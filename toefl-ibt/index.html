    const completeAction=done?`<button class="btn" data-action="return-results">返回总成绩 →</button>`:`<button class="btn" data-action="continue-section">${section==='writing'?'查看全部成绩 →':'确认复盘完成 · 进入下一科 →'}</button>`;
    const nav=arr.map((item,i)=>`<button data-action="review-nav" data-idx="${i}" class="qnum ${idx===i?'current':''} ${qIsSubjective(item)?'review-pending':correct(item)===true?'review-ok':'review-fail'}" title="${item.id} · ${qIsSubjective(item)?'待人工批改':correct(item)===true?'正确':correct(item)===false?'错误':'未答'}">${String(i+1).padStart(2,'0')}</button>`).join('');
    APP.innerHTML=header(`<span class="pill ok">已交卷 · 批改查看</span><button class="btn small light" data-action="export-docx">导出 Word ↓</button>`)+`<div class="exam-layout review-layout"><aside class="sidebar"><div class="side-pad"><div class="side-head">REVIEW YOUR ANSWERS</div>${phase}<div class="side-rule"></div><div class="side-label">${SECTION_NAMES[section]} <span>${stats.right} / ${stats.total} 正确</span></div><div class="question-nav">${nav}</div><div class="legend"><span><i class="dot done"></i>正确</span><span><i class="dot active"></i>错误/未答</span></div><div class="review-side-actions">${SECTION_ORDER.filter(s=>state.sectionsDone[s]&&s!==section).map(s=>`<button class="btn secondary small full" data-action="open-review" data-section="${s}">查看 ${SECTION_NAMES[s]} 批改</button>`).join('')}</div></div><p class="side-note">本区域已经交卷并锁定答案。页面会显示题目、原文、你的选择、正确答案和解析；不再计算考试时间。</p></aside><main class="exam-main"><div class="review-overview"><div><div class="eyebrow">SECTION REVIEW · ${e(section.toUpperCase())}</div><h1>返回原题，逐题看解析。</h1><p>${e(SECTION_NAMES[section])} · ${stats.total} 道自动评分题 · <b>${stats.right} 题正确</b> · 用时 ${usedTime(section)}</p></div><div class="review-score">${stats.total?Math.round(stats.right/stats.total*100):0}%<span>客观题正确率</span></div></div><div class="review-toolbar"><span>${q.id} · ${idx+1} / ${arr.length}</span>${statusPill(q)}<span class="review-lock">已交卷 · 只读</span></div><article class="q-surface review-question"><div class="q-header"><div><span class="eyebrow">ORIGINAL QUESTION · ${e(q.id)}</span><h2>${e(q.title)}</h2></div><small>${e(q.groupTitle||'')}</small></div>${body}</article><div class="exam-actions"><button class="btn secondary" data-action="review-prev" ${idx===0?'disabled':''}>← 上一题</button><div class="right"><button class="btn secondary" data-action="review-next" ${idx===arr.length-1?'disabled':''}>下一题 →</button>${completeAction}</div></div>${done?'<button class="btn link" data-action="return-results">← 返回总成绩与分类概览</button>':''}</main></div>`;
  };

  const renderResults=()=>{
    const r=statsFor('reading'),l=statsFor('listening'),w=statsFor('writing'),sum=r.total+l.total+w.total,right=r.right+l.right+w.right;
    const questions=SECTION_ORDER.flatMap(items);
    const displayed= selectedTab==='all'?questions:selectedTab==='writingSubjective'?items('writing').filter(x=>['email','discussion'].includes(x.type)):items(selectedTab);
    APP.innerHTML=header('<span class="pill dark">完成 / COMPLETE</span>')+`<main class="results-layout"><div class="results-top"><div><div class="eyebrow">EXAM COMPLETE · ${e(OPTIONS[state.mode].label)}</div><h1>Practice report.</h1></div><button class="btn secondary" data-action="reset">开始新考试 ↗</button></div><p class="result-desc">考试已经全部完成。可以点击下方任意科目的「返回原题 · 逐题批改」，在原始考题界面逐题对照你的答案、标准答案与解析。邮件和学术讨论等待人工批改；可导出 Word 交给 ChatGPT。</p><div class="score-grid"><div class="score-card"><div class="k">READING · 自动评分</div><div class="val">${r.right}<span class="muted" style="font-size:20px"> / ${r.total}</span></div><div class="sub">${r.total?Math.round(100*r.right/r.total):0}% · ${r.unanswered} 题未答 · 用时 ${usedTime('reading')}</div></div><div class="score-card"><div class="k">LISTENING · 自动评分</div><div class="val">${l.right}<span class="muted" style="font-size:20px"> / ${l.total}</span></div><div class="sub">${l.total?Math.round(100*l.right/l.total):0}% · ${l.unanswered} 题未答 · 用时 ${usedTime('listening')}</div></div><div class="score-card"><div class="k">WRITING · 组句自动评分</div><div class="val">${w.right}<span class="muted" style="font-size:20px"> / ${w.total}</span></div><div class="sub">用时 ${usedTime('writing')} · 邮件与学术讨论待人工批改</div></div></div><div class="notice">客观题合计：<b>${right}/${sum}</b>（${sum?Math.round(right/sum*100):0}%）。注意：百分比不等于 TOEFL 官方 1–6 分，不含自适应难度算法。未作答客观题按错误计入。</div><div class="review-section-cards">${SECTION_ORDER.map(sec=>{const score=statsFor(sec);return `<button class="review-section-btn" data-action="open-review" data-section="${sec}"><span>${e(SECTION_NAMES[sec])}</span><strong>${score.right} / ${score.total}</strong><small>返回原题 · 逐题批改 →</small></button>`}).join('')}</div><div class="export-panel"><div><div class="eyebrow">SUBJECTIVE WRITING REPORT</div><h3>导出主观题作答文档</h3><p>完整报告同时收录阅读及听力全部题目、你的答案、正确答案、解析和文字稿；主观写作可以直接上传聊天批改。</p></div><div class="export-actions"><button class="btn" data-action="export-docx">导出完整报告 · DOCX ↓</button><button class="btn secondary small" data-action="export-txt">导出完整 TXT</button></div></div><div class="result-tabs">${[['all','全部题目'],['reading','阅读'],['listening','听力'],['writing','写作'],['writingSubjective','待人工批改']].map(([k,v])=>`<button class="tab ${selectedTab===k?'active':''}" data-action="tab" data-tab="${k}">${v}</button>`).join('')}</div><div>${displayed.map(reviewCard).join('')}</div><p class="report-note">所有录音对应的文字稿在交卷后开放，便于复盘。页面不上传你的答案至任何服务器。本练习题库不属于 ETS，也不包含官方口语模块。</p></main>`;
  };
  const refreshAnswerUI=(id)=>{
    const q=activeQuestions().find(x=>x.id===id);if(!q)return;
    document.querySelectorAll(`[data-action="choice"][data-id="${id}"]`).forEach(el=>{const c=state.answers[id]===Number(el.dataset.value);el.classList.toggle('checked',c);el.setAttribute('aria-pressed',String(c));});
    activeQuestions().forEach((item,i)=>{const button=document.querySelector(`.qnum[data-idx="${i}"]`);if(button)button.classList.toggle('answered',isAnswered(item));});
    const count=document.getElementById('done-count');if(count)count.textContent=countAnswered(state.section)+'/'+activeQuestions().length;
    const bar=document.getElementById('exam-progress');if(bar)bar.style.width=100*countAnswered(state.section)/activeQuestions().length+'%';
  };
  const tryPlay=(clip,button)=>{
    if(!clip||!BANK.clips[clip]||currentAudio?.playing)return;
    if(state.mode==='full'&&state.played[clip])return;
    const session={clip,playing:true};currentAudio=session;
    const notify=message=>{const status=document.getElementById('audio-status');if(status)status.textContent=message;};
    const onDone=()=>{
      if(currentAudio!==session)return;
      currentAudio=null;state.played[clip]=true;save();renderExam();
      notify('录音完整结束。本组题目已解锁。');
    };
    const onError=err=>{
      if(currentAudio!==session)return;
      currentAudio=null;renderExam();
      notify('录音中断，本次不计入播放次数，可以重新播放。'+err);
    };
    const started=voice.playSegments(BANK.clips[clip].segments,voiceConfig,onDone,onError);
    if(started){renderExam();notify('录音正在播放，切题不会中断同组录音。');}
    else {currentAudio=null;renderExam();notify('系统语音不可用。请在首页试听、更换声音。');}
  };
  const reportParagraphs=()=>{
    const arr=[
      'TOEFL iBT (2026 Format) — Set C Practice Report',
      'Unofficial independent practice; generated '+new Date().toLocaleString('zh-CN'),
      'Mode: '+OPTIONS[state.mode].label+' | Session started: '+state.startedAt,
      'This report is intended for an English tutor / ChatGPT to evaluate subjective writing. Please evaluate task completion, organization, grammar, vocabulary, coherence and provide targeted corrections.',
      ''
    ];
    for (const q of items('writing').filter(x=>qIsSubjective(x))) {
      arr.push('===========================================');arr.push(q.id+' — '+q.title);arr.push('QUESTION / ORIGINAL PROMPT:');arr.push(q.prompt);
      if(q.positions)for(const [who,p] of q.positions){arr.push(who+': '+p);}
      if(q.checks){arr.push('TASK REQUIREMENTS:');q.checks.forEach((x,i)=>arr.push(`${i+1}. ${x}`));}
      arr.push('MY RESPONSE:');arr.push(answerText(q));arr.push('WORD COUNT: '+tallyWords(state.answers[q.id]));arr.push('');
    }
    arr.push('===========================================');arr.push('AUTO-GRADED WRITING SENTENCES (REFERENCE)');
    for(const q of items('writing').filter(x=>x.type==='sentence')){
      arr.push(q.id+' | '+(correct(q)===true?'Correct':'Incorrect / unanswered'));
      arr.push('Context: '+q.context);arr.push('Word groups: '+q.tokens.join(' / '));arr.push('My answer: '+answerText(q));arr.push('Correct order: '+correctAnswer(q));arr.push('');
    }
    const r=statsFor('reading'),l=statsFor('listening'),w=statsFor('writing');
    arr.push('AUTO-GRADED PRACTICE RESULTS');arr.push(`Reading: ${r.right}/${r.total}; Listening: ${l.right}/${l.total}; Writing sentence building: ${w.right}/${w.total}`);arr.push('These are raw practice scores, not official TOEFL score estimates.');
    arr.push('TIME SPENT: Reading '+usedTime('reading')+'; Listening '+usedTime('listening')+'; Writing '+usedTime('writing')+'.');
    arr.push('');arr.push('===========================================');
    arr.push('COMPLETE OBJECTIVE QUESTION RECORD — Reading / Listening / Sentence Building');
    arr.push('The following includes every original question, the response, the answer key and the explanation. Unanswered questions are explicitly noted.');
    const visited=new Set();
    for(const section of ['reading','listening']){
      arr.push('');arr.push('SECTION: '+section.toUpperCase());
      for(const q of items(section)){
        const key=section==='reading'&&q.type==='cloze'?q.group:section==='listening'?q.clip:null;
        if(key&&!visited.has(key)){
          if(q.passage)arr.push('PASSAGE ['+q.groupTitle+']: '+q.passage);
          if(q.clip)arr.push('AUDIO TRANSCRIPT ['+q.groupTitle+']: '+transcript(q));
          visited.add(key);
        }
        arr.push(q.id+' | '+(correct(q)===true?'CORRECT':correct(q)===false?'INCORRECT':'UNANSWERED'));
        arr.push('Type: '+q.type+' / '+(q.groupTitle||''));
        arr.push('Question: '+(q.type==='cloze'?('Blank '+q.index+' / prefix '+q.prefix):q.stem));
        if(q.options)q.options.forEach((op,i)=>arr.push('  '+'ABCD'[i]+'. '+op));
        arr.push('My answer: '+answerText(q));
        arr.push('Correct answer: '+correctAnswer(q));
        if(q.explanation)arr.push('Explanation: '+q.explanation);
        arr.push('');
      }
    }
    return arr;
  };
  const qIsSubjective=q=>q.type==='email'||q.type==='discussion';
  const download=(blob,name)=>{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},3500);};
  const paragraphXml = (val, i) => `<w:p><w:pPr><w:spacing w:after="${val?120:80}"/></w:pPr><w:r><w:rPr>${(i===0 || val.startsWith('W1')||val.startsWith('W11')||val.startsWith('W12')||val==='MY RESPONSE:'||val==='QUESTION / ORIGINAL PROMPT:')?'<w:b/>':''}</w:rPr><w:t xml:space="preserve">${e(val)}</w:t></w:r></w:p>`;
  const zipStore=(records)=>{
    const t=new TextEncoder();const parts=[],central=[];let offset=0;
    const u16=(d,p,v)=>{d[p]=v&255;d[p+1]=v>>>8&255;};const u32=(d,p,v)=>{u16(d,p,v&65535);u16(d,p+2,(v>>>16)&65535);};
    const crc=(bytes)=>{let c=~0;for(const b of bytes){c^=b;for(let i=0;i<8;i++)c=(c>>>1)^(c&1?0xEDB88320:0);}return(~c)>>>0;};
    for(const [name,contents] of Object.entries(records)){
      const filename=t.encode(name),data=t.encode(contents),checksum=crc(data);const local=new Uint8Array(30+filename.length);
      u32(local,0,0x04034b50);u16(local,4,20);u16(local,6,0x0800);u16(local,8,0);u32(local,14,checksum);u32(local,18,data.length);u32(local,22,data.length);u16(local,26,filename.length);local.set(filename,30);
      parts.push(local,data);
      const dir=new Uint8Array(46+filename.length);u32(dir,0,0x02014b50);u16(dir,4,20);u16(dir,6,20);u16(dir,8,0x0800);u16(dir,10,0);u32(dir,16,checksum);u32(dir,20,data.length);u32(dir,24,data.length);u16(dir,28,filename.length);u32(dir,42,offset);dir.set(filename,46);central.push(dir);offset+=local.length+data.length;
    }
    const centralLength=central.reduce((s,c)=>s+c.length,0);const end=new Uint8Array(22);u32(end,0,0x06054b50);u16(end,8,central.length);u16(end,10,central.length);u32(end,12,centralLength);u32(end,16,offset);
    return new Blob([...parts,...central,end],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  };
  const exportDocx=()=>{
    const paragraphs=reportParagraphs();
    const xml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${paragraphs.map(paragraphXml).join('')}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1400" w:right="1100" w:bottom="1400" w:left="1100"/></w:sectPr></w:body></w:document>`;
    const records={
      '[Content_Types].xml':'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>',
      '_rels/.rels':'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>',
      'word/document.xml':xml
    };
    download(zipStore(records),'TOEFL_Set_C_Full_Report_'+new Date().toISOString().slice(0,10)+'.docx');
  };
  const exportTxt=()=>download(new Blob([reportParagraphs().join('\n')],{type:'text/plain;charset=utf-8'}),'TOEFL_Set_C_Full_Report_'+new Date().toISOString().slice(0,10)+'.txt');
  const confirmSection=()=>{ const n=items(state.section).filter(x=>!isAnswered(x)).length; const last=state.section==='writing'; modal={title:last?'提交所有答案？':'结束当前科目？',message:`当前科目还有 ${n} 道题未作答。${last?'提交后立即显示写作逐题批改（组句自动评分，作文待人工批改），并可导出 Word。':'提交后将进入逐题批改界面，确认复盘完成后再进入下一科；本部分答案不可修改。'}`,button:last?'确认交卷':'交卷并查看本部分批改'};renderExam();};
  APP.addEventListener('click',event=>{
    const el=event.target.closest('[data-action]');if(!el)return;
    const action=el.dataset.action;
    if(action==='start'){voice.stop();start(el.dataset.mode);return;}
    if(action==='voice-test-dialogue'){voice.stop();const n=document.getElementById('voice-test-status');if(n)n.textContent='正在试听两个人物的英语对话…';voice.playSegments([{role:'A',text:'Have you finished preparing the report?'},{role:'B',text:'Almost. I just need to check the final references.'},{role:'A',text:'Great. Let me know when it is ready.'}],voiceConfig,()=>{if(n)n.textContent='对话试听完成。可以为不同人物选择不同的英语声音。';},err=>{if(n)n.textContent='试听失败：'+err;});return;}
    if(action==='voice-test'){voice.stop();const n=document.getElementById('voice-test-status')||document.getElementById('audio-status');if(n)n.textContent='正在播放英语试听句；如果声音不自然，可更换主讲声音。';voice.preview(voiceConfig,()=>{if(n)n.textContent='试听结束。听起来不自然的话，请在下拉列表中选择另一种英语声音。';},err=>{if(n)n.textContent='试听失败：'+err+'。请在系统语音设置中启用英文声音，或试用 Safari。';});return;}
    if(action==='reset'){state=null;showingResult=false;modal=null;audioStop();save();try{localStorage.removeItem(STORAGE_KEY)}catch(err){}render();return;}
    if(action==='tab'){selectedTab=el.dataset.tab;renderResults();return;}
    if(action==='open-review'){openReview(el.dataset.section);return;}
    if(action==='review-nav' && state?.section==='sectionReview'){state.reviewIndex=Number(el.dataset.idx);save();renderSectionReview();window.scrollTo(0,0);return;}
    if((action==='review-prev'||action==='review-next') && state?.section==='sectionReview'){state.reviewIndex=Math.max(0,Math.min(items(state.reviewSection).length-1,state.reviewIndex+(action==='review-prev'?-1:1)));save();renderSectionReview();window.scrollTo(0,0);return;}
    if(action==='continue-section'){continueAfterReview();return;}
    if(action==='return-results'){state.section='results';state.reviewSection=null;save();renderResults();window.scrollTo(0,0);return;}
    if(action==='export-docx'){exportDocx();return;}
    if(action==='export-txt'){exportTxt();return;}
    if(action==='resume'){state=load();render();return;}
    if(!state||state.section==='results')return;
    if(action==='toggle-mobile-nav'){
      const panel=document.querySelector('.sidebar');
      if(panel){const show=panel.classList.toggle('mobile-nav-open');el.setAttribute('aria-expanded',String(show));el.innerHTML=show?'收起题号导航 <span aria-hidden="true">⌃</span>':'题号导航 · 点击展开 <span aria-hidden="true">⌄</span>';}
      return;
    }
    if(action==='stop-audio'&&state.section==='listening'&&state.mode==='quick'){audioStop();renderExam();return;}
    if(action==='navigate'){navigate(Number(el.dataset.idx));return;}
    if(action==='prev'||action==='next'){navigate(nextIndex(action==='prev'?-1:1));return;}
    if(action==='choice'){state.answers[el.dataset.id]=Number(el.dataset.value);save();refreshAnswerUI(el.dataset.id);return;}
    if(action==='play'){tryPlay(el.dataset.clip,el);return;}
    if(action==='token-add'||action==='token-remove'||action==='token-clear'){
      const id=el.dataset.id;const chosen=Array.isArray(state.answers[id])?state.answers[id].slice():[];
      if(action==='token-add'){const idx=Number(el.dataset.idx);if(!chosen.includes(idx))chosen.push(idx);}
      if(action==='token-remove')chosen.splice(Number(el.dataset.pos),1);
      if(action==='token-clear')chosen.length=0;
      state.answers[id]=chosen;save();renderExam();return;
    }
    if(action==='finish-section'){if(currentAudio?.playing)return;confirmSection();return;}
    if(action==='cancel-modal'){modal=null;renderExam();return;}
    if(action==='confirm-modal') {finishCurrentSection();return;}
    if(action==='leave'){
      modal={title:'退出当前考试？',message:'退出将结束本次作答。若希望保留作答记录，请继续考试并在最后导出文件。',button:'退出并清空'};
      renderExam();const yes=document.querySelector('[data-action="confirm-modal"]');if(yes)yes.dataset.action='really-leave';return;
    }
    if(action==='really-leave'){state=null;audioStop();modal=null;try{localStorage.removeItem(STORAGE_KEY)}catch(err){}renderHome();}
  });
  APP.addEventListener('change',event=>{
    const el=event.target;if(!el.dataset.voice)return;
    if(el.dataset.voice==='rate')voiceConfig.rate=Number(el.value)||.94;
    if(el.dataset.voice==='primary')voiceConfig.primary=el.value;
    if(el.dataset.voice==='secondary')voiceConfig.secondary=el.value;
    saveVoice();
  });
  if(voice?.supported){speechSynthesis.addEventListener('voiceschanged',()=>{
    if(state)return;
    for(const kind of ['primary','secondary']){const el=document.getElementById('voice-'+kind);if(el){el.innerHTML=voiceOptions(kind);el.value=voiceConfig[kind]||'';}}
  });}
  APP.addEventListener('input',event=>{
    const t=event.target,id=t.dataset.id;if(!id || !state || state.section==='results')return;
    if(t.matches('.cloze-input, textarea.text-box')){
      state.answers[id]=t.value;save();refreshAnswerUI(id);
      if(t.matches('textarea')){const el=document.getElementById('word-count');if(el)el.textContent=tallyWords(t.value)+' words';}
    }
  });
  window.addEventListener('beforeunload',event=>{if(state && state.section!=='results'){save();event.preventDefault();}});
  state=load();
  // A saved exam retains its original wall-clock deadline; refreshing does not extend it.
  if(state){showingResult=state.section==='results';render();}else renderHome();
  tickInterval=setInterval(timerTick,250);
  window.TOEFL_TEST_API={getState:()=>state,score:statsFor,exportDocx,exportTxt,openReview,finishCurrentSection,continueAfterReview};
})();


</script>
