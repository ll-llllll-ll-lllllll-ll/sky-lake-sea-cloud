gh space. Scientists use several spacecraft to obtain {5} measurements, improving the time available for warnings. Nevertheless, uncertainty is unavoidable, and emergency planning must account for a {6} of possible outcomes.","index":6,"prefix":"ran","answer":"range","explanation":"A range of outcomes is the standard expression.","title":"Complete the Words"},{"id":"R31","type":"daily","title":"Read in Daily Life","groupTitle":"Photography Studio Access","passage":"The campus photography studio will close at 6 p.m. on Wednesday for equipment maintenance. Students with reservations beginning before 4 p.m. may complete their sessions, but no new equipment will be issued after 4. Reservations originally scheduled for Thursday will remain valid. Students collecting printed work may use the front desk until 5:30 p.m.","stem":"A student has a Wednesday reservation starting at 4:30 p.m. What should the student expect?","options":["The reservation will automatically move to Thursday.","New equipment will not be issued for the session.","The studio will remain open all evening.","Print collection will continue until 6 p.m."],"answer":1,"explanation":"Equipment issuance stops at 4; the 4:30 reservation cannot receive new equipment."},{"id":"R32","type":"daily","title":"Read in Daily Life","groupTitle":"Coastal Field Trip","passage":"Participants must submit the signed safety form by Monday noon. The bus leaves at 7:15 a.m. Friday; students who prefer to travel independently may meet the group at the harbor at 8:30 a.m., but they must notify the instructor before Wednesday. Waterproof footwear is recommended, and laboratory gloves will be provided on site.","stem":"What must a student who plans to travel independently do?","options":["Buy laboratory gloves before departure.","Arrive at the harbor before 7:15 a.m.","Inform the instructor before Wednesday.","Submit the safety form on Friday."],"answer":2,"explanation":"Independent travelers may meet at 8:30, but must notify the instructor before Wednesday."},{"id":"R33","type":"daily","title":"Read in Daily Life","groupTitle":"Residence Hall Painting","passage":"Corridors on the third floor will be painted from Tuesday through Thursday. Residents may use their rooms as usual, but bicycles must be removed from the corridor by Monday evening. Items left behind will be placed in temporary storage at the housing office; retrieval requires an ID card. Fire exits must remain clear throughout the work.","stem":"What happens to bicycles left in the corridor after Monday evening?","options":["They will be disposed of immediately.","They will be transferred to temporary storage.","They may remain there if their owners are present.","They will be moved to residents' rooms."],"answer":1,"explanation":"Unremoved items go to temporary storage, not disposal."},{"id":"R34","type":"daily","title":"Read in Daily Life","groupTitle":"Research Help Desk","passage":"The research help desk offers 20-minute appointments for undergraduate students. Appointments can be booked online until two hours before the scheduled time. Students who need statistical advice must bring a preliminary data table. Walk-ins are accepted only on Friday afternoons when a staff member is available.","stem":"Which student meets the stated conditions for statistical advice?","options":["A student who books thirty minutes ahead and brings no data.","A student who books three hours ahead and brings a preliminary data table.","A student who walks in on Tuesday with a data table.","A student who schedules in advance but refuses to share any data."],"answer":1,"explanation":"Booking must be at least two hours early and a preliminary table is mandatory."},{"id":"R35","type":"daily","title":"Read in Daily Life","groupTitle":"Student Newspaper Submissions","passage":"Articles for the November issue are due on October 25. Photographs should be submitted as separate image files rather than embedded in the article document. Editors may request revisions within four days of submission. Submissions that exceed 1,000 words will be returned without review unless an exception was approved beforehand.","stem":"Which submission will be returned without review?","options":["A 900-word article with separate photographs.","A 1,150-word article with no previously approved exception.","A 750-word article submitted on October 24.","An article that requires editorial revision."],"answer":1,"explanation":"Over 1,000 words requires preapproved exception."},{"id":"R36","type":"daily","title":"Read in Daily Life","groupTitle":"Recreation Center Classes","passage":"Swimming lessons will be held in Pool B for the next two weeks while Pool A is inspected. Evening yoga classes will begin fifteen minutes earlier, but morning sessions remain unchanged. Members registered for canceled rock-climbing classes may choose either a credit or a full refund by submitting the online form within seven days.","stem":"Which activity has a changed starting time?","options":["Morning yoga.","Swimming lessons.","Evening yoga.","Rock climbing."],"answer":2,"explanation":"Only evening yoga shifts earlier by 15 minutes."},{"id":"R37","type":"daily","title":"Read in Daily Life","groupTitle":"Greenhouse Plant Requests","passage":"Researchers may request seedlings using the online inventory. Requests are reviewed every Tuesday. Plants listed as available are not guaranteed until a staff member sends confirmation. Seedlings must be collected within three working days of confirmation, otherwise they may be reassigned.","stem":"What makes a seedling reservation definite?","options":["The online inventory lists the species.","The researcher submits a request.","Tuesday's review has begun.","The staff sends confirmation."],"answer":3,"explanation":"A listing or request alone is not a guarantee; staff confirmation is required."},{"id":"R38","type":"daily","title":"Read in Daily Life","groupTitle":"Travel Grant Reminder","passage":"Travel grant recipients must upload receipts within ten business days after returning. Meal expenses are reimbursed only up to the daily allowance listed in the award letter. Personal sightseeing costs are never eligible. If an airline cancels a trip, students should notify the grants office before purchasing replacement tickets.","stem":"Which expense cannot be reimbursed under any circumstances?","options":["A meal below the daily allowance.","A necessary replacement flight with prior notification.","Personal sightseeing costs.","A hotel stay supported by receipts."],"answer":2,"explanation":"Personal sightseeing is explicitly excluded without exception."},{"id":"R39","type":"daily","title":"Read in Daily Life","groupTitle":"Campus Shuttle Notice","passage":"Beginning next week, the north shuttle will no longer stop at the art building between 9 and 11 a.m. During those hours, passengers should use the stop beside the central library, a five-minute walk away. The regular route will resume after 11 a.m. Weekend service remains unchanged.","stem":"At 10 a.m. on a weekday, where should a passenger board the north shuttle?","options":["At the art building stop.","Beside the central library.","At the south entrance.","At the nearest weekend stop."],"answer":1,"explanation":"Between 9–11 a.m., the north shuttle uses the central library stop."},{"id":"R40","type":"daily","title":"Read in Daily Life","groupTitle":"Ethics Training Certificate","passage":"Students conducting interviews must complete the online ethics course before contacting participants. The certificate remains valid for two years. Students who previously took the course elsewhere may apply for recognition, but they must receive written approval before beginning recruitment. Supervisors cannot waive this requirement verbally.","stem":"What must a student with an external ethics certificate do before recruiting participants?","options":["Retake the course regardless of circumstances.","Obtain written recognition of the previous training.","Ask a supervisor for verbal permission.","Begin recruiting and apply for recognition later."],"answer":1,"explanation":"Recognition is possible but must be approved in writing before recruitment."},{"id":"R41","type":"academic","title":"Read an Academic Passage","groupTitle":"Why Rivers Build Their Own Curves","passage":"A river flowing across a broad floodplain rarely follows a perfectly straight path. Small irregularities in the channel can redirect water toward one bank, where faster currents gradually remove sediment. On the opposite bank, slower water deposits sand and silt. Over time, these differences enlarge a bend, creating the familiar sweeping curves called meanders.\n\nAlthough meanders appear stable on a map, individual bends may migrate across a floodplain for decades. During major floods, a river sometimes cuts across the narrow neck of a bend and adopts a shorter route. The isolated loop can become an oxbow lake, gradually filling with vegetation and fine sediment. Thus, a lake located far from the present channel may reveal an earlier course of the river.\n\nEngineers have frequently attempted to straighten rivers to improve navigation or reduce local flooding. Straightening can, however, increase the speed of water downstream and transfer flood risk elsewhere. It may also disconnect wetlands from the periodic overflow on which many species depend. The apparent efficiency of a shorter channel therefore comes with consequences that are not always visible at the site of intervention.\n\nModern river management increasingly considers entire drainage systems rather than individual stretches of channel. Floodplain restoration, for instance, may give rising water room to spread across designated areas. Such approaches do not eliminate flooding, but they can alter where and how its effects are experienced. Understanding a river as a changing system is essential when evaluating human attempts to control it.","stem":"Which process contributes most directly to the growth of a river bend?","options":["Water erodes the outer bank and deposits sediment along the inner bank.","The river becomes equally fast on both banks.","Underground water pushes the channel upward.","Sediment accumulates only in the center of the river."],"answer":0,"explanation":"Faster flow erodes one bank; slower flow deposits on the other."},{"id":"R42","type":"academic","title":"Read an Academic Passage","groupTitle":"Why Rivers Build Their Own Curves","passage":"A river flowing across a broad floodplain rarely follows a perfectly straight path. Small irregularities in the channel can redirect water toward one bank, where faster currents gradually remove sediment. On the opposite bank, slower water deposits sand and silt. Over time, these differences enlarge a bend, creating the familiar sweeping curves called meanders.\n\nAlthough meanders appear stable on a map, individual bends may migrate across a floodplain for decades. During major floods, a river sometimes cuts across the narrow neck of a bend and adopts a shorter route. The isolated loop can become an oxbow lake, gradually filling with vegetation and fine sediment. Thus, a lake located far from the present channel may reveal an earlier course of the river.\n\nEngineers have frequently attempted to straighten rivers to improve navigation or reduce local flooding. Straightening can, however, increase the speed of water downstream and transfer flood risk elsewhere. It may also disconnect wetlands from the periodic overflow on which many species depend. The apparent efficiency of a shorter channel therefore comes with consequences that are not always visible at the site of intervention.\n\nModern river management increasingly considers entire drainage systems rather than individual stretches of channel. Floodplain restoration, for instance, may give rising water room to spread across designated areas. Such approaches do not eliminate flooding, but they can alter where and how its effects are experienced. Understanding a river as a changing system is essential when evaluating human attempts to control it.","stem":"Why does the author mention oxbow lakes?","options":["To argue that all lakes are formed by flooding.","To illustrate how an abandoned bend preserves evidence of a former river channel.","To suggest that rivers change only during droughts.","To show that vegetation prevents all channel migration."],"answer":1,"explanation":"Oxbow lakes are evidence of former river courses."},{"id":"R43","type":"academic","title":"Read an Academic Passage","groupTitle":"Why Rivers Build Their Own Curves","passage":"A river flowing across a broad floodplain rarely follows a perfectly straight path. Small irregularities in the channel can redirect water toward one bank, where faster currents gradually remove sediment. On the opposite bank, slower water deposits sand and silt. Over time, these differences enlarge a bend, creating the familiar sweeping curves called meanders.\n\nAlthough meanders appear stable on a map, individual bends may migrate across a floodplain for decades. During major floods, a river sometimes cuts across the narrow neck of a bend and adopts a shorter route. The isolated loop can become an oxbow lake, gradually filling with vegetation and fine sediment. Thus, a lake located far from the present channel may reveal an earlier course of the river.\n\nEngineers have frequently attempted to straighten rivers to improve navigation or reduce local flooding. Straightening can, however, increase the speed of water downstream and transfer flood risk elsewhere. It may also disconnect wetlands from the periodic overflow on which many species depend. The apparent efficiency of a shorter channel therefore comes with consequences that are not always visible at the site of intervention.\n\nModern river management increasingly considers entire drainage systems rather than individual stretches of channel. Floodplain restoration, for instance, may give rising water room to spread across designated areas. Such approaches do not eliminate flooding, but they can alter where and how its effects are experienced. Understanding a river as a changing system is essential when evaluating human attempts to control it.","stem":"What can be inferred about straightening a river?","options":["It reliably eliminates downstream flood damage.","It has no effects on connected wetlands.","It may reduce problems locally while creating new problems elsewhere.","It causes all river bends to grow faster."],"answer":2,"explanation":"Local improvement may transfer risk downstream and disconnect wetlands."},{"id":"R44","type":"academic","title":"Read an Academic Passage","groupTitle":"Why Rivers Build Their Own Curves","passage":"A river flowing across a broad floodplain rarely follows a perfectly straight path. Small irregularities in the channel can redirect water toward one bank, where faster currents gradually remove sediment. On the opposite bank, slower water deposits sand and silt. Over time, these differences enlarge a bend, creating the familiar sweeping curves called meanders.\n\nAlthough meanders appear stable on a map, individual bends may migrate across a floodplain for decades. During major floods, a river sometimes cuts across the narrow neck of a bend and adopts a shorter route. The isolated loop can become an oxbow lake, gradually filling with vegetation and fine sediment. Thus, a lake located far from the present channel may reveal an earlier course of the river.\n\nEngineers have frequently attempted to straighten rivers to improve navigation or reduce local flooding. Straightening can, however, increase the speed of water downstream and transfer flood risk elsewhere. It may also disconnect wetlands from the periodic overflow on which many species depend. The apparent efficiency of a shorter channel therefore comes with consequences that are not always visible at the site of intervention.\n\nModern river management increasingly considers entire drainage systems rather than individual stretches of channel. Floodplain restoration, for instance, may give rising water room to spread across designated areas. Such approaches do not eliminate flooding, but they can alter where and how its effects are experienced. Understanding a river as a changing system is essential when evaluating human attempts to control it.","stem":"What is the main purpose of the third paragraph?","options":["To explain why sand is deposited near inner riverbanks.","To compare wetland vegetation with river organisms.","To describe how oxbow lakes are surveyed.","To question the idea that a straighter river is necessarily a better-managed river."],"answer":3,"explanation":"The paragraph examines unintended consequences of straightening."},{"id":"R45","type":"academic","title":"Read an Academic Passage","groupTitle":"Why Rivers Build Their Own Curves","passage":"A river flowing across a broad floodplain rarely follows a perfectly straight path. Small irregularities in the channel can redirect water toward one bank, where faster currents gradually remove sediment. On the opposite bank, slower water deposits sand and silt. Over time, these differences enlarge a bend, creating the familiar sweeping curves called meanders.\n\nAlthough meanders appear stable on a map, individual bends may migrate across a floodplain for decades. During major floods, a river sometimes cuts across the narrow neck of a bend and adopts a shorter route. The isolated loop can become an oxbow lake, gradually filling with vegetation and fine sediment. Thus, a lake located far from the present channel may reveal an earlier course of the river.\n\nEngineers have frequently attempted to straighten rivers to improve navigation or reduce local flooding. Straightening can, however, increase the speed of water downstream and transfer flood risk elsewhere. It may also disconnect wetlands from the periodic overflow on which many species depend. The apparent efficiency of a shorter channel therefore comes with consequences that are not always visible at the site of intervention.\n\nModern river management increasingly considers entire drainage systems rather than individual stretches of channel. Floodplain restoration, for instance, may give rising water room to spread across designated areas. Such approaches do not eliminate flooding, but they can alter where and how its effects are experienced. Understanding a river as a changing system is essential when evaluating human attempts to control it.","stem":"Which statement best represents the main argument?","options":["Rivers should be understood as dynamic, interconnected systems when planning interventions.","Rivers are unable to change their routes without human engineering.","The shortest river channel always produces the least flood risk.","Floodplain restoration is guaranteed to prevent flooding."],"answer":0,"explanation":"Dynamic system-level thinking unifies the discussion."},{"id":"R46","type":"academic","title":"Read an Academic Passage","groupTitle":"Why Waiting Feels Longer Than It Is","passage":"Two people may wait for the same number of minutes yet report very different experiences. Researchers studying the perception of time have found that duration judgments depend partly on where attention is directed. When a person watches a clock and anticipates an event, time itself becomes the focus of attention. When that person is absorbed in a demanding activity, fewer mental resources may be devoted to tracking the passage of time.\n\nExpectations can also shape how waiting is remembered. A train that arrives five minutes later than a promised departure may produce stronger irritation than a train that arrives after a clearly announced ten-minute interval. The objective delay is not the only factor: uncertainty and violated expectations matter. However, studies reporting these effects often rely on people recalling experiences afterward, and memory can be influenced by the outcome of an event.\n\nThis difference between experienced time and remembered time matters when designing public services. Displaying an accurate estimated waiting time can reduce uncertainty, but a prediction that is repeatedly revised may undermine confidence. Providing an engaging activity can make a wait feel shorter without reducing its actual duration. Neither strategy should be mistaken for a substitute for addressing unacceptable delays.\n\nThe broader implication is that efficiency and perceived quality are related but not identical. A service may become measurably faster while still feeling frustrating, or remain just as slow while becoming easier to tolerate. Researchers must therefore choose measures that reflect which aspect of waiting they intend to investigate.","stem":"According to the first paragraph, why may an engaging activity change time perception?","options":["It makes clocks run more slowly.","It reduces the attention available for monitoring the passage of time.","It guarantees that an event occurs earlier.","It erases people's memories of earlier waits."],"answer":1,"explanation":"Attention is diverted away from monitoring time."},{"id":"R47","type":"academic","title":"Read an Academic Passage","groupTitle":"Why Waiting Feels Longer Than It Is","passage":"Two people may wait for the same number of minutes yet report very different experiences. Researchers studying the perception of time have found that duration judgments depend partly on where attention is directed. When a person watches a clock and anticipates an event, time itself becomes the focus of attention. When that person is absorbed in a demanding activity, fewer mental resources may be devoted to tracking the passage of time.\n\nExpectations can also shape how waiting is remembered. A train that arrives five minutes later than a promised departure may produce stronger irritation than a train that arrives after a clearly announced ten-minute interval. The objective delay is not the only factor: uncertainty and violated expectations matter. However, studies reporting these effects often rely on people recalling experiences afterward, and memory can be influenced by the outcome of an event.\n\nThis difference between experienced time and remembered time matters when designing public services. Displaying an accurate estimated waiting time can reduce uncertainty, but a prediction that is repeatedly revised may undermine confidence. Providing an engaging activity can make a wait feel shorter without reducing its actual duration. Neither strategy should be mistaken for a substitute for addressing unacceptable delays.\n\nThe broader implication is that efficiency and perceived quality are related but not identical. A service may become measurably faster while still feeling frustrating, or remain just as slow while becoming easier to tolerate. Researchers must therefore choose measures that reflect which aspect of waiting they intend to investigate.","stem":"Why are recollections of waiting not always reliable evidence of the original experience?","options":["People cannot remember whether they used a clock.","Time judgments are unrelated to the outcome of an event.","The later outcome may influence how the earlier wait is remembered.","Long waits are always remembered as short."],"answer":2,"explanation":"Outcome and later memory can shape retrospective judgments."},{"id":"R48","type":"academic","title":"Read an Academic Passage","groupTitle":"Why Waiting Feels Longer Than It Is","passage":"Two people may wait for the same number of minutes yet report very different experiences. Researchers studying the perception of time have found that duration judgments depend partly on where attention is directed. When a person watches a clock and anticipates an event, time itself becomes the focus of attention. When that person is absorbed in a demanding activity, fewer mental resources may be devoted to tracking the passage of time.\n\nExpectation rceived/remembered waiting."}],"listening":[{"id":"L01","type":"listen","title":"Listen and Choose a Response","group":"choose01","groupTitle":"Printer Trouble","clip":"choose01","stem":"Choose the most appropriate response to the speaker.","options":["The office is on the third floor.","Have you checked whether the printer uses a different color profile?","I finished the poster last month.","The screen is quite large."],"answer":1,"explanation":"The appropriate reply directly responds to: I tried printing my poster, but the colors came out much darker than on my screen."},{"id":"L02","type":"listen","title":"Listen and Choose a Response","group":"choose02","groupTitle":"Office Hours","clip":"choose02","stem":"Choose the most appropriate response to the speaker.","options":["Not at all, that works for me.","The morning seems quite sunny.","I already moved the desk.","The building has four floors."],"answer":0,"explanation":"The appropriate reply directly responds to: Would you mind if we moved our meeting to Thursday morning?"},{"id":"L03","type":"listen","title":"Listen and Choose a Response","group":"choose03","groupTitle":"Missing Reference","clip":"choose03","stem":"Choose the most appropriate response to the speaker.","options":["Classes end next Tuesday.","I prefer reading books.","You might try searching the library database by the author's name.","The professor's office has a new door."],"answer":2,"explanation":"The appropriate reply directly responds to: I can't find the article our professor mentioned in class."},{"id":"L04","type":"listen","title":"Listen and Choose a Response","group":"choose04","groupTitle":"Workshop Limit","clip":"choose04","stem":"Choose the most appropriate response to the speaker.","options":["It starts at two on Wednesday.","Why don't you put your name on the waiting list?","The room has a lot of tables.","I wrote an essay last year."],"answer":1,"explanation":"The appropriate reply directly responds to: They've already filled all the seats for the writing workshop."},{"id":"L05","type":"listen","title":"Listen and Choose a Response","group":"choose05","groupTitle":"Research Delay","clip":"choose05","stem":"Choose the most appropriate response to the speaker.","options":["So we should adjust the analysis schedule.","The soils in this region are red.","I have already traveled there.","The boxes are in the hallway."],"answer":0,"explanation":"The appropriate reply directly responds to: It looks as though the soil samples won't arrive until next week."},{"id":"L06","type":"listen","title":"Listen and Choose a Response","group":"choose06","groupTitle":"Course Choice","clip":"choose06","stem":"Choose the most appropriate response to the speaker.","options":["The seminar uses Room 12.","My notes are in the library.","Yes, it would help you follow the quantitative material.","The textbook has several chapters."],"answer":2,"explanation":"The appropriate reply directly responds to: Do you think I should take statistics before enrolling in the advanced methods course?"},{"id":"L07","type":"listen","title":"Listen and Choose a Response","group":"choose07","groupTitle":"Opening Hours","clip":"choose07","stem":"Choose the most appropriate response to the speaker.","options":["I bought canvas last Friday.","Friday is my favorite day.","It's across from the theater.","No, it closes at five thirty."],"answer":3,"explanation":"The appropriate reply directly responds to: Is the art supply store still open after six on Fridays?"},{"id":"L08","type":"listen","title":"Listen and Choose a Response","group":"choose08","groupTitle":"Appointment Change","clip":"choose08","stem":"Choose the most appropriate response to the speaker.","options":["The session was informative.","Could you cancel your booking so someone else can use it?","The adviser works in biology.","I attended last semester."],"answer":1,"explanation":"The appropriate reply directly responds to: I'm afraid I won't be able to attend tomorrow's advising session."},{"id":"L09","type":"listen","title":"Listen and Choose a Response","group":"choose09","groupTitle":"Abstract Deadline","clip":"choose09","stem":"Choose the most appropriate response to the speaker.","options":["Yes, the portal closes at midnight.","The venue is downtown.","The abstract is two paragraphs.","I went to a conference in spring."],"answer":0,"explanation":"The appropriate reply directly responds to: The conference abstract is due tonight, isn't it?"},{"id":"L10","type":"listen","title":"Listen and Choose a Response","group":"choose10","groupTitle":"Lab Key","clip":"choose10","stem":"Choose the most appropriate response to the speaker.","options":["The lab is on the second floor.","My key is made of metal.","You should ask the front desk to update the record.","Laboratories are busy on Mondays."],"answer":2,"explanation":"The appropriate reply directly responds to: I returned the laboratory key, but the system still shows it as checked out."},{"id":"L11","type":"listen","title":"Listen and Choose a Response","group":"choose11","groupTitle":"Classroom Location","clip":"choose11","stem":"Choose the most appropriate response to the speaker.","options":["I've studied science before.","It was moved to the humanities hall because of repairs.","The lecture is about economics.","I brought the textbook."],"answer":1,"explanation":"The appropriate reply directly responds to: I thought our lecture was in the science building today."},{"id":"L12","type":"listen","title":"Listen and Choose a Response","group":"choose12","groupTitle":"Presentation Practice","clip":"choose12","stem":"Choose the most appropriate response to the speaker.","options":["The conclusion is on page five.","I saw the presentation yesterday.","Of course. Go ahead whenever you're ready.","Presentations are normally ten minutes."],"answer":2,"explanation":"The appropriate reply directly responds to: Would you listen to my presentation and tell me whether the conclusion is clear?"},{"id":"L13","type":"listen","title":"Listen and Choose a Response","group":"choose13","groupTitle":"Borrowing Equipment","clip":"choose13","stem":"Choose the most appropriate response to the speaker.","options":["It records at high quality.","It's usually kept in a drawer.","I recorded a lecture yesterday.","You can, as long as you return it on Monday morning."],"answer":3,"explanation":"The appropriate reply directly responds to: Can I borrow the audio recorder over the weekend?"},{"id":"L14","type":"listen","title":"Listen and Choose a Response","group":"choose14","groupTitle":"Scholarship Request","clip":"choose14","stem":"Choose the most appropriate response to the speaker.","options":["The deadline is at the end of the month.","The application checklist on the department website lists them.","The building is next to the cafeteria.","I won a scholarship before."],"answer":1,"explanation":"The appropriate reply directly responds to: I'm not sure which documents I need for the scholarship application."},{"id":"L15","type":"listen","title":"Listen and Choose a Response","group":"choose15","groupTitle":"Elevator Closure","clip":"choose15","stem":"Choose the most appropriate response to the speaker.","options":["We should contact facilities to arrange an accessible alternative.","The panels are made of wood.","I like taking the stairs.","The exhibition opens next year."],"answer":0,"explanation":"The appropriate reply directly responds to: The elevator is out of service again, so how can we move the exhibition panels upstairs?"},{"id":"L16","type":"listen","title":"Listen and Choose a Response","group":"choose16","groupTitle":"Survey Questions","clip":"choose16","stem":"Choose the most appropriate response to the speaker.","options":["The car park is nearly full.","I drove to campus this morning.","We should revise them to include people who use other forms of transport.","There are fifteen questions."],"answer":2,"explanation":"The appropriate reply directly responds to: These survey questions seem to assume that everyone owns a car."},{"id":"L17","type":"listen","title":"Listen and Choose a Response","group":"choose17","groupTitle":"Study Group","clip":"choose17","stem":"Choose the most appropriate response to the speaker.","options":["The group meets weekly.","Bring one question you'd like everyone to discuss.","The reading has twenty pages.","I finished mine yesterday."],"answer":1,"explanation":"The appropriate reply directly responds to: I already finished the assigned reading. Should I bring anything else to the study group?"},{"id":"L18","type":"listen","title":"Listening comprehension","group":"conv01","groupTitle":"Archival Photography Request","clip":"conv01","stem":"Why does the student visit the archive?","options":["To return a borrowed camera.","To ask about using historical photographs for an exhibition.","To request a railway timetable.","To apply for an archive internship."],"answer":1,"explanation":"The student wants to use archival photographs in an exhibition."},{"id":"L19","type":"listen","title":"Listening comprehension","group":"conv01","groupTitle":"Archival Photography Request","clip":"conv01","stem":"What distinction does the archivist make?","options":["Viewing a photograph and publishing it are subject to different conditions.","Printed photographs always require higher fees.","All items in an archive are public domain.","Photographing the reading room is prohibited."],"answer":0,"explanation":"Access to view does not equal publication permission."},{"id":"L20","type":"listen","title":"Listening comprehension","group":"conv01","groupTitle":"Archival Photography Request","clip":"conv01","stem":"What should the student submit?","options":["A completed website.","A signed donor agreement.","A list of desired images.","A list of station employees."],"answer":2,"explanation":"The archivist requests an image list to check digital rights."},{"id":"L21","type":"listen","title":"Listening comprehension","group":"conv01","groupTitle":"Archival Photography Request","clip":"conv01","stem":"How should uncertain dates be handled?","options":["Omit the photographs.","Estimate without disclosing uncertainty.","Ask visitors to choose dates.","Identify the dates as approximate."],"answer":3,"explanation":"The archivist says to label uncertain dates approximate."},{"id":"L22","type":"listen","title":"Listening comprehension","group":"conv01","groupTitle":"Archival Photography Request","clip":"conv01","stem":"What will the student probably do next?","options":["Obtain individual rights information before adding photos to the website.","Remove all photographs from the project.","Change the topic of the exhibition.","Submit the exhibition for grading."],"answer":0,"explanation":"The student agrees to send the list before preparing online images."},{"id":"L23","type":"listen","title":"Listening comprehension","group":"conv02","groupTitle":"Experiment Room Reservation","clip":"conv02","stem":"Why was the original reservation canceled?","options":["The chamber was broken.","The student missed a payment.","The training record was linked to an old student number.","The experiment was not approved."],"answer":2,"explanation":"The system thought training had expired because it was under a prior number."},{"id":"L24","type":"listen","title":"Listening comprehension","group":"conv02","groupTitle":"Experiment Room Reservation","clip":"conv02","stem":"Why can the student not simply reclaim Wednesday?","options":["Someone else has reserved it.","The building is closed Wednesday.","The staff does not allow transfers.","The student has a class then."],"answer":0,"explanation":"The released slot has been booked by another student."},{"id":"L25","type":"listen","title":"Listening comprehension","group":"conv02","groupTitle":"Experiment Room Reservation","clip":"conv02","stem":"Why does the staff member mention Friday morning?","options":["It is cheaper than Thursday.","The experiment requires time for ension","group":"conv03","groupTitle":"Student Podcast Project","clip":"conv03","stem":"What does the student reveal about the podcast?","options":["It is available only to classmates.","It will be distributed publicly.","It contains no interviews.","It must be submitted as a printed transcript."],"answer":1,"explanation":"The podcast will be available outside the university."},{"id":"L31","type":"listen","title":"Listening comprehension","group":"conv03","groupTitle":"Student Podcast Project","clip":"conv03","stem":"What is the likely next step?","options":["Remove all audio from the podcast.","Request a new microphone.","Submit without an introduction.","Find suitably licensed music and follow attribution requirements."],"answer":3,"explanation":"Student agrees to replace song and verify license."},{"id":"L32","type":"listen","title":"Listening comprehension","group":"ann01","groupTitle":"University Garden Volunteer Briefing","clip":"ann01","stem":"Where should volunteers meet?","options":["Inside the greenhouse.","In the courtyard behind the science center.","At the library entrance.","Beside the parking garage."],"answer":1,"explanation":"Meeting location is the courtyard behind the science center."},{"id":"L33","type":"listen","title":"Listening comprehension","group":"ann01","groupTitle":"University Garden Volunteer Briefing","clip":"ann01","stem":"What must late arrivals do before using pruning equipment?","options":["Purchase protective gloves.","Register for next month.","Attend a make-up safety briefing.","Visit the greenhouse."],"answer":2,"explanation":"Latecomers need a make-up briefing."},{"id":"L34","type":"listen","title":"Listening comprehension","group":"ann01","groupTitle":"University Garden Volunteer Briefing","clip":"ann01","stem":"What should volunteers bring?","options":["Water and closed-toe shoes.","Specialized pruning equipment.","Native plant seedlings.","Laboratory safety glasses."],"answer":0,"explanation":"Gloves and tools are supplied; ical reactions in construction materials should be avoided.","Changes in a material can sometimes improve rather than reduce performance."],"answer":3,"explanation":"The lecture challenges assumption that chemical change equals deterioration."},{"id":"L44","type":"listen","title":"Listening comprehension","group":"talk02","groupTitle":"Why Random Patterns Look Meaningful","clip":"talk02","stem":"What is the gambler’s fallacy?","options":["Believing that a past run of heads makes tails more likely on the next independent fair flip.","Assuming coins cannot be fair.","Believing all sequences contain equal numbers of outcomes.","Calculating the probability of a single flip."],"answer":0,"explanation":"Independence means previous outcomes do not change next flip probability."},{"id":"L45","type":"listen","title":"Listening comprehension","group":"talk02","groupTitle":"Why Random Patterns Look Meaningful","clip":"talk02","stem":"Why might six heads in a row occur with a fair coin?","options":["Because the coin remembers previous results.","Because the probability of heads rises after each flip.","Because random sequences sometimes contain runs even without bias.","Because tails become impossible after five flips."],"answer":2,"explanation":"Streaks occur naturally in random data."},{"id":"L46","type":"listen","title":"Listening comprehension","group":"talk02","groupTitle":"Why Random Patterns Look Meaningful","clip":"talk02","stem":"Why does the lecturer introduce a warming machine?","options":["To show that machines are always inaccurate.","To illustrate a process whose outcomes may not be independent.","To explain why coin flips are difficult to observe.","To claim all patterns are meaningful."],"answer":1,"explanation":"Machine conditions change, so outcomes may depend on earlier state."},{"id":"L47","type":"listen","title":"Listening comprehension","group":"talk02","groupTitle":"Why Random Patterns Look Meaningful","clip":"talk02","stem":"Which question best captures y might have been avoided."},{"id":"W05","type":"sentence","title":"Build a Sentence","context":"Describe the collaboration.","answer":["Although","the researchers","worked at different universities,","they shared","a common database."],"tokens":["Although","the researchers","they shared","a common database.","worked at different universities,"],"explanation":"Correct sentence structure: Although the researchers worked at different universities, they shared a common database."},{"id":"W06","type":"sentence","title":"Build a Sentence","context":"When is equipment returned?","answer":["The equipment","must be returned","within two days","of the field trip."],"tokens":["of the field trip.","must be returned","within two days","The equipment"],"explanation":"Correct sentence structure: The equipment must be returned within two days of the field trip."},{"id":"W07","type":"sentence","title":"Build a Sentence","context":"Explain the comparison.","answer":["The more precisely","a question is defined,","the easier it becomes","to evaluate the evidence."],"tokens":["the easier it becomes","a question is defined,","to evaluate the evidence.","The more precisely"],"explanation":"Correct sentence structure: The more precisely a question is defined, the easier it becomes to evaluate the evidence."},{"id":"W08","type":"sentence","title":"Build a Sentence","context":"Explain how a grant is renewed.","answer":["Only after","the review panel approved the proposal","could the funding","be renewed."],"tokens":["could the funding","the review panel approved the proposal","Only after","be renewed."],"explanation":"Correct sentence structure: Only after the review panel approved the proposal could the funding be renewed."},{"id":"W09","type":"sentence","title":"Build a Sentence","context":"Describe the unexpected outcome.","answer":["What surprised the committee","was that","the simpler model","performed more reliably."],"tokens":["the simpler model","performed more reliably.","was that","What surprised the committee"],"explanation":"Correct sentence structure: What surprised the committee was that the simpler model performed more reliably."},{"id":"W10","type":"sentence","title":"Build a Sentence","context":"State the condition for the conclusion.","answer":["The findings","can be generalized","provided that","the samples are representative."],"tokens":["The findings","provided that","can be generalized","the samples are representative."],"explanation":"Correct sentence structure: The findings can be generalized provided that the samples are representative."},{"id":"W11","type":"email","title":"Write an Email","timeHint":"Suggested time: 7 minutes","prompt":"You registered for a university-organized field trip and paid a registration fee. The organizer has changed the departure time, creating a conflict with a required course. Write an email to the trip coordinator. Explain your registration and the schedule conflict; ask whether an alternative departure is possible; and, if not, request details about the cancellation and refund policy.","positions":[],"checks":["Explain the original registration and the new conflict.","Ask about a possible alternative departure.","Ask about cancellation/refund terms if no alternative exists.","Use an appropriate polite email tone."]},{"id":"W12","type":"discussion","title":"Write for an Academic Discussion","timeHint":"Suggested time: 10 minutes","prompt":"Professor Morgan: “Some university courses replace field visits with interactive digital simulations. Simulations can make rare or dangerous environments accessible, but critics argue that students lose opportunities to observe unexpected details in the real world. When teaching a practical subject, should instructors prioritize digital simulations or in-person field experience? Explain your view.”","positions":[["Student A — Elena","Digital simulations allow every student to examine the same conditions and repeat an experiment safely. That makes instruction more consistent and can reduce costs."],["Student B — Noah","Real environments do not behave like scripted simulations. Observing surprises and adapting to imperfect conditions is part of what students need to learn."]],"checks":["Take a clear position.","Engage with at least one classmate’s reasoning.","Support your view with an example or practical implication.","Write coherent, grammatically accurate academic English."]}],"clips":{"choose01":{"title":"Printer Trouble","kind":"short response","segments":[{"role":"n","text":"I tried printing my poster, but the colors came out much darker than on my screen."}],"transcript":"I tried printing my poster, but the colors came out much darker than on my screen."},"choose02":{"title":"Office Hours","kind":"short response","segments":[{"role":"n","text":"Would you mind if we moved our meeting to Thursday morning?"}],"transcript":"Would you mind if we moved our meeting to Thursday morning?"},"choose03":{"title":"Missing Reference","kind":"short response","segments":[{"role":"n","text":"I can't find the article our professor mentioned in class."}],"transcript":"I can't find the article our professor mentioned in class."},"choose04":{"title":"Workshop Limit","kind":"short response","segments":[{"role":"n","text":"They've already filled all the seats for the writing workshop."}],"transcript":"They've already filled all the seats for the writing workshop."},"choose05":{"title":"Research Delay","kind":"short response","segments":[{"role":"n","text":"It looks as though the soil samples won't arrive until next week."}],"transcript":"It looks as though the soil samples won't arrive until next week."},"choose06":{"title":"Course Choice","kind":"short response","segments":[{"role":"n","text":"Do you think I should take statistics before enrolling in the advanced methods course?"}],"transcript":"Do you think I should take statistics before enrolling in the advanced methods course?"},"choose07":{"title":"Opening Hours","kind":"short response","segments":[{"role":"n","text":"Is the art supply store still open after six on Fridays?"}],"transcript":"Is the art supply store still open after six on Fridays?"},"choose08":{"title":"Appointment Change","kind":"short response","segments":[{"role":"n","text":"I'm afraid I won't be able to attend tomorrow's advising session."}],"transcript":"I'm afraid I won't be able to attend tomorrow's advising session."},"choose09":{"title":"Abstract Deadline","kind":"short response","segments":[{"role":"n","text":"The conference abstract is due tonight, isn't it?"}],"transcript":"The conference abstract is due tonight, isn't it?"},"choose10":{"title":"Lab Key","kind":"short response","segments":[{"role":"n","text":"I returned the laboratory key, but the system still shows it as checked out."}],"transcript":"I returned the laboratory key, but the system still shows it as checked out."},"choose11":{"title":"Classroom Location","kind":"short response","segments":[{"role":"n","text":"I thought our lecture was in the science building today."}],"transcript":"I thought our lecture was in the science building today."},"choose12":{"title":"Presentation Practice","kind":"short response","segments":[{"role":"n","text":"Would you listen to my presentation and tell me whether the conclusion is clear?"}],"transcript":"Would you listen to my presentation and tell me whether the conclusion is clear?"},"choose13":{"title":"Borrowing Equipment","kind":"short response","segments":[{"role":"n","text":"Can I borrow the audio recorder over the weekend?"}],"transcript":"Can I borrow the audio recorder over the weekend?"},"choose14":{"title":"Scholarship Request","kind":"short response","segments":[{"role":"n","text":"I'm not sure which documents I need for the scholarship application."}],"transcript":"I'm not sure which documents I need for the scholarship application."},"choose15":{"title":"Elevator Closure","kind":"short response","segments":[{"role":"n","text":"The elevator is out of service again, so how can we move the exhibition panels upstairs?"}],"transcript":"The elevator is out of service again, so how can we move the exhibition panels upstairs?"},"choose16":{"title":"Survey Questions","kind":"short response","segments":[{"role":"n","text":"These survey questions seem to assume that everyone owns a car."}],"transcript":"These survey questions seem to assume that everyone owns a car."},"choose17":{"title":"Study Group","kind":"short response","segments":[{"role":"n","text":"I already finished the assigned reading. Should I bring anything else to the study group?"}],"transcript":"I already finished the assigned reading. Should I bring anything else to the study group?"},"conv01":{"title":"Archival Photography Request","kind":"conversation","segments":[{"role":"A","text":"I am preparing an exhibition about the old railway station. Can I use photographs from the university archive?"},{"role":"B","text":"Probably, but some images have restrictions because donors retained certain rights."},{"role":"A","text":"So the photographs are in the archive but not necessarily free to publish?"},{"role":"B","text":"Exactly. You can view all of them here, but permission for online publication varies."},{"role":"A","text":"The exhibition will have a website as well as printed panels."},{"role":"B","text":"Then send us a list of the images you want. We can confirm which ones have cleared digital rights."},{"role":"A","text":"And the captions? The dates on several photographs look uncertain."},{"role":"B","text":"Please label those dates as approximate rather than treating them as confirmed."},{"role":"A","text":"I see. I’ll send the list before preparing the website images."}],"transcript":"A: I am preparing an exhibition about the old railway station. Can I use photographs from the university archive?\nB: Probably, but some images have restrictions because donors retained certain rights.\nA: So the photographs are in the archive but not necessarily free to publish?\nB: Exactly. You can view all of them here, but permission for online publication varies.\nA: The exhibition will have a website as well as printed panels.\nB: Then send us a list of the images you want. We can confirm which ones have cleared digital rights.\nA: And the captions? The dates on several photographs look uncertain.\nB: Please label those dates as approximate rather than treating them as confirmed.\nA: I see. I’ll send the list before preparing the website images."},"conv02":{"title":"Experiment Room Reservation","kind":"conversation","segments":[{"role":"A","text":"Hi, I reserved the climate chamber for Wednesday, but the schedule says my booking has been canceled."},{"role":"B","text":"Did you complete the annual equipment training? The system automatically removes reservations when the record expires."},{"role":"A","text":"I completed it in January. The certificate should still be valid."},{"role":"B","text":"Let me check. Ah, your training record was entered under your previous student number."},{"role":"A","text":"Can you transfer it? I need the chamber for my experiment."},{"role":"B","text":"I can link the accounts, but someone else booked your original slot after it was released."},{"role":"A","text":"Is there another time available?"},{"role":"B","text":"There is a slot Thursday afternoon. If the temperature needs to stabilize overnight, you might prefer Friday morning."},{"role":"A","text":"Yes, I need a twelve-hour stabilization period. I’ll take Friday morning."},{"role":"B","text":"All right. I’ll send confirmation once the record is updated."}],"transcript":"A: Hi, I reserved the climate chamber for Wednesday, but the schedule says my booking has been canceled.\nB: Did you complete the annual equipment training? The system automatically removes reservations when the record expires.\nA: I completed it in January. The certificate should still be valid.\nB: Let me check. Ah, your training record was entered under your previous student number.\nA: Can you transfer it? I need the chamber for my experiment.\nB: I can link the accounts, but someone else booked your original slot after it was released.\nA: Is there another time available?\nB: There is a slot Thursday afternoon. If the temperature needs to stabilize overnight, you might prefer Friday morning.\nA: Yes, I need a twelve-hour stabilization period. I’ll take Friday morning.\nB: All right. I’ll send confirmation once the record is updated."},"conv03":{"title":"Student Podcast Project","kind":"conversation","segments":[{"role":"A","text":"Our class podcast is almost finished, but we are not sure whether we can include a short song in the introduction."},{"role":"B","text":"Is it a recording your group created?"},{"role":"A","text":"No, it is commercially released music. We only planned to use ten seconds."},{"role":"B","text":"The length alone does not guarantee permission. Have you considered music offered under a suitable license?"},{"role":"A","text":"We could use something from the university media library."},{"role":"B","text":"That is a good place to start, but check whether its license covers public distribution."},{"role":"A","text":"The podcast will be available outside the university."},{"role":"B","text":"Then you need rights that allow that use, and you may also need to provide attribution."},{"role":"A","text":"All right. We will replace the song and check the terms carefully."}],"transcript":"A: Our class podcast is almost finished, but we are not sure whether we can include a short song in the introduction.\nB: Is it a recording your group created?\nA: No, it is commercially released music. We only planned to use ten seconds.\nB: The length alone does not guarantee permission. Have you considered music offered under a suitable license?\nA: We could use something from the university media library.\nB: That is a good place to start, but check whether its license covers public distribution.\nA: The podcast will be available outside the university.\nB: Then you need rights that allow that use, and you may also need to provide attribution.\nA: All right. We will replace the song and check the terms carefully."},"ann01":{"title":"University Garden Volunteer Briefing","kind":"announcement","segments":[{"role":"n","text":"Good morning, volunteers. Saturday’s garden restoration session will begin at nine in the courtyard behind the science center. Please do not enter through the greenhouse, which is closed for pest treatment. The first half-hour will cover tool safety, so late arrivals may not use pruning equipment until they complete a make-up briefing. Gloves and hand tools are provided, but participants should bring water and closed-toe shoes. Because we will be planting native grasses in a wet area, the work may be postponed if there is lightning. Any postponement will be announced by seven Saturday morning through the volunteer portal."}],"transcript":"n: Good morning, volunteers. Saturday’s garden restoration session will begin at nine in the courtyard behind the science center. Please do not enter through the greenhouse, which is closed for pest treatment. The first half-hour will cover tool safety, so late arrivals may not use pruning equipment until they complete a make-up briefing. Gloves and hand tools are provided, but participants should bring water and closed-toe shoes. Because we will be planting native grasses in a wet area, the work may be postponed if there is lightning. Any postponement will be announced by seven Saturday morning through the volunteer portal."},"ann02":{"title":"Evening Transit Policy","kind":"announcement","segments":[{"role":"n","text":"Attention students using the evening campus shuttle. Starting Monday, the shuttle will operate on a revised schedule during the examination period. The final departure from the central library will be at eleven forty-five p.m., fifteen minutes later than usual. However, the shuttle will no longer stop outside the west residence hall because construction has narrowed the access road. Passengers should instead use the stop at the student health center, approximately four minutes away on foot. Students who require an accessible pickup at the residence hall may request one through the transport office at least two hours before travel. The daytime shuttle schedule remains unchanged."}],"transcript":"n: Attention students using the evening campus shuttle. Starting Monday, the shuttle will operate on a revised schedule during the examination period. The final departure from the central library will be at eleven forty-five p.m., fifteen minutes later than usual. However, the shuttle will no longer stop outside the west residence hall because construction has narrowed the access road. Passengers should instead use the stop at the student health center, approximately four minutes away on foot. Students who require an accessible pickup at the residence hall may request one through the transport office at least two hours before travel. The daytime shuttle schedule remains unchanged."},"talk01":{"title":"How Ancient Concrete Changes Underwater","kind":"academic talk","segments":[{"role":"n","text":"When we think of concrete, we often imagine a material that gradually weakens when exposed to seawater. Yet some ancient harbor structures have endured for many centuries. Researchers studying Roman marine concrete have found that its long-term behavior differs from that of many modern mixtures."},{"role":"n","text":"One important ingredient was volcanic ash. When it reacted with lime and seawater, new minerals could form within the concrete over time. In certain samples, these mineral formations filled tiny spaces and strengthened parts of the material. That does not mean every ancient structure was durable, nor that modern concrete should simply copy an ancient recipe."},{"role":"n","text":"The original mixtures varied from one location to another, and the performance of a harbor wall also depends on its design and the forces acting upon it. Moreover, modern buildings often require faster curing and standardized strength, which create different engineering priorities."},{"role":"n","text":"What makes this research valuable is the way it expands the possibilities engineers consider. Instead of assuming that chemical change must always cause deterioration, researchers can investigate conditions under which change contributes to durability."}],"transcript":"n: When we think of concrete, we often imagine a material that gradually weakens when exposed to seawater. Yet some ancient harbor structures have endured for many centuries. Researchers studying Roman marine concrete have found that its long-term behavior differs from that of many modern mixtures.\nn: One important ingredient was volcanic ash. When it reacted with lime and seawater, new minerals could form within the concrete over time. In certain samples, these mineral formations filled tiny spaces and strengthened parts of the material. That does not mean every ancient structure was durable, nor that modern concrete should simply copy an ancient recipe.\nn: The original mixtures varied from one location to another, and the performance of a harbor wall also depends on its design and the forces acting upon it. Moreover, modern buildings often require faster curing and standardized strength, which create different engineering priorities.\nn: What makes this research valuable is the way it expands the possibilities engineers consider. Instead of assuming that chemical change must always cause deterioration, researchers can investigate conditions under which change contributes to durability."},"talk02":{"title":"Why Random Patterns Look Meaningful","kind":"academic talk","segments":[{"role":"n","text":"Suppose you flip a fair coin six times and get six heads. Many people feel that tails must be more likely on the next flip. But if the coin is fair and each flip is independent, the probability of tails remains one half. This error is known as the gambler’s fallacy."},{"role":"n","text":"People often expect a short sequence to resemble the overall balance of a much larger sample. Yet randomness does not guarantee that every small group of events will look balanced. In fact, long runs of one result are expected to occur occasionally when sufficiently many trials are observed."},{"role":"n","text":"An interesting complication arises when the events are not truly independent. Imagine a manufacturing process in which a machine becomes less accurate as it warms up. A run of defective products might reveal a real change in conditions. In that case, previous outcomes provide useful evidence about what may happen next."},{"role":"n","text":"So the lesson is not that past observations are always irrelevant. Instead, we must ask whether the process generating the outcomes is stable and whether events influence one another. Our intuitions about patterns can mislead us, but careful examination of mechanisms can sometimes reveal genuine dependence."}],"transcript":"n: Suppose you flip a fair coin six times and get six heads. Many people feel that tails must be more likely on the next flip. But if the coin is fair and each flip is independent, the probability of tails remains one half. This error is known as the gambler’s fallacy.\nn: People often expect a short sequence to resemble the overall balance of a much larger sample. Yet randomness does not guarantee that every small group of events will look balanced. In fact, long runs of one result are expected to occur occasionally when sufficiently many trials are observed.\nn: An interesting complication arises when the events are not truly independent. Imagine a manufacturing process in which a machine becomes less accurate as it warms up. A run of defective products might reveal a real change in conditions. In that case, previous outcomes provide useful evidence about what may happen next.\nn: So the lesson is not that past observations are always irrelevant. Instead, we must ask whether the process generating the outcomes is stable and whether events influence one another. Our intuitions about patterns can mislead us, but careful examination of mechanisms can sometimes reveal genuine dependence."}}};

<script>
/* Browser-native speech engine. This version includes NO low-fidelity pre-rendered MP3 recordings.
   The browser/OS supplies the voice. SpeechSynthesis quality varies by device and voice selection. */
(() => {
  'use strict';
  const synth = window.speechSynthesis;
  let revision = 0;
  let active = null;
  const supported = Boolean(synth && window.SpeechSynthesisUtterance);
  const key = v => v ? v.name+'|'+v.lang+'|'+v.voiceURI : '';
  const getVoices = () => supported ? synth.getVoices().filter(v=>/^en[-_]/i.test(v.lang)).sort((a,b)=>rank(b)-rank(a)) : [];
  function rank(v){
    const n=(v.name+' '+v.voiceURI).toLowerCase();let r=0;
    if(/(neural|natural|enhanced|premium|high quality)/.test(n))r+=40;
    if(/(ava|samantha|allison|zoe|aria|jenny|guy|serena|daniel|moira)/.test(n))r+=24;
    if(/(google us english|microsoft)/.test(n))r+=15;
    if(/^en-us$/i.test(v.lang))r+=9;
    if(v.localService)r+=3;
    if(/(espeak|default|compact|fred)/i.test(n))r-=25;
    return r;
  }
  const choose = (id,preferredOpposite='') => {
    const voices=getVoices();
    if (id) return voices.find(v=>key(v)===id)||voices[0]||null;
    if (preferredOpposite) return voices.find(v=>key(v)!==preferredOpposite)||voices[0]||null;
    return voices[0]||null;
  };
  function chunk(text){
    const sentences=(text.match(/[^.!?;]+[.!?;]?/g)||[text]).map(s=>s.trim()).filter(Boolean);
    const result=[];
    for(const sentence of sentences){
      if(sentence.length<=145){result.push(sentence);continue;}
      const words=sentence.split(' ');let buf='';
      for(const w of words){if((buf+' '+w).length>125 && buf){result.push(buf);buf=w;}else buf+=(buf?' ':'')+w;}
      if(buf)result.push(buf);
    }
    return result;
  }
  function stop(){revision++;if(supported){try{synth.cancel();}catch(e){}}active=null;}
  function playSegments(segments,conf,onFinish,onError){
    stop();if(!supported){onError?.('当前浏览器不支持系统英语语音合成，请使用 Chrome 或 Safari。');return false;}
    const myRun=revision,chosenA=choose(conf.primary),chosenB=choose(conf.secondary,key(chosenA)),rate=Math.max(.75,Math.min(1.12,Number(conf.rate)||.94));
    const queue=[];
    for(const seg of segments){
      const role=seg.role||'n';let v=role==='B'?chosenB:chosenA;
      for(const s of chunk(seg.text))queue.push({text:s,voice:v});
    }
    if(!queue.length){onError?.('录音文本为空。');return false;}
    let cursor=0;
    function speakNext(){
      if(myRun!==revision)return;
      if(cursor>=queue.length){active=null;onFinish?.();return;}
      const item=queue[cursor++],u=new SpeechSynthesisUtterance(item.text);active=u;
      u.lang=item.voice?.lang||'en-US';if(item.voice)u.voice=item.voice;
      u.rate=rate;u.pitch=1;u.volume=1;
      u.onend=()=>{if(myRun===revision)speakNext();};
      u.onerror=err=>{if(myRun!==revision)return;active=null;onError?.('语音播放被中断或不可用：'+(err.error||'unknown')+'。请换一个系统声音并重新试听。');};
      try{synth.speak(u);}catch(err){onError?.('浏览器无法朗读此段文本：'+err.message);}
    }
    speakNext();return true;
  }
  const defaults={primary:'',secondary:'',rate:.94};
  const storage='toefl-voice-settings-v3';
  function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(storage)||'{}')}}catch(e){return {...defaults}}}
  function save(conf){try{localStorage.setItem(storage,JSON.stringify(conf))}catch(e){}}
  window.TOEFL_VOICE={supported,getVoices,key,load,save,stop,playSegments,preview:(conf,onDone,onError)=>playSegments([{role:'n',text:'Good afternoon. You are listening to an English voice sample. Please choose a voice that is clear and comfortable to understand.'}],conf,onDone,onError)};
})();


</script>
<script>
/* TOEFL Examination Studio — original practice software, not an ETS product. */
(() => {
  'use strict';
  const BANK = window.TOEFL_BANK;
  const APP = document.getElementById('app');
  if (!BANK || !APP) { document.body.innerHTML = '<p style="padding:30px">题库未能加载。请打开完整版 HTML 或使用 ZIP 文件中的 index.html。</p>'; return; }
  const OPTIONS = {
    full: { label:'完整模拟', times: {reading:30, listening:29, writing:23}, ids: null },
    quick: { label:'短时练习', times: {reading:9, listening:9, writing:17}, ids: {
      reading:['R01','R02','R03','R04','R05','R06','R31','R32','R41','R42','R43','R44'],
      listening:['L01','L02','L03','L18','L19','L30','L31','L38','L39'],
      writing:['W01','W02','W03','W11','W12']
    }}
  };
  const SECTION_NAMES = { reading:'Reading 阅读', listening:'Listening 听力', writing:'Writing 写作' };
  const SECTION_ORDER=['reading','listening','writing'];
  const STORAGE_KEY='toefl-exam-studio-2026-set-c-mobile-v5';
  let state = null, modal=null, selectedTab='all', currentAudio=null, tickInterval=null, showingResult=false;
  const items = (section) => state?.ids?.[section]?.map(id=>BANK[section].find(q=>q.id===id)).filter(Boolean) || [];
  const e = (value) => String(value ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const escAttr = e;
  // Neutral word groups: punctuation and sentence-initial capitalization are hidden during answering.
  const neutralToken = token => String(token ?? '').toLocaleLowerCase('en-US').replace(/[.,!?;:\u2026\u3002\uff0c\uff01\uff1f\uff1b\uff1a]/g,'').trim();
  const trim = value => String(value??'').trim();
  const clean = value => trim(value).normalize('NFKC').toLowerCase().replace(/[\s.,!?;:]+/g,'');
  const tallyWords = value => (trim(value).match(/\b[\w’'-]+\b/g)||[]).length;
  const formatTime = seconds => {const sec=Math.max(0,Math.ceil(seconds));return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');};
  const header = (right='') => `<header class="site-header"><div class="brand"><div class="mark">T</div><div><div class="brand-main">TOEFL · EXAMINATION STUDIO</div><div class="brand-sub">INDEPENDENT PRACTICE · 2026 FORMAT</div></div></div><div class="site-right"><span class="header-note">Reading / Listening / Writing</span>${right}</div></header>`;
  const save=()=>{if (!state) return;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(err){/* local file browser policy */}};
  const load=()=>{try{const raw=localStorage.getItem(STORAGE_KEY); if(!raw)return null; const o=JSON.parse(raw); if(o.version===4 && o.bankVersion===BANK.version && OPTIONS[o.mode] && o.ids && o.answers && o.section)return o;}catch(err){}return null;};
  const audioStop=()=>{window.TOEFL_VOICE?.stop();currentAudio=null;};
  const voice=window.TOEFL_VOICE;
  let voiceConfig=voice?.load()||{primary:'',secondary:'',rate:.94};
  const voiceOptions=(which='primary')=>'<option value="">'+(which==='secondary'?'自动选择另一种英语语音':'自动选择系统英语语音')+'</option>'+voice.getVoices().map(v=>'<option value="'+e(voice.key(v))+'" '+(voice.key(v)===voiceConfig[which]?'selected':'')+'>'+e(v.name)+' · '+e(v.lang)+'</option>').join('');
  const voicePanel=(mini=false)=>`<div class="voice-panel ${mini?'mini':''}"><div class="voice-title">听力语音试听 / AUDIO CHECK</div><p>新版使用浏览器和操作系统中的英语声音，不再使用旧版的低质量 MP3。自然度取决于设备安装的语音。请在正式答题前试听。</p><div class="voice-controls"><label>主讲声音 <select id="voice-primary" data-voice="primary">${voiceOptions()}</select></label><label>对话第二声音 <select id="voice-secondary" data-voice="secondary">${voiceOptions('secondary')}</select></label><label>语速 <select id="voice-rate" data-voice="rate">${[.82,.88,.94,1,1.06].map(n=>`<option value="${n}" ${Number(voiceConfig.rate)===n?'selected':''}>${n.toFixed(2)}×</option>`).join('')}</select></label><button class="btn secondary small" data-action="voice-test">▶ 试听声音</button><button class="btn secondary small" data-action="voice-test-dialogue">▶ 试听对话</button></div><div class="audio-test-status" id="voice-test-status">${!voice.supported?'此浏览器不支持系统语音，请使用 Chrome 或 Safari':voice.getVoices().length?'请选择英语声音后试听':'暂未检测到英语语音。若试听失败，请在系统设置中添加英语声音，或换用 Safari。'}</div></div>`;
  const saveVoice=()=>{voice.save(voiceConfig)};
  const usedTime=(sec)=>{const max=OPTIONS[state.mode].times[sec]*60;return formatTime(Math.max(0,max-(state.remaining?.[sec]??max)));};
  const initialIds=(mode)=>Object.fromEntries(SECTION_ORDER.map(k=>[k, OPTIONS[mode].ids ? OPTIONS[mode].ids[k].slice() : BANK[k].map(q=>q.id)]));
  const start=(mode)=>{
    audioStop();
    state={version:4,bankVersion:BANK.version,mode,section:'reading',sectionIndex:0,ids:initialIds(mode),answers:{},played:{},sectionsDone:{},reviewSection:null,reviewIndex:0,startedAt:new Date().toISOString(),deadlines:{},remaining:{},finishedAt:null};
    state.deadlines.reading=Date.now()+OPTIONS[mode].times.reading*60000;
    showingResult=false;selectedTab='all';modal=null;save();render();
  };
  const getTimeLeft=()=>{if(!state || state.section==='results' || state.section==='sectionReview')return 0;return Math.max(0, Math.ceil((state.deadlines[state.section]||Date.now())-Date.now())/1000);};
  const activeQuestions=()=>items(state.section);
  const questionAt=()=> activeQuestions()[state.sectionIndex] || activeQuestions()[0];
  const isAnswered=(q)=> {const v=state.answers[q.id]; if(q.type==='sentence')return Array.isArray(v)&&v.length>0;return typeof v==='number'|| (typeof v==='string'&&trim(v)!=='');};
  const countAnswered=(section)=>items(section).filter(isAnswered).length;
  const nextIndex=(dir)=>{
    const arr=activeQuestions();let idx=state.sectionIndex;
    const q=arr[idx];
    if(q?.type==='cloze') {
      const group=q.group;
      if(dir>0) {while(idx<arr.length && arr[idx]?.group===group)idx++;} else {while(idx>=0 && arr[idx]?.group===group)idx--; if(idx>=0 && arr[idx]?.type==='cloze'){const prevGroup=arr[idx].group;while(idx>0&&arr[idx-1]?.group===prevGroup)idx--;}}
    } else idx+=dir;
    return idx;
  };
  const navigate=(idx)=>{
    const arr=activeQuestions();if(idx<0||idx>=arr.length)return;
    const target=arr[idx];
    if(state.section==='listening'&&currentAudio?.playing){
      if(state.mode==='full'||target.clip!==currentAudio.clip){
        const el=document.getElementById('audio-status');
        if(el)el.textContent='请完整听完录音，然后再切换到下一段音频。';
        return;
      }
    }else if(currentAudio?.playing){audioStop();}
    state.sectionIndex=target.type==='cloze'?arr.findIndex(x=>x.group===target.group):idx;
    save();render();window.scrollTo({top:0,behavior:'instant'});
  };
  // Review is deliberately outside the timed exam. Submitted answers are locked.
  const finishCurrentSection=()=>{
    audioStop();const section=state.section;
    if(!SECTION_ORDER.includes(section))return;
    state.sectionsDone[section]=true;
    state.remaining[section]=getTimeLeft();
    state.reviewSection=section;state.reviewIndex=0;
    state.section='sectionReview';
    if(section==='writing')state.finishedAt=new Date().toISOString();
    modal=null;save();render();window.scrollTo(0,0);
  };
  const continueAfterReview=()=>{
    if(!state || state.section!=='sectionReview')return;
    audioStop();
    const next=SECTION_ORDER.find(s=>!state.sectionsDone[s]);
    if(!next){state.section='results';state.reviewSection=null;showingResult=true;}
    else {
      state.section=next;state.sectionIndex=0;
      state.reviewSection=null;
      if(!state.deadlines[state.section])state.deadlines[state.section]=Date.now()+OPTIONS[state.mode].times[state.section]*60000;
    }
    save();render();window.scrollTo(0,0);
  };
  const openReview=(section)=>{
    if(!state || !state.sectionsDone[section])return;
    audioStop();state.reviewSection=section;state.reviewIndex=0;state.section='sectionReview';save();render();window.scrollTo(0,0);
  };
  const timerTick=()=>{
    if(!state || state.section==='results' || state.section==='sectionReview')return;
    const left=getTimeLeft();const timer=document.getElementById('exam-timer');if(timer){timer.textContent=formatTime(left);timer.classList.toggle('danger',left<60);}
    if(left<=0) {finishCurrentSection();}
  };
  const render=()=>{
    if(!state){renderHome();return;}
    if(state.section==='results'){renderResults();return;}
    if(state.section==='sectionReview'){renderSectionReview();return;}
    if(getTimeLeft()<=0){finishCurrentSection();return;}
    renderExam();
