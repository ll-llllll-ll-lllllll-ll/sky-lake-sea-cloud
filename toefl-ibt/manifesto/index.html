<script type="application/json" id="exam-data">{"readings": [{"title": "The Infrastructure of Everyday Life", "origin": "Preface — After Architecture; Modern Ruins", "level": "B2+", "passage": "A city's infrastructure is generally most successful when its operation goes unnoticed. Water arrives when a tap is opened, trains appear at scheduled intervals, and walls reliably divide public from private space. Because people encounter these arrangements from childhood, they may treat them as natural features of the world rather than products of investment, planning, and continual maintenance. Some scholars describe this human-made environment as a \"second nature\": a network so familiar that its historical construction becomes difficult to perceive.\n\nThe apparent permanence of such systems, however, depends on decisions that are rarely distributed equally. A neighborhood may receive a new transit line while another loses a public service. An aging facility may be repaired, replaced, or abandoned according to changing calculations of value. A building that once represented stability can therefore become obsolete even while its walls remain structurally sound. The physical structure and the social purpose that supported it do not necessarily disappear together.\n\nAbandoned infrastructure makes these distinctions unusually visible. Exposed pipes, empty entrances, and discontinued routes reveal relationships that once appeared inevitable. Yet it would be misleading to interpret every abandoned structure as evidence that planning itself has failed. Some facilities were superseded by better alternatives; others were left behind by unequal political or economic priorities. Examining a ruin requires distinguishing the processes that originally produced it from the forces that continue to change it. What looks like the end of a building may therefore be a useful beginning for investigating the wider system to which it once belonged.", "questions": [{"kind": "Main idea", "ask": "What is the passage primarily concerned with?", "choices": ["How the maintenance of existing systems can delay the need for infrastructure replacement", "How neglected structures make otherwise hidden social and material systems easier to investigate", "Why the material traces of abandoned buildings can clarify the history of their earlier use", "How differences in public investment influence the distribution of familiar urban services"], "ans": 1, "why": "The author moves from unnoticed systems to abandonment as an opportunity to expose their underlying relationships.", "trap": "C offers a tempting emphasis on physical traces, but the author also stresses policy, values and historical evidence."}, {"kind": "Inference", "ask": "What can be inferred about a building that remains structurally sound after being abandoned?", "choices": ["The cost of keeping it in use may have exceeded the value assigned to its former function.", "Its previous function may have become unnecessary independently of its physical condition.", "The building may have retained its earlier social function despite the loss of maintenance.", "Its design was originally too inflexible for changing urban needs."], "ans": 1, "why": "The second paragraph separates the disappearance of a function from the physical survival of its building.", "trap": "A and D give specific causal explanations that the text does not establish."}, {"kind": "Rhetoric", "ask": "Why does the author mention water arriving when a tap is opened?", "choices": ["To show that reliable services depend on sustained technical maintenance", "To explain why infrastructure is usually examined through household consumption", "To illustrate how routine operation can conceal the constructed character of a system", "To introduce a contrast between infrastructure experienced privately and collectively"], "ans": 2, "why": "The example establishes the seeming naturalness of familiar infrastructure.", "trap": "B uses a related idea but narrows the purpose to household consumption."}, {"kind": "Vocabulary", "ask": "In the passage, \"superseded\" is closest in meaning to ...", "choices": ["replaced", "repaired", "restricted", "reassessed"], "ans": 0, "why": "A superior or newer alternative can replace an old facility.", "trap": "Repaired and reassessed refer to interventions, not displacement by a successor."}, {"kind": "Inference", "ask": "Why does the author avoid treating all abandoned structures as failures of planning?", "choices": ["The visible condition of a building does not always reveal the decisions behind its abandonment.", "Different forms of abandonment can arise from improvement as well as exclusion.", "A building’s original purpose can never be determined from its remains.", "Changes in maintenance priorities can reflect economic improvement in some neighborhoods."], "ans": 1, "why": "The final paragraph contrasts better alternatives with unequal social priorities.", "trap": "A overstates the warning about evidence; C and D are unsupported criteria."}, {"kind": "Function", "ask": "What role does the final sentence play in the argument?", "choices": ["It recommends tracing the original design before evaluating any later social changes.", "It qualifies the earlier claim that the meaning of ruins depends on social values.", "It reframes apparent termination as an entry point for system-level inquiry.", "It moves from the social causes of abandonment toward the material forces of decay."], "ans": 2, "why": "The sentence reframes a ruin as a starting point for a broader investigation.", "trap": "B resembles an academic qualification but does not describe the rhetorical turn."}]}, {"title": "Traces and the Limits of Reconstruction", "origin": "Second Tenet: An Archaeology of Things Close at Hand; The Boundaries of the Ruinwright", "level": "C1", "passage": "Archaeologists have long used everyday objects to reconstruct activities that written records overlook. The contents of a recently abandoned factory or apartment may seem too ordinary to deserve similar attention. Yet ordinary remains can reveal the organization of labor, the distribution of resources, and changes in consumption with unusual immediacy. A worn handrail may indicate repeated movement; a sequence of repairs may suggest the gradual failure of a machine. Each trace offers evidence of a past practice, although it rarely identifies every person or event responsible for producing it.\n\nThis incompleteness creates a methodological problem. A researcher can sometimes construct a persuasive story by arranging scattered fragments into a sequence, but a convincing sequence is not necessarily the one that occurred. A child's notebook left in a damaged building, for example, might indicate recent occupation without revealing why its owner departed. Treating the object as proof of forced displacement would exceed the evidence, even if that interpretation fitted a broader historical pattern.\n\nThe difficulty is especially acute when a site remains connected to living communities. Material traces can be made visible through documentation, but their interpretation may also affect people who remember the events differently. Responsible research therefore involves more than accurate observation. It requires distinguishing what can be established from what remains uncertain, recognizing the interests of people connected to a site, and sometimes leaving gaps deliberately unresolved. An incomplete account is not always a weak one: when the evidence is limited, restraint can be part of the accuracy of the account itself.", "questions": [{"kind": "Main idea", "ask": "Which statement best expresses the passage’s central argument?", "choices": ["The proximity of recent abandonment to living memory complicates how physical traces are interpreted.", "Reconstructing narratives from ordinary objects can establish the overlooked activities of former occupants.", "Studying ordinary remnants can yield valuable evidence, but interpretation must respect uncertainty and affected communities.", "Archaeological methods should be replaced by interviews at recently abandoned sites."], "ans": 2, "why": "The passage balances the value of traces with epistemic and ethical constraints.", "trap": "B sounds constructive but contradicts the author’s insistence that gaps may remain unresolved."}, {"kind": "Detail", "ask": "What does the worn handrail illustrate?", "choices": ["Material damage can suggest patterns of repeated human activity.", "Patterns of repeated movement may help reconstruct the timing of a building’s abandonment.", "Signs of repair may provide a different kind of evidence from signs of repeated use.", "Structural deterioration proves that a building was abandoned gradually."], "ans": 0, "why": "Wear is evidence of use, not of named individuals or the entire history of the site.", "trap": "B extends a trace beyond what it supports."}, {"kind": "Inference", "ask": "Why is the notebook example especially important?", "choices": ["Personal artifacts may indicate the timing of occupation more readily than its social cause.", "It demonstrates that a plausible explanation may go beyond what a particular piece of evidence warrants.", "It establishes that the date of abandonment is usually impossible to determine.", "Written records should be preferred when material objects permit multiple explanations."], "ans": 1, "why": "The notebook shows the gap between a permissible inference and a specific story asserted as fact.", "trap": "A generalizes a distinction the author never makes."}, {"kind": "Vocabulary", "ask": "\"Acute\" in \"especially acute\" most nearly means ...", "choices": ["carefully observed", "especially serious", "recently discovered", "difficult to describe"], "ans": 1, "why": "Acute here intensifies the severity of the methodological difficulty.", "trap": "D refers to description, not degree of seriousness."}, {"kind": "Rhetoric", "ask": "Why does the passage introduce people who remember events differently?", "choices": ["To propose that living testimony should resolve ambiguities left by material evidence", "To explain why all sites with living witnesses should remain closed", "To introduce the ethical consequences of interpreting remnants in public", "To establish the limits of applying archaeological methods to contemporary locations"], "ans": 2, "why": "The final paragraph adds affected communities to the earlier concern about uncertain inference.", "trap": "A incorrectly ranks one evidence type over another."}, {"kind": "Inference", "ask": "Which research report would best follow the author’s recommendation?", "choices": ["One that organizes all surviving traces into the most plausible continuous narrative", "One that limits its conclusions to physical measurements and ignores personal memory", "One that identifies supported conclusions while distinguishing them from unresolved possibilities", "One that discusses uncertain conclusions only when independent witnesses support them"], "ans": 2, "why": "The author supports calibrated claims and acknowledged gaps.", "trap": "B removes a relevant source of evidence; D turns caution into an unreasonable absolute."}]}, {"title": "Designing With Existing Conditions", "origin": "Third Tenet: Borrowing the Ruin; The Boundaries of the Ruinwright", "level": "B2+", "passage": "Conventional construction typically begins with a design specifying how a site should be changed. Ecological restoration and adaptive reuse often proceed differently: existing conditions are treated as constraints that help determine the intervention. A disused brick courtyard, for example, may already contain channels through which rainwater flows and small pockets of soil where plants have established themselves. Rather than covering the entire surface with a new uniform design, a project might work around those channels and pockets.\n\nThis approach does not mean that environmental processes are automatically beneficial. Roots can destabilize masonry, while standing water can damage nearby buildings. Nor does it mean that an abandoned site is available for unrestricted experimentation. Structural surveys, environmental assessments, property permissions, and consultation with people connected to the location may remain essential. The fact that a structure is no longer used for its original purpose does not remove obligations to those who could be affected by an intervention.\n\nA productive design response may therefore be modest in scale but demanding in judgment. Its designer must identify which materials can safely be reused, where additional loads are acceptable, and which natural processes should be allowed to continue without interference. Such projects sometimes make their temporary character explicit, accepting that a small installation may eventually be removed or change as the site evolves. Their success should not be measured solely by permanence. It may instead depend on whether they make a site's ongoing transformations understandable while avoiding unnecessary damage. In this respect, \"working with\" a place describes an ongoing negotiation, not an absence of design.", "questions": [{"kind": "Main idea", "ask": "What is the passage’s main claim about working with existing site conditions?", "choices": ["It limits design choices by making environmental change the primary determinant of the intervention.", "It can guide a less intrusive intervention, but still requires technical and ethical decisions.", "It succeeds only when a site is left untouched by humans.", "It can result in a structure whose form is better adapted to long-term ecological change."], "ans": 1, "why": "The author repeatedly qualifies ecological responsiveness with judgment, permissions and safety.", "trap": "A confuses responsiveness with a lack of design."}, {"kind": "Detail", "ask": "Which feature of the courtyard is used to illustrate a design constraint?", "choices": ["The original size of its surrounding buildings", "The location of existing water channels and soil pockets", "The legal distinction between private and public courtyards", "The composition of its underground foundations"], "ans": 1, "why": "The first paragraph explicitly describes rainwater channels and established vegetation pockets.", "trap": "D is a plausible construction detail but not the cited example."}, {"kind": "Inference", "ask": "What does the author imply about an installation that is later removed?", "choices": ["Its success must be judged from the long-term condition of the site rather than its temporary effects.", "It can be successful if its temporary presence was appropriate to the site.", "It should be considered successful only if the original building is restored.", "Its removal suggests that the designer adapted the installation to changes in site conditions."], "ans": 1, "why": "Success is not reduced to physical permanence.", "trap": "D treats later removal as evidence of failure without such evidence."}, {"kind": "Vocabulary", "ask": "\"Constraints\" is closest in meaning to ...", "choices": ["restrictions that shape possible action", "resources that guarantee success", "temporary disruptions of a plan", "measurements taken after construction"], "ans": 0, "why": "Constraints define what is possible and safe to do.", "trap": "B casts all constraints as positive resources, which the text does not claim."}, {"kind": "Function", "ask": "Why does the author discuss roots destabilizing masonry?", "choices": ["To establish that natural growth must generally be suppressed when restoring damaged masonry", "To show that neglected masonry is generally beyond repair", "To qualify the idea that allowing natural processes to continue is always desirable", "To suggest that structural safety may require more active intervention than the original design proposed"], "ans": 2, "why": "The example prevents a simplistic celebration of all natural processes.", "trap": "B and D are narrower, unsupported technical conclusions."}, {"kind": "Inference", "ask": "Which project best illustrates the approach defended in the passage?", "choices": ["Maintaining most existing features while replacing drainage with a standardized system", "Reusing materials that appear stable without first requesting structural assessment", "Reusing stable materials, protecting existing drainage, and planning for later removal", "Leaving hazardous walls intact on the assumption that any collapse is natural"], "ans": 2, "why": "The combination of adaptation, safety and temporariness matches the passage.", "trap": "D wrongly equates noninterference with neglecting safety obligations."}]}, {"title": "Why Cracks Are Not Merely Damage", "origin": "Fourth Tenet: Brutal Materiality; Fifth Tenet: The Force-Flow View", "level": "C1", "passage": "Engineers distinguish the visible appearance of a structure from its capacity to transmit forces. Two walls may look equally solid while carrying very different loads; a narrow fracture may be more significant in one location than a wider fracture elsewhere. To understand deterioration, a specialist must consider the surrounding connections, the materials involved, and the direction in which forces travel. A crack is therefore not simply a defect to be counted. It can be a clue to how stress is redistributed within a system.\n\nWhen one component weakens, the consequences may extend beyond its immediate surroundings. A beam that shifts can alter the force carried by neighboring columns; a fragment that falls may unexpectedly brace another piece. Such changes are difficult to predict from surface appearance alone. They also show why a structure that seems motionless may be participating in a slow process of adjustment. Corrosion, temperature cycles, and repeated small movements can gradually change how the structure bears weight.\n\nArtists studying material deterioration sometimes borrow these ideas to make hidden forces perceptible. An instrument connected to a safe-scale model, for instance, might translate small displacements into sound or light. The aim is not necessarily to prevent failure or to reproduce every aspect of a real building. It may be to reveal relationships that ordinarily remain unnoticed until a much larger change occurs. Nevertheless, an artistic model cannot establish the safety of an actual site. Its explanatory value depends on being clear about which structural relations it represents and which have been omitted.", "questions": [{"kind": "Main idea", "ask": "What is the passage mainly explaining?", "choices": ["Why the apparent width of a fracture can sometimes misrepresent its structural importance", "How structural traces can reveal changing force relationships beyond what surface appearance shows", "How sensory technologies can provide evidence that visual examination alone may miss", "How changes in a building’s components can be measured before the structure visibly deteriorates"], "ans": 1, "why": "The central argument connects observable traces to system-wide redistribution, with models as a secondary application.", "trap": "A is attractive but contradicted by the first paragraph."}, {"kind": "Inference", "ask": "Why might a small crack be important?", "choices": ["It may be an early indication of slow deterioration elsewhere in the same building.", "Its location and connections may make it relevant to the transfer of substantial forces.", "Its position may reveal the history of earlier loading even if current stress is limited.", "It may reveal cosmetic damage even when stress remains unchanged."], "ans": 1, "why": "Significance depends on structural context and load paths, not crack width alone.", "trap": "A overstates the diagnostic certainty."}, {"kind": "Detail", "ask": "According to the passage, what may happen when a beam shifts?", "choices": ["A shifted beam transfers force to nearby columns.", "A fallen fragment may unexpectedly provide support to another low Failure Through Models", "origin": "Sixth Tenet: The Destructive Test Body; Fifth Tenet", "level": "B2+", "passage": "Material failure often occurs at scales that are difficult to observe directly. In some cases, microscopic damage accumulates so slowly that a person cannot detect a change during a single visit. In others, the final break happens rapidly enough to make direct observation hazardous. Researchers respond by constructing test specimens that reproduce selected features of larger systems: the arrangement of joints, the distribution of weight, or a particular material connection. These specimens permit controlled measurements without requiring an entire structure to be placed at risk.\n\nSensors extend what can be observed. A strain gauge can register changes too small to see, while a vibration sensor detects mechanical movement and turns it into a record that can be analyzed. By comparing measurements across repeated tests, researchers can sometimes identify how damage develops before a visible fracture occurs. Yet the specimen is never a perfect substitute for the original structure. Its reduced size, simplified geometry, and different boundary conditions may alter the way it fails.\n\nThe distinction matters when such tests are presented to a general audience. A dramatic break can communicate the fragility of seemingly stable materials, but the audience may mistake the sequence for a prediction of what will happen at a specific site. Good interpretation therefore explains the experiment's limited purpose: to reveal a mechanism or relationship under controlled conditions. The most informative test is not always the most spectacular. It is the one whose results are connected carefully to the question being investigated.", "questions": [{"kind": "Main idea", "ask": "What is the main purpose of the passage?", "choices": ["To explain why the study of material failure has shifted from full-scale tests to smaller specimens", "To explain the uses and interpretive limits of test specimens for studying material failure", "To compare what sensor records and public demonstrations can reveal about failure", "To illustrate how different experimental designs isolate changes in materials"], "ans": 1, "why": "The article develops both what tests reveal and why their scope must be specified.", "trap": "A generalizes beyond the carefully stated limits."}, {"kind": "Inference", "ask": "Why may a small test specimen fail differently from a full building?", "choices": ["The specimen is tested under loading conditions that the full building no longer experiences.", "Its geometry and boundary conditions may not match those of the larger structure.", "Its measurements may be more sensitive to small displacements than those taken on site.", "A full building is exposed only to static loads."], "ans": 1, "why": "The passage explicitly names size, geometry and boundary conditions.", "trap": "A and C claim necessary differences not established by the passage."}, {"kind": "Detail", "ask": "What is a function of a strain gauge mentioned in the text?", "choices": ["Detecting small changes in deformation", "Monitoring a fracture as it begins to spread during a controlled test", "Converting the vibration of a material into a record suitable for analysis", "Determining the historical age of a building"], "ans": 0, "why": "Strain gauges reveal otherwise invisible deformation.", "trap": "B confuses measuring a condition with stopping it."}, {"kind": "Rhetoric", "ask": "Why does the author contrast an informative test with a spectacular one?", "choices": ["To emphasize the difficulty of communicating technical results to people without specialized training", "To argue that clear relation to a research question matters more than dramatic appearance", "To suggest that the conditions needed for a reliable test may reduce its dramatic impact", "To show that audiences learn more from written explanations than live tests"], "ans": 1, "why": "The last sentence prioritizes explanatory relevance over spectacle.", "trap": "A would be too strong; the text accepts that demonstration can communicate."}, {"kind": "Vocabulary", "ask": "\"Specimen\" most nearly means ...", "choices": ["a representative sample used for study", "a permanently installed sensor", "a computer prediction of collapse", "a full record of previous failures"], "ans": 0, "why": "A specimen is a physical sample subjected to controlled testing.", "trap": "C is a model in a different sense but not the test object here."}, {"kind": "Inference", "ask": "Which conclusion would be most justified by a laboratory demonstration?", "choices": ["The same failure mechanism will remain unchanged when the surrounding conditions are altered.", "A particular arrangement under specified conditions showed a mechanism of damage.", "The exact failure time could help estimate the vulnerability of larger structures under similar loading.", "The visual appearance of a fracture is sufficient for a safety assessment."], "ans": 1, "why": "The author restricts generalization to observed mechanisms under stated conditions.", "trap": "The other options exceed the test’s scope."}]}, {"title": "When a Drawing Becomes a Record", "origin": "Ninth Tenet: The Blueprint Becomes a Score; Eighth Tenet", "level": "C1", "passage": "Engineering drawings usually describe an intended arrangement. They identify structural components, dimensions, and connections so that workers can construct a system according to a plan. In experimental art, however, a drawing can take on another role. If a temporary installation changes shape through weathering or movement, its initial blueprint may gradually become a record against which those changes are measured. In this case, the drawing is no longer only an instruction; it becomes part of a history of the work.\n\nThe shift resembles a distinction in musical notation. A conventional score specifies relations among sounds before performance. Other forms of notation leave some decisions open or register events that could not be predicted in advance. Imagine a structure whose suspended parts slowly loosen. A diagram could mark its original joints and expected movements. After each observation, the artist could add the actual locations of fractures and sources of sound. The accumulating annotations might eventually obscure the original instructions.\n\nThis process complicates the assumption that an artwork has one stable, fully reproducible form. The drawing would preserve evidence of successive states without allowing a later viewer to experience those states exactly as they occurred. It would be both a technical document and an incomplete account of a time-dependent event. Its value lies partly in that incompleteness: the distance between what was planned and what happened is made visible, rather than erased by a final, tidy representation.", "questions": [{"kind": "Main idea", "ask": "What transformation does the passage describe?", "choices": ["The drawing gains greater importance as an artwork than as a construction document.", "An initial plan acquires a documentary role as an evolving work departs from its intended form", "A technical diagram becomes less reliable as an installation undergoes unplanned changes.", "The record of successive changes becomes the primary basis for later reconstruction."], "ans": 1, "why": "The core is the changing role from instruction to record.", "trap": "A conflates a musical analogy with the literal function of the drawing."}, {"kind": "Inference", "ask": "Why might annotations obscure the original blueprint?", "choices": ["Successive records of changes may accumulate over the planned configuration.", "The artist’s initial expectations are revised as later observations accumulate.", "New measurements may require some original design symbols to be redrawn.", "Natural processes erase all marks from the page."], "ans": 0, "why": "The text describes successive observations physically accumulating on the drawing.", "trap": "B suggests a flaw not implied by later changes."}, {"kind": "Rhetoric", "ask": "What purpose does the comparison with musical scores serve?", "choices": ["To suggest that performance notation can preserve the order of events more effectively than a blueprint", "To introduce a parallel distinction between fixed prescriptions and open or retrospective notation", "To establish that mechanical vibrations follow the rules of musical harmony", "To explain how a technical drawing can function as a set of instructions without becoming a historical record"], "ans": 1, "why": "Musical notation supplies an analogy for plans becoming records or open systems.", "trap": "A reverses the contrast."}, {"kind": "Vocabulary", "ask": "\"Successive\" is closest in meaning to ...", "choices": ["consecutive", "independent", "simultaneous", "unanticipated"], "ans": 0, "why": "Successive states follow one after another in time.", "trap": "D may describe some events but not the temporal sequence indicated."}, {"kind": "Inference", "ask": "What can be concluded about a final drawing containing many observations?", "choices": ["It can provide information about the event without reproducing the experience of the event.", "It may help reconstruct the original design more precisely than the initial blueprint.", "It is a more accurate representation of the original design than the first plan.", "It may provide the most reliable basis for an exact re-creation of the performance."], "ans": 0, "why": "The author differentiates documentary traces from lived time-dependent experience.", "trap": "B and D mistake records for complete replacements."}, {"kind": "Function", "ask": "Why does the author call the document an \"incomplete account\"?", "choices": ["The visual record gives priority to features that remain recognizable at the end.", "Events unfolding in time cannot be fully recreated by the accumulated graphic record.", "The drawing leaves out dimensions that engineering drawings require.", "Its developing notation leaves some earlier design assumptions open to later reinterpretation."], "ans": 1, "why": "Incompleteness is inherent to representing duration through a drawing.", "trap": "A turns a conceptual claim into an accidental omission."}]}, {"title": "From the Picturesque to the Sublime", "origin": "The Broken Frame — From the Picturesque to the Sublime", "level": "C1", "passage": "Eighteenth-century landscape writers used the term picturesque to describe scenes whose irregular shapes and rough surfaces seemed well suited to a painting. Ruined buildings often fitted this taste: vegetation softened their edges, missing stones broke up symmetry, and an observer could enjoy the suggestion of age from a comfortable distance. The resulting scene offered a particular kind of control. Damage could be selected, arranged, and mentally framed as an image, even when the actual process of decay was continuing.\n\nA more unsettling experience begins when an observer recognizes that the arrangement is temporary and that the same forces may destroy what appears beautiful. A leaning wall is no longer simply an attractive diagonal line if its instability becomes physically evident. The viewer’s attention shifts from the composition to the forces that may change it without warning. Philosophers have often discussed the sublime in connection with experiences that challenge ordinary confidence in scale, power, or security. Here, the relevant shift is not a change of location but a change in how the same place is perceived.\n\nThe distinction does not require that picturesque appreciation is always mistaken. A photograph may communicate the visible pattern of a ruined facade quite well. What it cannot fully deliver is the bodily sense of duration, exposure, and uncertainty associated with entering a changing environment. Thus the passage from picturesque to sublime is less a judgment about which image looks better than a reconsideration of where the observer stands in relation to ongoing material change.", "questions": [{"kind": "Main idea", "ask": "What distinction is the passage primarily making?", "choices": ["The aesthetic appeal of irregular surfaces compared with the appeal of balanced compositions", "The experience of decay as an arranged image versus awareness of the forces and vulnerability involved", "The ability of photographs to preserve visual form compared with the instability of the real site", "The influence of eighteenth-century landscape preferences on modern conservation choices"], "ans": 1, "why": "The center of the argument is aesthetic distance versus experienced material contingency.", "trap": "C is related to media but misses the change in perception."}, {"kind": "Inference", "ask": "What would most likely cause a picturesque scene to become unsettling in the author’s account?", "choices": ["Observing the same damaged building after its visible appearance has changed", "Recognizing that the observed structure is subject to continuing unpredictable forces", "Learning that a picturesque photograph excludes information about the building’s earlier use", "Viewing the scene from a different artistic style"], "ans": 1, "why": "Awareness of physical instability shifts perception from form to force.", "trap": "A and C might add information but do not produce the specified change."}, {"kind": "Detail", "ask": "Why could a leaning wall be viewed differently?", "choices": ["Its diagonal form may no longer seem fixed when changing light makes fractures more apparent.", "Its form may suggest an immediate structural risk rather than only visual irregularity.", "The picturesque tradition excluded diagonal lines.", "Its apparent irregularity may become evidence of the longer process that created the scene."], "ans": 1, "why": "The second paragraph changes a diagonal from compositional feature to potentially unstable structure.", "trap": "D jumps from risk to certainty of total failure."}, {"kind": "Vocabulary", "ask": "\"Framed\" as used in \"mentally framed as an image\" most nearly means ...", "choices": ["organized within a selected view", "supported with a new physical structure", "accused of an event", "protected from environmental change"], "ans": 0, "why": "The word refers to arranging the ruin within a visual composition.", "trap": "D confuses the observer’s framing with actual preservation."}, {"kind": "Rhetoric", "ask": "Why does the author concede that photography may communicate a facade’s visible pattern?", "choices": ["To suggest that visible patterns provide more reliable evidence than the viewer’s bodily reactions", "To narrow the criticism to aspects of experience that static images cannot fully convey", "To suggest that photography captures structural forces better than direct observation", "To suggest that the aesthetic experience of photographs can be meaningful even at a distance"], "ans": 1, "why": "The concession avoids rejecting photographs wholesale while delimiting their representational power.", "trap": "A overextends a limited strength of photographs."}, {"kind": "Inference", "ask": "What does the last sentence suggest about the sublime?", "choices": ["It emphasizes how knowledge of physical risk can change the apparent character of a composition.", "It depends on observing a ruin from a physically closer position in every case.", "It involves reconsidering the observer’s relation to material processes rather than simply ranking images.", "It depends on recognizing the passage of time in the material form of the ruin."], "ans": 2, "why": "The ending emphasizes a change in relationship to ongoing change.", "trap": "B literalizes \"where the observer stands\"; the concept includes perception, not just distance."}]}, {"title": "The Value of Temporary Works", "origin": "Tenth Tenet: The Meaning of Futility; The Boundaries of the Ruinwright; Epilogue", "level": "C1", "passage": "Public institutions often evaluate a construction project through its anticipated lifespan, usefulness, and financial return. These measures are important when a structure is expected to provide shelter or services. Yet some artistic projects deliberately exist for a limited period. A temporary installation may respond to a changing site, record a material process, or invite reflection on how objects deteriorate. Assessing such work solely by how long it survives would overlook the purpose for which it was made.\n\nThat observation does not imply that destruction is valuable in itself. An artist may study fracture without claiming that damaged objects are more truthful than intact ones, and may document erosion without welcoming the human suffering associated with disaster. The distinction is particularly important when works are situated among the remnants of actual workplaces or homes. Those remnants may carry histories of displacement, unsafe conditions, or unresolved responsibility. Artistic attention cannot erase those histories or grant unlimited permission to intervene.\n\nA temporary work can still justify the effort devoted to it. Its value might lie in the knowledge gained during construction, the careful observation it invites, or the heightened awareness of a material process that remains after the object disappears. Such value cannot always be measured through the same indicators used for infrastructure. Nevertheless, artistic value is not a substitute for accountability. A defensible approach must combine openness to fleeting experience with an honest consideration of the costs, risks, and histories attached to the site.", "questions": [{"kind": "Main idea", "ask": "What is the main argument?", "choices": ["The contribution of short-lived artworks should be evaluated primarily through the experiences of their viewers.", "The value of temporary art can exceed its lifespan, but this does not remove obligations to affected people and places.", "Conventional measures of usefulness and durability cannot always account for the aims of artistic construction.", "Art made in historically sensitive places requires stricter evaluation than art made elsewhere."], "ans": 1, "why": "The author balances non-permanence with responsibility and context.", "trap": "C denies the legitimate role of practical measures for buildings."}, {"kind": "Inference", "ask": "Why might a temporary installation deserve resources?", "choices": ["Its intended contribution may concern observation or understanding rather than survival.", "Its lower maintenance demands may justify the original investment in materials.", "A work’s disappearance guarantees that viewers will remember it.", "Its potential to produce reflection may compensate for the difficulty of assessing its long-term impact."], "ans": 0, "why": "The third paragraph names process, reflection and knowledge as possible forms of value.", "trap": "D wrongly treats non-economic value as unaccountability."}, {"kind": "Rhetoric", "ask": "What does the second paragraph contribute to the argument?", "choices": ["It demonstrates that artistic studies of deterioration are independent of historical questions.", "It establishes an ethical boundary on the earlier defense of temporary work.", "It retracts the claim that temporary art may produce meaningful experience.", "It shows why some historical remnants require different artistic methods than newly built spaces."], "ans": 1, "why": "The second paragraph qualifies the defense and preserves accountability.", "trap": "D mistakes ethical qualification for a complete prohibition."}, {"kind": "Detail", "ask": "Which consideration is explicitly raised for work situated in former homes or workplaces?", "choices": ["Whether any surviving records document the building’s previous activities", "Whether the site remains connected to histories of displacement or unresolved responsibility", "Whether the work can help visitors understand the site’s original economic value", "Whether a newly built museum can di ass="controls">${pbtn('检查本题','check-voc','primary')}${!info.status?pbtn('查看答案','show-voc'):pbtn('重新尝试','retry-voc','')}${j<9?pbtn('下一空 →','next-voc'):''}</div></div>${info.status?`<div class="answerbox ${info.status==='correct'?'good':'bad'}"><b>${esc(g.word)}</b> · ${esc(g.gloss)}<div>${esc(g.why)}</div>${info.status==='wrong'?`<div>你的填写：${esc(info.typed)}</div>`:''}</div>`:''}</div>${navFooter(i,10,'vocab')}`}
function scramble(n,chunks){let arr=chunks.map((s,i)=>i);let seed=1931+n*7937;for(let i=arr.length-1;i>0;i--){seed=(Math.imul(seed,1664525)+1013904223)>>>0;let j=seed%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}if(arr.every((v,i)=>v===i)){arr.reverse()}return arr}

function writingView(){let n=sIdx(),w=state.writing,secs=['10道组句题','Write an Email','Academic Discussion'];let head=header('WRITING / '+(n<10?'BUILD A SENTENCE':n===10?'WRITE AN EMAIL':'ACADEMIC DISCUSSION'),n<10?`Sentence ${String(n+1).padStart(2,'0')}`:n===10?DATA.writing.email.title:DATA.writing.discussion.title,'2026版 TOEFL iBT 写作专项。组句自动判分；两篇独立写作需要人工评价。回答保存于当前浏览器。');let top=`<div class="controls"><span class="tag ${w.start?'wait':''}">写作计时 ${fmt(writingTime())}</span>${!w.start?pbtn('开始 23 分钟计时','start-timer','primary'):pbtn(w.done?'已结束计时':'结束计时','stop-timer')}${pbtn('导出写作 DOCX','export-docx')}</div>`;let body='';if(n<10)body=`<div class="block">${sentenceView(n)}</div>`;else if(n===10){let x=DATA.writing.email;body=`<div class="block"><h3>Situation</h3><p>${esc(x.prompt)}</p><h4 class="subhead">TASK REQUIREMENTS</h4><ul class="req">${x.requirements.map(s=>`<li>${esc(s)}</li>`).join('')}</ul><p class="hint">参考练习长度 ${x.minwords}–${x.maxwords} words。考试以任务完成和表达清晰为先，切勿为了字数遗漏请求。</p><textarea class="writingarea" data-write="email" placeholder="Dear Archive Coordinator,">${esc(w.email)}</textarea><p class="smallprint" id="email-count">${wordCount(w.email)} words · 将原文完整导出供批改</p></div>`}else{let d=DATA.writing.discussion;body=`<div class="block"><h3>Professor Avery</h3><p>${esc(d.prof)}</p><div class="intro"><b>${esc(d.studentA.name)}:</b> ${esc(d.studentA.text)}</div><div class="intro"><b>${esc(d.studentB.name)}:</b> ${esc(d.studentB.text)}</div><h4 class="subhead">YOUR TASK</h4><ul class="req">${d.requirements.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="hint">参考练习长度 ${d.minwords}–${d.maxwords} words。你可以不同意两位学生，但应明确回应至少一位。</p><textarea class="writingarea" data-write="discussion" placeholder="I believe that ...">${esc(w.discussion)}</textarea><p class="smallprint" id="discussion-count">${wordCount(w.discussion)} words · 需要人工批改</p></div>`}return head+top+body+`<div class="intro">写作答题提醒：不要借用《宣言》中的专属术语装饰句子。TOEFL 更重视具体请求、可检验的理由、合理例子，以及自然准确的英语。</div>`+navFooter(n,12 function crc32(data){let c=0xffffffff;for(let i=0;i<data.length;i++){c^=data[i];for(let j=0;j<8;j++)c=(c>>>1)^(c&1?0xedb88320:0)}return(c^0xffffffff)>>>0}
function zipStore(entries){let locals=[],central=[],off=0;function u16(n){return[n&255,n>>>8&255]}function u32(n){return[n&255,n>>>8&255,n>>>16&255,n>>>24&255]}entries.forEach(([name,str])=>{let n=enc(name),d=enc(str),crc=crc32(d);let l=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(d.length),...u32(d.length),...u16(n.length),...u16(0),...n,...d]);locals.push(l);let c=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(d.length),...u32(d.length),...u16(n.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off),...n]);central.push(c);off+=l.length});let cs=central.reduce((s,x)=>s+x.length,0),end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(entries.length),...u16(entries.length),...u32(cs),...u32(off),...u16(0)]);return new Blob([...locals,...central,end],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'})}
function exportDocx(){let txt=buildReport().split('\n');txt=txt.slice(0,txt.indexOf('===== VOCABULARY ====='));let paras=txt.map(line=>`<w:p><w:r><w:t xml:space="preserve">${xml(line)}</w:t></w:r></w:p>`).join('');const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${paras}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134"/></w:sectPr></w:body></w:document>`;let blob=zipStore([['[Content_Types].xml','<?xml version="1.0"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'],['_rels/.rels','<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],['word/document.xml',doc]]);let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Manifesto_TOEFL_Writing_and_Full_Report.docx';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)}
function onAction(action){let i=sIdx(),n=state.tab==='writing'?12:state.tab==='vocab'?10:readSections.length;switch(action){case 'start-writing':setTab('writing');return;case 'start-vocab':setTab('vocab');return;case 'start-reading':setTab('reading');return;case 'overview':setTab('overview');return;case 'prev':navigate(Math.max(0,i-1));return;case 'next':navigate(Math.min(n-1,i+1));return;case 'toggle-reveal':state.reviewNow=!state.reviewNow;save();render();return;case 'grade-reading':state.readingGraded[i]=true;save();render();return;case 'next-voc':state.vocSelected=Math.min(9,state.vocSelected+1);save();render();return;case 'check-voc':gradeVoc(i,state.vocSelected,$('#voc-input')?.value||'');return;case 'show-voc':gradeVoc(i,state.vocSelected,$('#voc-input')?.value||'',true);return;case 'retry-voc':delete state.vocab[vKey(i,state.vocSelected)];save();render();return;case 'check-sentence':checkSentence(i);return;case 'reset-sentence':state.wbuild[i]={sel:[],checked:false};save();render();return;case 'start-timer':state.writing.start=Date.now();state.writing.stoppedAt=null;state.writing.done=false;save();render();return;case 'stop-timer':state.writing.done=true;state.writing.stoppedAt=Date.now();save();render();return;case 'export-txt':download(buildReport(),'Manifesto_TOEFL_Full_Practice_Report.txt','text/plain;charset=utf-8');return;case 'export-docx':exportDocx();return;}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){setTab(b.dataset.tab);return}if(b.dataset.jumptab){setTab(b.dataset.jumptab);return}if(b.dataset.nav!==undefined){navigate(+b.dataset.nav);return}if(b.dataset.action){onAction(b.dataset.action);return}if(b.dataset.r!==undefined){let i=+b.dataset.r,j=+b.dataset.q;if(state.readingGraded[i])return;state.reading[`${i}.${j}`]=+b.dataset.o;save();render();return}if(b.dataset.vg!==undefined){state.vocSelected=+b.dataset.vg;save();render();document.querySelector('#voc-input')?.focus();return}if(b.dataset.cAdd){let [n,id]=b.dataset.cAdd.split('.').map(Number),z=state.wbuild[n]||{sel:[],checked:false};if(z.checked)return;z.sel=[...(z.sel||[]),id];state.wbuild[n]=z;save();render();return}if(b.dataset.cRemove){let [n,id]=b.dataset.cRemove.split('.').map(Number),z=state.wbuild[n]||{sel:[],checked:false};if(z.checked)return;z.sel=z.sel.filter(v=>v!==id);state.wbuild[n]=z;save();render();return}});
document.addEventListener('input',e=>{if(e.target.dataset.write){let name=e.target.dataset.write;state.writing[name]=e.target.value;save();let el=$('#'+name+'-count');if(el)el.textContent=`${wordCount(e.target.value)} words · 自动保存于当前浏览器`}if(e.target.id==='voc-input'){let i=sIdx(),g=DATA.vocab[i]?.gaps[state.vocSelected];if(!g)return;let value=e.target.value.trim(),missing=g.word.length-g.prefix.length;if((value.length===missing&&!value.toLowerCase().startsWith(g.prefix))||value.length===g.word.length){gradeVoc(i,state.vocSelected,value)}}});
document.addEventListener('keydown',e=>{if(e.target.id==='voc-input'&&e.key==='Enter'){e.preventDefault();onAction('check-voc')}});
