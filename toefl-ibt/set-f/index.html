,"groupTitle":"How Old Harbors Change","passage":"Ancient harbors were not always located where present-day coastlines might {1}. Rivers carried sediment that gradually {2} near the shore, while storms could reshape the {3} of a bay. Archaeologists sometimes {4} buried docks far inland, suggesting that the coastline has {5} over time. However, the discovery of a wall does not {6} prove that it served a maritime function. Researchers must {7} archaeological remains with geological evidence. By examining several sources, they can {8} between a temporary landing place and a major port. Such interpretations remain {9} when dating evidence is scarce, and new excavations may {10} earlier conclusions.","index":10,"prefix":"rev","answer":"revise","explanation":"May revise 指新的挖掘可能修正既有结论。","title":"Complete the Words"},{"id":"R11","type":"daily","title":"Read in Daily Life","groupTitle":"Campus Print Credits","passage":"Students receive 120 free monochrome printing pages per semester. Color printing counts as three pages of credit for each sheet. Unused credits do not carry into the next semester. Additional printing can be purchased online, but refunds are available only if a printer malfunction is reported within 24 hours.","stem":"A student prints 30 color sheets. How many free credits remain, assuming none were used earlier?","options":["30","60","90","120"],"answer":0,"explanation":"每张彩印消耗3页额度：30×3=90，120−90=30。"},{"id":"R12","type":"daily","title":"Read in Daily Life","groupTitle":"Community Garden Orientation","passage":"New volunteers may work in the campus garden only after attending a safety orientation. Sessions are offered Wednesday at 4 p.m. and Saturday at 10 a.m. Volunteers who completed orientation last year do not need to repeat it, but everyone must sign the current season's participation form before their first shift.","stem":"A returning volunteer attended orientation last year. What must the volunteer do before starting this season?","options":["Attend a Saturday session.","Sign the current participation form.","Complete an online gardening course.","Ask for an exemption from the garden coordinator."],"answer":1,"explanation":"上一年参加过培训可免再次参加，但必须签署本季表格。"},{"id":"R13","type":"daily","title":"Read in Daily Life","groupTitle":"Library Book Scanning","passage":"The library will scan selected pages from books for research use. Requests are limited to one chapter or 10 percent of a book, whichever is shorter. Staff do not scan materials that are physically too fragile. Requests received after 2 p.m. are handled on the next working day.","stem":"A researcher requests 15 percent of a book that has 30 chapters. What is the most likely outcome?","options":["The whole request is fulfilled for research use.","The request is rejected because books cannot be scanned.","The scan must be limited to the smaller permitted portion.","Staff will scan the pages only if the researcher pays a fee."],"answer":2,"explanation":"最长为一章或10%中较短的一项，15%超过限额。"},{"id":"R14","type":"daily","title":"Read in Daily Life","groupTitle":"Student Health Seminar","passage":"The stress-management seminar has moved from Thursday to Friday because its speaker is unavailable. Students who registered for Thursday retain their places automatically. Anyone who cannot attend Friday may request a refund until Wednesday at noon. The event will not be streamed or recorded.","stem":"What should a registered student who cannot attend on Friday do?","options":["Register for a new place on Friday.","Ask for a refund before Wednesday noon.","Request access to the recording.","Wait for a confirmation that the event has been canceled."],"answer":1,"explanation":"周五无法出席者须于周三中午前申请退款。"},{"id":"R15","type":"daily","title":"Read in Daily Life","groupTitle":"Art History Archive Visit","passage":"Visitors may study digital records without booking. To consult original drawings, students must reserve a supervised session at least 48 hours in advance. Photographing originals is permitted for personal notes, but publishing images—even in a class exhibition—requires separate authorization.","stem":"Which activity needs additional authorization even after an original drawing has been consulted?","options":["Taking handwritten notes.","Viewing digital records.","Publishing a photograph in a class exhibition.","Examining an original during a reserved session."],"answer":2,"explanation":"个人笔记照片可以拍，但展览发表必须单独取得授权。"},{"id":"R16","type":"academic","title":"Read an Academic Passage","groupTitle":"Why Forest Gaps Matter","passage":"Forests often appear to be continuous canopies, but the death of a large tree creates an opening through which additional light reaches the ground. Such gaps can alter the conditions experienced by young plants. Species that tolerate shade may establish beneath intact canopies, whereas others grow rapidly only when light becomes more abundant. A gap, however, does not automatically favor every light-demanding species. Its size, soil moisture, and the availability of seeds all influence which plants succeed.\n\nResearchers once described forest change as a relatively predictable progression from pioneer species toward a stable mature community. Longer studies suggest a less orderly picture. Several disturbances may occur before a canopy recovers, and surviving trees can affect regeneration through their roots and leaf litter. Moreover, a gap that appears similar in size to another may produce a different outcome because seeds and herbivores are distributed unevenly.\n\nThese findings have implications for restoration. Planting a uniform mixture of trees in every clearing may be less effective than responding to the history and local conditions of each patch. Nevertheless, allowing all disturbances to proceed without intervention can create difficulties where invasive plants are present. The central challenge is to distinguish natural variation from changes that threaten the forest's capacity to regenerate over the long term.","stem":"What is the passage mainly concerned with?","options":["How tree deaths can create the light needed for early plant growth","Why canopy openings produce varied patterns of regeneration and require context-sensitive management","Why mature forests eventually replace pioneer species with shade-tolerant plants","How forest restoration has shifted toward allowing every disturbance to proceed without intervention"],"answer":1,"explanation":"全文不仅讨论光照，还讨论种子、土壤和多次干扰，使林地恢复不可由单一过程预测。"},{"id":"R17","type":"academic","title":"Read an Academic Passage","groupTitle":"Why Forest Gaps Matter","passage":"Forests often appear to be continuous canopies, but the death of a large tree creates an opening through which additional light reaches the ground. Such gaps can alter the conditions experienced by young plants. Species that tolerate shade may establish beneath intact canopies, whereas others grow rapidly only when light becomes more abundant. A gap, however, does not automatically favor every light-demanding species. Its size, soil moisture, and the availability of seeds all influence which plants succeed.\n\nResearchers once described forest change as a relatively predictable progression from pioneer species toward a stable mature community. Longer studies suggest a less orderly picture. Several disturbances may occur before a canopy recovers, and surviving trees can affect regeneration through their roots and leaf litter. Moreover, a gap that appears similar in size to another may produce a different outcome because seeds and herbivores are distributed unevenly.\n\nThese findings have implications for restoration. Planting a uniform mixture of trees in every clearing may be less effective than responding to the history and local conditions of each patch. Nevertheless, allowing all disturbances to proceed without intervention can create difficulties where invasive plants are present. The central challenge is to distinguish natural variation from changes that threaten the forest's capacity to regenerate over the long term.","stem":"Why might two canopy gaps of similar size develop differently?","options":["Soil and seed conditions can differ between the two sites.","Larger gaps inevitably host fewer herbivores than smaller gaps.","Shade-tolerant trees grow only in openings left by dead trees.","The time of canopy closure can be estimated directly from opening size."],"answer":0,"explanation":"即使面积相似，种子、草食动物及土壤等条件仍可不同。"},{"id":"R18","type":"academic","title":"Read an Academic Passage","groupTitle":"Why Forest Gaps Matter","passage":"Forests often appear to be continuous canopies, but the death of a large tree creates an opening through which additional light reaches the ground. Such gaps can alter the conditions experienced by young plants. Species that tolerate shade may establish beneath intact canopies, whereas others grow rapidly only when light becomes more abundant. A gap, however, does not automatically favor every light-demanding species. Its size, soil moisture, and the availability of seeds all influence which plants succeed.\n\nResearchers once described forest change as a relatively predictable progression from pioneer species toward a stable mature community. Longer studies suggest a less orderly picture. Several disturbances may occur before a canopy recovers, and surviving trees can affect regeneration through their roots and leaf litter. Moreover, a gap that appears similar in size to another may produce a different outcome because seeds and herbivores are distributed unevenly.\n\nThese findings have implications for restoration. Planting a uniform mixture of trees in every clearing may be less effective than responding to the history and local conditions of each patch. Nevertheless, allowing all disturbances to proceed without intervention can create difficulties where invasive plants are present. The central challenge is to distinguish natural variation from changes that threaten the forest's capacity to regenerate over the long term.","stem":"What role does the older model of forest change play in the passage?","options":["It provides a historical explanation for why invasive plants spread.","It is introduced as an example of accurate long-term prediction.","It offers a simplified expectation that later research complicates.","It demonstrates that forest succession is driven mainly by soil moisture."],"answer":2,"explanation":"先提出旧模型的线性预期，再用长期研究限定其普遍性。"},{"id":"R19","type":"academic","title":"Read an Academic Passage","groupTitle":"Why Forest Gaps Matter","passage":"Forests often appear to be continuous canopies, but the death of a large tree creates an opening through which additional light reaches the ground. Such gaps can alter the conditions experienced by young plants. Species that tolerate shade may establish beneath intact canopies, whereas others grow rapidly only when light becomes more abundant. A gap, however, does not automatically favor every light-demanding species. Its size, soil moisture, and the availability of seeds all influence which plants succeed.\n\nResearchers once described forest change as a relatively predictable progression from pioneer species toward a stable mature community. Longer studies suggest a less orderly picture. Several disturbances may occur before a canopy recovers, and surviving trees can affect regeneration through their roots and leaf litter. Moreover, a gap that appears similar in size to another may produce a different outcome because seeds and herbivores are distributed unevenly.\n\nThese findings have implications for restoration. Planting a uniform mixture of trees in every clearing may be less effective than responding to the history and local conditions of each patch. Nevertheless, allowing all disturbances to proceed without intervention can create difficulties where invasive plants are present. The central challenge is to distinguish natural variation from changes that threaten the forest's capacity to regenerate over the long term.","stem":"The phrase “establish beneath intact canopies” most nearly means...","options":["begin growing successfully under unbroken tree cover","be deliberately planted in areas without sunlight","survive only after the surrounding trees have died","remain dormant until a gap appears"],"answer":0,"explanation":"Establish 在生态语境中指植物成功扎根、生长。"},{"id":"R20","type":"academic","title":"Read an Academic Passage","groupTitle":"Why Forest Gaps Matter","passage":"Forests often appear to be continuous canopies, but the death of a large tree creates an opening through which additional light reaches the ground. Such gaps can alter the conditions experienced by young plants. Species that tolerate shade may establish beneath intact canopies, whereas others grow rapidly only when light becomes more abundant. A gap, however, does not automatically favor every light-demanding species. Its size, soil moisture, and the availability of seeds all influence which plants succeed.\n\nResearchers once described forest change as a relatively predictable progression from pioneer species toward a stable mature community. Longer studies suggest a less orderly picture. Several disturbances may occur before a canopy recovers, and surviving trees can affect regeneration through their roots and leaf litter. Moreover, a gap that appears similar in size to another may produce a different outcome because seeds and herbivores are distributed unevenly.\n\nThese findings have implications for restoration. Planting a uniform mixture of trees in every clearing may be less effective than responding to the history and local conditions of each patch. Nevertheless, allowing all disturbances to proceed without intervention can create difficulties where invasive plants are present. The central challenge is to distinguish natural variation from changes that threaten the forest's capacity to regenerate over the long term.","stem":"Which restoration policy is most consistent with the author’s conclusion?","options ed standard room. What is true?","options":["Their room is no longer guaranteed, and equipment cannot be added.","Their reservation is extended by twenty minutes.","They can borrow media equipment after arrival.","They must pay a late fee to retain the room."],"answer":0,"explanation":"迟到超过15分钟会释放预订；标准房确认后不能增添媒体设备。"},{"id":"R43","type":"daily","title":"Read in Daily Life","groupTitle":"Research Assistant Hours","passage":"The psychology department is recruiting assistants for an eight-week study. Applicants must be available on two weekday afternoons and may not be enrolled in the professor's current class. Prior laboratory experience is helpful but not required. Applications submitted after Monday at 5 p.m. will not be considered.","stem":"Which applicant is eligible?","options":["A student in the professor’s current class with laboratory experience.","A student available one weekday afternoon with no lab experience.","A student available twice during the week who is not in the professor’s class.","A qualified student who submits an application on Tuesday morning."],"answer":2,"explanation":"同时满足每周两个工作日下午及未修该教授当期课程，实验经验非必需。"},{"id":"R44","type":"daily","title":"Read in Daily Life","groupTitle":"Museum Evening Admission","passage":"On the first Friday of each month, admission is free after 5 p.m. Tickets must still be reserved online, including for members. The photography gallery closes at 6 p.m. for maintenance, while the rest of the museum remains open until 9 p.m. Free tickets do not include the special guided tour.","stem":"A visitor with a free 7 p.m. ticket should NOT expect to...","options":["See the main permanent collection.","Enter the photography gallery.","Stay until 8:30 p.m.","Enter without paying admission."],"answer":1,"explanation":"摄影画廊在18:00关闭，即使其他区域开放至21:00也不例外。"},{"id":"R45","type":"daily","title":"Read in Daily Life","groupTitle":"Studio Chemical Disposal","passage":"Artists using solvent-based paints must place used liquids in labeled waste containers. The sink is for water-based materials only. Waste containers are collected every Tuesday, but full containers must be reported to the studio manager immediately rather than left beside the collection station.","stem":"What should a student do when a solvent-waste container is already full on Thursday?","options":["Wait until the next Tuesday collection.","Pour the liquid into the sink.","Place the container beside the station.","Notify the studio manager immediately."],"answer":3,"explanation":"容器满时应立刻报告，不能等例行收集或擅自放置。"},{"id":"R46","type":"academic","title":"Read an Academic Passage","groupTitle":"Mechanical Clocks and Shared Time","passage":"Mechanical clocks appeared in parts of medieval Europe long before most people organized their days around precise minutes. Early public clocks commonly marked hours for religious services or commercial activity, but they varied in accuracy and were not necessarily synchronized with devices in other towns. Local time was often determined by the apparent position of the sun, so noon in one settlement could differ slightly from noon in another. For communities whose activities were largely local, those differences caused few practical problems.\n\nThe expansion of railway networks changed the situation. Trains moved between towns whose clocks showed different times, creating confusion for passengers and difficulties for timetable coordination. Railway operators began adopting common reference times for their systems. Governments later established broader standard-time arrangements, though acceptance was not immediate. Some people regarded these changes as an unnecessary intrusion into familiar local routines.\n\nIt would be misleading, however, to claim that railways alone created modern time discipline. Factories, schools, and administrative institutions had already introduced schedules that organized activities by the clock. The contribution of railways was to make differences among local systems more visible and costly. Standard time emerged not simply because clocks became more accurate but because growing networks demanded a shared convention. Technology supplied instruments for measuring time; social coordination increasingly determined how their measurements would be used.","stem":"Which statement best captures the passage’s central argument?","options":["Clocks became accurate only after railway systems required them to be synchronized.","Timekeeping became standardized through growing demands for coordination, not technical improvement alone.","Religious institutions established a single schedule that later railways adopted.","Factory schedules replaced local solar time before public clocks became widespread."],"answer":1,"explanation":"科技提供测量手段，跨地区的社会协作推动共同时间规范。"},{"id":"R47","type":"academic","title":"Read an Academic Passage","groupTitle":"Mechanical Clocks and Shared Time","passage":"Mechanical clocks appeared in parts of medieval Europe long before most people organized their days around precise minutes. Early public clocks commonly marked hours for religious services or commercial activity, but they varied in accuracy and were not necessarily synchronized with devices in other towns. Local time was often determined by the apparent position of the sun, so noon in one settlement could differ slightly from noon in another. For communities whose activities were largely local, those differences caused few practical problems.\n\nThe expansion of railway networks changed the situation. Trains moved between towns whose clocks showed different times, creating confusion for passengers and difficulties for timetable coordination. Railway operators began adopting common reference times for their systems. Governments later established broader standard-time arrangements, though acceptance was not immediate. Some people regarded these changes as an unnecessary intrusion into familiar local routines.\n\nIt would be misleading, however, to claim that railways alone created modern time discipline. Factories, schools, and administrative institutions had already introduced schedules that organized activities by the clock. The contribution of railways was to make differences among local systems more visible and costly. Standard time emerged not simply because clocks became more accurate but because growing networks demanded a shared convention. Technology supplied instruments for measuring time; social coordination increasingly determined how their measurements would be used.","stem":"Why were differences in local noon initially of little concern?","options":["Most communities did not depend on tightly coordinated travel between distant towns.","Public clocks were not commonly installed in medieval settlements.","Factories allowed workers to choose their own schedules.","Railway operators already supplied a universal reference time."],"answer":0,"explanation":"当地活动为主，跨区域同步需求较弱。"},{"id":"R48","type":"academic","title":"Read an Academic Passage","groupTitle":"Mechanical Clocks and Shared Time","passage":"Mechanical clocks appeared in parts of medieval Europe long before most people organized their days around precise minutes. Early public clocks commonly marked hours for religious services or commercial activity, but they varied in accuracy and were not necessarily synchronized with devices in other towns. Local time was often determined by the apparent position of the sun, so noon in one settlement could differ slightly from noon in another. For communities whose activities were largely local, those differences caused few practical problems.\n\nThe expansion of railway networks changed the situation. Trains moved between towns whose clocks showed different times, creating confusion for passengers and difficulties for timetable coordination. Railway operators began adopting common reference times for their systems. Governments later established broader standard-time arrangements, though acceptance was not immediate. Some people regarded these changes as an unnecessary intrusion into familiar local routines.\n\nIt would be misleading, however, to claim that railways alone created modern time discipline. Factories, schools, and administrative institutions had already introduced schedules that organized activities by the clock. The contribution of railways was to make differences among local systems more visible and costly. Standard time emerged not simply because clocks became more accurate but because growing networks demanded a shared convention. Technology supplied instruments for measuring time; social coordination increasingly determined how their measurements would be used.","stem":"The word “intrusion” is closest in meaning to...","options":["a careful adjustment","an unwanted interference","a widely shared agreement","a technical improvement"],"answer":1,"explanation":"把统一时间视为对熟悉当地习惯不受欢迎的干涉。"},{"id":"R49","type":"academic","title":"Read an Academic Passage","groupTitle":"Mechanical Clocks and Shared Time","passage":"Mechanical clocks appeared in parts of medieval Europe long before most people organized their days around precise minutes. Early public clocks commonly marked hours for religious services or commercial activity, but they varied in accuracy and were not necessarily synchronized with devices in other towns. Local time was often determined by the apparent position of the sun, so noon in one settlement could differ slightly from noon in another. For communities whose activities were largely local, those differences caused few practical problems.\n\nThe expansion of railway networks changed the situation. Trains moved between towns whose clocks showed different times, creating confusion for passengers and difficulties for timetable coordination. Railway operators began adopting common reference times for their systems. Governments later established broader standard-time arrangements, though acceptance was not immediate. Some people regarded these changes as an unnecessary intrusion into familiar local routines.\n\nIt would be misleading, however, to claim that railways alone created modern time discipline. Factories, schools, and administrative institutions had already introduced schedules that organized activities by the clock. The contribution of railways was to make differences among local systems more visible and costly. Standard time emerged not simply because clocks became more accurate but because growing networks demanded a shared convention. Technology supplied instruments for measuring time; social coordination increasingly determined how their measurements would be used.","stem":"Why does the author mention factories and schools?","options":["To demonstrate that railway timetables were less accurate than local schedules","To show that time-based organization had other sources besides railway development","To argue that religious services were the first to use precise minutes","To suggest standard time was accepted instantly once schools adopted it"],"answer":1,"explanation":"工厂学校等使守时制度先于铁路扩张而发展，限制铁路单因论。"},{"id":"R50","type":"academic","title":"Read an Academic Passage","groupTitle":"Mechanical Clocks and Shared Time","passage":"Mechanical clocks appeared in parts of medieval Europe long before most people organized their days around precise minutes. Early public clocks commonly marked hours for religious services or commercial activity, but they varied in accuracy and were not necessarily synchronized with devices in other towns. Local time was often determined by the apparent position of the sun, so noon in one settlement could differ slightly from noon in another. For communities whose activities were largely local, those differences caused few practical problems.\n\nThe expansion of railway networks changed the situation. Trains moved between towns whose clocks showed different times, creating confusion for passengers and difficulties for timetable coordination. Railway operators began adopting common reference times for their systems. Governments later established broader standard-time arrangements, though acceptance was not immediate. Some people regarded these changes as an unnecessary intrusion into familiar local routines.\n\nIt would be misleading, however, to claim that railways alone created modern time discipline. Factories, schools, and administrative institutions had already introduced schedules that organized activities by the clock. The contribution of railways was to make differences among local systems more visible and costly. Standard time emerged not simply because clocks became more accurate but because growing networks demanded a shared convention. Technology supplied instruments for measuring time; social coordination increasingly determined how their measurements would be used.","stem":"What can be inferred about the adoption of standard time?","options":["It resulted chiefly from the invention of clocks that displayed minutes.","It eliminated objections from people accustomed to solar time.","Its usefulness grew as the practical consequences of incompatible local times increased.","It was initially promoted because railway operators wanted to reduce clock maintenance costs."],"answer":2,"explanation":"不同地方时引发更高协作成本，统一标准的收益随之提高。"}],"listening":[{"id":"L01","type":"listen","title":"Listen and Choose a Response","group":"choose01","groupTitle":"Library Hold","clip":"choose01","stem":"Choose the most appropriate response to the speaker.","options":["You could ask whether the hold can be extended until tomorrow.","The seminar covers research methods.","I read that book last year.","The library has a new entrance."],"answer":0,"explanation":"最佳答复提出延长预约保留时间的实际办法。"},{"id":"L02","type":"listen","title":"Listen and Choose a Response","group":"choose02","groupTitle":"Unexpected Charge","clip":"choose02","stem":"Choose the most appropriate response to the speaker.","options":["Housing fees usually rise every year.","Did you keep a copy of the bill so we can ask the housing office?","I have pai ally expire on Friday.","They must be booked again at full price.","They will be transferred to the third floor."],"answer":0,"explanation":"二楼已有预约转至一楼等同房间。"},{"id":"L26","type":"listen","title":"Listen to an Announcement","group":"ann01","groupTitle":"New Instructions for the Library Quiet Zone","clip":"ann01","stem":"Which feature will remain unchanged?","options":["The location of all reserved study rooms.","The second floor’s discussion policy.","The third floor’s availability.","The library’s opening hours."],"answer":3,"explanation":"开馆时间与借阅不变。"},{"id":"L27","type":"listen","title":"Listen to an Academic Talk","group":"talk01","groupTitle":"How Animals Use Environmental Signals","clip":"talk01","stem":"What is the lecture mainly about?","options":["How researchers determine whether animals use multiple cues to navigate.","Why every migrating bird must learn a route from its parents.","How magnetic fields determine the length of migration.","Why clouds prevent animals from traveling long distances."],"answer":0,"explanation":"讲座解释迁徙导航中的多重线索及实验鉴别方法。"},{"id":"L28","type":"listen","title":"Listen to an Academic Talk","group":"talk01","groupTitle":"How Animals Use Environmental Signals","clip":"talk01","stem":"Why does the professor discuss altered light schedules?","options":["To show how migratory routes are learned from the sun.","To illustrate a test of the connection between internal clocks and orientation.","To establish that birds do not use magnetic information.","To explain why birds migrate only at sunrise."],"answer":1,"explanation":"操纵生物钟再观察方向变化，以检验日照方向补偿机制。"},{"id":"L29","type":"listen","title":"Listen to an Academic Talk","group":"talk01","groupTitle":"How Animals Use Environmental Signals","clip":"talk01","stem":"What would suggest that two different navigational cues interact?","options":["Birds orient better in clear skies than in cloudy weather.","Birds begin their migration earlier after light exposure.","Birds lose direction only when two signal :3,"explanation":"反复加热冷却可能引起疲劳。"},{"id":"L43","type":"listen","title":"Listen to an Academic Talk","group":"talk02","groupTitle":"Why Some Materials Remember Their Shape","clip":"talk02","stem":"What should engineers consider when selecting an application?","options":["Whether the material works reliably under expected loads and temperatures.","Whether the first demonstration produces a dramatic movement.","Whether the wire can be heated without measuring force.","Whether the alloy can replace every mechanical actuator."],"answer":0,"explanation":"必须评估实际温度、载荷和重复工作表现。"},{"id":"L44","type":"listen","title":"Listen to an Academic Talk","group":"talk03","groupTitle":"Why Cities Keep Old Trees","clip":"talk03","stem":"What is the main point of the talk?","options":["Mature trees should always be retained regardless of risk.","Tree replacement is usually cheaper than maintenance.","Decisions about urban trees should consider delayed benefits and varied costs over time.","Young trees deliver the same cooling benefits as mature trees when planted in groups."],"answer":2,"explanation":"核心是评估长期、多种收益与成本，而非简单即时成本比较。"},{"id":"L45","type":"listen","title":"Listen to an Academic Talk","group":"talk03","groupTitle":"Why Cities Keep Old Trees","clip":"talk03","stem":"Why is the cooling effect of a tree difficult to estimate precisely?","options":["It depends on the surrounding environment as well as the tree itself.","It occurs only when rain falls.","It has never been measured in urban settings.","It is determined solely by the number of leaves."],"answer":0,"explanation":"遮荫降温受建筑布局、天气和树的大小共同影响。"},{"id":"L46","type":"listen","title":"Listen to an Academic Talk","group":"talk03","groupTitle":"Why Cities Keep Old Trees","clip":"talk03","stem":"What point is made about replacing a mature tree with several young ones?","options":["The younger trees will necessarily cause more pavement damage.","Their combined benefits may take years to reach those of the original tree.","Their cultural value is always higher than that of old trees.","Their roots are unable to absorb rainwater."],"answer":1,"explanation":"小树综合叶面积和服务需要多年才能接近成熟树。"},{"id":"L47","type":"listen","title":"Listen to an Academic Talk","group":"talk03","groupTitle":"Why Cities Keep Old Trees","clip":"talk03","stem":"What does the speaker imply about monetary calculations?","options":["They should never be used in city planning.","They always favor maintaining diseased trees.","They can be incomplete when cultural value and time delays are omitted.","They are sufficient if they include the price of planting new trees."],"answer":2,"explanation":"单纯货币即时成本可能遗漏文化价值和长期迟延效应。"}],"writing":[{"id":"W01","type":"sentence","title":"Build a Sentence","context":"Explain why the results could not be released.","tokens":["until the measurements","could not be published","The results","had been checked","independently"],"answer":["The results","could not be published","until the measurements","had been checked","independently"],"explanation":"Until 指向必须先完成的核验。","alternatives":["Until the measurements had been checked independently, the results could not be published."]},{"id":"W02","type":"sentence","title":"Build a Sentence","context":"Describe what the advisor insisted on.","tokens":["before the deadline","that each student","The adviser requested","submit a draft","of the proposal"],"answer":["The adviser requested","that each student","submit a draft","of the proposal","before the deadline"],"explanation":"Requested that 后可直接使用动词原形 submit。"},{"id":"W03","type":"sentence","title":"Build a Sentence","context":"Explain a hypothetical outcome.","tokens":["had the researchers","they might have","identified the problem","earlier","collected more samples"],"answer":["had the researchers","collected more samples","they might have","identified the problem","earlier"],"explanation":"Had... 表省略 if 的过去虚拟条件。"},{"id":"W04","type":"sentence","title":"Build a Sentence","context":"State a qualified judgment about an intervention.","tokens":["the intervention","although","was well intentioned","it created","unexpected difficulties"],"answer":["although","the intervention","was well intentioned","it created","unexpected difficulties"],"explanation":"Although 从句与主句完整。","alternatives":["It created unexpected difficulties although the intervention was well intentioned."]},{"id":"W05","type":"sentence","title":"Build a Sentence","context":"Explain when the museum changed its policy.","tokens":["did the museum","Only after","revise its policy","a second review","was completed"],"answer":["Only after","a second review","was completed","did the museum","revise its policy"],"explanation":"Only after 引发主句部分倒装。"},{"id":"W06","type":"sentence","title":"Build a Sentence","context":"Describe how additional evidence affects confidence.","tokens":["the conclusion becomes","the more evidence","the more reliable","researchers examine","independently"],"answer":["the more evidence","researchers examine","independently","the more reliable","the conclusion becomes"],"explanation":"The more..., the more... 相关比较结构。"},{"id":"W07","type":"sentence","title":"Build a Sentence","context":"Explain the consequence of missing records.","tokens":["could not","the damaged room","Without the original documents","researchers","establish the history of"],"answer":["Without the original documents","researchers","could not","establish the history of","the damaged room"],"explanation":"Without + 名词短语引出背景；主句结构完整。","alternatives":["Researchers could not establish the history of the damaged room without the original documents."]},{"id":"W08","type":"sentence","title":"Build a Sentence","context":"Say what the instructor found surprising.","tokens":["the students","What surprised the instructor","was that","reached similar conclusions","using different methods"],"answer":["What surprised the instructor","was that","the students","reached similar conclusions","using different methods"],"explanation":"What 引导主语从句，was that 后为表语从句。"},{"id":"W09","type":"sentence","title":"Build a Sentence","context":"Express the requirement for continued funding.","tokens":["provided that","the project","its progress","may continue","is documented"],"answer":["the project","may continue","provided that","its progress","is documented"],"explanation":"Provided that 表示前提条件，引导完整从句。"},{"id":"W10","type":"sentence","title":"Build a Sentence","context":"Describe a finding and an important limitation.","tokens":["the study","suggests a relationship","although","causation","it cannot establish"],"answer":["the study","suggests a relationship","although","it cannot establish","causation"],"explanation":"Although 引导让步从句，需区分相关与因果。","alternatives":["Although it cannot establish causation, the study suggests a relationship."]},{"id":"W11","type":"email","title":"Write an Email","timeHint":"Suggested time: 7 minutes","prompt":"You are scheduled to present your group's research poster at a university symposium next Thursday. The organizer has moved your presentation from the afternoon to the morning, when you must attend a required laboratory assessment. Write an email to the symposium coordinator. Explain the conflict and your team's preparation; ask whether an afternoon slot or a recorded presentation is possible; and request a decision by Tuesday at noon so that your group can plan accordingly.","positions":[],"checks":["State the original plan and the new scheduling conflict.","Explain that the group has prepared the research poster.","Ask about an afternoon slot or an approved recording alternative.","Request confirmation by Tuesday at noon.","Use a professional and courteous tone."]},{"id":"W12","type":"discussion","title":"Write for an Academic Discussion","timeHint":"Suggested time: 10 minutes","prompt":"Professor Morgan: 'Universities sometimes invest in large shared study areas instead of providing many small individual rooms. Shared spaces may encourage spontaneous collaboration and make better use of limited buildings. However, some students argue that concentration and privacy are essential for serious academic work. If a university can renovate only one type of space, should it prioritize shared study areas or private rooms? Explain your position.'","positions":[["Student A — Grace","Shared study areas are more flexible. Students can work alone for a while and then easily exchange ideas. Universities can also accommodate more people in the same space, which matters when resources are limited."],["Student B — Noah","Private rooms are more valuable because uninterrupted concentration is difficult in a busy environment. Students who need to write, analyze data, or rehearse presentations may find that a crowded shared area makes their work less effective."]],"checks":["Take and justify a clear position.","Engage explicitly with Grace, Noah, or both.","Develop a concrete example or consequence.","Address a trade-off: flexibility, cost, privacy, capacity, or concentration.","Write a coherent academic response."]}],"clips":{"choose01":{"title":"Library Hold","kind":"short response","segments":[{"role":"n","text":"The research methods book I reserved is ready, but the library closes before my seminar ends."}],"transcript":"The research methods book I reserved is ready, but the library closes before my seminar ends."},"choose02":{"title":"Unexpected Charge","kind":"short response","segments":[{"role":"n","text":"I noticed an extra fee on my housing bill, but I cannot find an explanation for it."}],"transcript":"I noticed an extra fee on my housing bill, but I cannot find an explanation for it."},"choose03":{"title":"Discussion Sections","kind":"short response","segments":[{"role":"n","text":"Would you mind switching discussion groups with me? Mine conflicts with a required lab."}],"transcript":"Would you mind switching discussion groups with me? Mine conflicts with a required lab."},"choose04":{"title":"Late Arrival","kind":"short response","segments":[{"role":"n","text":"I might be ten minutes late to the guest lecture because of my appointment."}],"transcript":"I might be ten minutes late to the guest lecture because of my appointment."},"choose05":{"title":"Draft Review","kind":"short response","segments":[{"role":"n","text":"Could you look over the conclusion of my paper before I submit it?"}],"transcript":"Could you look over the conclusion of my paper before I submit it?"},"choose06":{"title":"Locked Studio","kind":"short response","segments":[{"role":"n","text":"The art studio door is locked, and I left my materials inside."}],"transcript":"The art studio door is locked, and I left my materials inside."},"choose07":{"title":"Exchange Program","kind":"short response","segments":[{"role":"n","text":"I have been accepted for a semester abroad, but I do not know which courses will count toward my degree."}],"transcript":"I have been accepted for a semester abroad, but I do not know which courses will count toward my degree."},"choose08":{"title":"Dataset Missing","kind":"short response","segments":[{"role":"n","text":"The spreadsheet has the sample IDs, but several measurements seem to be missing."}],"transcript":"The spreadsheet has the sample IDs, but several measurements seem to be missing."},"choose09":{"title":"Poster Printing","kind":"short response","segments":[{"role":"n","text":"The conference poster has to be printed by Monday, but our final graph is not ready."}],"transcript":"The conference poster has to be printed by Monday, but our final graph is not ready."},"choose10":{"title":"Office Hours","kind":"short response","segments":[{"role":"n","text":"I tried to visit the professor yesterday, but she had changed her office hours."}],"transcript":"I tried to visit the professor yesterday, but she had changed her office hours."},"choose11":{"title":"Broken Projector","kind":"short response","segments":[{"role":"n","text":"The projector is working, but the slides look too dim for the audience to read."}],"transcript":"The projector is working, but the slides look too dim for the audience to read."},"choose12":{"title":"Reimbursement","kind":"short response","segments":[{"role":"n","text":"I paid for the workshop supplies myself. Is there a way to get reimbursed?"}],"transcript":"I paid for the workshop supplies myself. Is there a way to get reimbursed?"},"choose13":{"title":"Unexpected Result","kind":"short response","segments":[{"role":"n","text":"The second experiment produced almost the opposite result from the first."}],"transcript":"The second experiment produced almost the opposite result from the first."},"choose14":{"title":"Quiet Room","kind":"short response","segments":[{"role":"n","text":"I need a quiet place to record my presentation this weekend."}],"transcript":"I need a quiet place to record my presentation this weekend."},"choose15":{"title":"Changed Requirement","kind":"short response","segments":[{"role":"n","text":"My course outline says the project is due Friday, but the latest announcement says Wednesday."}],"transcript":"My course outline says the project is due Friday, but the latest announcement says Wednesday."},"choose16":{"title":"Group Interview","kind":"short response","segments":[{"role":"n","text":"Our interview participants can meet only at different times, so a group session seems impossible."}],"transcript":"Our interview participants can meet only at different times, so a group session seems impossible."},"choose17":{"title":"Lost Access Card","kind":"short response","segments":[{"role":"n","text":"I cannot get into the science building because I misplaced my access card."}],"transcript":"I cannot get into the science building because I misplaced my access card."},"conv01":{"title":"Resolving a Course Credit Problem","kind":"conversation","segments":[{"role":"A","text":"Hello. I transferred here this semester, and one of my environmental science courses is missing from my degree audit."},{"role":"B","text":"Did you submit the official transcript from your previous university?"},{"role":"A","text":"Yes, two weeks ago. The admissions office says it was received."},{"role":"B","text":"Then the transcript is probably not the problem. Some courses transfer as electives until the department reviews their content."},{"role":"A","text":"I thought this course would satisfy the laboratory requirement. We spent most of the semester collecting soil samples."},{"role":"B","text":"It might. But our department needs to compare the course objectives and the amount of supervised laboratory time."},{"role":"A","text":"Should I register for another lab just in case? Registration closes tomorrow."},{"role":"B","text":"I would reserve a place if you can, but do not pay an extra course fee yet. Send me the old course syllabus today."},{"role":"A","text":"Will you be able to decide before registration closes?"},{"role":"B","text":"The committee will not meet until next week. I can give you a temporary enrollment override, though, so you will have time to make a decision."},{"role":"A","text":"That is a relief. I will email the syllabus this afternoon."}],"transcript":"Speaker A: Hello. I transferred here this semester, and one of my environmental science courses is missing from my degree audit.\nSpeaker B: Did you submit the official transcript from your previous university?\nSpeaker A: Yes, two weeks ago. The admissions office says it was received.\nSpeaker B: Then the transcript is probably not the problem. Some courses transfer as electives until the department reviews their content.\nSpeaker A: I thought this course would satisfy the laboratory requirement. We spent most of the semester collecting soil samples.\nSpeaker B: It might. But our department needs to compare the course objectives and the amount of supervised laboratory time.\nSpeaker A: Should I register for another lab just in case? Registration closes tomorrow.\nSpeaker B: I would reserve a place if you can, but do not pay an extra course fee yet. Send me the old course syllabus today.\nSpeaker A: Will you be able to decide before registration closes?\nSpeaker B: The committee will not meet until next week. I can give you a temporary enrollment override, though, so you will have time to make a decision.\nSpeaker A: That is a relief. I will email the syllabus this afternoon."},"conv02":{"title":"Borrowing a Portable Exhibition Case","kind":"conversation","segments":[{"role":"A","text":"I am organizing a small exhibition in the student center, and I would like to borrow one of the portable display cases."},{"role":"B","text":"Certainly. Will it contain original objects or reproductions?"},{"role":"A","text":"Mostly reproductions, but there is one fragile ceramic piece that belongs to a local collector."},{"role":"B","text":"In that case, a standard portable case may not be suitable. It is designed for posters and objects that can tolerate small temperature changes."},{"role":"A","text":"Could I add a protective cover inside?"},{"role":"B","text":"Possibly, but we would need the collector to approve the arrangement. Also, the case cannot be placed directly beside the entrance where sunlight is strongest."},{"role":"A","text":"The exhibition opens on Friday. Could I collect the case on Thursday morning?"},{"role":"B","text":"You can collect it Wednesday afternoon. We need it back by Monday because another class has reserved it."},{"role":"A","text":"I could set up Wednesday, but I will need someone to help move it."},{"role":"B","text":"The facilities team can assist if you submit a request by noon tomorrow."},{"role":"A","text":"All right. I will contact the collector and arrange the move."}],"transcript":"Speaker A: I am organizing a small exhibition in the student center, and I would like to borrow one of the portable display cases.\nSpeaker B: Certainly. Will it contain original objects or reproductions?\nSpeaker A: Mostly reproductions, but there is one fragile ceramic piece that belongs to a local collector.\nSpeaker B: In that case, a standard portable case may not be suitable. It is designed for posters and objects that can tolerate small temperature changes.\nSpeaker A: Could I add a protective cover inside?\nSpeaker B: Possibly, but we would need the collector to approve the arrangement. Also, the case cannot be placed directly beside the entrance where sunlight is strongest.\nSpeaker A: The exhibition opens on Friday. Could I collect the case on Thursday morning?\nSpeaker B: You can collect it Wednesday afternoon. We need it back by Monday because another class has reserved it.\nSpeaker A: I could set up Wednesday, but I will need someone to help move it.\nSpeaker B: The facilities team can assist if you submit a request by noon tomorrow.\nSpeaker A: All right. I will contact the collector and arrange the move."},"ann01":{"title":"New Instructions for the Library Quiet Zone","kind":"announcement","segments":[{"role":"n","text":"Starting next Monday, the second floor of the main library will become a designated quiet-study area. Group conversations and online meetings must take place on the first floor, but students may still use laptops on the second floor if the devices are silent. Existing reservations for second-floor group rooms will be moved to equivalent first-floor spaces; confirmation emails will be sent by Friday. The change is temporary while the third floor is renovated. Library opening hours and book loans will remain unchanged."}],"transcript":"Starting next Monday, the second floor of the main library will become a designated quiet-study area. Group conversations and online meetings must take place on the first floor, but students may still use laptops on the second floor if the devices are silent. Existing reservations for second-floor group rooms will be moved to equivalent first-floor spaces; confirmation emails will be sent by Friday. The change is temporary while the third floor is renovated. Library opening hours and book loans will remain unchanged."},"ann02":{"title":"Outdoor Research Demonstration","kind":"announcement","segments":[{"role":"n","text":"Students registered for the meteorology demonstration on Saturday should meet at the observatory entrance at 8:45 a.m., fifteen minutes earlier than originally announced. The activity will proceed in light rain, so bring a waterproof jacket. The department will supply instruments and safety helmets. If wind speeds exceed the safety limit, the outdoor portion will move into the engineering classroom, but the demonstration will not be canceled. Participants will receive any location update by email on Friday evening. Please do not go directly to the rooftop without an instructor."}],"transcript":"Students registered for the meteorology demonstration on Saturday should meet at the observatory entrance at 8:45 a.m., fifteen minutes earlier than originally announced. The activity will proceed in light rain, so bring a waterproof jacket. The department will supply instruments and safety helmets. If wind speeds exceed the safety limit, the outdoor portion will move into the engineering classroom, but the demonstration will not be canceled. Participants will receive any location update by email on Friday evening. Please do not go directly to the rooftop without an instructor."},"talk01":{"title":"How Animals Use Environmental Signals","kind":"talk","segments":[{"role":"n","text":"When animals migrate, it is tempting to imagine that they follow one perfect internal map. In reality, many species appear to combine several environmental signals. Some birds can use the position of the sun to estimate direction. But because the sun appears to move during the day, an animal relying on it must also account for time. Internal daily rhythms may help with that adjustment."},{"role":"n","text":"Researchers test these ideas by manipulating the conditions in which animals orient themselves. In one type of experiment, birds are exposed to altered light schedules before being released into a controlled orientation arena. If their preferred direction changes, the result supports a connection between internal timekeeping and navigation. Yet it does not show that the internal clock is the only influence."},{"role":"n","text":"Under cloudy skies, for example, visual information may be less reliable. Magnetic cues could become more important. Scientists therefore look for situations where two explanations make different predictions. If birds continue to orient when one signal is blocked but lose direction when two are disrupted together, that would support a system involving more than one cue."},{"role":"n","text":"The broader lesson is methodological: a convincing explanation should account not only for an animal’s successful journey but also for how its behavior changes under carefully selected conditions."}],"transcript":"When animals migrate, it is tempting to imagine that they follow one perfect internal map. In reality, many species appear to combine several environmental signals. Some birds can use the position of the sun to estimate direction. But because the sun appears to move during the day, an animal relying on it must also account for time. Internal daily rhythms may help with that adjustment.\nResearchers test these ideas by manipulating the conditions in which animals orient themselves. In one type of experiment, birds are exposed to altered light schedules before being released into a controlled orientation arena. If their preferred direction changes, the result supports a connection between internal timekeeping and navigation. Yet it does not show that the internal clock is the only influence.\nUnder cloudy skies, for example, visual information may be less reliable. Magnetic cues could become more important. Scientists therefore look for situations where two explanations make different predictions. If birds continue to orient when one signal is blocked but lose direction when two are disrupted together, that would support a system involving more than one cue.\nThe broader lesson is methodological: a convincing explanation should account not only for an animal’s successful journey but also for how its behavior changes under carefully selected conditions."},"talk02":{"title":"Why Some Materials Remember Their Shape","kind":"talk","segments":[{"role":"n","text":"You may have seen a bent metal wire return to its original shape after being warmed. Certain alloys, called shape-memory alloys, can do this because the arrangement of atoms in the material changes with temperature. The metal is not remembering in the psychological sense. Rather, its crystal structure can switch between two forms."},{"role":"n","text":"At a lower temperature, some of these alloys can be deformed comparatively easily. When heated, they return toward a previously established shape as the crystal arrangement transforms. Engineers can take advantage of this response in small medical devices and mechanical actuators. But the effect is not unlimited. Repeated cycling can produce fatigue, and the temperature at which a transformation occurs depends on the material’s composition."},{"role":"n","text":"An especially important distinction is between the visible movement of the wire and the underlying phase change. A demonstration may look like a piece of metal pulling itself into shape, but that description leaves out the material mechanism. Scientists use measurements of temperature, force, and microscopic structure to explain why the motion occurs."},{"role":"n","text":"So when evaluating a proposed application, we should ask not merely whether a wire can return once, but whether it can operate repeatedly under the temperatures and loads the device will actually encounter."}],"transcript":"You may have seen a bent metal wire return to its original shape after being warmed. Certain alloys, called shape-memory alloys, can do this because the arrangement of atoms in the material changes with temperature. The metal is not remembering in the psychological sense. Rather, its crystal structure can switch between two forms.\nAt a lower temperature, some of these alloys can be deformed comparatively easily. When heated, they return toward a previously established shape as the crystal arrangement transforms. Engineers can take advantage of this response in small medical devices and mechanical actuators. But the effect is not unlimited. Repeated cycling can produce fatigue, and the temperature at which a transformation occurs depends on the material’s composition.\nAn especially important distinction is between the visible movement of the wire and the underlying phase change. A demonstration may look like a piece of metal pulling itself into shape, but that description leaves out the material mechanism. Scientists use measurements of temperature, force, and microscopic structure to explain why the motion occurs.\nSo when evaluating a proposed application, we should ask not merely whether a wire can return once, but whether it can operate repeatedly under the temperatures and loads the device will actually encounter."},"talk03":{"title":"Why Cities Keep Old Trees","kind":"talk","segments":[{"role":"n","text":"When city planners estimate the value of a mature tree, they often begin with measurable services. Its canopy can shade nearby streets, leaves can intercept rainfall, and the roots may help soil absorb water. But measuring these benefits is complicated. The cooling effect of a tree depends on its size, the surrounding buildings, and local weather."},{"role":"n","text":"An urban tree also has costs. Roots can damage poorly designed pavement, and a tree weakened by disease may require extensive care or removal. These concerns are important, yet they do not necessarily justify replacing every old tree with several young ones. The combined leaf area of small trees may remain far lower for many years."},{"role":"n","text":"Researchers therefore recommend looking at benefits across time rather than comparing a tree’s current maintenance bill with the cost of planting a replacement. In some neighborhoods, older trees are also associated with local identity and memories of earlier streetscapes, although these cultural values are difficult to express as monetary estimates."},{"role":"n","text":"The key lesson is not that every mature tree must be preserved. It is that decisions should consider the tree’s condition, the services it provides now, and the period needed for new plantings to deliver comparable benefits. Short-term cost comparisons can make long-term losses almost invisible."}],"transcript":"When city planners estimate the value of a mature tree, they often begin with measurable services. Its canopy can shade nearby streets, leaves can intercept rainfall, and the roots may help soil absorb water. But measuring these benefits is complicated. The cooling effect of a tree depends on its size, the surrounding buildings, and local weather.\nAn urban tree also has costs. Roots can damage poorly designed pavement, and a tree weakened by disease may require extensive care or removal. These concerns are important, yet they do not necessarily justify replacing every old tree with several young ones. The combined leaf area of small trees may remain far lower for many years.\nResearchers therefore recommend looking at benefits across time rather than comparing a tree’s current maintenance bill with the cost of planting a replacement. In some neighborhoods, older trees are also associated with local identity and memories of earlier streetscapes, although these cultural values are difficult to express as monetary estimates.\nThe key lesson is not that every mature tree must be preserved. It is that decisions should consider the tree’s condition, the services it provides now, and the period needed for new plantings to deliver comparable benefits. Short-term cost comparisons can make long-term losses almost invisible."}}};
</script>
<script>
/* Browser-native speech engine. This version includes NO low-fidelity pre-rendered MP3 recordings.
   The browser/OS supplies the voice. SpeechSynthesis quality varies by device and voice selection. */
(() => {
  'use strict';
  const synth = window.speechSynthesis;
  let revision = 0;
  let active = null;
  const supported = Boolean(synth && window.SpeechSynthesisUtterance);
  const key = v => v ? v.name+'|'+v.lang+'|'+v.voiceURI : '';
  const getVoices = () => supported ? synth.getVoices().filter(v=>/^en[-_]/i.test(v.lang)).sort((a,b)=>rank(b)-rank(a)) : [];
  function rank(v){
    const n=(v.name+' '+v.voiceURI).toLowerCase();let r=0;
    if(/(neural|natural|enhanced|premium|high quality)/.test(n))r+=40;
    if(/(ava|samantha|allison|zoe|aria|jenny|guy|serena|daniel|moira)/.test(n))r+=24;
    if(/(google us english|microsoft)/.test(n))r+=15;
    if(/^en-us$/i.test(v.lang))r+=9;
    if(v.localService)r+=3;
    if(/(espeak|default|compact|fred)/i.test(n))r-=25;
    return r;
  }
  const choose = (id,preferredOpposite='') => {
    const voices=getVoices();
    if (id) return voices.find(v=>key(v)===id)||voices[0]||null;
    if (preferredOpposite) return voices.find(v=>key(v)!==preferredOpposite)||voices[0]||null;
    return voices[0]||null;
  };
  function chunk(text){
    const sentences=(text.match(/[^.!?;]+[.!?;]?/g)||[text]).map(s=>s.trim()).filter(Boolean);
    const result=[];
    for(const sentence of sentences){
      if(sentence.length<=145){result.push(sentence);continue;}
      const words=sentence.split(' ');let buf='';
      for(const w of words){if((buf+' '+w).length>125 && buf){result.push(buf);buf=w;}else buf+=(buf?' ':'')+w;}
      if(buf)result.push(buf);
    }
    return result;
  }
  function stop(){revision++;if(supported){try{synth.cancel();}catch(e){}}active=null;}
  function playSegments(segments,conf,onFinish,onError){
    stop();if(!supported){onError?.('当前浏览器不支持系统英语语音合成，请使用 Chrome 或 Safari。');return false;}
    const myRun=revision,chosenA=choose(conf.primary),chosenB=choose(conf.secondary,key(chosenA)),rate=Math.max(.75,Math.min(1.12,Number(conf.rate)||.94));
    const queue=[];
    for(const seg of segments){
      const role=seg.role||'n';let v=role==='B'?chosenB:chosenA;
      for(const s of chunk(seg.text))queue.push({text:s,voice:v});
    }
    if(!queue.length){onError?.('录音文本为空。');return false;}
    let cursor=0;
    function speakNext(){
      if(myRun!==revision)return;
      if(cursor>=queue.length){active=null;onFinish?.();return;}
      const item=queue[cursor++],u=new SpeechSynthesisUtterance(item.text);active=u;
      u.lang=item.voice?.lang||'en-US';if(item.voice)u.voice=item.voice;
      u.rate=rate;u.pitch=1;u.volume=1;
      u.onend=()=>{if(myRun===revision)speakNext();};
      u.onerror=err=>{if(myRun!==revision)return;active=null;onError?.('语音播放被中断或不可用：'+(err.error||'unknown')+'。请换一个系统声音并重新试听。');};
      try{synth.speak(u);}catch(err){onError?.('浏览器无法朗读此段文本：'+err.message);}
    }
    speakNext();return true;
  }
  const defaults={primary:'',secondary:'',rate:.94};
  const storage='toefl-voice-settings-v3';
  function load(){try{return {...defaults,...JSON.parse(localStorage.getItem(storage)||'{}')}}catch(e){return {...defaults}}}
  function save(conf){try{localStorage.setItem(storage,JSON.stringify(conf))}catch(e){}}
  window.TOEFL_VOICE={supported,getVoices,key,load,save,stop,playSegments,preview:(conf,onDone,onError)=>playSegments([{role:'n',text:'Good afternoon. You are listening to an English voice sample. Please choose a voice that is clear and comfortable to understand.'}],conf,onDone,onError)};
})();

</script>

(() => {

  const BANK = window.TOEFL_BANK;
  const APP = document.getElementById('app');
  if (!BANK || !APP) { document.body.innerHTML = '<p style="padding:30px">题库未能加载。请打开完整版 HTML 或使用 ZIP 文件中的 index.html。</p>'; return; }
  const OPTIONS = {

      arr.push('');arr.push('SECTION: '+section.toUpperCase());
      for(const q of items(section)){
        const key=section==='reading'&&q.type==='cloze'?q.group:section==='listening'?q.clip:null;
        if(key&&!visited.has(key)){
          if(q.passage)arr.push('PASSAGE ['+q.groupTitle+']: '+q.passage);
          if(q.clip)arr.push('AUDIO TRANSCRIPT ['+q.groupTitle+']: '+transcript(q));
          visited.add(key);
        }
        arr.push(q.id+' | '+(correct(q)===true?'CORRECT':correct(q)===false?'INCORRECT':'UNANSWERED'));
        arr.push('Type: '+q.type+' / '+(q.groupTitle||''));
        arr.push('Question: '+(q.type==='cloze'?('Blank '+q.index+' / prefix '+q.prefix):q.stem));
        if(q.options)q.options.forEach((op,i)=>arr.push('  '+'ABCD'[i]+'. '+op));
        arr.push('My answer: '+answerText(q));
        arr.push('Correct answer: '+correctAnswer(q));
        if(q.explanation)arr.push('Explanation: '+q.explanation);
        arr.push('');
      }
    }
    return arr;
  };
  const qIsSubjective=q=>q.type==='email'||q.type==='discussion';
  const download=(blob,name)=>{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},3500);};
  const paragraphXml = (val, i) => `<w:p><w:pPr><w:spacing w:after="${val?120:80}"/></w:pPr><w:r><w:rPr>${(i===0 || val.startsWith('W1')||val.startsWith('W11')||val.startsWith('W12')||val==='MY RESPONSE:'||val==='QUESTION / ORIGINAL PROMPT:')?'<w:b/>':''}</w:rPr><w:t xml:space="preserve">${e(val)}</w:t></w:r></w:p>`;
  const zipStore=(records)=>{
    const t=new TextEncoder();const parts=[],central=[];let offset=0;
    const u16=(d,p,v)=>{d[p]=v&255;d[p+1]=v>>>8&255;};const u32=(d,p,v)=>{u16(d,p,v&65535);u16(d,p+2,(v>>>16)&65535);};
    const crc=(bytes)=>{let c=~0;for(const b of bytes){c^=b;for(let i=0;i<8;i++)c=(c>>>1)^(c&1?0xEDB88320:0);}return(~c)>>>0;};
    for(const [name,contents] of Object.entries(records)){
      const filename=t.encode(name),data=t.encode(contents),checksum=crc(data);const local=new Uint8Array(30+filename.length);
      u32(local,0,0x04034b50);u16(local,4,20);u16(local,6,0x0800);u16(local,8,0);u32(local,14,checksum);u32(local,18,data.length);u32(local,22,data.length);u16(local,26,filename.length);local.set(filename,30);
      parts.push(local,data);
      const dir=new Uint8Array(46+filename.length);u32(dir,0,0x02014b50);u16(dir,4,20);u16(dir,6,20);u16(dir,8,0x0800);u16(dir,10,0);u32(dir,16,checksum);u32(dir,20,data.length);u32(dir,24,data.length);u16(dir,28,filename.length);u32(dir,42,offset);dir.set(filename,46);central.push(dir);offset+=local.length+data.length;
    }
    const centralLength=central.reduce((s,c)=>s+c.length,0);const end=new Uint8Array(22);u32(end,0,0x06054b50);u16(end,8,central.length);u16(end,10,central.length);u32(end,12,centralLength);u32(end,16,offset);
    return new Blob([...parts,...central,end],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  };
  const exportDocx=()=>{
    const paragraphs=reportParagraphs();
    const xml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${paragraphs.map(paragraphXml).join('')}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1400" w:right="1100" w:bottom="1400" w:left="1100"/></w:sectPr></w:body></w:document>`;
    const records={
      '[Content_Types].xml':'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>',
      '_rels/.rels':'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>',
      'word/document.xml':xml
    };
    download(zipStore(records),'TOEFL_Set_F_Full_Report_'+new Date().toISOString().slice(0,10)+'.docx');
  };
  const exportTxt=()=>download(new Blob([reportParagraphs().join('\n')],{type:'text/plain;charset=utf-8'}),'TOEFL_Set_F_Full_Report_'+new Date().toISOString().slice(0,10)+'.txt');
  const confirmSection=()=>{ const n=items(state.section).filter(x=>!isAnswered(x)).length; const last=state.section==='writing';
    if(state.mode==='full'&&CUT[state.section]&&sectionModule(state.section)===1){showModuleConfirm();return;} modal={title:last?'提交所有答案？':'结束当前科目？',message:`当前科目还有 ${n} 道题未作答。${last?'提交后将进入考试总览，组句自动判分，作文待人工批改。':'提交后本部分答案将锁定。完整考试模式不提前显示正确答案；下一科开始前会有提示。'}`,button:last?'确认交卷':'交卷并查看本部分批改'};renderExam();};
  APP.addEventListener('click',event=>{
    const el=event.target.closest('[data-action]');if(!el)return;
    const action=el.dataset.action;
    if(action==='start'){voice.stop();start(el.dataset.mode);return;}
    if(action==='begin-section'&&state?.section==='intro'){const s=state.introNext;state.section=s;state.introNext=null;state.sectionIndex=0;state.module[s]=1;state.deadlines[s]=Date.now()+OPTIONS[state.mode].times[s]*60000;save();render();return;}
    if(action==='module-next'){if(currentAudio?.playing)return;showModuleConfirm();return;}
    if(action==='voice-test-dialogue'){voice.stop();const n=document.getElementById('voice-test-status');if(n)n.textContent='正在试听两个人物的英语对话…';voice.playSegments([{role:'A',text:'Have you finished preparing the report?'},{role:'B',text:'Almost. I just need to check the final references.'},{role:'A',text:'Great. Let me know when it is ready.'}],voiceConfig,()=>{if(n)n.textContent='对话试听完成。可以为不同人物选择不同的英语声音。';},err=>{if(n)n.textContent='试听失败：'+err;});return;}
    if(action==='voice-test'){voice.stop();const n=document.getElementById('voice-test-status')||document.getElementById('audio-status');if(n)n.textContent='正在播放英语试听句；如果声音不自然，可更换主讲声音。';voice.preview(voiceConfig,()=>{if(n)n.textContent='试听结束。听起来不自然的话，请在下拉列表中选择另一种英语声音。';},err=>{if(n)n.textContent='试听失败：'+err+'。请在系统语音设置中启用英文声音，或试用 Safari。';});return;}
    if(action==='reset'){state=null;showingResult=false;modal=null;audioStop();save();try{localStorage.removeItem(STORAGE_KEY)}catch(err){}render();return;}
    if(action==='tab'){selectedTab=el.dataset.tab;renderResults();return;}
    if(action==='open-review'){openReview(el.dataset.section);return;}
    if(action==='review-nav' && state?.section==='sectionReview'){state.reviewIndex=Number(el.dataset.idx);save();renderSectionReview();window.scrollTo(0,0);return;}
    if((action==='review-prev'||action==='review-next') && state?.section==='sectionReview'){state.reviewIndex=Math.max(0,Math.min(items(state.reviewSection).length-1,state.reviewIndex+(action==='review-prev'?-1:1)));save();renderSectionReview();window.scrollTo(0,0);return;}
    if(action==='continue-section'){continueAfterReview();return;}
    if(action==='return-results'){state.section='results';state.reviewSection=null;save();renderResults();window.scrollTo(0,0);return;}
    if(action==='export-docx'){exportDocx();return;}
    if(action==='export-txt'){exportTxt();return;}
    if(action==='resume'){state=load();render();return;}
    if(!state||state.section==='results')return;
    if(action==='stop-audio' && state.section==='listening' && state.mode==='quick'){audioStop();renderExam();return;}
    if(action==='toggle-mobile-nav'){const panel=document.querySelector('.sidebar');if(panel){const show=panel.classList.toggle('mobile-nav-open');el.setAttribute('aria-expanded',String(show));el.innerHTML=show?'收起题号导航 <span aria-hidden="true">⌃</span>':'题号导航 · 点击展开 <span aria-hidden="true">⌄</span>';}return;}
    if(action==='navigate'){navigate(Number(el.dataset.idx));return;}
    if(action==='prev'||action==='next'){navigate(nextIndex(action==='prev'?-1:1));return;}
    if(action==='choice'){state.answers[el.dataset.id]=Number(el.dataset.value);save();refreshAnswerUI(el.dataset.id);return;}
    if(action==='play'){tryPlay(el.dataset.clip,el);return;}
    if(action==='token-add'||action==='token-remove'||action==='token-clear'){
      const id=el.dataset.id;const chosen=Array.isArray(state.answers[id])?state.answers[id].slice():[];
      if(action==='token-add'){const idx=Number(el.dataset.idx);if(!chosen.includes(idx))chosen.push(idx);}
      if(action==='token-remove')chosen.splice(Number(el.dataset.pos),1);
      if(action==='token-clear')chosen.length=0;
      state.answers[id]=chosen;save();renderExam();return;
    }
    if(action==='finish-section'){if(currentAudio?.playing)return;confirmSection();return;}
    if(action==='cancel-modal'){modal=null;renderExam();return;}
    if(action==='confirm-modal') {if(modal?.kind==='module')commitModule();else finishCurrentSection();return;}
    if(action==='leave'){
      modal={title:'退出当前考试？',message:'退出将结束本次作答。若希望保留作答记录，请继续考试并在最后导出文件。',button:'退出并清空'};
      renderExam();const yes=document.querySelector('[data-action="confirm-modal"]');if(yes)yes.dataset.action='really-leave';return;
    }
    if(action==='really-leave'){state=null;audioStop();modal=null;try{localStorage.removeItem(STORAGE_KEY)}catch(err){}renderHome();}
  });
  APP.addEventListener('change',event=>{
    const el=event.target;if(!el.dataset.voice)return;
    if(el.dataset.voice==='rate')voiceConfig.rate=Number(el.value)||.94;
    if(el.dataset.voice==='primary')voiceConfig.primary=el.value;
    if(el.dataset.voice==='secondary')voiceConfig.secondary=el.value;
    saveVoice();
  });
  if(voice?.supported){speechSynthesis.addEventListener('voiceschanged',()=>{
    if(state)return;
    for(const kind of ['primary','secondary']){const el=document.getElementById('voice-'+kind);if(el){el.innerHTML=voiceOptions(kind);el.value=voiceConfig[kind]||'';}}
  });}
  APP.addEventListener('input',event=>{
    const t=event.target,id=t.dataset.id;if(!id || !state || state.section==='results')return;
    if(t.matches('.cloze-input, textarea.text-box')){
      state.answers[id]=t.value;save();refreshAnswerUI(id);
      if(t.matches('textarea')){const el=document.getElementById('word-count');if(el)el.textContent=tallyWords(t.value)+' words';}
    }
  });
  window.addEventListener('beforeunload',event=>{if(state && state.section!=='results'){save();event.preventDefault();}});
  state=load();
  // A saved exam retains its original wall-clock deadline; refreshing does not extend it.
  if(state){showingResult=state.section==='results';render();}else renderHome();
  tickInterval=setInterval(timerTick,250);
  window.TOEFL_TEST_API={getState:()=>state,score:statsFor,exportDocx,exportTxt,openReview,finishCurrentSection,continueAfterReview};
})();

</script>
