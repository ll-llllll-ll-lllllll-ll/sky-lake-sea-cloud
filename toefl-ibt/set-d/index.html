e systems do not make all observations perfect, but they can {5} sharper images of distant objects. Astronomers also have to consider whether improvements in resolution introduce new {6} when comparing images taken by different instruments.","index":6,"prefix":"bia","answer":"biases","explanation":"New biases: plural noun.","title":"Complete the Words"},{"id":"R31","type":"daily","title":"Read in Daily Life","groupTitle":"Archive Reading Room Policy","passage":"Researchers may consult rare manuscripts from 10 a.m. to 4 p.m. Reservations must be requested by noon on the previous working day. Bags must remain in lockers, and only pencils are permitted at reading tables. Photography without flash is allowed unless an item bears a restricted-copying label. Staff may cancel appointments if the researcher has not arrived within twenty minutes.","stem":"A researcher booked a manuscript for 11 a.m. but arrives at 11:25. What is the most accurate expectation?","options":["The appointment may already have been canceled.","The appointment automatically continues until 4 p.m.","A flash may be used to photograph the manuscript.","The reservation must be moved to noon."],"answer":0,"explanation":"Arriving more than twenty minutes late permits staff to cancel the appointment; it is not guaranteed to remain active."},{"id":"R32","type":"daily","title":"Read in Daily Life","groupTitle":"Restoration Workshop Notice","passage":"The conservation workshop has moved from Friday to Thursday because the instructor will be away. Participants who registered before Monday retain their places. Those who registered on Monday or later must confirm attendance by emailing the organizer by 5 p.m. Wednesday. Protective aprons are supplied; participants should bring cotton gloves. The participation fee is nonrefundable after the confirmation deadline.","stem":"A student registered on Tuesday. What must the student do to retain the place?","options":["Purchase an apron before Thursday.","Email confirmation before 5 p.m. Wednesday.","Register for another workshop.","Pay the participation fee a second time."],"answer":1,"explanation":"Those registered Monday or later must reconfirm by the specified deadline."},{"id":"R33","type":"daily","title":"Read in Daily Life","groupTitle":"Island Ferry Field Course","passage":"Due to high winds, Monday’s ferry will depart at 8:10 a.m. instead of 8:40. Field-course students must check in at the terminal by 7:45. If services are suspended entirely, the instructor will post a replacement assignment by 9 a.m. on the course portal. Students should not travel to the harbor after a suspension announcement. The coastal museum visit planned for Tuesday is unaffected.","stem":"What should a student do if ferry service is canceled before departure?","options":["Meet at the harbor at 9 a.m.","Attend the coastal museum on Monday.","Check the course portal for an alternative assignment.","Wait at the terminal until Tuesday."],"answer":2,"explanation":"The instructor posts a replacement assignment through the course portal if service is suspended."},{"id":"R34","type":"daily","title":"Read in Daily Life","groupTitle":"Campus Exhibition Print Guidelines","passage":"Student artists may submit up to three prints to the annual exhibition. Prints must be unframed and labeled on the back. Works larger than 60 by 80 centimeters require advance approval; unapproved oversized pieces cannot be installed. Students may collect rejected submissions on Friday between 1 and 4 p.m. The gallery accepts electronic labels but not replacement works after the deadline.","stem":"Which submission is ineligible for installation without further approval?","options":["Two unframed 40-by-50-centimeter prints.","Three prints labeled on the reverse.","A print with an electronic label.","A 70-by-90-centimeter print submitted without advance approval."],"answer":3,"explanation":"Oversized work requires prior approval; 70 by 90 exceeds the 60 by 80 limit."},{"id":"R35","type":"daily","title":"Read in Daily Life","groupTitle":"Greenhouse Sensor Calibration","passage":"The greenhouse temperature sensors will be recalibrated on Wednesday from 2 to 5 p.m. Automatic data logs will remain available, but measurements taken during that interval will be marked provisional. Researchers who need certified measurements should schedule sampling outside the interval. No plants will be moved. Access to the southern greenhouse is restricted only between 3 and 4 p.m.","stem":"What is true of temperature data recorded at 2:30 p.m. Wednesday?","options":["They will be deleted after calibration.","They can be viewed but are not certified during calibration.","They will automatically count as certified data.","They cannot be downloaded at any time."],"answer":1,"explanation":"Logs stay available but readings in the calibration window are flagged provisional."},{"id":"R36","type":"daily","title":"Read in Daily Life","groupTitle":"Course Waitlist Procedure","passage":"Students on the waitlist receive an email if a seat becomes available. An offer expires twelve hours after it is sent, even if it arrives overnight. Accepting the offer does not cancel a conflicting course automatically; students must update their own timetable. The department cannot extend an expired offer, but students may rejoin the waitlist if enrollment remains open.","stem":"A student accepts an offered seat after eleven hours. What additional step may still be required?","options":["Ask the department to extend the offer.","Rejoin the waitlist immediately.","Remove a conflicting course from the timetable.","Wait another twelve hours before enrollment is possible."],"answer":2,"explanation":"Accepting a seat does not automatically remove a conflicting course from the student’s timetable."},{"id":"R37","type":"daily","title":"Read in Daily Life","groupTitle":"Makerspace Laser Cutter Access","passage":"Only students who have passed the safety demonstration may reserve the laser cutter. Booking opens seven days ahead and closes two hours before a session. Users must supply their own approved material; untreated plywood and acrylic are permitted, but vinyl is prohibited. Students must remain in the room while the machine operates. Staff will not cut materials on behalf of absent users.","stem":"Which person is eligible to use the laser cutter?","options":["A trained student who books three hours in advance and brings approved acrylic.","A trained student who books thirty minutes before the session.","An untrained student who brings untreated plywood.","A trained student who wants staff to operate it while they leave."],"answer":0,"explanation":"Eligibility requires completed safety demonstration, reservation at least two hours ahead, approved material, and supervision."},{"id":"R38","type":"daily","title":"Read in Daily Life","groupTitle":"Community Repair Café","passage":"Volunteers at the repair café will examine small household appliances on Saturday. Visitors may bring one item per person and should remove all batteries before arriving. Repairs are offered without labor charges, but replacement parts must be purchased by the owner. The café cannot accept microwave ovens or devices that show evidence of water entering the electrical housing.","stem":"Which item may the café consider accepting?","options":["A microwave oven with the battery removed.","A water-damaged electric kettle.","Two small fans from the same visitor.","One dry desk lamp with its batteries removed."],"answer":3,"explanation":"A single dry device other than a microwave is potentially acceptable; batteries should be removed."},{"id":"R39","type":"daily","title":"Read in Daily Life","groupTitle":"Geology Museum Sample Requests","passage":"Rock specimens may be borrowed for teaching only after a faculty supervisor signs the request. Collections staff review applications each Thursday; approval emails are sent within two working days. Borrowers must return items within fourteen days unless an extension is approved in advance. Photographs of the collection may be used in student presentations, but public exhibition requires written permission.","stem":"A student wants to display a museum photograph at a public event. What is required?","options":["Only a verbal promise to credit the museum.","Written permission for public exhibition.","A faculty signature for any photograph.","Approval only if the event lasts more than fourteen days."],"answer":1,"explanation":"Public exhibition of collection photos requires written permission, unlike ordinary student presentations."},{"id":"R40","type":"daily","title":"Read in Daily Life","groupTitle":"Language Exchange Sign-Ups","passage":"The language exchange program matches participants in pairs for a six-week period. Applicants may indicate preferred languages but cannot request a specific partner. Matches will be announced Friday afternoon. Participants who cannot attend the opening meeting must notify the coordinator before Thursday noon; otherwise their place may be given to someone on the waiting list. Online attendance at the first meeting is not offered.","stem":"What should a participant do if they cannot attend the opening meeting?","options":["Ask to join the first meeting remotely.","Choose a specific replacement partner.","Notify the coordinator before Thursday noon.","Wait until Friday to explain the absence."],"answer":2,"explanation":"The notice requires early notification or the place may be reassigned."},{"id":"R41","type":"academic","title":"Read an Academic Passage","groupTitle":"What a Brighter City Changes","passage":"At the turn of the twentieth century, many cities adopted bright electric street lighting as evidence of technological progress. Engineers measured improvements largely in terms of visibility and the number of lamps installed. Yet a street’s brightness is only one part of its nighttime environment. Illumination also changes how residents use public space and how other organisms navigate it.\n\nFor insects, the effects can depend on wavelength as well as intensity. Some species are strongly attracted to ultraviolet and blue-rich light. Once drawn toward a lamp, insects may circle it rather than continuing to feed or reproduce. But this response is not universal: insects differ in their visual systems, and even members of one species may respond differently depending on the season.\n\nResearchers comparing neighborhoods must therefore account for factors that correlate with lighting. Brighter districts may also have more traffic, fewer plants, or different temperatures. An observed reduction in moth abundance near lamps cannot alone establish that the lamps caused it. Carefully designed interventions, such as changing a street’s lamps while monitoring comparable untreated streets, can provide stronger evidence. Even those comparisons require attention to insects moving between areas.\n\nUrban planners increasingly discuss lighting in terms of its distribution rather than its simple quantity. Shielding lamps can direct light toward pedestrian paths and away from nearby habitat. Reducing unnecessary illumination during low-use hours may preserve visibility where it matters while limiting ecological effects elsewhere. The broader lesson is that infrastructure can be evaluated not only by the service it provides, but also by what it alters beyond its intended users.","stem":"Why does the author mention insects that circle a lamp?","options":["To show that all insect species prefer artificial environments.","To provide an example of how lighting can disrupt behavior beyond improving human visibility.","To argue that ultraviolet light never reaches city streets.","To demonstrate that insects avoid feeding in all urban habitats."],"answer":1,"explanation":"The circling example illustrates an unintended behavioral effect of lighting."},{"id":"R42","type":"academic","title":"Read an Academic Passage","groupTitle":"What a Brighter City Changes","passage":"At the turn of the twentieth century, many cities adopted bright electric street lighting as evidence of technological progress. Engineers measured improvements largely in terms of visibility and the number of lamps installed. Yet a street’s brightness is only one part of its nighttime environment. Illumination also changes how residents use public space and how other organisms navigate it.\n\nFor insects, the effects can depend on wavelength as well as intensity. Some species are strongly attracted to ultraviolet and blue-rich light. Once drawn toward a lamp, insects may circle it rather than continuing to feed or reproduce. But this response is not universal: insects differ in their visual systems, and even members of one species may respond differently depending on the season.\n\nResearchers comparing neighborhoods must therefore account for factors that correlate with lighting. Brighter districts may also have more traffic, fewer plants, or different temperatures. An observed reduction in moth abundance near lamps cannot alone establish that the lamps caused it. Carefully designed interventions, such as changing a street’s lamps while monitoring comparable untreated streets, can provide stronger evidence. Even those comparisons require attention to insects moving between areas.\n\nUrban planners increasingly discuss lighting in terms of its distribution rather than its simple quantity. Shielding lamps can direct light toward pedestrian paths and away from nearby habitat. Reducing unnecessary illumination during low-use hours may preserve visibility where it matters while limiting ecological effects elsewhere. The broader lesson is that infrastructure can be evaluated not only by the service it provides, but also by what it alters beyond its intended users.","stem":"What makes it difficult to attribute lower moth abundance directly to streetlamps?","options":["Urban neighborhoods differ in multiple variables besides lighting.","Insects cannot be counted reliably under any circumstances.","Streetlamps usually attract mammals rather than insects.","Moth abundance cannot change across seasons."],"answer":0,"explanation":"Lighting correlates with traffic, vegetation and temperature; these are confounding variables."},{"id":"R43","type":"academic","title":"Read an Academic Passage","groupTitle":"What a Brighter City Changes","passage":"At the turn of the twentieth century, many cities adopted bright electric street lighting as evidence of technological progress. Engineers measured improvements largely in terms of visibility and the number of lamps installed. Yet a street’s brightness is only one part of its nighttime environment. Illumination also changes how residents use public space and how other organisms navigate it.\n\nFor insects, the effects can depend on wavelength as well as intensity. Some species are strongly attracted to ultraviolet and blue-rich light. Once drawn toward a lamp, insects may circle it rather than continuing to feed or reproduce. But this response is not universal: insects differ in their visual systems, and even members of one species may respond differently depending on the season.\n\nResearchers comparing neighborhoods must therefore account for factors that correlate with lighting. Brighter districts may also have more traffic, fewer plants, or different temperatures. An observed reduction in moth abundance near lamps cannot alone establish that the lamps caused it. Carefully designed interventions, such as changing a street’s lamps while monitoring comparable untreated streets, can provide stronger evidence. Even those comparisons require attention to insects moving between areas.\n\nUrban planners increasingly discuss lighting in terms of its distribution rather than its simple quantity. Shielding lamps can direct light toward pedestrian paths and away from nearby habitat. Reducing unnecessary illumination during low-use hours may preserve visibility where it matters while limiting on to insects moving between areas.\n\nUrban planners increasingly discuss lighting in terms of its distribution rather than its simple quantity. Shielding lamps can direct light toward pedestrian paths and away from nearby habitat. Reducing unnecessary illumination during low-use hours may preserve visibility where it matters while limiting ecological effects elsewhere. The broader lesson is that infrastructure can be evaluated not only by the service it provides, but also by what it alters beyond its intended users.","stem":"Which planning measure is most consistent with the passage?","options":["Adding brighter lamps to every residential street.","Removing lighting from all busy crossroads.","Measuring success only by the number of lamps.","Shielding light away from sensitive habitat while retaining illumination where needed."],"answer":3,"explanation":"The last paragraph advocates directing light purposefully while reducing spillover."},{"id":"R45","type":"academic","title":"Read an Academic Passage","groupTitle":"What a Brighter City Changes","passage":"At the turn of the twentieth century, many cities adopted bright electric street lighting as evidence of technological progress. Engineers measured improvements largely in terms of visibility and the number of lamps installed. Yet a street’s brightness is only one part of its nighttime environment. Illumination also changes how residents use public space and how other organisms navigate it.\n\nFor insects, the effects can depend on wavelength as well as intensity. Some species are strongly attracted to ultraviolet and blue-rich light. Once drawn toward a lamp, insects may circle it rather than continuing to feed or reproduce. But this response is not universal: insects differ in their visual systems, and even members of one species may respond differently depending on the season.\n\nResearchers comparing neighborhoods must therefore account for factors that correlate with lighting. Brighter districts may also have more traffic, fewer plants, or different temperatures. An observed reduction in moth abundance near lamps cannot alone establish that the lamps caused it. Carefully designed interventions, such as changing a street’s lamps while monitoring comparable untreated streets, can provide stronger evidence. Even those comparisons require attention to insects moving between areas.\n\nUrban planners increasingly discuss lighting in terms of its distribution rather than its simple quantity. Shielding lamps can direct light toward pedestrian paths and away from nearby habitat. Reducing unnecessary illumination during low-use hours may preserve visibility where it matters while limiting ecological effects elsewhere. The broader lesson is that infrastructure can be evaluated not only by the service it provides, but also by what it alters beyond its intended users.","stem":"What is the passage’s central claim?","options":["Electric lighting has produced no genuine benefits.","Infrastructure should be judged by both its intended function and its wider effects.","Insects are the only organisms harmed by urban development.","Scientific studies have disproved the value of street lighting."],"answer":1,"explanation":"The argument extends from lamp performance to ecological and social externalities."},{"id":"R46","type":"academic","title":"Read an Academic Passage","groupTitle":"When Maps Become Arguments","passage":"A map appears to offer a view of space from above, but its apparent neutrality depends on many decisions made before it reaches a reader. Cartographers select what to include, choose symbols, and decide which distances or boundaries require emphasis. The same territory can therefore appear very different on maps designed for sailors, public-health officials, or military planners.\n\nThe problem becomes especially visible in historical maps of disputed territory. A boundary drawn as a solid line may suggest settled authority even when communities on the ground recognize overlapping claims. Conversely, leaving a road or settlement off a map may make an inhabited area seem empty. Such omissions are not necessarily deliberate deception; limited surveys, scale and intended audience also shape what is recorded.\n\nHistorians now examine maps alongside tax registers, travel accounts and local testimony. Comparing these sources can expose where a cartographic image reproduces an official perspective rather than a shared understanding. The disagreement itself may be informative: a mismatch between mapped borders and customary routes reveals how administrative categories interacted with everyday movement.\n\nDigital mapping has made it easier to combine sources and revise their presentation. Yet the ability to display more layers does not remove the need to interpret them. When two datasets use different definitions of a settlement or region, merging them may create an appearance of precision that their underlying evidence cannot support. Good maps can clarify uncertainties, but only if designers show what those uncertainties are.","stem":"Why does the author contrast maps made for sailors and public-health officials?","options":["To show that maps are always deliberately misleading.","To argue sailors require larger maps than officials.","To illustrate how a map’s purpose affects which details are represented.","To prove that historical maps contain no accurate information."],"answer":2,"explanation":"Different audiences lead to different design and information choices."},{"id":"R47","type":"academic","title":"Read an Academic Passage","groupTitle":"When Maps Become Arguments","passage":"A map appears to offer a view of space from above, but its apparent neutrality depends on many decisions made before it reaches a reader. Cartographers select what to include, choose symbols, and decide which distances or boundaries require emphasis. The same territory can therefore appear very different on maps designed for sailors, public-health officials, or military planners.\n\nThe problem becomes especially visible in historical maps of disputed territory. A boundary drawn as a solid line may suggest settled authority even when communities on the ground recognize overlapping claims. Conversely, leaving a road or settlement off a map may make an inhabited area seem empty. Such omissions are not necessarily deliberate deception; limited surveys, scale and intended audience also shape what is recorded.\n\nHistorians now examine maps alongside tax registers, travel accounts and local testimony. Comparing these sources can expose where a cartographic image reproduces an official perspective rather than a shared understanding. The disagreement itself may be informative: a mismatch between mapped borders and customary routes reveals how administrative categories interacted with everyday movement.\n\nDigital mapping has made it easier to combine sources and revise their presentation. Yet the ability to display more layers does not remove the need to interpret them. When two datasets use different definitions of a settlement or region, merging them may create an appearance of precision that their underlying evidence cannot support. Good maps can clarify uncertainties, but only if designers show what those uncertainties are.","stem":"What can a solid boundary line misleadingly imply?","options":["That territory is politically uncontested when local claims overlap.","That a survey was completed using satellites.","That a region is uninhabited.","That local residents never traveled across borders."],"answer":0,"explanation":"Solid boundaries may present contested authority as settled."},{"id":"R48","type":"academic","title":"Read an Academic Passage","groupTitle":"When Maps Become Arguments","passage":"A map appears to offer a view of space from above, but its apparent neutrality depends on many decisions made before it reaches a reader. Cartographers select what to include, choose symbols, and decide which distances or bou ncompatible definitions."},{"id":"R50","type":"academic","title":"Read an Academic Passage","groupTitle":"When Maps Become Arguments","passage":"A map appears to offer a view of space from above, but its apparent neutrality depends on many decisions made before it reaches a reader. Cartographers select what to include, choose symbols, and decide which distances or boundaries require emphasis. The same territory can therefore appear very different on maps designed for sailors, public-health officials, or military planners.\n\nThe problem becomes especially visible in historical maps of disputed territory. A boundary drawn as a solid line may suggest settled authority even when communities on the ground recognize overlapping claims. Conversely, leaving a road or settlement off a map may make an inhabited area seem empty. Such omissions are not necessarily deliberate deception; limited surveys, scale and intended audience also shape what is recorded.\n\nHistorians now examine maps alongside tax registers, travel accounts and local testimony. Comparing these sources can expose where a cartographic image reproduces an official perspective rather than a shared understanding. The disagreement itself may be informative: a mismatch between mapped borders and customary routes reveals how administrative categories interacted with everyday movement.\n\nDigital mapping has made it easier to combine sources and revise their presentation. Yet the ability to display more layers does not remove the need to interpret them. When two datasets use different definitions of a settlement or region, merging them may create an appearance of precision that their underlying evidence cannot support. Good maps can clarify uncertainties, but only if designers show what those uncertainties are.","stem":"Which statement best summarizes the author’s view?","options":["Historical maps should never be used in research.","The quality of a map depends primarily on its visual complexity.","Maps are selective interpretations whose choices and uncertainties require scrutiny.","Digital maps are always more trustworthy than printed ones."],"answer":2,"explanation":"Selection, purpose, omission, and uncertainty are the unifying issues."}],"listening":[{"id":"L01","type":"listen","title":"Listen and Choose a Response","group":"choose01","groupTitle":"Library Card","clip":"choose01","stem":"Choose the most appropriate response to the speaker.","options":["The database opened last summer.","You may need to sign out and reactivate your institutional account.","The journal publishes four issues each year.","My card is blue."],"answer":1,"explanation":"The appropriate response addresses the speaker’s actual request or problem: I renewed my library card online, but I still cannot access the journal database."},{"id":"L02","type":"listen","title":"Listen and Choose a Response","group":"choose02","groupTitle":"Project Materials","clip":"choose02","stem":"Choose the most appropriate response to the speaker.","options":["Could we disassemble part of it and rebuild it inside?","The exhibition opens in November.","I prefer visiting museums.","The room has two windows."],"answer":0,"explanation":"The appropriate response addresses the speaker’s actual request or problem: The model we built is too large to fit through the exhibition-room door."},{"id":"L03","type":"listen","title":"Listen and Choose a Response","group":"choose03","groupTitle":"Course Prerequisite","clip":"choose03","stem":"Choose the most appropriate response to the speaker.","options":["That professor gives excellent lectures.","We registered last year.","Check whether you have completed the prerequisite.","The website has a new logo."],"answer":2,"explanation":"The appropriate response addresses the speaker’s actual request or problem: The course website says enrollment is open, but it will not let me register."},{"id":"L04","type":"listen","title":"Listen and Choose a Response","group":"choose04","groupTitle":"Borrowed Tripod","clip":"choose04","stem":"Choose the most appropriate response to the speaker.","options":["The tripod has three legs.","I enjoy photographing landscapes.","Yesterday was a Tuesday.","You should email the office and arrange another return time."],"answer":3,"explanation":"The appropriate response addresses the speaker’s actual request or problem: I promised to return the tripod yesterday, but the photography office was closed."},{"id":"L05","type":"listen","title":"Listen and Choose a Response","group":"choose05","groupTitle":"Late Results","clip":"choose05","stem":"Choose the most appropriate response to the speaker.","options":["The water was collected near campus.","Would you like me to follow up with the technician?","The laboratory has two entrances.","The results were surprising last term."],"answer":1,"explanation":"The appropriate response addresses the speaker’s actual request or problem: The laboratory promised to send our water-test results by noon, but nothing has arrived."},{"id":"L06","type":"listen","title":"Listen and Choose a Response","group":"choose06","groupTitle":"Poster Revision","clip":"choose06","stem":"Choose the most appropriate response to the speaker.","options":["Then we should revise it to reflect the uncertainty.","The poster is printed on thick paper.","I am presenting next Friday.","The evidence is stored in the archive."],"answer":0,"explanation":"The appropriate response addresses the speaker’s actual request or problem: My supervisor thinks the conclusion on our poster is too strong for the evidence."},{"id":"L07","type":"listen","title":"Listen and Choose a Response","group":"choose07","groupTitle":"Exhibition Ticket","clip":"choose07","stem":"Choose the most appropriate response to the speaker.","options":["The gallery closes at seven.","Your friend studies literature.","The gallery has a new exhibition.","Student tickets admit one person, but guests can purchase their own."],"answer":3,"explanation":"The appropriate response addresses the speaker’s actual request or problem: Can I use my student ticket to bring a friend into the gallery?"},{"id":"L08","type":"listen","title":"Listen and Choose a Response","group":"choose08","groupTitle":"Unclear Instructions","clip":"choose08","stem":"Choose the most appropriate response to the speaker.","options":["The assignment is due tomorrow.","I summarized the article yesterday.","It might help to ask the instructor how the work will be assessed.","The article was very long."],"answer":2,"explanation":"The appropriate response addresses the speaker’s actual request or problem: I cannot tell whether the assignment requires a summary or a critical response."},{"id":"L09","type":"listen","title":"Listen and Choose a Response","group":"choose09","groupTitle":"Missed Shuttle","clip":"choose09","stem":"Choose the most appropriate response to the speaker.","options":["The app is installed on my phone.","You could report the discrepancy to the transport office.","The shuttle is electric.","I walked to campus yesterday."],"answer":1,"explanation":"The appropriate response addresses the speaker’s actual request or problem: The shuttle left a minute before the time shown on the campus app."},{"id":"L10","type":"listen","title":"Listen and Choose a Response","group":"choose10","groupTitle":"Lost Draft","clip":"choose10","stem":"Choose the most appropriate response to the speaker.","options":["Try checking the version history before editing it again.","The report is about ecology.","I shared a desk with Maya.","We discussed the topic last week."],"answer":0,"explanation":"The appropriate response addresses the speaker’s actual request or problem: I edited the report all afternoon, but the changes are missing from the shared document."},{"id":"L11","type":"listen","title":"Listen and Choose a Response","group":"choose11","groupTitle":"Quiet Study Room","clip":"choose11","stem":"Choose the most appropriate response to the speaker.","options":["They study architecture.","The room has six chairs.","Of course. I will remind them this is a quiet area.","The door was painted last month."],"answer":2,"explanation":"The appropriate response addresses the speaker’s actual request or problem: Could you ask the students next door to lower their voices?"},{"id":"L12","type":"listen","title":"Listen and Choose a Response","group":"choose12","groupTitle":"Research Interview","clip":"choose12","stem":"Choose the most appropriate response to the speaker.","options":["The recorder has fresh batteries.","We met last semester.","The interview is scheduled for Monday.","Then we should respect that and ask whether written notes are acceptable."],"answer":3,"explanation":"The appropriate response addresses the speaker’s actual request or problem: The participant agreed to speak with us but does not want to be recorded."},{"id":"L13","type":"listen","title":"Listen and Choose a Response","group":"choose13","groupTitle":"Equipment Loan","clip":"choose13","stem":"Choose the most appropriate response to the speaker.","options":["It uses an LED light.","Ask whether the equipment desk can approve an extension.","Microscopes are useful.","I returned mine last year."],"answer":1,"explanation":"The appropriate response addresses the speaker’s actual request or problem: I need the microscope for another day, but my borrowing period ends tonight."},{"id":"L14","type":"listen","title":"Listen and Choose a Response","group":"choose14","groupTitle":"Unfamiliar Term","clip":"choose14","stem":"Choose the most appropriate response to the speaker.","options":["Try asking during the question period for a definition.","The slides use a blue background.","The speaker arrives tomorrow.","I recognize the classroom."],"answer":0,"explanation":"The appropriate response addresses the speaker’s actual request or problem: The speaker mentioned a word I do not recognize, and I could not find it in the slides."},{"id":"L15","type":"listen","title":"Listen and Choose a Response","group":"choose15","groupTitle":"Schedule Conflict","clip":"choose15","stem":"Choose the most appropriate response to the speaker.","options":["Wednesday is a good day.","The first seminar has twenty students.","One of the rooms is very small.","You should contact the coordinators before deciding which to miss."],"answer":3,"explanation":"The appropriate response addresses the speaker’s actual request or problem: Both my seminars have moved to the same time on Wednesday."},{"id":"L16","type":"listen","title":"Listen and Choose a Response","group":"choose16","groupTitle":"Damaged Archive Box","clip":"choose16","stem":"Choose the most appropriate response to the speaker.","options":["The archives are on the ground floor.","I borrowed a box last month.","Do not separate them yourself; notify a conservator.","The pages are numbered."],"answer":2,"explanation":"The appropriate response addresses the speaker’s actual request or problem: This archival box looks damp, and some of the pages are sticking together."},{"id":"L17","type":"listen","title":"Listen and Choose a Response","group":"choose17","groupTitle":"Research Presentation","clip":"choose17","stem":"Choose the most appropriate response to the speaker.","options":["The results were collected in May.","Focus on the main finding and move supporting details to the handout.","The presentation starts at five.","I need new presentation software."],"answer":1,"explanation":"The appropriate response addresses the speaker’s actual request or problem: I am worried that I cannot explain all these results in five minutes."},{"id":"L18","type":"listen","title":"Listen to a Conversation","group":"conv01","groupTitle":"Museum Label Revision","clip":"conv01","stem":"Why did the curator return the exhibition labels?","options":["They contained unsupported claims about object origins.","They were printed in the wrong language.","They were too short to read.","The museum had canceled the exhibition."],"answer":0,"explanation":"Similar tool marks do not prove a common workshop, so the certainty is unjustified."},{"id":"L19","type":"listen","title":"Listen to a Conversation","group":"conv01","groupTitle":"Museum Label Revision","clip":"conv01","stem":"What does the staff member suggest saying about the objects?","options":["They definitely came from one workshop.","They were recently manufactured.","They may have originated in the same workshop.","Their provenance can never be researched."],"answer":2,"explanation":"The recommendation softens certainty to a possible attribution."},{"id":"L20","type":"listen","title":"Listen to a Conversation","group":"conv01","groupTitle":"Museum Label Revision","clip":"conv01","stem":"Why does the staff member encourage explaining the uncertainty?","options":["The gallery requires longer text for billing.","It can help visitors understand how interpretations are formed.","It means the museum need not display objects.","All visitors prefer technical terminology."],"answer":1,"explanation":"An explanation of uncertainty can reveal the research process."},{"id":"L21","type":"listen","title":"Listen to a Conversation","group":"conv01","groupTitle":"Museum Label Revision","clip":"conv01","stem":"What special labeling does the illustration require?","options":["A warning that photographs are prohibited.","The date of the museum opening.","A list of other exhibitors.","A clear indication that it is a reconstruction."],"answer":3,"explanation":"The drawing could otherwise be mistaken for documentary evidence."},{"id":"L22","type":"listen","title":"Listen to a Conversation","group":"conv01","groupTitle":"Museum Label Revision","clip":"conv01","stem":"What is the central principle guiding the revision?","options":["Present interpretation at a level of certainty justified by the evidence.","Avoid any explanations of archaeological objects.","Use only historical photographs in galleries.","Prefer visually attractive claims to qualified ones."],"answer":0,"explanation":"The dialogue consistently distinguishes evidence from interpretation."},{"id":"L23","type":"listen","title":"Listen to a Conversation","group":"conv02","groupTitle":"Coastal Sampling Permit","clip":"conv02","stem":"What caused the student’s original plan to become unsuitable?","options":["The sand was contaminated.","The nesting reserve boundary had been expanded.","The beach had been permanently closed to visitors.","The project topic had changed."],"answer":1,"explanation":"The expanded nesting area now overlaps two proposed sampling points."},{"id":"L24","type":"listen","title":"Listen to a Conversation","group":"conv02","groupTitle":"Coastal Sampling Permit","clip":"conv02","stem":"Why is the older field guide insufficient?","options":["Its map does not reflect a recent boundary change.","It contains no information about sand.","The library prohibits its use.","Its coordinates use a different time zone."],"answer":0,"explanation":"The new reserve map supersedes last year’s guide."},{"id":"L25","type":"listen","title":"Listen to a Conversation","group":"conv02","groupTitle":"Coastal Sampling Permit","clip":"conv02","stem":"What must happen before the student changes the sampling sites?","options":["The student must purchase new containers.","The protected dunes must be cleared.","The research project must be canceled.","The instructor must approve the revised sites."],"answer":3,"explanation":"The instructor’s approval is required before any collection in the new locations."},{"id":"L26","type":"listen","title":"Listen to a Conversation","group":"conv02","groupTitle":"Coastal Sampling Permit","clip":"conv02","stem":"What should accompany the proposed coordinates?","options":["A history of every past beach survey.","A list of all students on the course.","An explanation of how the revised sites answer the same research question.","A letter from the museum curator."],"answer":2,"explanation":"The instructor needs the scientific rationale alongside coordinates."},{"id":"L27","type":"listen","title":"Listen to a Conversation","group":"conv02","groupTitle":"Coastal Sampling Permit","clip":"conv02","stem":"What can the student do while awaiting approval?","options":["Collect only very small samples.","Visit the site for observation without removing material.","Collect samples only at night.","Ask another student to sample instead."],"answer":1,"explanation":"Observation is permitted, but collection requires written approval."},{"id":"L28","type":"listen","title":"Listen to a Conversation","group":"conv03","groupTitle":"Accessibility of a Conference Poster","clip":"conv03","stem":"Why was the poster flagged for revision?","options":["Its online diagrams were not sufficiently accessible.","Its research data had been falsified.","The poster had no title.","The conference changed its topic."],"answer":0,"explanation":"The review targets captions and figures that do not convey necessary information."},{"id":"L29","type":"listen","title":"Listen to a Conversation","group":"conv03","groupTitle":"Accessibility of a Conference Poster","clip":"conv03","stem":"What is wrong with the existing captions?","options":["They contain the wrong dates.","They describe a different project.","They merely repeat figure titles instead of explaining their content.","They are too detailed for the reviewer."],"answer":2,"explanation":"The reviewer wants meaningful descriptive explanations."},{"id":"L30","type":"listen","title":"Listen to a Conversation","group":"conv03","groupTitle":"Accessibility of a Conference Poster","clip":"conv03","stem":"What should the student add to the graph?","options":["A fourth color with no labels.","A larger file size only.","Photographs of the presenter.","Different line patterns or direct labels."],"answer":3,"explanation":"The graph must distinguish datasets without relying solely on color."},{"id":"L31","type":"listen","title":"Listen to a Conversation","group":"conv03","groupTitle":"Accessibility of a Conference Poster","clip":"conv03","stem":"What is the staff member’s point about enlarging the file?","options":["It will invalidate the figures.","Greater size helps legibility but does not solve color-dependent meaning.","It will remove the need for captions.","Every dataset must then be deleted."],"answer":1,"explanation":"Legibility and accessible encoding of information are distinct issues."},{"id":"L32","type":"listen","title":"Listen to an Announcement","group":"ann01","groupTitle":"Observatory Open Night","clip":"ann01","stem":"When will visitors be allowed to use the telescope?","options":["As soon as the doors open at seven.","After the safety orientation.","Only after midnight.","After the indoor demonstration ends."],"answer":1,"explanation":"Telescope access begins after the orientation talks."},{"id":"L33","type":"listen","title":"Listen to an Announcement","group":"ann01","groupTitle":"Observatory Open Night","clip":"ann01","stem":"What will happen if clouds prevent telescope observations?","options":["The entire event will be canceled.","Visitors will be sent home immediately.","The event will move indoors for an image-processing demonstration.","Visitors may climb to an alternative roof."],"answer":2,"explanation":"An indoor demonstration is the alternative plan."},{"id":"L34","type":"listen","title":"Listen to an Announcement","group":"ann01","groupTitle":"Observatory Open Night","clip":"ann01","stem":"What should visitors needing step-free access do?","options":["Use the north elevator and contact the team before Friday noon.","Bring a portable ramp without notifying organizers.","Use the roof stairs with an assistant.","Arrive only after the orientation."],"answer":0,"explanation":"The announcement gives both the elevator route and advance contact deadline."},{"id":"L35","type":"listen","title":"Listen to an Announcement","group":"ann01","groupTitle":"Observatory Open Night","clip":"ann01","stem":"Which item is prohibited on the roof?","options":["Handheld cameras.","Warm clothing.","Printed star charts.","Personal tripods."],"answer":3,"explanation":"The rooftop rules explicitly forbid personal tripods."},{"id":"L36","type":"listen","title":"Listen to an Announcement","group":"ann02","groupTitle":"Research Data Deposit Deadline","clip":"ann02","stem":"When is the dataset deadline?","options":["Wednesday at six p.m.","Friday at six p.m.","Next Monday at noon.","One hour after the written report."],"answer":0,"explanation":"Data deposit is due at 6 p.m. Wednesday, separate from the written report."},{"id":"L37","type":"listen","title":"Listen to an Announcement","group":"ann02","groupTitle":"Research Data Deposit Deadline","clip":"ann02","stem":"What must students do besides uploading a file?","options":["Pay a file-storage fee.","Attend an interview with the professor.","Provide a description of collection methods and privacy handling.","Send all recordings to classmates."],"answer":2,"explanation":"Submission requires collection-method and personal-data information."},{"id":"L38","type":"listen","title":"Listen to an Announcement","group":"ann02","groupTitle":"Research Data Deposit Deadline","clip":"ann02","stem":"How should restricted interview recordings be handled?","options":["Upload all unedited audio as public files.","Seek secure-deposit instructions instead of publicly uploading raw recordings.","Remove the project from the course.","Submit recordings directly to the student newspaper."],"answer":1,"explanation":"Restricted raw recordings require the research office’s secure procedure."},{"id":"L39","type":"listen","title":"Listen to an Announcement","group":"ann02","groupTitle":"Research Data Deposit Deadline","clip":"ann02","stem":"What if confirmation email does not arrive within one hour?","options":["Assume the written report was rejected.","Upload the same files repeatedly without checking.","Wait until the following Friday.","Check the dashboard and contact support."],"answer":3,"explanation":"The announcement explicitly provides this troubleshooting sequence."},{"id":"L40","type":"listen","title":"Listen to an Academic Talk","group":"talk01","groupTitle":"How Trees Register an Earlier Drought","clip":"talk01","stem":"What does the lecturer mean by “stress memory”?","options":["Conscious recollection of a past event.","A permanently inherited preference for dry soil.","Persistent physiological effects of earlier conditions.","The ability of a tree to predict weather accurately."],"answer":2,"explanation":"Stress memory denotes measurable persistent changes, not conscious remembrance."},{"id":"L41","type":"listen","title":"Listen to an Academic Talk","group":"talk01","groupTitle":"How Trees Register an Earlier Drought","clip":"talk01","stem":"Why are the leaf pores, or stomata, discussed?","options":["They regulate gas exchange and water loss, illustrating a possible lasting response.","They prevent every kind of plant disease.","They are only present in desert species.","They absorb nutrients directly from soil."],"answer":0,"explanation":"Stomata are a concrete example of altered drought response."},{"id":"L42","type":"listen","title":"Listen to an Academic Talk","group":"talk01","groupTitle":"How Trees Register an Earlier Drought","clip":"talk01","stem":"Why use comparable seedlings with different watering histories?","options":["To eliminate the need for further measurement.","To test whether prior exposure causes response differences rather than preexisting traits.","To make every seedling genetically identical after the experiment.","To show that roots are irrelevant to drought response."],"answer":1,"explanation":"Controlled histories help isolate environmental-history effects from confounding variables."},{"id":"L43","type":"listen","title":"Listen to an Academic Talk","group":"talk01","groupTitle":"How Trees Register an Earlier Drought","clip":"talk01","stem":"Which caution does the lecturer emphasize?","options":["Earlier drought always makes later drought harmless.","A tree’s age is the only important variable.","Stress memory has been found only in annual flowers.","Prior drought may help or harm depending on circumstances."],"answer":3,"explanation":"The final paragraph warns against assuming all prior stress is protective."},{"id":"L44","type":"listen","title":"Listen to an Academic Talk","group":"talk02","groupTitle":"Why Ancient Trade Routes Shift","clip":"talk02","stem":"What is the lecture’s main argument?","options":["Ancient merchants always followed the shortest possible path.","Trade routes should be understood as flexible networks rather than fixed lines.","Archaeological maps cannot represent ancient travel.","Every inland trade route required government supervision."],"answer":1,"explanation":"The whole lecture emphasizes variable corridors shaped by conditions."},{"id":"L45","type":"listen","title":"Listen to an Academic Talk","group":"talk02","groupTitle":"Why Ancient Trade Routes Shift","clip":"talk02","stem":"Why might merchants prefer a longer route?","options":["It offered reliable wells and safer stopping places.","It had no settlements.","It required more travel taxes in every case.","It was always approved by every government."],"answer":0,"explanation":"Access to water and safe stops can outweigh distance."},{"id":"L46","type":"listen","title":"Listen to an Academic Talk","group":"talk02","groupTitle":"Why Ancient Trade Routes Shift","clip":"talk02","stem":"What does the lecturer suggest about surviving roadside artifacts?","options":["They always identify the only road ever used.","They prove all travelers were merchants.","They eliminate the need for written evidence.","They may overrepresent routes with structures or official monitoring."],"answer":3,"explanation":"Preservation and official record-keeping create uneven evidence."},{"id":"L47","type":"listen","title":"Listen to an Academic Talk","group":"talk02","groupTitle":"Why Ancient Trade Routes Shift","clip":"talk02","stem":"What role should terrain-based travel models play?","options":["They replace the need for archaeological investigation.","They prove a route regardless of historical context.","They help compare plausible pathways alongside other evidence.","They indicate which ancient city was culturally superior."],"answer":2,"explanation":"Models generate and compare plausible explanations but do not replace evidence."}],"writing":[{"id":"W01","type":"sentence","title":"Build a Sentence","context":"Express an exception to the conservation rules.","answer":["The removal of a sample","is permitted","only when","written authorization","has been granted."],"tokens":["is permitted","only when","has been granted.","The removal of a sample","written authorization"],"explanation":"Only when marks a restriction in the predicate without sentence-initial inversion."},{"id":"W02","type":"sentence","title":"Build a Sentence","context":"Explain why the result was initially doubted.","answer":["The team","questioned the finding","because","the earlier measurements","could not be reproduced."],"tokens":["The team","could not be reproduced.","because","the earlier measurements","questioned the finding"],"explanation":"The team questioned the finding because the earlier measurements could not be reproduced."},{"id":"W03","type":"sentence","title":"Build a Sentence","context":"Describe the source of uncertainty.","answer":["The available observations","remain insufficient","to determine","whether the change is permanent."],"tokens":["to determine","remain insufficient","whether the change is permanent.","The available observations"],"explanation":"The available observations remain insufficient to determine whether the change is permanent."},{"id":"W04","type":"sentence","title":"Build a Sentence","context":"Report what followed the equipment test.","answer":["Not until","the calibration error","had been corrected","did the instrument","produce consistent readings."],"tokens":["had been corrected","Not until","did the instrument","produce consistent readings.","the calibration error"],"explanation":"Sentence-initial Not until requires did + subject + base verb; subordinate clause uses past perfect passive."},{"id":"W05","type":"sentence","title":"Build a Sentence","context":"Describe a conditional result.","answer":["Had the researchers","used a larger control group,","the unexpected variation","might have been avoided."],"tokens":["might have been avoided.","Had the researchers","the unexpected variation","used a larger control group,"],"explanation":"Inverted third conditional Had the researchers used... variation might have been avoided."},{"id":"W06","type":"sentence","title":"Build a Sentence","context":"Explain a research recommendation.","answer":["The review panel","recommended","that each deviation","be documented","before any samples were discarded."],"tokens":["be documented","recommended","before any samples were discarded.","that each deviation","The review panel"],"explanation":"Mandative subjunctive: recommended that each deviation be documented."},{"id":"W07","type":"sentence","title":"Build a Sentence","context":"State a contrast about a map.","answer":["Although the map","appeared precise,","its underlying estimates","remained uncertain."],"tokens":["appeared precise,","its underlying estimates","remained uncertain.","Although the map"],"explanation":"Although + dependent clause followed by contrasting independent clause."},{"id":"W08","type":"sentence","title":"Build a Sentence","context":"Explain the impact of improved records.","answer":["Only after the descriptions","had been revised","could the archive","allow public access."],"tokens":["could the archive","allow public access.","Only after the descriptions","had been revised"],"explanation":"Only after + clause requires subject–auxiliary inversion in main clause."},{"id":"W09","type":"sentence","title":"Build a Sentence","context":"Express a relationship between clarity and comparison.","answer":["The clearer","the definitions are,","the easier it becomes","to evaluate","the differences."],"tokens":["the differences.","the easier it becomes","to evaluate","the definitions are,","The clearer"],"explanation":"Correlative comparative: The clearer ..., the easier ... ."},{"id":"W10","type":"sentence","title":"Build a Sentence","context":"State a qualified conclusion.","answer":["The results","can be compared","provided that","the samples were gathered","under similar conditions."],"tokens":["provided that","can be compared","the samples were gathered","under similar conditions.","The results"],"explanation":"Provided that introduces the limiting condition under which comparison is valid."},{"id":"W11","type":"email","title":"Write an Email","timeHint":"Suggested time: 7 minutes","prompt":"You reserved a place in a university archive digitization workshop, but you have received two conflicting emails about whether participants must bring their own laptops. The registration fee has already been paid, and you need to prepare before traveling. Write an email to the workshop organizer. Explain the conflicting information; ask what equipment will be provided and what you must bring; and request confirmation before the workshop begins on Friday morning.","positions":[],"checks":["Identify the reservation and the conflicting laptop instructions.","Ask what equipment the organizer provides and what you need to bring.","Request clarification before Friday morning.","Maintain a clear and polite email tone."]},{"id":"W12","type":"discussion","title":"Write for an Academic Discussion","timeHint":"Suggested time: 10 minutes","prompt":"Professor Lin: “Some universities require students to make their research notes and preliminary data accessible to the class, rather than submitting only a final paper. Supporters believe that sharing the process improves transparency and collaboration. Critics worry that early, unfinished ideas may be misunderstood or copied. Should university courses routinely require students to share their research process with classmates? Explain your reasoning.”","positions":[["Student A — Avery","I support sharing early research materials. When students can see each other’s methods and mistakes, they learn more than they would from polished final papers alone. Openness may also encourage constructive feedback."],["Student B — Priya","I am concerned that mandatory sharing could discourage experimentation. Students need room to test uncertain ideas without worrying that a draft will be judged as a finished claim or reused without acknowledgment."]],"checks":["Take a clear position on routine mandatory sharing.","Respond to at least one classmate’s reasoning.","Support the argument with a specific example or practical implication.","Use clear academic English and acknowledge relevant conditions or tradeoffs."]}],"clips":{"choose01":{"title":"Library Card","kind":"short response","segments":[{"role":"n","text":"I renewed my library card online, but I still cannot access the journal database."}],"transcript":"I renewed my library card online, but I still cannot access the journal database."},"choose02":{"title":"Project Materials","kind":"short response","segments":[{"role":"n","text":"The model we built is too large to fit through the exhibition-room door."}],"transcript":"The model we built is too large to fit through the exhibition-room door."},"choose03":{"title":"Course Prerequisite","kind":"short response","segments":[{"role":"n","text":"The course website says enrollment is open, but it will not let me register."}],"transcript":"The course website says enrollment is open, but it will not let me register."},"choose04":{"title":"Borrowed Tripod","kind":"short response","segments":[{"role":"n","text":"I promised to return the tripod yesterday, but the photography office was closed."}],"transcript":"I promised to return the tripod yesterday, but the photography office was closed."},"choose05":{"title":"Lat ],"transcript":"The participant agreed to speak with us but does not want to be recorded."},"choose13":{"title":"Equipment Loan","kind":"short response","segments":[{"role":"n","text":"I need the microscope for another day, but my borrowing period ends tonight."}],"transcript":"I need the microscope for another day, but my borrowing period ends tonight."},"choose14":{"title":"Unfamiliar Term","kind":"short response","segments":[{"role":"n","text":"The speaker mentioned a word I do not recognize, and I could not find it in the slides."}],"transcript":"The speaker mentioned a word I do not recognize, and I could not find it in the slides."},"choose15":{"title":"Schedule Conflict","kind":"short response","segments":[{"role":"n","text":"Both my seminars have moved to the same time on Wednesday."}],"transcript":"Both my seminars have moved to the same time on Wednesday."},"choose16":{"title":"Damaged Archive Box","kind":"short response","segments":[{"role":"n","text":"This archival box looks damp, and some of the pages are sticking together."}],"transcript":"This archival box looks damp, and some of the pages are sticking together."},"choose17":{"title":"Research Presentation","kind":"short response","segments":[{"role":"n","text":"I am worried that I cannot explain all these results in five minutes."}],"transcript":"I am worried that I cannot explain all these results in five minutes."},"conv01":{"title":"Museum Label Revision","kind":"conversation","segments":[{"role":"A","text":"I have drafted the wall labels for our exhibition, but the curator returned nearly all of them."},{"role":"B","text":"Did the curator say what needed to change?"},{"role":"A","text":"She said I described several objects as definitely belonging to the same workshop. Our evidence only shows similar tool marks."},{"role":"B","text":"Then the labels should distinguish observation from attribution. You can say the objects may have been produced in the same workshop."},{"role":"A","text":"I am worried that too much uncertainty will make the exhibition confusing."},{"role":"B","text":"You could explain why the attribution is uncertain. Visitors often appreciate learning how researchers draw conclusions."},{"role":"A","text":"There is also an illustration of the workshop in our draft."},{"role":"B","text":"If it is a reconstruction, label it clearly. Otherwise people might think it is a historical photograph."},{"role":"A","text":"So I should revise the claims and mark the reconstruction as speculative?"},{"role":"B","text":"Exactly. Keep the evidence visible, even when the interpretation is provisional."}],"transcript":"A: I have drafted the wall labels for our exhibition, but the curator returned nearly all of them.\nB: Did the curator say what needed to change?\nA: She said I described several objects as definitely belonging to the same workshop. Our evidence only shows similar tool marks.\nB: Then the labels should distinguish observation from attribution. You can say the objects may have been produced in the same workshop.\nA: I am worried that too much uncertainty will make the exhibition confusing.\nB: You could explain why the attribution is uncertain. Visitors often appreciate learning how researchers draw conclusions.\nA: There is also an illustration of the workshop in our draft.\nB: If it is a reconstruction, label it clearly. Otherwise people might think it is a historical photograph.\nA: So I should revise the claims and mark the reconstruction as speculative?\nB: Exactly. Keep the evidence visible, even when the interpretation is provisional."},"conv02":{"title":"Coastal Sampling Permit","kind":"conversation","segments":[{"role":"A","text":"I am planning to collect sand samples along the eastern beach for my final project."},{"role":"B","text":"Have you checked which parts of the beach are within the protected nesting area?"},{"role":"A","text":"I saw the protected zone on an old map, but the university website has a different boundary."},{"role":"B","text":"The nesting area was extended this spring. Use the updated reserve map, not the one in last year’s field guide."},{"role":"A","text":"That removes two of my planned sampling points. Can I move them farther down the beach?"},{"role":"B","text":"Possibly, but your instructor must approve revised sites before you collect anything. Some nearby dunes are also protected."},{"role":"A","text":"Would it help if I photographed the proposed locations and sent their coordinates?"},{"role":"B","text":"Yes. Send the coordinates with a short explanation of how the new sites still address your research question."},{"role":"A","text":"Should I wait for the approval email before going to the beach?"},{"role":"B","text":"You can visit to observe, but do not remove samples until you have written approval."}],"transcript":"A: I am planning to collect sand samples along the eastern beach for my final project.\nB: Have you checked which parts of the beach are within the protected nesting area?\nA: I saw the protected zone on an old map, but the university website has a different boundary.\nB: The nesting area was extended this spring. Use the updated reserve map, not the one in last year’s field guide.\nA: That removes two of my planned sampling points. Can I move them farther down the beach?\nB: Possibly, but your instructor must approve revised sites before you collect anything. Some nearby dunes are also protected.\nA: Would it help if I photographed the proposed locations and sent their coordinates?\nB: Yes. Send the coordinates with a short explanation of how the new sites still address your research question.\nA: Should I wait for the approval email before going to the beach?\nB: You can visit to observe, but do not remove samples until you have written approval."},"conv03":{"title":"Accessibility of a Conference Poster","kind":"conversation","segments":[{"role":"A","text":"Our conference poster uses several diagrams, but the accessibility reviewer says the online version needs revisions."},{"role":"B","text":"Are the diagrams labeled with descriptions?"},{"role":"A","text":"They have captions, but the reviewer says the captions only repeat the titles."},{"role":"B","text":"Add descriptions of what the figures demonstrate, especially the trends that matter to your argument."},{"role":"A","text":"One graph distinguishes three datasets only by color."},{"role":"B","text":"That is another issue. Use different line patterns or direct labels as well."},{"role":"A","text":"Would enlarging the file solve the problem?"},{"role":"B","text":"It may help readability, but size alone will not communicate information that depends entirely on color."},{"role":"A","text":"I will revise the descriptions and the graph before resubmitting."}],"transcript":"A: Our conference poster uses several diagrams, but the accessibility reviewer says the online version needs revisions.\nB: Are the diagrams labeled with descriptions?\nA: They have captions, but the reviewer says the captions only repeat the titles.\nB: Add descriptions of what the figures demonstrate, especially the trends that matter to your argument.\nA: One graph distinguishes three datasets only by color.\nB: That is another issue. Use different line patterns or direct labels as well.\nA: Would enlarging the file solve the problem?\nB: It may help readability, but size alone will not communicate information that depends entirely on color.\nA: I will revise the descriptions and the graph before resubmitting."},"ann01":{"title":"Observatory Open Night","kind":"announcement","segments":[{"role":"n","text":"Good evening. The astronomy department will host its public observing session this Friday on the roof of the east science building. Doors open at seven, and short orientation talks begin at seven fifteen. The rooftop telescope is available only after the orientation because visitors must learn how to move safely around the equipment. If clouds prevent observing, the event will continue indoors with a demonstration of astronomical image processing. Guests who require step-free access should use the north elevator and contact the event team before noon on Friday. Personal tripods are not permitted on the roof, but handheld cameras are welcome."}],"transcript":"Good evening. The astronomy department will host its public observing session this Friday on the roof of the east science building. Doors open at seven, and short orientation talks begin at seven fifteen. The rooftop telescope is available only after the orientation because visitors must learn how to move safely around the equipment. If clouds prevent observing, the event will continue indoors with a demonstration of astronomical image processing. Guests who require step-free access should use the north elevator and contact the event team before noon on Friday. Personal tripods are not permitted on the roof, but handheld cameras are welcome."},"ann02":{"title":"Research Data Deposit Deadline","kind":"announcement","segments":[{"role":"n","text":"Attention students submitting capstone projects. The university data repository will accept project datasets until six p.m. next Wednesday. Uploading a file does not complete the submission. Students must also provide a description of how the data were collected and whether any personal information has been removed. Projects involving restricted interviews should not upload raw recordings; instead, submit a description of the dataset and contact the research office for secure deposit instructions. Submissions completed by the deadline will receive an automated confirmation email. If you do not receive that email within one hour, check the repository dashboard and contact support. The written project report has a separate deadline on Friday."}],"transcript":"Attention students submitting capstone projects. The university data repository will accept project datasets until six p.m. next Wednesday. Uploading a file does not complete the submission. Students must also provide a description of how the data were collected and whether any personal information has been removed. Projects involving restricted interviews should not upload raw recordings; instead, submit a description of the dataset and contact the research office for secure deposit instructions. Submissions completed by the deadline will receive an automated confirmation email. If you do not receive that email within one hour, check the repository dashboard and contact support. The written project report has a separate deadline on Friday."},"talk01":{"title":"How Trees Register an Earlier Drought","kind":"academic talk","segments":[{"role":"n","text":"A plant cannot remember an event in the way a person does, but its response to earlier conditions can influence how it reacts later. Consider a tree that experiences a moderate period of drought. Even after water returns, some of its physiological adjustments may persist."},{"role":"n","text":"For example, tiny pores on leaves, called stomata, regulate both gas exchange and water loss. During drought, plants often reduce the opening of these pores. In certain species, patterns of stomatal behavior or related chemical signals remain altered after the immediate stress has ended. Researchers sometimes describe this persistence as stress memory, though the term is a metaphor for measurable biological changes."},{"role":"n","text":"A challenge is distinguishing the effects of past drought from differences that existed before the experiment. Trees growing in dry soil may already differ in age, root depth or genetic background from trees in wetter soil. Controlled experiments can expose comparable seedlings to different watering histories and then test how they respond to a second drought."},{"role":"n","text":"The results do not imply that prior stress always improves survival. A previous drought may prepare a plant to conserve water more efficiently, but it can also deplete energy reserves and reduce growth. The broader question is how environmental history shapes an organism’s present condition, and under which circumstances that history becomes beneficial or costly."}],"transcript":"A plant cannot remember an event in the way a person does, but its response to earlier conditions can influence how it reacts later. Consider a tree that experiences a moderate period of drought. Even after water returns, some of its physiological adjustments may persist.\nFor example, tiny pores on leaves, called stomata, regulate both gas exchange and water loss. During drought, plants often reduce the opening of these pores. In certain species, patterns of stomatal behavior or related chemical signals remain altered after the immediate stress has ended. Researchers sometimes describe this persistence as stress memory, though the term is a metaphor for measurable biological changes.\nA challenge is distinguishing the effects of past drought from differences that existed before the experiment. Trees growing in dry soil may already differ in age, root depth or genetic background from trees in wetter soil. Controlled experiments can expose comparable seedlings to different watering histories and then test how they respond to a second drought.\nThe results do not imply that prior stress always improves survival. A previous drought may prepare a plant to conserve water more efficiently, but it can also deplete energy reserves and reduce growth. The broader question is how environmental history shapes an organism’s present condition, and under which circumstances that history becomes beneficial or costly."},"talk02":{"title":"Why Ancient Trade Routes Shift","kind":"academic talk","segments":[{"role":"n","text":"It is tempting to imagine ancient trade routes as fixed lines connecting major cities. In practice, routes often consisted of networks of alternatives, changing with political authority, seasonal conditions and the availability of water or safe passage."},{"role":"n","text":"Consider merchants crossing a dry inland region. A route that was shorter on a map might require a long distance between wells. A longer route with reliable stopping places could therefore be quicker or safer in practice. Archaeologists find evidence of such choices in roadside settlements, fragments of imported pottery and records of taxes collected along different corridors."},{"role":"n","text":"But the survival of these materials is uneven. Stone buildings may leave visible traces for centuries, while temporary camps can disappear almost entirely. Written records also tend to describe routes monitored by governments rather than every path used by local travelers. A dense cluster of surviving artifacts does not automatically prove that all trade followed that line."},{"role":"n","text":"Researchers increasingly combine archaeological evidence with models of terrain and travel cost. Such models can suggest plausible corridors, but they are not a substitute for historical evidence. The purpose is to compare multiple explanations, not to draw a single perfect road across the past. Trade routes were shaped by practical decisions made under changing constraints."}],"transcript":"It is tempting to imagine ancient trade routes as fixed lines connecting major cities. In practice, routes often consisted of networks of alternatives, changing with political authority, seasonal conditions and the availability of water or safe passage.\nConsider merchants crossing a dry inland region. A route that was shorter on a map might require a long distance between wells. A longer route with reliable stopping places could therefore be quicker or safer in practice. Archaeologists find evidence of such choices in roadside settlements, fragments of imported pottery and records of taxes collected along different corridors.\nBut the survival of these materials is uneven. Stone buildings may leave visible traces for centuries, while temporary camps can disappear almost entirely. Written records also tend to describe routes monitored by governments rather than every path used by local travelers. A dense cluster of surviving artifacts does not automatically prove that all trade followed that line.\nResearchers increasingly combine archaeological evidence with models of terrain and travel cost. Such models can suggest plausible corridors, but they are not a substitute for historical evidence. The purpose is to compare multiple explanations, not to draw a single perfect road across the past. Trade routes were shaped by practical decisions made under changing constraints."}}};
