 Linguists rely on written records and oral {4} to reconstruct these changes, but neither source provides a complete history. A word's earliest documented appearance does not {5} establish when people began saying it. Researchers must therefore draw {6} conclusions from incomplete evidence.","index":6,"prefix":"tent","answer":"tentative","explanation":"Tentative conclusions remain open to revision.","title":"Complete the Words"},{"id":"R31","type":"daily","title":"Read in Daily Life","groupTitle":"Student Orchestra Rehearsal","passage":"Due to a maintenance inspection, Tuesday’s orchestra rehearsal will take place in the north auditorium instead of the music building. String players should arrive by 5:20 p.m. to arrange chairs; wind players may arrive at the usual 5:40 p.m. time. Instrument lockers in the music building remain accessible until 6 p.m. Rehearsal will still end at 7:30 p.m.","stem":"Which musicians must arrive earlier than usual?","options":["All orchestra members.","String players.","Wind players.","Only percussionists."],"answer":1,"explanation":"String players are specifically asked to arrive at 5:20 to arrange chairs."},{"id":"R32","type":"daily","title":"Read in Daily Life","groupTitle":"Campus Bicycle Rental","passage":"Students may borrow campus bicycles for up to four hours. Reservations made online are held for twenty minutes after the requested pickup time. Helmets are provided at no cost, but riders must show a current student ID. A late-return fee applies only when a bicycle is returned more than fifteen minutes past the scheduled return time.","stem":"A student arrives 25 minutes after the reserved pickup time. What is the most likely consequence?","options":["The reservation may no longer be held.","A late-return fee is charged immediately.","The student must purchase a helmet.","The bicycle is automatically reserved for another four hours."],"answer":0,"explanation":"Online bookings are held only twenty minutes after pickup time."},{"id":"R33","type":"daily","title":"Read in Daily Life","groupTitle":"Research Participant Sign-up","passage":"Volunteers for the memory study must be at least eighteen years old and cannot have participated in its pilot phase. Sessions last forty minutes. Participants may withdraw at any point without losing the travel reimbursement, but reimbursement is provided only after attending the initial orientation. Please bring a photo ID to verify eligibility.","stem":"Who is eligible to participate?","options":["A seventeen-year-old who has never joined the study.","An adult who completed the pilot phase.","A nineteen-year-old who did not join the pilot phase.","An adult who refuses identity verification."],"answer":2,"explanation":"Participants must be adults, have no pilot participation, and bring a photo ID."},{"id":"R34","type":"daily","title":"Read in Daily Life","groupTitle":"Digital Archive Access","passage":"The library has digitized several local newspapers. Files dated before 1950 can be downloaded without an account. More recent issues may be read on library computers, but downloading them requires special authorization. Visitors conducting academic research can apply for access; decisions are usually issued within three working days.","stem":"What is true about a newspaper issue published in 1975?","options":["Anyone can download it without an account.","It is unavailable to visitors.","It must be requested by postal mail.","A visitor can read it on a library computer."],"answer":3,"explanation":"Issues after 1950 may be read on library computers but need authorization to download."},{"id":"R35","type":"daily","title":"Read in Daily Life","groupTitle":"Laboratory Safety Update","passage":"Anyone using the chemistry laboratory next semester must complete a revised safety module by November 12. Students who completed last year’s module are not exempt. The online quiz can be attempted twice; students who fail both attempts must schedule an in-person review. Lab access will be suspended on November 13 for anyone without a passing record.","stem":"What must a returning student do?","options":["Complete the revised module despite previous training.","Wait until November 13 to take the quiz.","Attend an in-person review before attempting the quiz.","Obtain an exemption from the laboratory director."],"answer":0,"explanation":"Last year’s completion does not exempt a student from the revised module."},{"id":"R36","type":"daily","title":"Read in Daily Life","groupTitle":"Photography Exhibition Delivery","passage":"Artists participating in the student photography exhibition should bring framed prints to Gallery 2 between 9 a.m. and noon on Thursday. Works arriving later will be accepted only if the exhibition coordinator approved an extension in writing before Wednesday. The gallery provides labels but does not provide packaging or transportation.","stem":"When can an artist deliver a framed print on Thursday afternoon?","options":["Whenever the gallery is open.","Only with prior written approval for an extension.","If the print is already labeled.","Only if a volunteer transports it."],"answer":1,"explanation":"Late acceptance depends on written approval before Wednesday."},{"id":"R37","type":"daily","title":"Read in Daily Life","groupTitle":"Dining Hall Allergy Notice","passage":"The west dining hall will replace its regular sesame dressing for one week while suppliers investigate a labeling error. Ingredients for all replacement sauces are posted at the serving station. Students with serious allergies should speak to staff before ordering, even if a dish has been offered previously.","stem":"What should a student with a serious allergy do?","options":["Assume previously served dishes are unchanged.","Avoid every dining hall meal for a week.","Check with dining staff before ordering.","Request a supplier investigation personally."],"answer":2,"explanation":"The notice explicitly instructs students with serious allergies to consult staff."},{"id":"R38","type":"daily","title":"Read in Daily Life","groupTitle":"Graduate Seminar Registration","passage":"Enrollment in the advanced seminar is limited to twelve students. Doctoral candidates in the department receive priority until Friday at noon; remaining seats will then be released to other graduate students. Joining the waiting list does not guarantee admission, and requests for exceptions must be sent to the instructor rather than the registrar.","stem":"What happens after Friday at noon?","options":["All seminar seats are canceled.","The waiting list automatically becomes the enrollment list.","Registration is limited to doctoral candidates.","Available seats may be offered to other graduate students."],"answer":3,"explanation":"Seats not taken by priority doctoral students are released to other graduate students."},{"id":"R39","type":"daily","title":"Read in Daily Life","groupTitle":"Campus Observatory Visit","passage":"The public observatory session will take place Saturday at 8:30 p.m. if the sky is sufficiently clear. Tickets remain valid for the rescheduled date if the session is canceled because of weather. Visitors should check the status page after 5 p.m. on Saturday. Tickets cannot be exchanged for a different event.","stem":"If clouds force cancellation, what happens to tickets?","options":["They remain valid for the rescheduled session.","They are exchanged for any other campus event.","They must be purchased again at full price.","They are valid only on the original Saturday."],"answer":0,"explanation":"Weather cancellation preserves ticket validity for the rescheduled observatory session."},{"id":"R40","type":"daily","title":"Read in Daily Life","groupTitle":"Student Travel Assistance","passage":"The travel assistance office can reimburse train tickets purchased after a conference invitation has been confirmed. Applicants must submit receipts and a brief account of the event within ten working days of returning. Taxi expenses require advance approval except when no public transport is operating. Personal sightseeing expenses are never reimbursable.","stem":"Which taxi expense might be reimbursed without advance approval?","options":["A ride taken for convenience during the day.","A ride when no public transportation was operating.","A ride to a sightseeing destination.","A ride without any receipt or documentation."],"answer":1,"explanation":"Taxi rides are exempt from advance approval only if no public transport is operating."},{"id":"R41","type":"academic","title":"Read an Academic Passage","groupTitle":"Why Sand Dunes Move","passage":"At the edge of a sandy coast, dunes seem like permanent hills, yet they are continuously reshaped by wind and vegetation. When grains move inland, they may accumulate around grasses whose stems slow the airflow. Over time, roots stabilize the sand, making it easier for additional plants to establish. The resulting dune can protect the land behind it from waves during moderate storms.\n\nThis protection is never absolute. During a powerful storm, water may cut through a dune, carry sand offshore, or deposit it farther inland. Such changes are sometimes interpreted as evidence that a beach is deteriorating. However, a coastline can recover sand naturally over months or years, and the location of the dunes may shift without the total supply of sediment disappearing.\n\nEngineers have traditionally attempted to hold dunes in a fixed position by building walls or erecting barriers. These structures can protect certain facilities in the short term, but they may also interrupt the movement of sand that maintains nearby beaches. Researchers increasingly recommend monitoring sediment exchange across an entire coastal system instead of judging success by whether one dune stays unchanged. In some locations, moving buildings away from the most exposed areas allows the shoreline more space to evolve.","stem":"What role do grasses play in early dune development?","options":["They prevent any sand from moving.","They reduce airflow and allow sand to accumulate.","They increase wave height during storms.","They dissolve minerals in the sand."],"answer":1,"explanation":"Vegetation slows the wind, allowing sand to gather around stems."},{"id":"R42","type":"academic","title":"Read an Academic Passage","groupTitle":"Why Sand Dunes Move","passage":"At the edge of a sandy coast, dunes seem like permanent hills, yet they are continuously reshaped by wind and vegetation. When grains move inland, they may accumulate around grasses whose stems slow the airflow. Over time, roots stabilize the sand, making it easier for additional plants to establish. The resulting dune can protect the land behind it from waves during moderate storms.\n\nThis protection is never absolute. During a powerful storm, water may cut through a dune, carry sand offshore, or deposit it farther inland. Such changes are sometimes interpreted as evidence that a beach is deteriorating. However, a coastline can recover sand naturally over months or years, and the location of the dunes may shift without the total supply of sediment disappearing.\n\nEngineers have traditionally attempted to hold dunes in a fixed position by building walls or erecting barriers. These structures can protect certain facilities in the short term, but they may also interrupt the movement of sand that maintains nearby beaches. Researchers increasingly recommend monitoring sediment exchange across an entire coastal system instead of judging success by whether one dune stays unchanged. In some locations, moving buildings away from the most exposed areas allows the shoreline more space to evolve.","stem":"Why does the author mention natural recovery after storms?","options":["To establish that severe storms cannot affect dunes.","To argue that all beaches return to their exact original position.","To show that visible change is not always permanent loss of sediment.","To claim that restoration work is unnecessary everywhere."],"answer":2,"explanation":"The passage warns against equating changed dune location with permanent sediment loss."},{"id":"R43","type":"academic","title":"Read an Academic Passage","groupTitle":"Why Sand Dunes Move","passage":"At the edge of a sandy coast, dunes seem like permanent hills, yet they are continuously reshaped by wind and vegetation. When grains move inland, they may accumulate around grasses whose stems slow the airflow. Over time, roots stabilize the sand, making it easier for additional plants to establish. The resulting dune can protect the land behind it from waves during moderate storms.\n\nThis protection is never absolute. During a powerful storm, water may cut through a dune, carry sand offshore, or deposit it farther inland. Such changes are sometimes interpreted as evidence that a beach is deteriorating. However, a coastline can recover sand naturally over months or years, and the location of the dunes may shift without the total supply of sediment disappearing.\n\nEngineers have traditionally attempted to hold dunes in a fixed position by building walls or erecting barriers. These structures can protect certain facilities in the short term, but they may also interrupt the movement of sand that maintains nearby beaches. Researchers increasingly recommend monitoring sediment exchange across an entire coastal system instead of judging success by whether one dune stays unchanged. In some locations, moving buildings away from the most exposed areas allows the shoreline more space to evolve.","stem":"What potential limitation of fixed barriers is identified?","options":["They may disrupt the movement of sand sustaining adjacent beaches.","They always accelerate the growth of coastal vegetation.","They eliminate the need for monitoring.","They guarantee complete protection against storms."],"answer":0,"explanation":"Barriers can interrupt movement of sand to neighboring areas."},{"id":"R44","type":"academic","title":"Read an Academic Passage","groupTitle":"Why Sand Dunes Move","passage":"At the edge of a sandy coast, dunes seem like permanent hills, yet they are continuously reshaped by wind and vegetation. When grains move inland, they may accumulate around grasses whose stems slow the airflow. Over time, roots stabilize the sand, making it easier for additional plants to establish. The resulting dune can protect the land behind it from waves during moderate storms.\n\nThis protection is never absolute. During a powerful storm, water may cut through a dune, carry sand offshore, or deposit it farther inland. Such changes are sometimes interpreted as evidence that a beach is deteriorating. However, a coastline can recover sand naturally over months or years, and the location of the dunes may shift without the total supply of sediment disappearing.\n\nEngineers have traditionally attempted to hold dunes in a fixed position by building walls or erecting barriers. These structures can protect certain facilities in the short term, but they may also interrupt the movement of sand that maintains nearby beaches. Researchers increasingly recommend monitoring sediment exchange across an entire coastal system instead of judging success by whether one dune stays unchanged. In some locations, moving buildings away from the most exposed areas allows the shoreline more space to evolve.","stem":"What can be inferred about relocating buildings?","options":["It changes the wind direction at sea.","It prevents storms from entering the region.","It is appropriate only on coasts without dunes.","It may reduce pressure to keep a naturally moving shoreline fixed."],"answer":3,"explanation":"Moving structures away can allow coastal change without forcing the dune to remain stationary."},{"id":"R45","type":"academic","title":"Read an Academic Passage","groupTitle":"Why Sand Dunes Move","passage":"At the edge of a sandy coast, dunes seem like permanent hills, yet they are continuously reshaped by wind and vegetation. When grains move inland, they may accumulate around grasses whose stems slow the airflow. Over time, roots stabilize the sand, making it easier for additional plants to establish. The resulting dune can protect the land behind it from waves during moderate storms.\n\nThis protection is never absolute. During a powerful storm, water may cut through a dune, carry sand offshore, or deposit it farther inland. Such changes are sometimes interpreted as evidence that a beach is deteriorating. However, a coastline can recover sand naturally over months or years, and the location of the dunes may shift without the total supply of sediment disappearing.\n\nEngineers have traditionally attempted to hold dunes in a fixed position by building walls or erecting barriers. These structures can protect certain facilities in the short term, but they may also interrupt the movement of sand that maintains nearby beaches. Researchers increasingly recommend monitoring sediment exchange across an entire coastal system instead of judging success by whether one dune stays unchanged. In some locations, moving buildings away from the most exposed areas allows the shoreline more space to evolve.","stem":"Which statement best captures the central argument?","options":["Every change to a dune indicates long-term erosion.","Coastal dunes should be managed as changing parts of a connected sediment system.","All engineering structures should be removed immediately.","Grasses can protect every coastline without other measures."],"answer":1,"explanation":"The passage stresses dynamic sediment flows and system-level management."},{"id":"R46","type":"academic","title":"Read an Academic Passage","groupTitle":"When Public Data Look Certain","passage":"When a city publishes environmental measurements online, the information can help residents make decisions about air quality, traffic, and water use. However, public availability alone does not guarantee that the data will be interpreted correctly. A number may appear exact while representing an average across many neighborhoods or several hours. The level of precision in a display can therefore exceed the detail supported by the underlying measurements.\n\nConsider a network of low-cost air sensors. These instruments can reveal patterns that would be difficult to detect with a few expensive monitoring stations. Yet inexpensive sensors may respond differently to humidity or temperature. If some neighborhoods have more devices than others, a citywide average may also reflect uneven coverage. Researchers may calibrate instruments against reference stations, but the process depends on assumptions about which conditions are comparable.\n\nSome agencies address these problems by including descriptions of measurement methods, uncertainty ranges, and known limitations alongside graphs. Such explanations require effort from readers, and too much technical detail can obscure the main message. Nevertheless, carefully designed summaries can make uncertainty understandable without pretending it has disappeared. The goal is not simply to offer more numbers, but to enable people to judge which claims those numbers can reasonably support.","stem":"What is the author’s main concern about public data displays?","options":["They make citizens less interested in public issues.","They cannot contain any precise measurements.","They can suggest certainty that the measurements do not support.","They are more expensive than printed reports."],"answer":2,"explanation":"A display can appear more exact than the underlying sampling supports."},{"id":"R47","type":"academic","title":"Read an Academic Passage","groupTitle":"When Public Data Look Certain","passage":"When a city publishes environmental measurements online, the information can help residents make decisions about air quality, traffic, and water use. However, public availability alone does not guarantee that the data will be interpreted correctly. A number may appear exact while representing an average across many neighborhoods or several hours. The level of precision in a display can therefore exceed the detail supported by the underlying measurements.\n\nConsider a network of low-cost air sensors. These instruments can reveal patterns that would be difficult to detect with a few expensive monitoring stations. Yet inexpensive sensors may respond differently to humidity or temperature. If some neighborhoods have more devices than others, a citywide average may also reflect uneven coverage. Researchers may calibrate instruments against reference stations, but the process depends on assumptions about which conditions are comparable.\n\nSome agencies address these problems by including descriptions of measurement methods, uncertainty ranges, and known limitations alongside graphs. Such explanations require effort from readers, and too much technical detail can obscure the main message. Nevertheless, carefully designed summaries can make uncertainty understandable without pretending it has disappeared. The goal is not simply to offer more numbers, but to enable people to judge which claims those numbers can reasonably support.","stem":"Why are low-cost sensors discussed?","options":["They increase coverage but introduce calibration and sampling challenges.","They can replace all other scientific instruments without verification.","They measure only traffic patterns.","They are never affected by weather."],"answer":0,"explanation":"The example illustrates a trade-off between broad measurement and sources of bias."},{"id":"R48","type":"academic","title":"Read an Academic Passage","groupTitle":"When Public Data Look Certain","passage":"When a city publishes environmental measurements online, the information can help residents make decisions about air quality, traffic, and water use. However, public availability alone does not guarantee that the data will be interpreted correctly. A number may appear exact while representing an average across many n e detail supported by the underlying measurements.\n\nConsider a network of low-cost air sensors. These instruments can reveal patterns that would be difficult to detect with a few expensive monitoring stations. Yet inexpensive sensors may respond differently to humidity or temperature. If some neighborhoods have more devices than others, a citywide average may also reflect uneven coverage. Researchers may calibrate instruments against reference stations, but the process depends on assumptions about which conditions are comparable.\n\nSome agencies address these problems by including descriptions of measurement methods, uncertainty ranges, and known limitations alongside graphs. Such explanations require effort from readers, and too much technical detail can obscure the main message. Nevertheless, carefully designed summaries can make uncertainty understandable without pretending it has disappeared. The goal is not simply to offer more numbers, but to enable people to judge which claims those numbers can reasonably support.","stem":"Why does the author mention that technical explanations can obscure a message?","options":["To recommend eliminating all explanatory text.","To acknowledge a challenge in communicating uncertainty effectively.","To prove that citizens cannot understand scientific data.","To suggest that exact numbers are always misleading."],"answer":1,"explanation":"The qualification recognizes the difficulty of balancing detail with clarity."},{"id":"R50","type":"academic","title":"Read an Academic Passage","groupTitle":"When Public Data Look Certain","passage":"When a city publishes environmental measurements online, the information can help residents make decisions about air quality, traffic, and water use. However, public availability alone does not guarantee that the data will be interpreted correctly. A number may appear exact while representing an average across many neighborhoods or several hours. The level of precision in a display can therefore exceed the detail supported by the underlying measurements.\n\nConsider a network of low-cost air sensors. These instruments can reveal patterns that would be difficult to detect with a few expensive monitoring stations. Yet inexpensive sensors may respond differently to humidity or temperature. If some neighborhoods have more devices than others, a citywide average may also reflect uneven coverage. Researchers may calibrate instruments against reference stations, but the process depends on assumptions about which conditions are comparable.\n\nSome agencies address these problems by including descriptions of measurement methods, uncertainty ranges, and known limitations alongside graphs. Such explanations require effort from readers, and too much technical detail can obscure the main message. Nevertheless, carefully designed summaries can make uncertainty understandable without pretending it has disappeared. The goal is not simply to offer more numbers, but to enable people to judge which claims those numbers can reasonably support.","stem":"Which principle does the passage ultimately endorse?","options":["Avoid publishing environmental information until measurements are perfect.","Prefer the largest possible number of charts.","Explain how data were produced and what conclusions they justify.","Replace calibrated devices with unverified estimates."],"answer":2,"explanation":"The final paragraph prioritizes justified interpretations, not sheer quantity of data."}],"listening":[{"id":"L01","type":"listen","title":"Listen and Choose a Response","group":"choose01","groupTitle":"Late Registration","clip":"choose01","stem":"Choose the most appropriate response to the speaker.","options":["The lab uses microscopes.","You should email the coordinator to ask whether late registration is possible.","Yesterday was quite warm.","I took ecology last year."],"answer":1,"explanation":"The appropriate reply addresses the speaker’s question, request, or practical difficulty: I tried to register for the ecology lab, but the online form says the deadline was yesterday."},{"id":"L02","type":"listen","title":"Listen and Choose a Response","group":"choose02","groupTitle":"Noisy Ventilation","clip":"choose02","stem":"Choose the most appropriate response to the speaker.","options":["We should notify the building staff.","I have an air filter at home.","The lecture is on Thursday.","I prefer sitting near the window."],"answer":0,"explanation":"The appropriate reply addresses the speaker’s question, request, or practical difficulty: The ventilation system is making such a loud noise that I can hardly hear the lecture."},{"id":"L03","type":"listen","title":"Listen and Choose a Response","group":"choose03","groupTitle":"New Timetable","clip":"choose03","stem":"Choose the most appropriate response to the speaker.","options":["Two seminars are offered this year.","One of the rooms is on the second floor.","You could ask the department office to confirm the correct location.","I usually arrive early."],"answer":2,"explanation":"The appropriate reply addresses the speaker’s question, request, or practical difficulty: The online timetable shows two different rooms for my seminar. Which one should I trust?"},{"id":"L04","type":"listen","title":"Listen and Choose a Response","group":"choose04","groupTitle":"Research Data","clip":"choose04","stem":"Choose the most appropriate response to the speaker.","options":["Temperatures are lower in winter.","The lab thermometer is on the shelf.","I entered the classroom quietly.","Sure. Send me the spreadsheet and I will compare it with the log."],"answer":3,"explanation":"The appropriate reply addresses the speaker’s question, request, or practical difficulty: Could you check whether I entered the temperature readings correctly?"},{"id":"L05","type":"listen","title":"Listen and Choose a Response","group":"choose05","groupTitle":"Absent Partner","clip":"choose05","stem":"Choose the most appropriate response to the spea y: Do you think the caption explains why the photograph matters?"},{"id":"L09","type":"listen","title":"Listen and Choose a Response","group":"choose09","groupTitle":"Project Deadline","clip":"choose09","stem":"Choose the most appropriate response to the speaker.","options":["Then we should identify which remaining sections are essential.","The report uses blue headings.","Friday is the last weekday.","I used statistics last year."],"answer":0,"explanation":"The appropriate reply addresses the speaker’s question, request, or practical difficulty: I finished the analysis, but I am not sure the report will be ready by Friday."},{"id":"L10","type":"listen","title":"Listen and Choose a Response","group":"choose10","groupTitle":"Computer Update","clip":"choose10","stem":"Choose the most appropriate response to the speaker.","options":["My laptop is black.","Could you use a campus computer if the update takes too long?","The quiz contains ten questions.","I updated my notes yesterday."],"answer":1,"explanation":"The appropriate reply addresses the speaker’s question, request, or practical difficulty: My laptop started installing an update just before the online quiz."},{"id":"L11","type":"listen","title":"Listen and Choose a Response","group":"choose11","groupTitle":"Guest Speaker","clip":"choose11","stem":"Choose the most appropriate response to the speaker.","options":["The projector was purchased recently.","I heard the speech was interesting.","Of course. Could you send me a short biography?","Our lecture starts at eleven."],"answer":2,"explanation":"The appropriate reply addresses the speaker’s question, request, or practical difficulty: Would you mind introducing our guest speaker while I set up the projector?"},{"id":"L12","type":"listen","title":"Listen and Choose a Response","group":"choose12","groupTitle":"Lab Measurements","clip":"choose12","stem":"Choose the most appropriate response to the speaker.","options":["I have weighed the box already.","The scales are listen","title":"Listen and Choose a Response","group":"choose16","groupTitle":"Broken Microphone","clip":"choose16","stem":"Choose the most appropriate response to the speaker.","options":["The interviewee arrived early.","I prefer quiet spaces.","Microphones can be expensive.","We should check the backup recorder before trying again."],"answer":3,"explanation":"The appropriate reply addresses the speaker’s question, request, or practical difficulty: The microphone stopped working halfway through our interview recording."},{"id":"L17","type":"listen","title":"Listen and Choose a Response","group":"choose17","groupTitle":"Conference Travel","clip":"choose17","stem":"Choose the most appropriate response to the speaker.","options":["Could you travel the evening before and stay overnight?","The station has a café.","I have attended two conferences.","The conference website is green."],"answer":0,"explanation":"The appropriate reply addresses the speaker’s question, request, or practical difficulty: The conference starts at nine, but the earliest train reaches the city at ten."},{"id":"L18","type":"listen","title":"Listen to Conversation","group":"conv01","groupTitle":"Checking a Specimen Loan","clip":"conv01","stem":"Why does the student visit the collection?","options":["To report a missing label.","To borrow specimens for a display.","To request admission to a biology course.","To inspect a damaged microscope."],"answer":1,"explanation":"The student asks to borrow specimens for a departmental display."},{"id":"L19","type":"listen","title":"Listen to Conversation","group":"conv01","groupTitle":"Checking a Specimen Loan","clip":"conv01","stem":"Why does the staff member discuss humidity?","options":["A humid display might damage older labels.","Humidity will attract visitors to the gallery.","The specimens must be kept wet.","The museum has no sealed display cases."],"answer":0,"explanation":"The old labels are moisture-sensitive, so protection requires humidity control."},{"id":"L20","type":"listen","title":"Listen to Conversation","group":"conv01","groupTitle":"Checking a Specimen Loan","clip":"conv01","stem":"What must the student send before approval?","options":["A list of visitors.","A final printed catalog.","A drawing of the case and its location.","An invoice for new specimens."],"answer":2,"explanation":"The staff requires a sketch of the case and where it will be placed."},{"id":"L21","type":"listen","title":"Listen to Conversation","group":"conv01","groupTitle":"Checking a Specimen Loan","clip":"conv01","stem":"When will the student probably receive a decision if the plan is sent today?","options":["Immediately.","Next Monday evening.","After winter break.","On Friday."],"answer":3,"explanation":"The registrar needs two working days and could respond by Friday."},{"id":"L22","type":"listen","title":"Listen to Conversation","group":"conv01","groupTitle":"Checking a Specimen Loan","clip":"conv01","stem":"What additional restriction does the staff member mention?","options":["The specimens must be returned before winter break.","Visitors must wear protective gloves.","The display must take place outdoors.","The specimens can never leave the collection."],"answer":0,"explanation":"The loan must end before the laboratory closes for winter break."},{"id":"L23","type":"listen","title":"Listen to Conversation","group":"conv02","groupTitle":"Changing a Theater Rehearsal","clip":"conv02","stem":"What problem does the student describe?","options":["The performance has been canceled.","The director lost a rehearsal schedule.","A required seminar conflicts with rehearsal.","The workshop equipment is broken."],"answer":2,"explanation":"The evening seminar has been moved to the rehearsal time."},{"id":"L24","type":"listen","title":"Listen to Conversation","group":"conv02","groupTitle":"Changing a Theater Rehearsal","clip":"conv02","stem":"Why cannot the technical rehearsal be rescheduled?","options":["It is held in another city.","Several other teams have already confirmed their availability.","The student has not paid the fee.","The actors refuse to practice on weekends."],"answer":1,"explanation":"Actors and sound team have already confirmed; coordination prevents moving it."},{"id":"L25","type":"listen","title":"Listen to Conversation","group":"conv02","groupTitle":"Changing a Theater Rehearsal","clip":"conv02","stem":"What alternative work is suggested?","options":["Constructing scenery on Saturday.","Writing the script alone.","Operating the sound board during the show.","Designing advertising posters."],"answer":0,"explanation":"Set construction on Saturday is available and does not require rehearsal attendance."},{"id":"L26","type":"listen","title":"Listen to Conversation","group":"conv02","groupTitle":"Changing a Theater Rehearsal","clip":"conv02","stem":"Why is the student’s lack of woodworking experience not a problem?","options":["Wood will not be used.","All construction is done by robots.","The supervisor plans to skip the equipment demonstration.","New volunteers receive guidance and safety instruction."],"answer":3,"explanation":"Students are paired with experienced volunteers and shown how to use equipment."},{"id":"L27","type":"listen","title":"Listen to Conversation","group":"conv02","groupTitle":"Changing a Theater Rehearsal","clip":"conv02","stem":"What should the student do next?","options":["Request an extension for the seminar.","Cancel participation entirely.","Update the online registration and notify the coordinator.","Attend the technical rehearsal anyway."],"answer":2,"explanation":"The staff requests the online role change plus a message for the safety roster."},{"id":"L28","type":"listen","title":"Listen to Conversation","group":"conv03","groupTitle":"Preparing an Oral History Project","clip":"conv03","stem":"What is the student uncertain about?","options":["How to repair recording equipment.","Which interviews may be published online.","How to arrange more interviews.","Where the factory was located."],"answer":1,"explanation":"The student asks which recordings can be shared on a course website."},{"id":"L29","type":"listen","title":"Listen to Conversation","group":"conv03","groupTitle":"Preparing an Oral History Project","clip":"conv03","stem":"Why are the existing release forms insufficient for a public website?","options":["They were all signed in another language.","They apply only to photographs.","They were destroyed.","They allow classroom use, not necessarily open distribution."],"answer":3,"explanation":"Classroom permission does not automatically extend to public online use."},{"id":"L30","type":"listen","title":"Listen to Conversation","group":"conv03","groupTitle":"Preparing an Oral History Project","clip":"conv03","stem":"What concern does the staff member raise about written summaries?","options":["Even without names, details may reveal identities.","Summaries are always illegal to publish.","Summaries cannot be used in academic research.","Every summary must contain a direct quotation."],"answer":0,"explanation":"Indirect identifying details can compromise anonymity."},{"id":"L31","type":"listen","title":"Listen to Conversation","group":"conv03","groupTitle":"Preparing an Oral History Project","clip":"conv03","stem":"What does the student plan to do?","options":["Delete every interview.","Upload unedited recordings immediately.","Keep audio restricted while reviewing summaries.","Replace interviews with fictional stories."],"answer":2,"explanation":"The student says the audio will remain on a restricted drive pending review."},{"id":"L32","type":"listen","title":"Listen to Announcement","group":"ann01","groupTitle":"Public Lecture Ticket Update","clip":"ann01","stem":"What has changed about the lecture?","options":["The topic.","The venue.","The lecturer.","The starting time."],"answer":1,"explanation":"The lecture moves to a larger auditorium but retains its start time."},{"id":"L33","type":"listen","title":"Listen to Announcement","group":"ann01","groupTitle":"Public Lecture Ticket Update","clip":"ann01","stem":"What should people registered before Monday do?","options":["Register again immediately.","Purchase a paper ticket.","Use the updated ticket sent by email.","Arrive before noon to keep their place."],"answer":2,"explanation":"Existing registrants receive updated digital tickets automatically."},{"id":"L34","type":"listen","title":"Listen to Announcement","group":"ann01","groupTitle":"Public Lecture Ticket Update","clip":"ann01","stem":"What is the deadline for new seat reservations?","options":["Noon on Thursday.","Six thirty on Thursday.","Monday morning.","One week after the lecture."],"answer":0,"explanation":"Reservations remain open until Thursday at noon if seats remain."},{"id":"L35","type":"listen","title":"Listen to Announcement","group":"ann01","groupTitle":"Public Lecture Ticket Update","clip":"ann01","stem":"Why is a rear seating section designated?","options":["It provides a better view of the screen.","It is reserved for university staff.","It contains power outlets.","It helps attendees avoid appearing in the discussion recording."],"answer":3,"explanation":"Rear-section audience cameras will not be directed at people who opt out."},{"id":"L36","type":"listen","title":"Listen to Announcement","group":"ann02","groupTitle":"Library Renovation Notice","clip":"ann02","stem":"What is the main purpose of the announcement?","options":["To advertise a new library membership.","To cancel all study-room bookings.","To explain arrangements during a temporary renovation.","To announce an increase in library fines."],"answer":2,"explanation":"The announcement details services during renovation of the first floor."},{"id":"L37","type":"listen","title":"Listen to Announcement","group":"ann02","groupTitle":"Library Renovation Notice","clip":"ann02","stem":"Where can students collect first-floor materials?","options":["From the temporary desk in the student center.","From the closed first-floor room.","From the campus bookstore.","Only from an off-campus warehouse."],"answer":0,"explanation":"The temporary pickup desk is located in the student center."},{"id":"L38","type":"listen","title":"Listen to Announcement","group":"ann02","groupTitle":"Library Renovation Notice","clip":"ann02","stem":"Why might rare materials take additional time?","options":["They are never available to students.","They require supervised handling.","Their catalog entries have been deleted.","They are being sent to another university."],"answer":1,"explanation":"A librarian must supervise transfer of rare materials."},{"id":"L39","type":"listen","title":"Listen to Announcement","group":"ann02","groupTitle":"Library Renovation Notice","clip":"ann02","stem":"What should students expect about existing group-study bookings?","options":["All such reservations are automatically canceled.","They must pay a transfer charge.","They must wait until construction ends.","They will receive reassigned rooms by message."],"answer":3,"explanation":"Existing bookings will receive alternative room assignments rather than automatically canceling."},{"id":"L40","type":"listen","title":"Listen to Academic Talk","group":"talk01","groupTitle":"How Migrating Insects Find Their Way","clip":"talk01","stem":"What is the lecture mainly about?","options":["Why butterflies avoid flying over rivers.","Why migration always occurs at night.","How insects may combine different directional cues during migration.","How migrating butterflies feed in winter."],"answer":2,"explanation":"The talk surveys multiple navigation cues and their interaction."},{"id":"L41","type":"listen","title":"Listen to Academic Talk","group":"talk01","groupTitle":"How Migrating Insects Find Their Way","clip":"talk01","stem":"Why does the lecturer describe experiments that shift internal daily rhythms?","options":["To show that internal clocks may help compensate for the changing sun position.","To establish that insects never sense magnetic fields.","To prove that butterflies navigate solely by memory.","To demonstrate that clouds have no influence on navigation."],"answer":0,"explanation":"Changing the internal clock changes preferred flight direction, evidence for time compensation."},{"id":"L42","type":"listen","title":"Listen to Academic Talk","group":"talk01","groupTitle":"How Migrating Insects Find Their Way","clip":"talk01","stem":"What qualification does the lecturer make about laboratory experiments?","options":["All laboratory observations are invalid.","Results can be affected by stress or alternative sensory cues.","Laboratory insects are always faster than wild insects.","Scientists have never observed migration directly."],"answer":1,"explanation":"The lecturer warns that stress and other cues can complicate causal inference."},{"id":"L43","type":"listen","title":"Listen to Academic Talk","group":"talk01","groupTitle":"How Migrating Insects Find Their Way","clip":"talk01","stem":"What broader research method does the lecturer recommend?","options":["Choosing the most visually striking observation.","Assuming one cue explains every migration route.","Avoiding controlled experiments entirely.","Testing competing explanations through distinct predictions."],"answer":3,"explanation":"Researchers distinguish mechanisms by comparing what different hypotheses predict."},{"id":"L44","type":"listen","title":"Listen to Academic Talk","group":"talk02","groupTitle":"The Many Meanings of Satellite Colors","clip":"talk02","stem":"What is a false-color satellite image?","options":["A fraudulent photograph.","An image that uses visible colors to represent measurements outside ordinary human vision.","A satellite picture taken only at night.","A map that contains no measurements."],"answer":1,"explanation":"False-color imagery maps nonvisible bands to displayed colors."},{"id":"L45","type":"listen","title":"Listen to Academic Talk","group":"talk02","groupTitle":"The Many Meanings of Satellite Colors","clip":"talk02","stem":"Why might vegetation appear bright red?","options":["Plants have been painted before a satellite pass.","Every plant emits strong red light.","Healthy plants always have very high temperatures.","The image assigns red to reflected near-infrared light."],"answer":3,"explanation":"The map uses red as a visual coding for near-infrared reflectance."},{"id":"L46","type":"listen","title":"Listen to Academic Talk","group":"talk02","groupTitle":"The Many Meanings of Satellite Colors","clip":"talk02","stem":"Why might two maps of one location look different?","options":["They may employ different bands, processing methods, or resolutions.","Satellites cannot photograph the same place twice.","Only one of the maps can use real data.","The location must have changed completely."],"answer":0,"explanation":"Different spectral selections and display methods can produce differing appearances."},{"id":"L47","type":"listen","title":"Listen to Academic Talk","group":"talk02","groupTitle":"The Many Meanings of Satellite Colors","clip":"talk02","stem":"What does the speaker identify as essential for interpreting such images?","options":["Guessing colors from familiar photographs.","Eliminating all image processing.","Knowing the measurement and display choices behind the image.","Assuming every pixel represents exactly one material."],"answer":2,"explanation":"The central point is that colors derive meaning from processing and measurement conventions."}],"writing":[{"id":"W01","type":"sentence","title":"Build a Sentence","context":"Explain why a sample was excluded.","answer":["The sample","was excluded","because","its origin","could not be verified."],"tokens":["because","The sample","could not be verified.","was excluded","its origin"],"explanation":"Because introduces a reason; past passive could not be verified."},{"id":"W02","type":"sentence","title":"Build a Sentence","context":"Describe a change that occurred before an announcement.","answer":["Not until","the revised timetable","had been approved","did the office","notify the students."],"tokens":["had been approved","Not until","notify the students.","the revised timetable","did the office"],"explanation":"Not until at the front triggers inversion did the office notify; past perfect precedes it."},{"id":"W03","type":"sentence","title":"Build a Sentence","context":"Explain the laboratory protocol.","answer":["The supervisor","required that","each instrument","be inspected","before use."],"tokens":["each instrument","The supervisor","before use.","required that","be inspected"],"explanation":"Require that + base form be inspected is a mandative subjunctive."},{"id":"W04","type":"sentence","title":"Build a Sentence","context":"State a counterfactual about field conditions.","answer":["Had the team","checked the forecast,","they might have","avoided the delay."],"tokens":["they might have","Had the team","avoided the delay.","checked the forecast,"],"explanation":"Had + subject + past participle is an inverted past counterfactual."},{"id":"W05","type":"sentence","title":"Build a Sentence","context":"Explain a qualified conclusion.","answer":["The results","appear reliable","provided that","the sensors","were calibrated correctly."],"tokens":["provided that","The results","were calibrated correctly.","appear reliable","the sensors"],"explanation":"Provided that introduces a necessary condition for accepting a claim."},{"id":"W06","type":"sentence","title":"Build a Sentence","context":"Describe how a proposal was assessed.","answer":["Although the proposal","was ambitious,","the committee","considered it","feasible."],"tokens":["the committee","Although the proposal","feasible.","was ambitious,","considered it"],"explanation":"Although introduces a concession contrasting ambition and feasibility."},{"id":"W07","type":"sentence","title":"Build a Sentence","context":"State the consequence of a missing record.","answer":["Without the original notes,","researchers","cannot determine","whether the estimate","was accurate."],"tokens":["cannot determine","Without the original notes,","was accurate.","researchers","whether the estimate"],"explanation":"Without introduces a missing precondition; whether begins an embedded question."},{"id":"W08","type":"sentence","title":"Build a Sentence","context":"Describe the comparison of two surveys.","answer":["The larger","the sample becomes,","the more accurately","researchers can","estimate the trend."],"tokens":["the more accurately","The larger","estimate the trend.","the sample becomes,","researchers can"],"explanation":"The comparative ... the comparative describes a proportional relationship."},{"id":"W09","type":"sentence","title":"Build a Sentence","context":"Explain the timing of a decision.","answer":["Only after","the interviews were completed","could the team","identify","a consistent pattern."],"tokens":["could the team","Only after","a consistent pattern.","the interviews were completed","identify"],"explanation":"Only after at sentence start triggers partial inversion could the team identify."},{"id":"W10","type":"sentence","title":"Build a Sentence","context":"Describe what caused surprise.","answer":["What surprised the audience","was that","the simpler method","produced","more consistent results."],"tokens":["the simpler method","What surprised the audience","more consistent results.","was that","produced"],"explanation":"What surprised ... was that ... is a noun-clause construction."},{"id":"W11","type":"email","title":"Write an Email","timeHint":"Suggested time: 7 minutes","prompt":"You signed up for a university fieldwork workshop and received a confirmation that you would be provided with protective gloves and safety glasses. A later message says students must bring their own equipment. Write an email to the workshop coordinator. Explain the conflicting instructions and your registration; ask which safety items will actually be supplied; and request clarification before the workshop begins on Monday morning.","positions":[],"checks":["Explain registration and the conflicting safety-equipment information.","Ask what the organizers will provide and what you must bring.","Request an answer before Monday morning.","Use a concise, professional email tone."]},{"id":"W12","type":"discussion","title":"Write for an Academic Discussion","timeHint":"Suggested time: 10 minutes","prompt":"Professor Hale: “Many universities are considering allowing students to choose between written final papers and alternative formats, such as podcasts, exhibitions, or short documentaries. Supporters argue that multiple formats allow students to demonstrate different strengths. Critics worry that projects in different formats are difficult to evaluate fairly. Should university courses allow students to choose the format of a final assignment? Explain your position.”","positions":[["Student A — Iris","I support flexible formats. An exhibition or podcast can communicate research to people who might never read a traditional essay. Students may also develop useful communication skills while presenting the same ideas in a different medium."],["Student B — Owen","I prefer a common written format. Writing is an important academic skill, and equal expectations make grading more transparent. Different media may require equipment or experience that some students do not have."]],"checks":["Take a clear position on choice of assignment format.","Engage with at least one student’s reasoning.","Provide a relevant example or practical consequence.","Use precise and coherent academic English."]}],"clips":{"choose01":{"title":"Late Registration","kind":"short response","segments":[{"role":"n","text":"I tried to register for the ecology lab, but the online form says the deadline was yesterday."}],"transcript":"I tried to register for the ecology lab, but the online form says the deadline was yesterday."},"choose02":{"title":"Noisy Ventilation","kind":"s ll be ready by Friday."}],"transcript":"I finished the analysis, but I am not sure the report will be ready by Friday."},"choose10":{"title":"Computer Update","kind":"short response","segments":[{"role":"n","text":"My laptop started installing an update just before the online quiz."}],"transcript":"My laptop started installing an update just before the online quiz."},"choose11":{"title":"Guest Speaker","kind":"short response","segments":[{"role":"n","text":"Would you mind introducing our guest speaker while I set up the projector?"}],"transcript":"Would you mind introducing our guest speaker while I set up the projector?"},"choose12":{"title":"Lab Measurements","kind":"short response","segments":[{"role":"n","text":"The two scales gave different weights for the same sample."}],"transcript":"The two scales gave different weights for the same sample."},"choose13":{"title":"Workshop Refund","kind":"short response","segments":[{"role":"n","text":"I paid for the workshop, but it was canceled by the organizers."}],"transcript":"I paid for the workshop, but it was canceled by the organizers."},"choose14":{"title":"Essay Outline","kind":"short response","segments":[{"role":"n","text":"I have plenty of evidence, but my essay still feels disorganized."}],"transcript":"I have plenty of evidence, but my essay still feels disorganized."},"choose15":{"title":"Museum Ticket","kind":"short response","segments":[{"role":"n","text":"Does the student ticket include access to the temporary exhibition?"}],"transcript":"Does the student ticket include access to the temporary exhibition?"},"choose16":{"title":"Broken Microphone","kind":"short response","segments":[{"role":"n","text":"The microphone stopped working halfway through our interview recording."}],"transcript":"The microphone stopped working halfway through our interview recording."},"choose17":{"title":"Conference Travel","kind":"short response","segments":[{"role":"n","text":"The conference starts at nine, but the earliest train reaches the city at ten."}],"transcript":"The conference starts at nine, but the earliest train reaches the city at ten."},"conv01":{"title":"Checking a Specimen Loan","kind":"conversation","segments":[{"role":"A","text":"Hello, I am preparing a biology display for our department and would like to borrow two insect specimens from the teaching collection."},{"role":"B","text":"Are you planning to display them behind glass, or will visitors be able to handle them?"},{"role":"A","text":"Behind glass. I thought that would be enough to protect them."},{"role":"B","text":"That helps, but we also need the display case to stay below a certain humidity level. The older labels are sensitive to moisture."},{"role":"A","text":"We have a sealed case, though it does not have a humidity sensor."},{"role":"B","text":"You could borrow a sensor from the department. Before we approve the loan, please send us a sketch of the case and its planned location."},{"role":"A","text":"Would the specimens be available next Monday? That is when we start installing the display."},{"role":"B","text":"Possibly, but our registrar needs two working days to review the plan. If you submit the sketch today, we should be able to give you an answer on Friday."},{"role":"A","text":"All right. I will include the location and humidity plan in one document."},{"role":"B","text":"Good. Also remember that the objects must be returned before the laboratory closes for winter break."}],"transcript":"Hello, I am preparing a biology display for our department and would like to borrow two insect specimens from the teaching collection.\nAre you planning to display them behind glass, or will visitors be able to handle them?\nBehind glass. I thought that would be enough to protect them.\nThat helps, but we also need the display case to stay below a certain humidity level. The older labels are sensitive to moisture.\nWe have a sealed case, though it does not have a humidity sensor.\nYou could borrow a sensor from the department. Before we approve the loan, please send us a sketch of the case and its planned location.\nWould the specimens be available next Monday? That is when we start installing the display.\nPossibly, but our registrar needs two working days to review the plan. If you submit the sketch today, we should be able to give you an answer on Friday.\nAll right. I will include the location and humidity plan in one document.\nGood. Also remember that the objects must be returned before the laboratory closes for winter break."},"conv02":{"title":"Changing a Theater Rehearsal","kind":"conversation","segments":[{"role":"A","text":"Hi, I signed up to help with the student theater production, but my evening seminar has moved to the same time as rehearsal."},{"role":"B","text":"Are you part of the lighting crew or the stage crew?"},{"role":"A","text":"The stage crew. I was assigned to move scenery during scene changes."},{"role":"B","text":"That work requires you to attend the technical rehearsal. We cannot move that one, because the actors and sound team have already confirmed their schedules."},{"role":"A","text":"Could I help with set construction instead? I would still like to contribute."},{"role":"B","text":"Yes. The construction workshop meets on Saturday afternoon, and those tasks can be completed before the technical rehearsal."},{"role":"A","text":"I have experience cutting cardboard models, but not large wooden panels."},{"role":"B","text":"That is fine. We pair new volunteers with experienced students, and the supervisor will demonstrate the equipment first."},{"role":"A","text":"Should I change my volunteer registration online?"},{"role":"B","text":"Please do. Once you select construction, send me a message so I can update the safety roster."}],"transcript":"Hi, I signed up to help with the student theater production, but my evening seminar has moved to the same time as rehearsal.\nAre you part of the lighting crew or the stage crew?\nThe stage crew. I was assigned to move scenery during scene changes.\nThat work requires you to attend the technical rehearsal. We cannot move that one, because the actors and sound team have already confirmed their schedules.\nCould I help with set construction instead? I would still like to contribute.\nYes. The construction workshop meets on Saturday afternoon, and those tasks can be completed before the technical rehearsal.\nI have experience cutting cardboard models, but not large wooden panels.\nThat is fine. We pair new volunteers with experienced students, and the supervisor will demonstrate the equipment first.\nShould I change my volunteer registration online?\nPlease do. Once you select construction, send me a message so I can update the safety roster."},"conv03":{"title":"Preparing an Oral History Project","kind":"conversation","segments":[{"role":"A","text":"I have completed my interviews with former factory workers, but I am unsure which recordings I can share on our course website."},{"role":"B","text":"Did the participants sign release forms specifying how their words may be used?"},{"role":"A","text":"They signed forms allowing classroom use, but I do not think the forms mention public websites."},{"role":"B","text":"Then do not upload the recordings publicly yet. Permission for a classroom presentation is not necessarily permission for online distribution."},{"role":"A","text":"Could I publish anonymous written summaries instead?"},{"role":"B","text":"Possibly, but you should check whether any details could identify a participant indirectly, such as an unusual job title or a specific event."},{"role":"A","text":"One participant is the only person who held a certain position during that period."},{"role":"B","text":"That would be a strong identifying clue. Consider changing the level of detail, and ask participants to approve the summaries if possible."},{"role":"A","text":"I will keep the audio on the restricted course drive for now and review the summaries."}],"transcript":"I have completed my interviews with former factory workers, but I am unsure which recordings I can share on our course website.\nDid the participants sign release forms specifying how their words may be used?\nThey signed forms allowing classroom use, but I do not think the forms mention public websites.\nThen do not upload the recordings publicly yet. Permission for a classroom presentation is not necessarily permission for online distribution.\nCould I publish anonymous written summaries instead?\nPossibly, but you should check whether any details could identify a participant indirectly, such as an unusual job title or a specific event.\nOne participant is the only person who held a certain position during that period.\nThat would be a strong identifying clue. Consider changing the level of detail, and ask participants to approve the summaries if possible.\nI will keep the audio on the restricted course drive for now and review the summaries."},"ann01":{"title":"Public Lecture Ticket Update","kind":"announcement","segments":[{"role":"n","text":"Attention students and guests. Thursday's public lecture on deep-sea exploration has been moved from the east lecture hall to the larger auditorium near the central library. The starting time remains six thirty p.m. Admission is free, but all visitors must present a digital ticket at the entrance. People who registered before Monday will receive an updated ticket by email; they do not need to register again. New visitors may reserve seats until noon on Thursday, provided space remains. Please note that the post-lecture discussion will be recorded for the university website. Anyone who prefers not to appear in the recording should sit in the designated rear section, where audience cameras will not be directed. Signs and volunteers will guide you on arrival."}],"transcript":"Attention students and guests. Thursday's public lecture on deep-sea exploration has been moved from the east lecture hall to the larger auditorium near the central library. The starting time remains six thirty p.m. Admission is free, but all visitors must present a digital ticket at the entrance. People who registered before Monday will receive an updated ticket by email; they do not need to register again. New visitors may reserve seats until noon on Thursday, provided space remains. Please note that the post-lecture discussion will be recorded for the university website. Anyone who prefers not to appear in the recording should sit in the designated rear section, where audience cameras will not be directed. Signs and volunteers will guide you on arrival."},"ann02":{"title":"Library Renovation Notice","kind":"announcement","segments":[{"role":"n","text":"Beginning next Tuesday, the first-floor reading room will close for five weeks while contractors improve the ventilation system. The book return slot outside the main entrance will remain open throughout the project. Materials normally held on the first floor can be requested through the online catalog and collected from the temporary desk in the student center. Most requests will be ready by the following working day, but rare materials may take longer because a librarian must supervise their transfer. Students with reservations in the first-floor group-study rooms will receive a message with an alternative room assignment. Please do not assume that a previous reservation has been canceled simply because the original room is unavailable. During construction, the library's upper floors will remain open on their normal schedule."}],"transcript":"Beginning next Tuesday, the first-floor reading room will close for five weeks while contractors improve the ventilation system. The book return slot outside the main entrance will remain open throughout the project. Materials normally held on the first floor can be requested through the online catalog and collected from the temporary desk in the student center. Most requests will be ready by the following working day, but rare materials may take longer because a librarian must supervise their transfer. Students with reservations in the first-floor group-study rooms will receive a message with an alternative room assignment. Please do not assume that a previous reservation has been canceled simply because the original room is unavailable. During construction, the library's upper floors will remain open on their normal schedule."},"talk01":{"title":"How Migrating Insects Find Their Way","kind":"academic talk","segments":[{"role":"n","text":"A butterfly that travels hundreds of kilometers cannot simply remember every landmark along the route. Researchers therefore study several kinds of information that migrating insects might use, including the position of the sun, patterns of polarized light, and the Earth's magnetic field. Each source can provide directional information, but none is available with equal reliability at all times."},{"role":"n","text":"Consider the sun as a compass. Its apparent position changes over the course of a day, so an insect using it must somehow compensate for time. Experiments suggest that internal daily rhythms help some species maintain a consistent direction. If those rhythms are shifted under controlled lighting conditions, their preferred flight direction may also change. This provides evidence that the internal clock contributes to navigation."},{"role":"n","text":"However, such experiments cannot establish that the sun is the only cue. Under cloudy skies, some insects may respond to polarized light, which remains informative even when the sun itself is difficult to see. Magnetic information may provide an additional reference. Researchers must also be cautious: an insect might change direction because of laboratory stress rather than because a specific sensory cue was removed."},{"role":"n","text":"The central insight is that migration is likely supported by several interacting systems. To identify their roles, scientists compare predictions from competing explanations instead of relying on a single dramatic observation. Understanding how these signals complement one another may also help explain why artificial lighting can disrupt insect movement."}],"transcript":"A butterfly that travels hundreds of kilometers cannot simply remember every landmark along the route. Researchers therefore study several kinds of information that migrating insects might use, including the position of the sun, patterns of polarized light, and the Earth's magnetic field. Each source can provide directional information, but none is available with equal reliability at all times.\nConsider the sun as a compass. Its apparent position changes over the course of a day, so an insect using it must somehow compensate for time. Experiments suggest that internal daily rhythms help some species maintain a consistent direction. If those rhythms are shifted under controlled lighting conditions, their preferred flight direction may also change. This provides evidence that the internal clock contributes to navigation.\nHowever, such experiments cannot establish that the sun is the only cue. Under cloudy skies, some insects may respond to polarized light, which remains informative even when the sun itself is difficult to see. Magnetic information may provide an additional reference. Researchers must also be cautious: an insect might change direction because of laboratory stress rather than because a specific sensory cue was removed.\nThe central insight is that migration is likely supported by several interacting systems. To identify their roles, scientists compare predictions from competing explanations instead of relying on a single dramatic observation. Understanding how these signals complement one another may also help explain why artificial lighting can disrupt insect movement."},"talk02":{"title":"The Many Meanings of Satellite Colors","kind":"academic talk","segments":[{"role":"n","text":"A satellite image often looks like a photograph, but not every color on a satellite map represents the color a human observer would see from the ground. Some maps combine measurements made at wavelengths beyond visible light, including infrared bands. To make patterns understandable, scientists assign those invisible measurements visible colors, producing what is called a false-color image."},{"role":"n","text":"For example, healthy vegetation strongly reflects certain near-infrared wavelengths. In one common mapping scheme, that signal is shown as bright red. Red areas therefore need not indicate red plants or hot surfaces; they may indicate vegetation with a distinctive pattern of light reflection. By choosing a different combination of bands, an analyst can highlight moisture, burned areas, or minerals instead."},{"role":"n","text":"These transformations are useful, but they introduce interpretive choices. Two maps of the same place can emphasize different features because they use different spectral bands, processing steps, or scales. The apparent boundary between two land types may also depend on the resolution of the sensor. A single pixel sometimes represents a mixture of several kinds of surface."},{"role":"n","text":"Satellite imagery thus provides a powerful way to observe large or inaccessible areas, but its meaning is not self-evident. Researchers should describe the measurement bands and mapping rules rather than assuming viewers can infer them from the colors alone. Interpreting an image requires knowledge of how the data became visible."}],"transcript":"A satellite image often looks like a photograph, but not every color on a satellite map represents the color a human observer would see from the ground. Some maps combine measurements made at wavelengths beyond visible light, including infrared bands. To make patterns understandable, scientists assign those invisible measurements visible colors, producing what is called a false-color image.\nFor example, healthy vegetation strongly reflects certain near-infrared wavelengths. In one common mapping scheme, that signal is shown as bright red. Red areas therefore need not indicate red plants or hot surfaces; they may indicate vegetation with a distinctive pattern of light reflection. By choosing a different combination of bands, an analyst can highlight moisture, burned areas, or minerals instead.\nThese transformations are useful, but they introduce interpretive choices. Two maps of the same place can emphasize different features because they use different spectral bands, processing steps, or scales. The apparent boundary between two land types may also depend on the resolution of the sensor. A single pixel sometimes represents a mixture of several kinds of surface.\nSatellite imagery thus provides a powerful way to observe large or inaccessible areas, but its meaning is not self-evident. Researchers should describe the measurement bands and mapping rules rather than assuming viewers can infer them from the colors alone. Interpreting an image requires knowledge of how the data became visible."}}};
