<script>
(function(){'use strict';
const DATA=JSON.parse(document.getElementById('course-data').textContent), CH=DATA.chapters, SYN=DATA.synthesis;
const KEY='morris_1978_toefl_close_reading_v1';
let state={mc:{},cloze:{},unit:0,view:'home',tab:'reading',seconds:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.mc&&s.cloze)state={...state,...s,view:'home'};}catch(e){}

const blanksOf=unit=>[...unit.cloze.matchAll(/\[([A-Za-z]+)\]/g)].map(x=>x[1]);
const prefixFor=w=>{const n=w.length;return n<=4?1:n<=6?2:n<=8?3:Math.max(3,Math.floor(n*.4));};
const missing=w=>w.slice(prefixFor(w));
const answers=()=>{let all=0,correct=0,wrong=0;for(let u=0;u<10;u++){for(let j=0;j<CH[u].questions.length;j++){const r=state.mc[mcKey(u,j)];if(r){all++;if(r.ok)correct++;else wrong++;}}for(let j=0;j<10;j++){const r=state.cloze[clKey(u,j)];if(r){all++;if(r.ok)correct++;else wrong++;}}}for(let i=0;i<SYN.length;i++){let r=state.mc[mcKey(10,i)];if(r){all++;if(r.ok)correct++;else wrong++;}}return{all,correct,wrong,total:161};};
const unitStats=u=>{let done=0,good=0;for(let j=0;j<CH[u].questions.length;j++){let x=state.mc[mcKey(u,j)];if(x){done++;if(x.ok)good++;}}for(let j=0;j<10;j++){let x=state.cloze[clKey(u,j)];if(x){done++;if(x.ok)good++;}}return{done,good,total:CH[u].questions.length+10}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}updateNav()}
function showToast(s){const t=$('toast');t.textContent=s;t.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('visible'),2300)}
function timeText(t){t=Math.max(0,t|0);const h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;return h?String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'):String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
setInterval(()=>{const now=Date.now(),delta=Math.min(10,Math.max(0,Math.floor((now-clockStart)/1000)));if(delta){state.seconds+=delta;clockStart+=delta*1000;if(state.seconds%10===0)save();}$('clock').textContent=timeText(state.seconds)},1000);
function go(view,u,tab){if(typeof u==='number')state.unit=u;if(tab)state.tab=tab;state.view=view;activeWord=-1;clearTimeout(wordTimer);render();save();window.scrollTo({top:0,behavior:'instant'});}
function updateNav(){const selected=state.view==='unit'?'unit-'+state.unit:state.view;const d=$('sidebar');let html='<div class="side-heading">Course / Chapter navigation</div><button class="nav-item '+(selected==='home'?'active':'')+'" data-action="home"><span class="nav-no">◌</span><span class="nav-name">首页 · 阅读路线</span></button>';
CH.forEach((ch,i)=>{const s=unitStats(i);html+='<button class="nav-item '+(selected==='unit-'+i?'active':'')+'" data-unit="'+i+'"><span class="nav-no">'+String(i+1).padStart(2,'0')+'</span><span class="nav-name">'+esc(ch.title.replace(/^\d+ · /,''))+'<br><span class="nav-count">'+s.done+'/'+s.total+' 已完成</span></span></button>';});
let syn=SYN.filter((_,i)=>state.mc[mcKey(10,i)]).length;html+='<button class="nav-item '+(selected==='synthesis'?'active':'')+'" data-action="synthesis"><span class="nav-no">✳</span><span class="nav-name">跨章节综合测试<br><span class="nav-count">'+syn+'/10 已完成</span></span></button><button class="nav-item '+(selected==='dashboard'?'active':'')+'" data-action="dashboard"><span class="nav-no">↗</span><span class="nav-name">成绩总览 · 错题本</span></button><div class="side-bottom">原典：Robert Morris, 1978<br>题目与英文训练短文均为基于原文的原创改写。<br>不包含原 PDF 全文或图片。<br>练习进度仅保存在当前浏览器。</div>';d.innerHTML=html;
const select=$('mobileChapters');if(select.options.length<12){select.innerHTML='<option value="home">章节目录</option>'+CH.map((c,i)=>'<option value="'+i+'">'+esc(c.title)+'</option>').join('')+'<option value="synthesis">综合测试</option><option value="dashboard">成绩与错题</option>';}select.value=selected.startsWith('unit-')?String(state.unit):selected;}
function hero(){const s=answers();return `<section class="hero"><div class="eyebrow">Art / Theory / TOEFL · 1978</div><div class="mini-meta">原著 Robert Morris · The Present Tense of Space · Art in America</div><h1>空间的<br><i>现在时</i></h1><p class="lead">一本为真正读懂论文而设计的互动阅读册。沿着 Morris 的论证走过记忆、身体、雕塑、废墟与摄影；通过英语阅读与填词练习，在一次次答题中辨认概念的边界。</p><div class="hero-actions"><button class="primary" data-unit="${state.unit||0}">从${state.unit?'上次章节继续':'第一章开始'} →</button><button class="secondary" data-unit="4">直接进入 · 废墟章节</button><button class="secondary" data-action="dashboard">查看已做的题</button></div></section><div class="hero-grid"><div class="metric"><strong>10</strong><small>原文论证单元</small></div><div class="metric"><strong>161</strong><small>英语阅读与填词题</small></div><div class="metric"><strong>${s.all}</strong><small>已练习 · ${s.correct} 题正确</small></div></div><div class="eyebrow">The argument / 文章论证路线</div><div class="concept-path">${['刀剑与矛盾','I 与 me','物体与建筑','废墟与行动','摄影与不可再现'].map((x,i)=>'<div><span style="font-family:Georgia;color:#37694c">0'+(i+1)+'</span><br>'+x+'</div>').join('')}</div><h2 class="section-title">按原文顺序精读</h2><p class="section-sub">每章：英文重述 → 阅读理解 → Complete the Words → 中文解析。单词填空按缺失字母数量显示短横线。</p><div class="chapter-grid">${CH.map((c,i)=>{let s=unitStats(i);return `<button class="chapter-card" data-unit="${i}"><div class="ch-info">CHAPTER ${String(i+1).padStart(2,'0')}　·　原刊 ${esc(c.pages)}</div><div class="ch-name">${esc(c.title.replace(/^\d+ · /,''))}</div><div class="ch-thesis">${esc(c.thesis)}</div><div class="progress"><div class="bar" style="width:${s.done/s.total*100}%"></div></div><div class="ch-info">${s.done}/${s.total} 已完成</div></button>`}).join('')}</div><div class="source-note">关于文本：本站的英语段落是根据你提供的1978年论文逐章撰写的学习性改写，并非 Morris 的逐字原文；你可以按每章标注的《Art in America》页码回到原 PDF 对照。本题库属于非官方 TOEFL 风格练习。</div>`}
function readingPanel(ch,u){return `<section class="panel"><div class="smallhead">Reading passage / 根据原文改写的英语阅读</div><div class="two-col"><div><div class="reading-text">${ch.reading.split(/\n\n/).map(p=>'<p>'+esc(p)+'</p>').join('')}</div><div class="muted">来源对应：原刊第 ${esc(ch.pages)} 页。英文阅读为学习性重述，不是原文全文摘录。</div></div><aside class="aside-note"><h3>边读边理解 · 这章要抓住什么？</h3><ol>${ch.points.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol><div class="smallhead" style="margin-top:10px">Key terms</div><div class="terms">${ch.terms.map(t=>'<span class="term">'+esc(t)+'</span>').join('')}</div></aside></div></section><section><div class="smallhead" style="margin-top:25px">TOEFL-style questions / 本章 ${ch.questions.length} 题</div>${ch.questions.map((q,i)=>mcCard(q,u,i)).join('')}</section>`}
function mcCard(q,u,i){const key=mcKey(u,i),r=state.mc[key],correct=!!(r&&r.ok),letter='ABCD';return `<article class="question ${r?'answered '+(correct?'correct':'wrong'):''}" id="question-${key}"><div class="q-top"><span>${u===10?'FINAL '+String(i+1).padStart(2,'0'):'R'+String(u+1).padStart(2,'0')+'-'+String(i+1).padStart(2,'0')}　·　${esc(q.kind)}</span><span>${r?(correct?'✓ 正确':'× 错误'):'未作答'}</span></div><h3 class="q-title">${esc(q.q)}</h3><div class="options">${q.opts.map((o,j)=>{const clas=r?(j===q.a?'right':j===r.a?'wrong-choice':'answered-neutral'):'';return `<button class="option ${clas}" ${r?'disabled':''} data-mc="${u},${i},${j}"><span class="letter">${letter[j]}</span><span>${esc(o)}</span></button>`}).join('')}</div>${r?`<div class="feedback ${correct?'':'bad'}"><strong>${correct?'回答正确':'这题选错了'} · 正确答案 ${letter[q.a]}</strong><p>${esc(q.why)}</p>${q.trap?'<small>辨析提示：'+esc(q.trap)+'</small>':''}</div>`:''}</article>`}
function clozePanel(ch,u){const words=blanksOf(ch),parts=ch.cloze.split(/\[[A-Za-z]+\]/),progress=words.filter((_,j)=>state.cloze[clKey(u,j)]).length;let text='';words.forEach((w,j)=>{const d=ch.defs[j],r=state.cloze[clKey(u,j)],p=prefixFor(w),suffix=w.slice(p),res=r?(r.ok?'correct':'wrong'):'';text+=esc(parts[j])+`<span class="word ${res}" id="w-${j}" data-word-index="${j}"><span class="prefix">${esc(w.slice(0,p))}</span><input type="text" data-cloze="${u},${j}" aria-label="第${j+1}个单词，补全${esc(w.slice(0,p))}" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="${w.length}" placeholder="${'_'.repeat(suffix.length)}" style="width:${Math.max(30,suffix.length*12+11)}px" value="${r?esc(r.typed):''}" ${r?'disabled':''}/>${r?`<button class="word-reveal" data-word="${j}" title="查看这道题的解析">${r.ok?'✓':'×'}</button>`:''}</span>`});text+=esc(parts.at(-1));return `<section class="panel"><div class="smallhead">Complete the Words · 10 questions</div><h2 class="panel-title">在语境中补全单词</h2><div class="helper">每条短横线恰好代表一个缺失字母。只需填写单词<strong>未显示的部分</strong>，填满后自动检查；也可以按 Enter 检查当前词。点击任意已批改词后的符号可查看解释。本练习的英文段落由原文观点重新撰写。</div><div class="progress"><div class="bar" style="width:${progress*10}%"></div></div><div class="muted" style="margin-bottom:10px">已批改 ${progress}/10 · 正确 ${words.filter((w,j)=>state.cloze[clKey(u,j)]?.ok).length}/10</div><div class="cloze-text" id="clozeText">${text}</div><div id="wordFeedback" class="answer-card"><h4>词汇与语法提示</h4><p>选择任意一个空格，填入缺失字母。答完后会显示完整答案、中文释义和语法解释。</p></div><div class="answer-buttons"><button class="secondary" id="checkWord" data-action="check-word">检查当前词 ↵</button><button class="quiet-button" data-action="reveal-word">查看当前词答案</button><button class="quiet-button" data-action="next-blank">跳到下一个空格</button></div></section><section class="panel"><h3 style="margin:0 0 9px;font-size:14px">这十个词如何服务于这一章的论证？</h3><p class="muted" style="font-size:13px;line-height:1.9">${esc(ch.thesis)}</p><div class="terms">${ch.terms.map(t=>'<span class="term">'+esc(t)+'</span>').join('')}</div></section>`}
function renderUnit(){const u=state.unit,ch=CH[u],stats=unitStats(u);const tabs=['reading','cloze','guide'],names=['英文阅读 · '+ch.questions.length+'题','填词训练 · 10题','原文精读梳理'];let html=`<div class="chapter-h"><div class="eyebrow">Chapter ${String(u+1).padStart(2,'0')} / ${esc(ch.pages)}</div><h1>${esc(ch.title)}</h1><p class="thesis">${esc(ch.thesis)}</p><div class="meta-strip"><span class="tag">原典导读</span><span class="tag">TOEFL-style reading</span><span class="tag">Immediate feedback</span><span>${stats.done}/${stats.total} 已做 · ${stats.good} 正确</span></div></div><div class="tabs" role="tablist">${tabs.map((t,i)=>`<button class="tab ${state.tab===t?'active':''}" data-tab="${t}">${names[i]}</button>`).join('')}</div>`;
if(state.tab==='reading')html+=readingPanel(ch,u);else if(state.tab==='cloze')html+=clozePanel(ch,u);else html+=`<section class="panel"><div class="smallhead">Reading compass / 由问题返回概念</div><h2 class="panel-title">精读笔记 · 原典结构</h2><p style="font-size:15px;line-height:1.95">${esc(ch.thesis)}</p><ol style="font-size:14px;line-height:2.05;color:#475a4c;padding-left:22px">${ch.points.map(x=>'<li>'+esc(x)+'</li>').join('')}</ol><h3 style="font-size:14px;margin-top:25px">关键术语</h3><div class="terms">${ch.terms.map(t=>'<span class="term">'+esc(t)+'</span>').join('')}</div><div class="helper" style="margin-top:24px">请对照你上传的 PDF 中第 ${esc(ch.pages)} 页。这里的中文注释是依照原文论点的教学性解释，英文训练段落也为改写，没有把解释和作者原话混同。</div></section>`;
html+=`<div class="footer-action"><button class="secondary" data-unit="${Math.max(0,u-1)}" ${u===0?'disabled':''}>← 上一章</button><span class="muted">Chapter ${u+1} / 10</span>${u===9?'<button class="primary" data-action="synthesis">进入最终综合测试 →</button>':'<button class="primary" data-unit="'+(u+1)+'">下一章 →</button>'}</div><div class="source-note">Robert Morris, “The Present Tense of Space,” <i>Art in America</i>, January–February 1978, 70–80. 本页对应原刊 ${esc(ch.pages)}。</div>`;
return html;}
function renderSynthesis(){let num=SYN.filter((_,i)=>state.mc[mcKey(10,i)]).length;return `<section class="chapter-h"><div class="eyebrow">Final review / 综合分析</div><h1>走出单篇，重建全文</h1><p class="thesis">前面的练习分别考察局部段落。这里的十题要求你跨越章节，重新辨认 Morris 的三个模型、他对废墟的判断，以及文章结尾无法消除的矛盾。</p><div class="meta-strip"><span class="tag">全局论证</span><span>${num}/10 已答</span></div></section><div class="helper" style="margin:12px 0 24px">本组题没有新文本，考查你对前10章所学内容的整合理解。所有题目仍支持单独批改、即时查看中文解释。</div>${SYN.map((q,i)=>mcCard(q,10,i)).join('')}<div class="footer-action"><button class="secondary" data-unit="9">← 返回第十章</button><button class="primary" data-action="dashboard">查看全部成绩与错题 →</button></div>`}
function renderDash(){const s=answers();let wrong=[];for(let u=0;u<10;u++){CH[u].questions.forEach((q,i)=>{const r=state.mc[mcKey(u,i)];if(r&&!r.ok)wrong.push({u,kind:'reading',index:i,title:q.q,answer:'ABCD'[q.a],why:q.why})});CH[u].defs.forEach((d,i)=>{const r=state.cloze[clKey(u,i)];if(r&&!r.ok)wrong.push({u,kind:'cloze',index:i,title:d.w,answer:d.w,why:d.why})});}SYN.forEach((q,i)=>{const r=state.mc[mcKey(10,i)];if(r&&!r.ok)wrong.push({u:10,kind:'reading',index:i,title:q.q,answer:'ABCD'[q.a],why:q.why})});let html=`<section class="chapter-h"><div class="eyebrow">Learning archive / 成绩记录</div><h1>进度与错题本</h1><p class="thesis">答题后自动保存记录。每题的答题结果只计首次提交，避免反复重选扭曲正确率；可以从错题本回到对应章节查看完整解析。</p></section><div class="overview-grid"><div class="overview-item"><b>${s.all}</b><span>完成 / ${s.total} 总题数</span></div><div class="overview-item"><b>${s.correct}</b><span>正确</span></div><div class="overview-item"><b>${s.wrong}</b><span>错误／主动看答案</span></div><div class="overview-item"><b>${s.all?Math.round(s.correct/s.all*100):'—'}${s.all?'%':''}</b><span>已作答正确率</span></div></div><section class="panel" style="margin-top:20px"><div class="smallhead">Breakdown / 分章记录</div>${CH.map((c,i)=>{let x=unitStats(i);return `<div class="review-entry"><div class="review-info"><strong>${esc(c.title)}</strong><small>${x.done}/${x.total} 已做，正确 ${x.good} · ${esc(c.pages)}</small><div class="progress" style="max-width:420px"><div class="bar" style="width:${x.done/x.total*100}%"></div></div></div><button class="quiet-button" data-unit="${i}">前往</button></div>`}).join('')}</section><section class="panel"><div class="smallhead">Mistakes / 错题本</div><h2 class="panel-title">${wrong.length} 道需要回看</h2>${wrong.length?`<div class="review-list">${wrong.map(w=>`<div class="review-entry"><div class="review-info"><strong>${esc(w.title)}</strong><small>第 ${w.u+1} 章 · ${esc(w.kind==='cloze'?'补全单词':'阅读题')} · 正解 ${esc(w.answer)}</small><small>${esc(w.why)}</small></div><button class="quiet-button" data-review="${w.u},${w.kind},${w.index}">回看</button></div>`).join('')}</div>`:'<p class="muted">目前还没有错题。做完章节后，这里会自动收集失分点。</p>'}</section><section class="panel"><div class="smallhead">Export / 导出记录</div><p class="muted">导出完整的题号、你的答案、正确答案、中文解析及原文页码，方便上传到聊天框进一步分析。</p><div class="hero-actions"><button class="primary" data-action="export">下载 TXT 复盘报告</button><button class="secondary" data-action="synthesis">综合测试</button><button class="quiet-button" data-action="reset" style="color:#a15445">清空本套练习记录</button></div></section>`;return html;}
function render(){updateNav();$('app').innerHTML=state.view==='home'?hero():state.view==='unit'?renderUnit():state.view==='synthesis'?renderSynthesis():renderDash();if(state.view==='unit'&&state.tab==='cloze')initWord();}
function checkMC(u,i,j){let key=mcKey(u,i);if(state.mc[key])return;const q=u===10?SYN[i]:CH[u].questions[i];state.mc[key]={a:j,ok:j===q.a,at:Date.now()};save();const parent=$('question-'+key);if(parent){const newer=document.createElement('div');newer.innerHTML=mcCard(q,u,i);parent.replaceWith(newer.firstElementChild)}const next=document.querySelector('#question-'+key+' + .question');if(!state.mc[key].ok)showToast('本题已批改 · 查看解析');}
function initWord(){const fields=[...document.querySelectorAll('[data-cloze]')];let next=fields.findIndex(x=>!x.disabled);activeWord=next<0?0:next;document.querySelectorAll('.word').forEach(w=>w.addEventListener('click',e=>{if(e.target.matches('button'))return;activeWord=Number(w.dataset.wordIndex);showWord(activeWord)}));fields.forEach(el=>{el.addEventListener('focus',()=>{activeWord=Number(el.dataset.cloze.split(',')[1]);if(state.cloze[clKey(state.unit,activeWord)])showWord(activeWord)});el.addEventListener('input',()=>{const [u,i]=el.dataset.cloze.split(',').map(Number),w=CH[u].defs[i].w;clearTimeout(wordTimer);if(!state.cloze[clKey(u,i)]&&el.value.trim().length===missing(w).length)wordTimer=setTimeout(()=>checkWord(u,i,false),450)});el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const [u,i]=el.dataset.cloze.split(',').map(Number);checkWord(u,i,false)}})});
if(fields[activeWord]?.disabled)showWord(activeWord);}
function showWord(i){if(state.view!=='unit'||state.tab!=='cloze')return;const ch=CH[state.unit],r=state.cloze[clKey(state.unit,i)],d=ch.defs[i],el=$('wordFeedback');if(!d||!el)return;el.className='answer-card '+(r&&!r.ok?'warn':'');if(r){el.innerHTML=`<h4>${r.ok?'✓ 正确':'× 需复习'} · ${esc(d.w)}</h4><p>你的答案：${esc(r.typed||'（直接查看答案）')} · 正确补全：${esc(missing(d.w))}</p><p><b>中文释义：</b>${esc(d.meaning)}</p><p><b>词形与语法：</b>${esc(d.why)}</p>`;}else{el.innerHTML='<h4>正在填写第 '+(i+1)+' 个单词</h4><p>根据前后语境与已给字母，输入剩余 '+missing(d.w).length+' 个字母。输入后按 Enter 可以立即批改。</p>';}}
function checkWord(u,i,reveal){const ch=CH[u],key=clKey(u,i);if(state.cloze[key]){showWord(i);return}const d=ch.defs[i],node=document.querySelector('input[data-cloze="'+u+','+i+'"]');if(!node)return;let typed=node.value.trim().replace(/\s+/g,'').toLowerCase();const word=d.w.toLowerCase(),part=missing(word).toLowerCase();if(!reveal&&!typed){showToast('请先输入字母，也可以点「查看答案」');return}const ok=!reveal&&(typed===part||typed===word);state.cloze[key]={typed:typed,ok,at:Date.now(),reveal:!!reveal};save();const wrap=$('w-'+i);wrap.classList.add(ok?'correct':'wrong');node.disabled=true;if(reveal){node.value=part;node.setAttribute('data-reveal','true')}else node.value=typed;let btn=document.createElement('button');btn.type='button';btn.className='word-reveal';btn.dataset.word=String(i);btn.textContent=ok?'✓':'×';btn.title='查看词语解释';wrap.appendChild(btn);activeWord=i;showWord(i);const unans=[...document.querySelectorAll('[data-cloze]')].filter(x=>!x.disabled);if(unans.length){}if(reveal)showToast('已显示正确答案，计为主动查看');else showToast(ok?'正确 · 已显示语法解释':'已批改 · 请看正确答案与原因');const all=CH[u].defs.filter((_,j)=>state.cloze[clKey(u,j)]).length;const p=document.querySelector('.panel .progress .bar');if(p)p.style.width=(all*10)+'%';}
function skipToNext(){const nodes=[...document.querySelectorAll('[data-cloze]')];if(!nodes.length)return;const n=nodes.find(x=>!x.disabled&&Number(x.dataset.cloze.split(',')[1])>activeWord)||nodes.find(x=>!x.disabled);if(n){n.focus();n.scrollIntoView({behavior:'smooth',block:'center'})}else showToast('本章十个词已全部批改')}
function exportTxt(){const lines=['Robert Morris · The Present Tense of Space (1978)','TOEFL-style Close Reading Report','Generated: '+new Date().toLocaleString('zh-CN'),'本套由原论文改写生成；所有题目和评分均非官方。',''];const s=answers();lines.push('SUMMARY  '+s.correct+' correct / '+s.all+' answered / 161 total','TIME  '+timeText(state.seconds),'');CH.forEach((ch,u)=>{lines.push('\n=== '+ch.title+' | SOURCE '+ch.pages+' ===','CHAPTER THESIS: '+ch.thesis,'','READING');ch.questions.forEach((q,i)=>{let r=state.mc[mcKey(u,i)];lines.push('R-'+(u+1)+'-'+(i+1)+' '+q.q,'MY ANSWER: '+(r?'ABCD'[r.a]:'UNANSWERED'),'CORRECT: '+'ABCD'[q.a]+' '+q.opts[q.a],'EXPLANATION: '+q.why,'')});lines.push('CLOZE');ch.defs.forEach((d,i)=>{let r=state.cloze[clKey(u,i)];lines.push('C-'+(u+1)+'-'+(i+1)+' / '+d.w,'MY ANSWER: '+(r?(r.typed||'ANSWER REVEALED'):'UNANSWERED'),'CORRECT: '+d.w,'MEANING: '+d.meaning,'GRAMMAR: '+d.why,'')})});lines.push('\n=== SYNTHESIS ===');SYN.forEach((q,i)=>{let r=state.mc[mcKey(10,i)];lines.push('S'+(i+1)+' '+q.q,'MY ANSWER: '+(r?'ABCD'[r.a]:'UNANSWERED'),'CORRECT: '+'ABCD'[q.a]+' '+q.opts[q.a],'EXPLANATION: '+q.why,'')});const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Morris_Present_Tense_of_Space_TOEFL_161_Report.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-unit')){go('unit',Number(b.dataset.unit),'reading');return}if(b.hasAttribute('data-tab')){go('unit',state.unit,b.dataset.tab);return}if(b.hasAttribute('data-mc')){checkMC(...b.dataset.mc.split(',').map(Number));return}if(b.hasAttribute('data-word')){activeWord=Number(b.dataset.word);showWord(activeWord);return}if(b.hasAttribute('data-review')){const [u,kind,i]=b.dataset.review.split(',');if(Number(u)===10){go('synthesis');setTimeout(()=>$('question-'+mcKey(10,Number(i)))?.scrollIntoView({block:'start'}),40);}else{go('unit',Number(u),kind==='cloze'?'cloze':'reading');if(kind==='reading')setTimeout(()=>$('question-'+mcKey(Number(u),Number(i)))?.scrollIntoView({block:'start'}),40);else{activeWord=Number(i);setTimeout(()=>{$('w-'+i)?.scrollIntoView({block:'center'});showWord(Number(i))},40);}}return}const action=b.dataset.action;if(!action)return;switch(action){case'home':go('home');break;case'dashboard':go('dashboard');break;case'synthesis':go('synthesis');break;case'check-word':if(activeWord<0){showToast('请先选择一个填词空格');break;}checkWord(state.unit,activeWord,false);break;case'reveal-word':if(activeWord<0){showToast('请先选择一个填词空格');break;}checkWord(state.unit,activeWord,true);break;case'next-blank':skipToNext();break;case'export':exportTxt();break;case'reset':if(confirm('确定清空这套161题的全部作答记录吗？此操作无法撤销。')){state.mc={};state.cloze={};state.seconds=0;go('dashboard');showToast('练习记录已重置')}break;}});
$('mobileChapters').addEventListener('change',e=>{const v=e.target.value;if(/^\d+$/.test(v))go('unit',Number(v),'reading');else go(v)});
render();window.MORRIS_TEST_API={chapters:CH.length,mc:CH.reduce((a,c)=>a+c.questions.length,0),cloze:CH.reduce((a,c)=>a+c.defs.length,0),synthesis:SYN.length,stats:answers,go,checkMC,checkWord,state};
})();
</script>
