name: Optimize Folly score frames

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-folly-score-frames.yml'
      - 'works/ruin-garden/score-1/*.webp'
      - 'works/ruin-garden/score-2/*.webp'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: folly-score-frame-optimization
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out score originals
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image processor
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Make lightweight, color-preserving WebPs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          root = Path("works/ruin-garden")
          groups = (
              ("score-1", 15, "score-1-{}.webp", 1000),
              ("score-2", 22, "{}.webp", 1680),
          )
          for folder, count, naming, max_width in groups:
              destination = root / folder / "optimized"
              destination.mkdir(parents=True, exist_ok=True)
              for index in range(1, count + 1):
                  filename = naming.format(index)
                  source = root / folder / filename
                  if not source.is_file():
                      raise FileNotFoundError(source)
                  with Image.open(source) as original:
                      image = ImageOps.exif_transpose(original)
                      # Preserve transparency, including palette transparency.
                      if image.mode == "P":
                          image = image.convert("RGBA" if "transparency" in image.info else "RGB")
                      elif image.mode not in ("RGB", "RGBA"):
                          image = image.convert("RGBA" if "A" in image.getbands() else "RGB")
                      if image.width > max_width:
                          height = max(1, round(image.height * max_width / image.width))
                          image = image.resize((max_width, height), Image.Resampling.LANCZOS)
                      output = destination / filename
                      # Strip potentially incompatible ICC metadata by default.
                      image.save(output, format="WEBP", quality=83, method=5, exact=True)
                      print(f"{source} -> {output}: {image.width}x{image.height}, {output.stat().st_size} bytes")
          PY
      - name: Publish generated frames to the website repository
        shell: bash
        run: |
          set -euo pipefail
          git add works/ruin-garden/score-1/optimized works/ruin-garden/score-2/optimized
          if git diff --cached --quiet; then
            echo "No optimized frames changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate optimized display frames for both Folly scores"
          git pull --rebase origin main
          git push origin HEAD:main
