const BANK=[{"id":"N2-001","cat":"vocab","kind":"漢字の読み","stem":"海辺の施設は長い間【放置】されていた。","options":["ほうち","ほうじ","はなち","ほち"],"answer":0,"exp":"「放置（ほうち）」＝放任不管。「放」读ほう、「置」读ち。常见搭配：放置する／放置された建物。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L1","extra":false,"level":"N2"},{"id":"N2-002","cat":"vocab","kind":"漢字の読み","stem":"現地で周辺の【状況】を確認した。","options":["じょうきょ","じょうきょう","しょうきょう","じょきょう"],"answer":1,"exp":"「状況（じょうきょう）」＝情况。注意末尾是长音「きょう」，不是「きょ」。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L2","extra":false,"level":"N2"},{"id":"N2-003","cat":"vocab","kind":"漢字の読み","stem":"古い設備の【維持】には費用がかかる。","options":["いし","いじ","ゆいじ","ういち"],"answer":1,"exp":"「維持（いじ）」＝维持。与「意地（いじ，固执）」同音，但汉字和用法不同。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L3","extra":false,"level":"N2"},{"id":"N2-004","cat":"vocab","kind":"漢字の読み","stem":"安全のために立ち入りを【制限】した。","options":["せいげん","せいけん","せんげん","ぜいげん"],"answer":0,"exp":"「制限（せいげん）」＝限制。「宣言（せんげん）」＝声明，常见混淆。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L4","extra":false,"level":"N2"},{"id":"N2-005","cat":"vocab","kind":"漢字の読み","stem":"資料を読んで作品の【意図】を理解した。","options":["いど","いず","いと","いとう"],"answer":2,"exp":"「意図（いと）」＝意图；「意図する」＝打算、意在。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L5","extra":false,"level":"N2"},{"id":"N2-006","cat":"vocab","kind":"表記","stem":"この問題を【かいけつ】するには時間が必要だ。","options":["解結","解決","開決","改結"],"answer":1,"exp":"「解決（かいけつ）」：处理或解决问题。与「結論（けつろん）」中的「結」不同。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L6","extra":false,"level":"N2"},{"id":"N2-007","cat":"vocab","kind":"表記","stem":"研究室の【せつび】を点検した。","options":["設置","設備","摂備","説備"],"answer":1,"exp":"「設備（せつび）」＝设备。設置（せっち）＝安装，读音和含义不同。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L7","extra":false,"level":"N2"},{"id":"N2-008","cat":"vocab","kind":"表記","stem":"作業に参加する人数を【せいげん】する。","options":["制限","制減","製限","正現"],"answer":0,"exp":"「制限（せいげん）」限制数量；「減少（げんしょう）」是减少，不可写作「制減」。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L8","extra":false,"level":"N2"},{"id":"N2-009","cat":"vocab","kind":"表記","stem":"【ちょうさ】の結果を発表した。","options":["長査","調査","超査","頂査"],"answer":1,"exp":"「調査（ちょうさ）」调查。調べる／調査する属于同一词族。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L9","extra":false,"level":"N2"},{"id":"N2-010","cat":"vocab","kind":"表記","stem":"台風の進路を【よそく】した。","options":["予測","余側","予則","預測"],"answer":0,"exp":"「予測（よそく）」预测。「予想」也指预料，但「予測」更强调利用数据推测。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L10","extra":false,"level":"N2"},{"id":"N2-011","cat":"vocab","kind":"語形成","stem":"この地域では、住民の（　）高齢化が問題になっている。","options":["超","低","逆","再"],"answer":0,"exp":"「超高齢化」是固定复合词，表示超高龄化；「再高齢化」「低高齢化」不自然。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L11","extra":false,"level":"N2"},{"id":"N2-012","cat":"vocab","kind":"語形成","stem":"以前公開した資料を修正し、国内外に（　）公開した。","options":["無","大","再","未"],"answer":2,"exp":"「再公開する」＝再次公开；「大公開」虽可用作宣传语，但此处「研究成果を国内外に大公開した」语体不自然。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L12","extra":false,"level":"N2"},{"id":"N2-013","cat":"vocab","kind":"語形成","stem":"建物の（　）利用について話し合った。","options":["再","半","否","無"],"answer":0,"exp":"「再利用」＝再使用、再利用。废弃建筑经过整修后可「再利用」する。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L13","extra":false,"level":"N2"},{"id":"N2-014","cat":"vocab","kind":"語形成","stem":"美術館では作品の（　）展示を行った。","options":["準","特別","否","当"],"answer":1,"exp":"「特別展示」＝特别展览；「準展示」「否展示」不是自然的常用搭配。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L14","extra":false,"level":"N2"},{"id":"N2-015","cat":"vocab","kind":"語形成","stem":"資料の（　）整理を担当した。","options":["未","再","過","難"],"answer":1,"exp":"「再整理」＝重新整理。表示工作已整理过但需要重新排列、分类。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L15","extra":false,"level":"N2"},{"id":"N2-016","cat":"vocab","kind":"文脈に合う語","stem":"海に近い建物では、金属が（　）しやすい。","options":["腐食","増殖","成長","拡散"],"answer":0,"exp":"「腐食（ふしょく）」＝腐蚀，常与金属和盐分搭配。増殖＝增殖；成長＝成长；拡散＝扩散。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L16","extra":false,"level":"N2"},{"id":"N2-017","cat":"vocab","kind":"文脈に合う語","stem":"展示会の準備は予定より（　）進んでいる。","options":["順調に","慎重に","永久に","突然に"],"answer":0,"exp":"「順調に進む」＝进展顺利；慎重に＝谨慎地，是做事态度，不代表进度良好。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L17","extra":false,"level":"N2"},{"id":"N2-018","cat":"vocab","kind":"文脈に合う語","stem":"急な変更で参加者に（　）をかけてしまった。","options":["手間","迷惑","印象","意識"],"answer":1,"exp":"「迷惑をかける」固定搭配＝给别人添麻烦；「手間をかける」是费工夫，不等同于造成困扰。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L18","extra":false,"level":"N2"},{"id":"N2-019","cat":"vocab","kind":"文脈に合う語","stem":"会議では予算についてさまざまな（　）が出た。","options":["意見","状況","習慣","原因"],"answer":0,"exp":"「意見が出る」意见被提出；「原因が出る」不是普通会议语境的搭配。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L19","extra":false,"level":"N2"},{"id":"N2-020","cat":"vocab","kind":"文脈に合う語","stem":"調査の経過を後から確認できるように、観測中の風の強さや音を（　）した。","options":["比較","記録","回避","調査"],"answer":1,"exp":"「風の強さや音を記録する」表示把观测内容记录下来，目的是之后能够核对调查经过。「調査する」指调查现象本身，与后续查看观测记录的目的不同。","topic":"废墟・材料","passage":"","translation":"","tip":"比較する通常要有比较对象，如「二つの地点の風速を比較する」。","wrong":[],"audio":"","group":"L20","extra":false,"level":"N2"},{"id":"N2-021","cat":"vocab","kind":"文脈に合う語","stem":"長期間使われなかった施設は、設備が（　）していた。","options":["老朽化","理想化","多様化","簡略化"],"answer":0,"exp":"「老朽化（ろうきゅうか）」＝因年代久远而老旧。理想化/多様化/簡略化不符合「長期間使われなかった」背景。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L21","extra":false,"level":"N2"},{"id":"N2-022","cat":"vocab","kind":"文脈に合う語","stem":"安全上の理由から、立ち入りを一時（　）した。","options":["納得","許可","禁止","依頼"],"answer":2,"exp":"「立ち入りを禁止する」禁止进入；「許可」是允许，与「安全上の理由」不吻合。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L22","extra":false,"level":"N2"},{"id":"N2-023","cat":"vocab","kind":"言い換え・類義","stem":"この計画には【大幅な】変更が必要だ。","options":["小さな","大きな","細かい","一時的な"],"answer":1,"exp":"「大幅な」＝幅度很大，最接近「大きな」。与「細かい（细小的）」相反。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L23","extra":false,"level":"N2"},{"id":"N2-024","cat":"vocab","kind":"言い換え・類義","stem":"提出期限を【延長】することになった。","options":["早める","取り消す","遅くする","守る"],"answer":2,"exp":"「延長する」＝延长期限，即推迟截止时间；不是取消或提前。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L24","extra":false,"level":"N2"},{"id":"N2-025","cat":"vocab","kind":"言い換え・類義","stem":"雨が降ったため、予定を【変更】した。","options":["変えた","続けた","決めた","知らせた"],"answer":0,"exp":"「変更する」＝改变，「変える」是直接的同义表达。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L25","extra":false,"level":"N2"},{"id":"N2-026","cat":"vocab","kind":"言い換え・類義","stem":"説明が【曖昧】で、よく理解できなかった。","options":["具体的","不明確","丁寧","正確"],"answer":1,"exp":"「曖昧（あいまい）」＝含糊、不明确；「不明確」最接近。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L26","extra":false,"level":"N2"},{"id":"N2-027","cat":"vocab","kind":"言い換え・類義","stem":"実験の結果は【予想外】だった。","options":["予測していた通り","計画通り","思っていたのと違う","十分に検討した"],"answer":2,"exp":"「予想外」＝出乎预料；与「思っていたのと違う」同义。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L27","extra":false,"level":"N2"},{"id":"N2-028","cat":"vocab","kind":"語の使い方","stem":"「携わる」の使い方として最も適切なものはどれか。","options":["彼は地域の建築調査に携わっている。","机が部屋の隅に携わっている。","彼女は荷物を携わって駅に向かった。","新しい機械を携わって使った。"],"answer":0,"exp":"「携わる（たずさわる）」＝参与某项工作／事业；接「～に携わる」。不表示物体的位置或携带物品。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L28","extra":false,"level":"N2"},{"id":"N2-029","cat":"vocab","kind":"語の使い方","stem":"「踏まえる」の使い方として最も適切なものはどれか。","options":["昨日の雨を踏まえて靴が濡れた。","調査結果を踏まえて計画を見直した。","信号を踏まえて道を渡った。","材料を踏まえて箱に入れた。"],"answer":1,"exp":"「踏まえる」＝以事实、结果、前提为依据；「～を踏まえて判断する／見直す」。不是实际踩踏。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L29","extra":false,"level":"N2"},{"id":"N2-030","cat":"vocab","kind":"語の使い方","stem":"「見込む」の使い方として最も適切なものはどれか。","options":["今朝、友人を駅まで見込んだ。","紙を箱に見込んだ。","来場者は約千人と見込まれている。","昼食を見込んで食べた。"],"answer":2,"exp":"「見込む」＝预计、预期；「～と見込まれる」预计为……，常用于人数、费用、收益。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L30","extra":false,"level":"N2"},{"id":"N2-031","cat":"vocab","kind":"語の使い方","stem":"「さえぎる」の使い方として最も適切なものはどれか。","options":["木々が強い日差しをさえぎっている。","先生は宿題をさえぎって配った。","仕事が終わってから昼食をさえぎった。","彼は毎朝七時に目をさえぎる。"],"answer":0,"exp":"「遮る（さえぎる）」＝阻挡光、风、声音，或打断谈话；「日差しを遮る」自然。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L31","extra":false,"level":"N2"},{"id":"N2-032","cat":"vocab","kind":"語の使い方","stem":"「とどまる」の使い方として最も適切なものはどれか。","options":["海水をコップにとどまった。","彼は説明をとどまって話した。","被害は小規模な範囲にとどまった。","写真をとどまって印刷した。"],"answer":2,"exp":"「とどまる」＝停留在某范围或程度；「～にとどまる」。不表示把海水倒入容器。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L32","extra":false,"level":"N2"},{"id":"N2-033","cat":"grammar","kind":"文の文法①","stem":"この建物の調査を始める（　）、安全管理者に相談してください。","options":["にあたって","ところで","にすぎず","ばかりに"],"answer":0,"exp":"「V辞書形＋にあたって」＝在开始某项重要活动时。后接需要预先进行的行为；「ところで」表示即使……也，并不合语境。","topic":"日常・社会","passage":"","translation":"","tip":"接续：調査を始めるにあたって／調査にあたって。","wrong":[],"audio":"","group":"L33","extra":false,"level":"N2"},{"id":"N2-034","cat":"grammar","kind":"文の文法①","stem":"風が強くなってきたので、屋外での作業を中止せ（　）。","options":["ざるを得ない","ないことはない","ないわけではない","るに違いない"],"answer":0,"exp":"「Vない形（ない→ず）＋ざるを得ない」＝不得不。する→せざるを得ない（特别变化）。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L34","extra":false,"level":"N2"},{"id":"N2-035","cat":"grammar","kind":"文の文法①","stem":"何度も確認した（　）、資料の数値には誤りが見つからなかった。","options":["にとって","うえで","ところ","ものの"],"answer":3,"exp":"「～ものの」表示转折：虽然反复确认，但最终还是没有找到错误。「にとって」要接名词，不能直接接「確認した」。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L35","extra":false,"level":"N2"},{"id":"N2-036","cat":"grammar","kind":"文の文法①","stem":"この装置は便利な（　）、定期的な点検が必要だ。","options":["反面","うちに","限り","せいで"],"answer":0,"exp":"「～反面」＝一方面……另一方面……。便利与需要维护是并列对比；「せいで」需有负面原因结果。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L36","extra":false,"level":"N2"},{"id":"N2-037","cat":"grammar","kind":"文の文法①","stem":"参加者の増加に（　）、展示室の利用時間を延ばした。","options":["つれて","伴って","よっても","限って"],"answer":1,"exp":"「N＋に伴って」＝随着某种变化而发生另一变化；「増加に伴って」固定书面搭配。「につれて」要接动词/名词表达如「増えるにつれて」。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L37","extra":false,"level":"N2"},{"id":"N2-038","cat":"grammar","kind":"文の文法①","stem":"先生の説明を聞いた（　）、疑問がすべて解消したわけではない。","options":["からといって","に従って","ところで","ついでに"],"answer":0,"exp":"「～からといって、必ずしも～わけではない」＝不能因为……就断定……。「聞いたからといって」明确反驳简单因果推断。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L38","extra":false,"level":"N2"},{"id":"N2-039","cat":"grammar","kind":"文の文法①","stem":"この公園は子ども（　）、高齢者にも利用されている。","options":["からには","に限らず","にわたって","かねて"],"answer":1,"exp":"「N＋に限らず」＝不仅限于……；「子どもに限らず、高齢者にも」自然。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L39","extra":false,"level":"N2"},{"id":"N2-040","cat":"grammar","kind":"文の文法①","stem":"提出された資料は、内容を確認した（　）公開します。","options":["上で","おかげで","ばかりに","ところを"],"answer":0,"exp":"「Vた形＋上で」＝完成前一动作后，再进行下一动作；强调步骤。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L40","extra":false,"level":"N2"},{"id":"N2-041","cat":"grammar","kind":"文の文法①","stem":"あの研究者は長年現場を調べてきただけ（　）、説明に説得力がある。","options":["で","あって","に","か"],"answer":1,"exp":"「～だけあって」＝不愧是／正因为具有某经历，结果符合期待；接「だけあって」。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L41","extra":false,"level":"N2"},{"id":"N2-042","cat":"grammar","kind":"文の文法①","stem":"問題がこれ以上深刻化すれば、計画の延期もあり（　）。","options":["かねない","そうもない","得る","うるまい"],"answer":2,"exp":"「Vます形＋得る（える／うる）」＝有可能发生；「あり得る」。注意「ありかねない」不是标准表达，かねない接「起こりかねない」。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L42","extra":false,"level":"N2"},{"id":"N2-043","cat":"grammar","kind":"文の文法①","stem":"準備が整い（　）、詳しい日程をご連絡します。","options":["次第","以来","途中","ほど"],"answer":0,"exp":"「Vます形＋次第」＝一……就立刻……（正式通知常见）；「整い次第」正确。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L43","extra":false,"level":"N2"},{"id":"N2-044","cat":"grammar","kind":"文の文法①","stem":"この作品は美しい（　）、修復には多くの課題が残っている。","options":["一方で","だけに","ところを","ことから"],"answer":0,"exp":"「～一方で」＝另一方面；既承认美感，也指出修复困难。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L44","extra":false,"level":"N2"},{"id":"N2-045","cat":"grammar","kind":"文の文法②（★排序）","stem":"海沿いに建つ古い建物の壁に ____ ____ ★ ____ 気づいた。","options":["ひびが","ことに","小さな","入っている"],"answer":3,"exp":"完整顺序：壁に【小さな → ひびが → 入っている → ことに】気づいた。★是第三个「入っている」。关键搭配「～ことに気づく」。","topic":"废墟・材料","passage":"","translation":"","tip":"四个词块必须各用一次，排成自然句子；选择放在 ★ 位置的词块。","wrong":["先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。"],"audio":"","group":"L45","extra":false,"level":"N2"},{"id":"N2-046","cat":"grammar","kind":"文の文法②（★排序）","stem":"私は、その作品が ____ ____ ★ ____ ようになった。","options":["動かすのかを","人の心を","考える","なぜ"],"answer":0,"exp":"完整顺序：作品が【なぜ → 人の心を → 動かすのかを → 考える】ようになった。「疑问词＋普通形＋か」嵌入间接疑问。","topic":"废墟・材料","passage":"","translation":"","tip":"四个词块必须各用一次，排成自然句子；选择放在 ★ 位置的词块。","wrong":["先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。"],"audio":"","group":"L46","extra":false,"level":"N2"},{"id":"N2-047","cat":"grammar","kind":"文の文法②（★排序）","stem":"安全性を確認せずに ____ ____ ★ ____ わけにはいかない。","options":["危険な","場所へ","学生を","入れる"],"answer":2,"exp":"完整顺序：【危険な → 場所へ → 学生を → 入れる】わけにはいかない。结构「V辞書形＋わけにはいかない」＝基于常识、责任不能这样做。","topic":"废墟・材料","passage":"","translation":"","tip":"四个词块必须各用一次，排成自然句子；选择放在 ★ 位置的词块。","wrong":["先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。"],"audio":"","group":"L47","extra":false,"level":"N2"},{"id":"N2-048","cat":"grammar","kind":"文の文法②（★排序）","stem":"長年使われていない設備を ____ ____ ★ ____ 難しい。","options":["動かす","再び","のは","そのまま"],"answer":0,"exp":"完整顺序：設備を【そのまま → 再び → 動かす → のは】難しい。「V辞書形＋のは＋形容词」，将动作名词化。","topic":"废墟・材料","passage":"","translation":"","tip":"四个词块必须各用一次，排成自然句子；选择放在 ★ 位置的词块。","wrong":["先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。"],"audio":"","group":"L48","extra":false,"level":"N2"},{"id":"N2-049","cat":"grammar","kind":"文の文法②（★排序）","stem":"計画を進める前に ____ ____ ★ ____ 必要がある。","options":["住民に","説明を","する","周辺の"],"answer":1,"exp":"完整顺序：【周辺の → 住民に → 説明を → する】必要がある。「V辞書形＋必要がある」表示有必要做。","topic":"废墟・材料","passage":"","translation":"","tip":"四个词块必须各用一次，排成自然句子；选择放在 ★ 位置的词块。","wrong":["先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。"],"audio":"","group":"L49","extra":false,"level":"N2"},{"id":"N2-050","cat":"grammar","kind":"文章の文法","stem":"文章中の【A】に入る最も適切なものを選びなさい。","options":["にもかかわらず","とともに","にかけて","に限って"],"answer":0,"exp":"「放置されていたにもかかわらず、外観はよく残っている」＝虽然长期闲置，外观却保持良好。","topic":"废墟・材料","passage":"ある町では、使われなくなった倉庫を展示室として活用する計画が進んでいる。建物は長年放置されていた【A】、外観は比較的よく残っている。しかし、内部の設備は古く、来場者を迎える前に点検が必要だ。担当者は安全性を確認した【B】、公開できる範囲を決めるという。\n一方、市民からは「古さをすべて消してほしくない」という声も上がった。そこで、設計者は建物の傷を【C】残す方法を検討している。修復によって空間が安全になる【D】、その場所の歴史まで見えなくなるのは避けたいからだ。今回の計画は、建物をただ新しくする【E】、過去の痕跡と現在の利用を両立させようとする試みである。","translation":"","tip":"文章语法要回到前后句找逻辑关系；单看语法接续往往有多个看似可能的选项。","wrong":[],"audio":"","group":"L50","extra":false,"level":"N2"},{"id":"N2-051","cat":"grammar","kind":"文章の文法","stem":"文章中の【B】に入る最も適切なものを選びなさい。","options":["ように","うえで","ばかりに", 者を迎える前に点検が必要だ。担当者は安全性を確認した【B】、公開できる範囲を決めるという。\n一方、市民からは「古さをすべて消してほしくない」という声も上がった。そこで、設計者は建物の傷を【C】残す方法を検討している。修復によって空間が安全になる【D】、その場所の歴史まで見えなくなるのは避けたいからだ。今回の計画は、建物をただ新しくする【E】、過去の痕跡と現在の利用を両立させようとする試みである。","translation":"","tip":"文章语法要回到前后句找逻辑关系；单看语法接续往往有多个看似可能的选项。","wrong":[],"audio":"","group":"L54","extra":false,"level":"N2"},{"id":"N2-055","cat":"reading","kind":"内容理解（短文）","stem":"大型の作品を搬入する学生は、何をしなければならないか。","options":["金曜日の午後五時以降に搬入する","前日までに搬入口を予約する","土曜日までに照明を調整する","会場の鍵を受付で借りる"],"answer":1,"exp":"「大型の作品を搬入する場合は、前日までに受付へ連絡し、搬入口を予約する必要がある」が直接依据。照明调整与搬入口不是同一事项。","topic":"大学・展示","passage":"大学のギャラリーでは、来週から学生作品の展示が始まる。作品の設置は金曜日の午後五時までに終えること。ただし、照明の調整については土曜日の午前中も担当者が対応する。大型の作品を搬入する場合は、前日までに受付へ連絡し、搬入口を予約する必要がある。会場の鍵は展示担当の職員が管理するため、学生が自由に持ち出すことはできない。","translation":"大型作品须提前一天预约搬入口，照明可周六调整，但布展须周五17:00前结束。","tip":"定位决定性语句；避免把可能性夸大成已经证实。","wrong":[],"audio":"","group":"L55","extra":false,"level":"N2"},{"id":"N2-056","cat":"reading","kind":"内容理解（短文）","stem":"この案内の内容と合っているものはどれか。","options":["本の貸し出しは午後八時まで可能だ","二階では普段どおり本が読める","夜間にも返却ポストを利用できる","図書館は今月から午後七時に閉まる"],"answer":2,"exp":"文中「返却は入口横のポストを利用すれば夜間でも可能」。借阅截至19:45，不是20:00；二楼阅览席停用。","topic":"校园・生活","passage":"駅前の図書館では、今月から閉館時間を午後七時から八時に変更した。ただし、資料の貸し出しは閉館十五分前までで、返却は入口横のポストを利用すれば夜間でも可能だ。また、館内の一部で工事が行われるため、二階の閲覧席は当面利用できない。最新の開館情報は図書館のウェブサイトで確認してほしい。","translation":"图书馆延时到20:00，但借阅截止19:45，夜间可用还书箱，二楼临时关闭。","tip":"定位决定性语句；避免把可能性夸大成已经证实。","wrong":[],"audio":"","group":"L56","extra":false,"level":"N2"},{"id":"N2-057","cat":"reading","kind":"内容理解（短文）","stem":"筆者がこの時点で判断したことは何か。","options":["音は確実に機械から出ている","風と音には関係がありそうだが原因は未確定だ","建物の内部には入っても安全だ","風の強さと音の大きさは無関係だ"],"answer":1,"exp":"「風が強まるたびに音も大きく」是观察相关；「原因を特定できたわけではない」明确未证因果。典型 N2 过度推断陷阱。","topic":"废墟・风声","passage":"海沿いの古い建物を訪れたとき、壁の隙間から低い音が聞こえた。最初は機械が動いているのかと思ったが、近づいてみると、風が強まるたびに音も大きくなっていた。ただし、それだけで音の原因を特定できたわけではない。記録を続け、風向きや周囲の環境との関係を確かめる必要があると感じた。","translation":"在海边旧建筑听到低鸣，声音随风变大，但尚不能确认机制。","tip":"定位决定性语句；避免把可能性夸大成已经证实。","wrong":[],"audio":"","group":"L57","extra":false,"level":"N2"},{"id":"N2-058","cat":"reading","kind":"内容理解（短文）","stem":"申し込みに関して正しいものはどれか。","options":["定員を超えたら早い者から選ばれる","電話申し込みは週末も可能だ","ネットが使えない人は電話で申し込める","結果は申し込み当日に必ず分かる"],"answer":2,"exp":"「インターネットを利用できない人は…電話で申し込むことができる」。先着順ではなく抽選。","topic":"公告・生活","passage":"市が運営する文化講座の申し込みは、原則としてウェブサイトで受け付ける。ただし、インターネットを利用できない人は、平日の午前九時から午後五時まで電話で申し込むことができる。申し込み人数が定員を超えた場合は抽選とし、先着順では決めない。結果は来月初めにメールまたは郵便で通知する。","translation":"网页优先报名；无法上网可平日电话报名；超额抽签；下月初通知。","tip":"定位决定性语句；避免把可能性夸大成已经证实。","wrong":[],"audio":"","group":"L58","extra":false,"level":"N2"},{"id":"N2-059","cat":"reading","kind":"内容理解（短文）","stem":"研究者が特に重視しているのは何か。","options":["古い写真だけで歴史を結論づけること","写真の数を増やすこと","過去の記録に加えて現在の変化を調べること","歴史的な建物をすべて建て直すこと"],"answer":2,"exp":"「だからこそ」之后是结论：听居民讲述、实地观察现状。不是拒绝照片，而是认为仅凭过去的静态记录不够。","topic":"废墟・时间","passage":"ある研究者は、古い写真を集めることだけでは地域の歴史を理解したことにはならないと言う。写真には撮影された瞬間が残るが、その後に場所がどう使われたのか、なぜ姿を変えたのかまでは写らない。だからこそ、住民の話を聞いたり、現在の景色を歩いて観察したりすることが重要なのだ。","translation":"照片记录瞬间，难呈现后续变化，因此要结合口述与当前的场所观察。","tip":"定位决定性语句；避免把可能性夸大成已经证实。","wrong":[],"audio":"","group":"L59","extra":false,"level":"N2"},{"id":"N2-060","cat":"reading","kind":"内容理解（中文）","stem":"筆者によると、舗装された場所では何が起こりやすいか。","options":["雨水が地下に入りにくい","どんな植物もすぐ育つ","人が歩けなくなる","風が常に弱くなる"],"answer":0,"exp":"第一段「舗装された地面では雨水が地下にしみ込みにくく」明确说明。","topic":"废墟・生态","passage":"都市の空き地に自然が戻ってくることを、単純に「緑が増えて良かった」と評価する人もいる。しかし、草や木が増える過程は場所によって大きく異なる。舗装された地面では雨水が地下にしみ込みにくく、根を伸ばせる場所も限られる。一方、建物が取り壊された後の土地には、土に含まれる種や、風に運ばれてきた種が芽を出す場合がある。\nこうした変化を観察する際には、植物の種類を数えるだけでは不十分だ。日当たりや水の流れ、以前そこに何が建っていたのかを調べることで、現在の風景がどう生まれたのかが少しずつ分かってくる。また、空き地を利用する人々の行動も変化に影響する。人がよく歩く場所には草が育ちにくいが、通らなくなった道では徐々に植物が広がることもある。\nこのように、都市の自然は人間の活動から切り離されたものではない。過去に造られた環境と現在の利用の仕方が、植物の成長と重なり合っている。だからこそ、空き地の変化を考えるには、自然だけでなく、その場所の使われ方にも目を向ける必要がある。","translation":"城市空地的植被变化受雨水、土壤、旧建设、行走路径等共同影响；认识城市自然不能脱离人的使用历史。","tip":"","wrong":[],"audio":"","group":"L60","extra":false,"level":"N2"},{"id":"N2-061","cat":"reading","kind":"内容理解（中文）","stem":"植物の種類を数えるだけでは不十分なのはなぜか。","options":["種類が多すぎて数えられないから","日当たりや過去の土地利用も変化に関わるから","すべて同じ種類の草だから","空き地には植物が生えないから"],"answer":1,"exp":"第二段举日照、水流、建筑历史及人的路径，说明需要考察形成条件，而非仅测数量。","topic":"废墟・生态","passage":"都市の空き地に自然が戻ってくることを、単純に「緑が増えて良かった」と評価する人もいる。しかし、草や木が増える過程は場所によって大きく異なる。舗装された地面では雨水が地下にしみ込みにくく、根を伸ばせる場所も限られる。一方、建物が取り壊された後の土地には、土に含まれる種や、風に運ばれてきた種が芽を出す場合がある。\nこうした変化を観察する際には、植物の種類を数えるだけでは不十分だ。日当たりや水の流れ、以前そこに何が建っていたのかを調べることで、現在の風景がどう生まれたのかが少しずつ分かってくる。また、空き地を利用する人々の行動も変化に影響する。人がよく歩く場所には草が育ちにくいが、通らなくなった道では徐々に植物が広がることもある。\nこのように、都市の自然は人間の活動から切り離されたものではない。過去に造られた環境と現在の利用の仕方が、植物の成長と重なり合っている。だからこそ、空き地の変化を考えるには、自然だけでなく、その場所の使われ方にも目を向ける必要がある。","translation":"城市空地的植被变化受雨水、土壤、旧建设、行走路径等共同影响；认识城市自然不能脱离人的使用历史。","tip":"","wrong":[],"audio":"","group":"L61","extra":false,"level":"N2"},{"id":"N2-062","cat":"reading","kind":"内容理解（中文）","stem":"文章全体で筆者が述べたいことは何か。","options":["都市の自然は人間と無関係にできる","空き地はすべて公園に変えるべきだ","都市の自然を理解するには人の活動と場所の歴史も見るべきだ","舗装を増やすと植物が育ちやすい"],"answer":2,"exp":"最后一段「自然だけでなく、その場所の使われ方にも目を向ける必要」是主张。","topic":"废墟・生态","passage":"都市の空き地に自然が戻ってくることを、単純に「緑が増えて良かった」と評価する人もいる。しかし、草や木が増える過程は場所によって大きく異なる。舗装された地面では雨水が地下にしみ込みにくく、根を伸ばせる場所も限られる。一方、建物が取り壊された後の土地には、土に含まれる種や、風に運ばれてきた種が芽を出す場合がある。\nこうした変化を観察する際には、植物の種類を数えるだけでは不十分だ。日当たりや水の流れ、以前そこに何が建っていたのかを調べることで、現在の風景がどう生まれたのかが少しずつ分かってくる。また、空き地を利用する人々の行動も変化に影響する。人がよく歩く場所には草が育ちにくいが、通らなくなった道では徐々に植物が広がることもある。\nこのように、都市の自然は人間の活動から切り離されたものではない。過去に造られた環境と現在の利用の仕方が、植物の成長と重なり合っている。だからこそ、空き地の変化を考えるには、自然だけでなく、その場所の使われ方にも目を向ける必要がある。","translation":"城市空地的植被变化受雨水、土壤、旧建设、行走路径等共同影响；认识城市自然不能脱离人的使用历史。","tip":"","wrong":[],"audio":"","group":"L62","extra":false,"level":"N2"},{"id":"N2-063","cat":"reading","kind":"内容理解（中文）","stem":"オンライン授業の利点として挙げられているものは何か。","options":["教員に必ず直接会えること","通学の負担が減ること","実験をすべて自宅で行えること","友人と話す時間が増えること"],"answer":1,"exp":"第一段前半：远程学生通学负担减轻；后面指出交流机会可能减少。","topic":"教育・社会","passage":"ある大学では、授業の一部をオンラインで受けられる仕組みを導入した。遠くに住む学生にとっては通学の負担が減り、録画を繰り返し視聴できるという利点もある。一方で、友人に質問したり、授業の前後に先生と話したりする機会が減ったという声も聞かれる。\nそこで大学は、すべての授業をオンラインに移すのではなく、講義の説明部分は録画で提供し、議論や実験を行う時間は教室に集まる方法を試している。学生は説明を自分の速さで理解した上で、対面の時間を他者との交流に使える。ただし、この方法がどの授業にも適しているとは限らない。例えば、実際に道具を操作することそのものが学習の中心となる科目では、早い段階から教員の指導が必要になる。\n授業方法を選ぶ際に大切なのは、新しい技術を使うこと自体を目標にしないことだ。学生が何を身につけるべきかを考え、そのために必要な環境を整える姿勢が求められる。","translation":"线上课程便利，但影响交流；大学混合录播讲授与教室讨论、实验。教学形式应根据学习目标而定。","tip":"","wrong":[],"audio":"","group":"L63","extra":false,"level":"N2"},{"id":"N2-064","cat":"reading","kind":"内容理解（中文）","stem":"大学が試している方法は何か。","options":["講義も実験もすべて録画にする","録画で説明を学び、議論などは教室で行う","授業の前後の交流を禁止する","すべての授業を対面だけに戻す"],"answer":1,"exp":"第二段「説明部分は録画」「議論や実験は教室」が组合关键。","topic":"教育・社会","passage":"ある大学では、授業の一部をオンラインで受けられる仕組みを導入した。遠くに住む学生にとっては通学の負担が減り、録画を繰り返し視聴できるという利点もある。一方で、友人に質問したり、授業の前後に先生と話したりする機会が減ったという声も聞かれる。\nそこで大学は、すべての授業をオンラインに移すのではなく、講義の説明部分は録画で提供し、議論や実験を行う時間は教室に集まる方法を試している。学生は説明を自分の速さで理解した上で、対面の時間を他者との交流に使える。ただし、この方法がどの授業にも適しているとは限らない。例えば、実際に道具を操作することそのものが学習の中心となる科目では、早い段階から教員の指導が必要になる。\n授業方法を選ぶ際に大切なのは、新しい技術を使うこと自体を目標にしないことだ。学生が何を身につけるべきかを考え、そのために必要な環境を整える姿勢が求められる。","translation":"线上课程便利，但影响交流；大学混合录播讲授与教室讨论、实验。教学形式应根据学习目标而定。","tip":"","wrong":[],"audio":"","group":"L64","extra":false,"level":"N2"},{"id":"N2-065","cat":"reading","kind":"内容理解（中文）","stem":"筆者が授業方法を決める際に重視するのは何か。","options":["最新技術を必ず導入すること","学ぶべき内容に合った環境を用意すること","学生を教室に集めないこと","録画の長さを統一すること"],"answer":1,"exp":"末段强调「新技术本身不是目标」，根据学习目的设计环境。","topic":"教育・社会","passage":"ある大学では、授業の一部をオンラインで受けられる仕組みを導入した。遠くに住む学生にとっては通学の負担が減り、録画を繰り返し視聴できるという利点もある。一方で、友人に質問したり、授業の前後に先生と話したりする機会が減ったという声も聞かれる。\nそこで大学は、すべての授業をオンラインに移すのではなく、講義の説明部分は録画で提供し、議論や実験を行う時間は教室に集まる方法を試している。学生は説明を自分の速さで理解した上で、対面の時間を他者との交流に使える。ただし、この方法がどの授業にも適しているとは限らない。例えば、実際に道具を操作することそのものが学習の中心となる科目では、早い段階から教員の指導が必要になる。\n授業方法を選ぶ際に大切なのは、新しい技術を使うこと自体を目標にしないことだ。学生が何を身につけるべきかを考え、そのために必要な環境を整える姿勢が求められる。","translation":"线上课程便利，但影响交流；大学混合录播讲授与教室讨论、实验。教学形式应根据学习目标而定。","tip":"","wrong":[],"audio":"","group":"L65","extra":false,"level":"N2"},{"id":"N2-066","cat":"reading","kind":"内容理解（中文）","stem":"塩分が鉄筋の周囲に達すると、何が起こることがあるか。","options":["鉄筋の腐食が進む","コンクリートが自動的に修復する","海風が弱まる","建物の設計図が完成する"],"answer":0,"exp":"第一段「塩分が…鉄筋の周囲に達すると…腐食が進む」，并说明锈膨胀可能导致裂缝。","topic":"废墟・盐害","passage":"海岸近くの構造物では、表面に大きな変化が見られなくても、内部で劣化が進むことがある。海から運ばれる塩分がコンクリートの隙間から入り、鉄筋の周囲に達すると、条件によっては金属の腐食が進む。腐食によって生じたさびは元の金属より体積が大きくなるため、周囲のコンクリートを押し、ひび割れを生じさせる場合がある。\nこのため、建物の状態を外観だけで判断するのは危険だ。表面の色や傷は参考になるものの、安全性を確かめるには専門的な調査が必要になる。特に、長い間利用されていない施設では、過去の修理記録や設計図が残っていないこともある。調査を行う際は、見えている変化と、目に見えない部分の可能性を分けて考えなければならない。\nまた、海風による音が聞こえたとしても、それだけで部材の状態を決めつけることはできない。音を記録することは変化を知る手がかりになるが、原因を調べるには風向きや部材の形状など、複数の条件を確認する必要がある。","translation":"沿海混凝土内部可能因氯盐侵入而导致钢筋腐蚀、锈胀和开裂。不能只凭外观或风声推断结构状态。","tip":"","wrong":[],"audio":"","group":"L66","extra":false,"level":"N2"},{"id":"N2-067","cat":"reading","kind":"内容理解（中文）","stem":"筆者が外観だけでの判断を危険だとする理由は何か。","options":["外から見えない部分でも劣化が進む可能性があるから","海辺には色の違う建物が多いから","写真撮影が難しいから","修理記録は必ず残っているから"],"answer":0,"exp":"文章明确区分可见的痕迹与内部劣化可能；外观好不等于结构安全。","topic":"废墟・盐害","passage":"海岸近くの構造物では、表面に大きな変化が見られなくても、内部で劣化が進むことがある。海から運ばれる塩分がコンクリートの隙間から入り、鉄筋の周囲に達すると、条件によっては金属の腐食が進む。腐食によって生じたさびは元の金属より体積が大きくなるため、周囲のコンクリートを押し、ひび割れを生じさせる場合がある。\nこのため、建物の状態を外観だけで判断するのは危険だ。表面の色や傷は参考になるものの、安全性を確かめるには専門的な調査が必要になる。特に、長い間利用されていない施設では、過去の修理記録や設計図が残っていないこともある。調査を行う際は、見えている変化と、目に見えない部分の可能性を分けて考えなければならない。\nまた、海風による音が聞こえたとしても、それだけで部材の状態を決めつけることはできない。音を記録することは変化を知る手がかりになるが、原因を調べるには風向きや部材の形状など、複数の条件を確認する必要がある。","translation":"沿海混凝土内部可能因氯盐侵入而导致钢筋腐蚀、锈胀和开裂。不能只凭外观或风声推断结构状态。","tip":"","wrong":[],"audio":"","group":"L67","extra":false,"level":"N2"},{"id":"N2-068","cat":"reading","kind":"内容理解（中文）","stem":"海風による音について筆者はどう述べているか。","options":["音だけで部材の安全性を判断できる","記録する意味がない","音は機械からしか生じない","音は手がかりになるが原因の確認には他の条件も必要だ"],"answer":3,"exp":"第三段：「手がかりになるが」后接必须核对风向、构件形状等条件。","topic":"废墟・盐害","passage":"海岸近くの構造物では、表面に大きな変化が見られなくても、内部で劣化が進むことがある。海から運ばれる塩分がコンクリートの隙間から入り、鉄筋の周囲に達すると、条件によっては金属の腐食が進む。腐食によって生じたさびは元の金属より体積が大きくなるため、周囲のコンクリートを押し、ひび割れを生じさせる場合がある。\nこのため、建物の状態を外観だけで判断するのは危険だ。表面の色や傷は参考になるものの、安全性を確かめるには専門的な調査が必要になる。特に、長い間利用されていない施設では、過去の修理記録や設計図が残っていないこともある。調査を行う際は、見えている変化と、目に見えない部分の可能性を分けて考えなければならない。\nまた、海風による音が聞こえたとしても、それだけで部材の状態を決めつけることはできない。音を記録することは変化を知る手がかりになるが、原因を調べるには風向きや部材の形状など、複数の条件を確認する必要がある。","translation":"沿海混凝土内部可能因氯盐侵入而导致钢筋腐蚀、锈胀和开裂。不能只凭外观或风声推断结构状态。","tip":"","wrong":[],"audio":"","group":"L68","extra":false,"level":"N2"},{"id":"N2-069","cat":"reading","kind":"統合理解（比较两文）","stem":"二人が共通して認めていることは何か。","options":["危険を考慮せず一般公開すべきだ","建物の安全性を考える必要がある","記録をすべて捨てるべきだ","建物は完全に取り壊すしかない"],"answer":1,"exp":"A主张「安全を優先」；B也明确「危険性を無視して公開すべきだとは思わない」。共同点是重视安全。","topic":"废墟・保护","passage":"【資料A：市の担当者の意見】\n使われなくなった公共施設を保存することには一定の価値がある。しかし、建物を維持するには費用がかかり、危険な部分をそのまま残すわけにはいかない。私たちは安全を優先し、必要に応じて建物の一部を取り除く方針だ。その一方で、建設当時の資料や住民の記憶を集め、建物が地域に果たしてきた役割を記録として残したい。\n\n【資料B：地域の研究者の意見】\n建物の危険性を無視して公開すべきだとは思わない。ただ、写真や文章で記録すれば、実物が持つ価値を十分に伝えられるとも限らない。ひび割れや使われた材料の質感は、長い時間がそこに積み重なったことを示している。安全な範囲を慎重に見極めながら、できる限り実物を残す選択肢も検討してほしい。","translation":"A 市政管理者优先安全与费用、以记录保留历史；B 研究者也重视安全，但强调实物裂痕和质地具有无法被照片完全替代的价值。","tip":"","wrong":[],"audio":"","group":"L69","extra":false,"level":"N2"},{"id":"N2-070","cat":"reading","kind":"統合理解（比较两文）","stem":"資料Bの研究者が資料Aと特に異なる点は何か。","options":["建物の写真の保存を全く認めない","施設の費用を重視している","実物が持つ質感や痕跡の価値をより重視している","市民の記憶を否定している"],"answer":2,"exp":"A倾向必要时拆除、以资料记录；B强调实物的裂痕和材质无法完全由影像替代。差异是实物遗存价值的权重。","topic":"废墟・保护","passage":"【資料A：市の担当者の意見】\n使われなくなった公共施設を保存することには一定の価値がある。しかし、建物を維持するには費用がかかり、危険な部分をそのまま残すわけにはいかない。私たちは安全を優先し、必要に応じて建物の一部を取り除く方針だ。その一方で、建設当時の資料や住民の記憶を集め、建物が地域に果たしてきた役割を記録として残したい。\n\n【資料B：地域の研究者の意見】\n建物の危険性を無視して公開すべきだとは思わない。ただ、写真や文章で記録すれば、実物が持つ価値を十分に伝えられるとも限らない。ひび割れや使われた材料の質感は、長い時間がそこに積み重なったことを示している。安全な範囲を慎重に見極めながら、できる限り実物を残す選択肢も検討してほしい。","translation":"A 市政管理者优先安全与费用、以记录保留历史；B 研究者也重视安全，但强调实物裂痕和质地具有无法被照片完全替代的价值。","tip":"","wrong":[],"audio":"","group":"L70","extra":false,"level":"N2"},{"id":"N2-071","cat":"reading","kind":"主張理解（長文）","stem":"筆者は、古い建物をすべて保存することについてどう考えているか。","options":["安全性や費用の問題があるため一律には決められない","どんな状況でも必ず保存すべきだ","必ず商業施設に改装するべきだ","住民の記憶は判断に関係しない"],"answer":0,"exp":"第二段「すべてを保存することが正しいとは言い切れない」，理由是费用与安全等；不是主张全部拆除。","topic":"废墟・场所记忆","passage":"私たちは普段、街の中を歩きながら建物を一つ一つ意識しているわけではない。駅から学校へ、あるいは家から職場へ向かう道では、目の前の空間を目的地までの通路として利用している。ところが、いつも通っていた店が閉まり、看板が外されたとき、急にその場所の存在に気づくことがある。何も変わらないように見えた通りにも、時間は積み重なっていたのである。\n古い建物を残すことについて、人々の意見が分かれるのは当然だ。そこに思い出がある人にとっては大切な風景でも、新しく移り住んだ人にとっては不便な施設にすぎないかもしれない。また、建物を修理して使い続けるには費用がかかる。壊れた部分を放置すれば、安全上の問題が生じることもある。そのため、すべてを保存することが正しいとは言い切れない。\nしかし、古いものを新しくすれば、それで場所の問題が解決するとも限らない。例えば、かつて工場だった建物をきれいな商業施設に改装した場合、利用者が増えて街がにぎやかになることはあるだろう。一方で、以前そこで働いていた人々の生活や、長い時間の中で生じた材料の変化が、改装によって見えなくなる場合もある。建物の使いやすさが増したとしても、そこにあったさまざまな経験まで新しくできるわけではない。\nこう考えると、残すか壊すかという二つの選択肢だけで議論するのは十分ではない。何を残し、何を変えるのかを具体的に考える必要がある。建物全体をそのまま保存できなくても、特徴的な部分を残し、その場所がどのように変化してきたのかを伝える方法はある。また、建物に入れない場合でも、外から観察できる仕組みを用意したり、当時の記録を公開したりすることは可能だ。\n大切なのは、ある時代の姿を唯一の正解として固定することではなく、その場所に関わってきた人々や物の時間を、現在の生活の中でどう扱うかという問いを持ち続けることだろう。過去の痕跡を見つめることは、単に昔を懐かしむためだけではない。私たちが日常の中で当然だと思っている風景も、いずれ変わっていくことを知るためでもある。","translation":"长文讨论旧建筑的保存与更新：安全、费用和使用价值都真实存在，但仅二选一会丢失地点的复杂时间。关键是具体决定保留和改变什么。","tip":"","wrong":[],"audio":"","group":"L71","extra":false,"level":"N2"},{"id":"N2-072","cat":"reading","kind":"主張理解（長文）","stem":"「経験まで新しくできるわけではない」とあるが、どういう意味か。","options":["改装は必ず失敗する","建物を新しくしても過去の人々の経験は作り直せない","記録を残す必要はない","新しい利用者は過去を必ず理解する"],"answer":1,"exp":"前文谈工厂工人的生活与材料痕迹；翻新可更新功能，无法把过往的经验重新制造出来。","topic":"废墟・场所记忆","passage":"私たちは普段、街の中を歩きながら建物を一つ一つ意識しているわけではない。駅から学校へ、あるいは家から職場へ向かう道では、目の前の空間を目的地までの通路として利用している。ところが、いつも通っていた店が閉まり、看板が外されたとき、急にその場所の存在に気づくことがある。何も変わらないように見えた通りにも、時間は積み重なっていたのである。\n古い建物を残すことについて、人々の意見が分かれるのは当然だ。そこに思い出がある人にとっては大切な風景でも、新しく移り住んだ人にとっては不便な施設にすぎないかもしれない。また、建物を修理して使い続けるには費用がかかる。壊れた部分を放置すれば、安全上の問題が生じることもある。そのため、すべてを保存することが正しいとは言い切れない。\nしかし、古いものを新しくすれば、それで場所の問題が解決するとも限らない。例えば、かつて工場だった建物をきれいな商業施設に改装した場合、利用者が増えて街がにぎやかになることはあるだろう。一方で、以前そこで働いていた人々の生活や、長い時間の中で生じた材料の変化が、改装によって見えなくなる場合もある。建物の使いやすさが増したとしても、そこにあったさまざまな経験まで新しくできるわけではない。\nこう考えると、残すか壊すかという二つの選択肢だけで議論するのは十分ではない。何を残し、何を変えるのかを具体的に考える必要がある。建物全体をそのまま保存できなくても、特徴的な部分を残し、その場所がどのように変化してきたのかを伝える方法はある。また、建物に入れない場合でも、外から観察できる仕組みを用意したり、当時の記録を公開したりすることは可能だ。\n大切なのは、ある時代の姿を唯一の正解として固定することではなく、その場所に関わってきた人々や物の時間を、現在の生活の中でどう扱うかという問いを持ち続けることだろう。過去の痕跡を見つめることは、単に昔を懐かしむためだけではない。私たちが日常の中で当然だと思っている風景も、いずれ変わっていくことを知るためでもある。","translation":"长文讨论旧建筑的保存与更新：安全、费用和使用价值都真实存在，但仅二选一会丢失地点的复杂时间。关键是具体决定保留和改变什么。","tip":"","wrong":[],"audio":"","group":"L72","extra":false,"level":"N2"},{"id":"N2-073","cat":"reading","kind":"主張理解（長文）","stem":"筆者が最も伝えたいことは何か。","options":["過去の建物は人々の生活と切り離して判断すべきだ","都市は変化しないほうが良い","保存と更新の間で、場所の時間や人の経験をどう扱うか考え続けることが重要だ","建物を外から見るだけでは意味がない"],"answer":2,"exp":"末段主张：不能仅在保留/拆除二选一里停下；要思考时间痕迹与当代生活的关系。","topic":"废墟・场所记忆","passage":"私たちは普段、街の中を歩きながら建物を一つ一つ意識しているわけではない。駅から学校へ、あるいは家から職場へ向かう道では、目の前の空間を目的地までの通路として利用している。ところが、いつも通っていた店が閉まり、看板が外されたとき、急にその場所の存在に気づくことがある。何も変わらないように見えた通りにも、時間は積み重なっていたのである。\n古い建物を残すことについて、人々の意見が分かれるのは当然だ。そこに思い出がある人にとっては大切な風景でも、新しく移り住んだ人にとっては不便な施設にすぎないかもしれない。また、建物を修理して使い続けるには費用がかかる。壊れた部分を放置すれば、安全上の問題が生じることもある。そのため、すべてを保存することが正しいとは言い切れない。\nしかし、古いものを新しくすれば、それで場所の問題が解決するとも限らない。例えば、かつて工場だった建物をきれいな商業施設に改装した場合、利用者が増えて街がにぎやかになることはあるだろう。一方で、以前そこで働いていた人々の生活や、長い時間の中で生じた材料の変化が、改装によって見えなくなる場合もある。建物の使いやすさが増したとしても、そこにあったさまざまな経験まで新しくできるわけではない。\nこう考えると、残すか壊すかという二つの選択肢だけで議論するのは十分ではない。何を残し、何を変えるのかを具体的に考える必要がある。建物全体をそのまま保存できなくても、特徴的な部分を残し、その場所がどのように変化してきたのかを伝える方法はある。また、建物に入れない場合でも、外から観察できる仕組みを用意したり、当時の記録を公開したりすることは可能だ。\n大切なのは、ある時代の姿を唯一の正解として固定することではなく、その場所に関わってきた人々や物の時間を、現在の生活の中でどう扱うかという問いを持ち続けることだろう。過去の痕跡を見つめることは、単に昔を懐かしむためだけではない。私たちが日常の中で当然だと思っている風景も、いずれ変わっていくことを知るためでもある。","translation":"长文讨论旧建筑的保存与更新：安全、费用和使用价值都真实存在，但仅二选一会丢失地点的复杂时间。关键是具体决定保留和改变什么。","tip":"","wrong":[],"audio":"","group":"L73","extra":false,"level":"N2"},{"id":"N2-074","cat":"reading","kind":"情報検索","stem":"高校生の佐藤さんは、土曜日の午後に無料で参加できる講座を探している。どれがよいか。","options":["①風と音の観察","②身近な建築の記録","③海岸の自然を読む","④地域の記憶を聞く"],"answer":1,"exp":"条件「土曜日／午後／無料」を同时满足的只有②；④虽然免费但在周日。","topic":"校园・活动","passage":"【地域文化センター　公開講座のご案内】\n①「風と音の観察」：12月12日（土）10:00～12:00／参加費500円／定員20名。屋外で短時間の観察を行う。雨天時は室内講義に変更。中学生以上。\n②「身近な建築の記録」：12月12日（土）14:00～16:00／参加費無料／定員30名。写真を使った記録方法を学ぶ。年齢制限なし。\n③「海岸の自然を読む」：12月13日（日）9:30～11:30／参加費800円／定員15名。海岸の植物を観察する。雨天中止。高校生以上。\n④「地域の記憶を聞く」：12月13日（日）13:00～15:00／参加費無料／定員25名。地域住民による話を聞く。年齢制限なし。\n【申し込み方法】\n各講座の開催日の5日前、17:00までにウェブサイトで申し込むこと。申し込み多数の場合は抽選。複数講座への申し込みも可能だが、同じ時間帯に重なる講座は選べない。キャンセルは開催日の2日前までに連絡すること。\n【持ち物】\n屋外観察を含む①③は歩きやすい靴。③のみ筆記用具と飲み物も必要。館内講座②④は特別な持ち物は不要。","translation":"活动安排：①周六上午收费500，②周六下午免费，③周日上午收费800，④周日下午免费。统一提前5天17:00报名；③需装备，遇雨取消。","tip":"","wrong":[],"audio":"","group":"L74","extra":false,"level":"N2"},{"id":"N2-075","cat":"reading","kind":"情報検索","stem":"③を受講したい人は、何をする必要があるか。","options":["12月13日の朝に会場で申し込む","12月8日17時までに申し込み、歩きやすい靴などを用意する","雨でも必ず海岸へ行く","年齢に関係なく誰でも参加できる"],"answer":1,"exp":"③ 12月13日举办，5日前是12月8日17:00；同时需要鞋、笔记用具和饮料，雨天取消。","topic":"校园・活动","passage":"【地域文化センター　公開講座のご案内】\n①「風と音の観察」：12月12日（土）10:00～12:00／参加費500円／定員20名。屋外で短時間の観察を行う。雨天時は室内講義に変更。中学生以上。\n②「身近な建築の記録」：12月12日（土）14:00～16:00／参加費無料／定員30名。写真を使った記録方法を学ぶ。年齢制限なし。\n③「海岸の自然を読む」：12月13日（日）9:30～11:30／参加費800円／定員15名。海岸の植物を観察する。雨天中止。高校生以上。\n④「地域の記憶を聞く」：12月13日（日）13:00～15:00／参加費無料／定員25名。地域住民による話を聞く。年齢制限なし。\n【申し込み方法】\n各講座の開催日の5日前、17:00までにウェブサイトで申し込むこと。申し込み多数の場合は抽選。複数講座への申し込みも可能だが、同じ時間帯に重なる講座は選べない。キャンセルは開催日の2日前までに連絡すること。\n【持ち物】\n屋外観察を含む①③は歩きやすい靴。③のみ筆記用具と飲み物も必要。館内講座②④は特別な持ち物は不要。","translation":"活动安排：①周六上午收费500，②周六下午免费，③周日上午收费800，④周日下午免费。统一提前5天17:00报名；③需装备，遇雨取消。","tip":"","wrong":[],"audio":"","group":"L75","extra":false,"level":"N2"},{"id":"N2-076","cat":"listening","kind":"課題理解","stem":"男の人はこのあと、まず何をしますか。","options":["照明を調整する","印刷室にカードを取りに行く","机を並べる","作品を運ぶ"],"answer":1,"exp":"女性明确指示「印刷室…受け取りに行ってください」。注意桌子已摆好；照明由女性负责。","topic":"展览・准备","passage":"","translation":"","tip":"先确认「谁接下来做什么」；对话中同时提到多个任务时区分责任人。","wrong":[],"audio":"女：会場の準備、どうなっていますか。\n男：机は並べ終わりました。でも、作品の説明カードがまだ届いていません。\n女：印刷室に連絡したら、もうできているそうです。受け取りに行ってください。私は照明を確認します。\n男：分かりました。","group":"L76","extra":false,"level":"N2"},{"id":"N2-077","cat":"listening","kind":"課題理解","stem":"男の人は何をすることになりましたか。","options":["機材を準備する","午前の測定を中止する","集合時間の変更を知らせる","午後の天気を調べる"],"answer":2,"exp":"男性表示「参加者に集合時間の変更を伝えておく」，器材由女性负责。","topic":"废墟・调研","passage":"","translation":"","tip":"先确认「谁接下来做什么」；对话中同时提到多个任务时区分责任人。","wrong":[],"audio":"男：明日の海岸調査だけど、午後は雨になりそうだね。\n女：じゃあ午前中に測定を済ませましょう。機材は私が用意します。\n男：僕は参加者に集合時間の変更を伝えておくよ。\n女：助かります。","group":"L77","extra":false,"level":"N2"},{"id":"N2-078","cat":"listening","kind":"課題理解","stem":"女の人はまず何をしますか。","options":["家でメールを送る","窓口へ書類を持っていく","署名を取り消す","明日の朝まで待つ"],"answer":1,"exp":"签名件要亲赴窗口，16:00关门，目前15:30，故立即去。","topic":"校园・手续","passage":"","translation":"","tip":"先确认「谁接下来做什么」；对话中同时提到多个任务时区分责任人。","wrong":[],"audio":"女：この書類、今日中に出さなきゃ。\n男：提出はネットだけ？\n女：いや、署名が必要だから窓口へ持っていくの。\n男：窓口は四時に閉まるよ。今、三時半だ。\n女：じゃあ、すぐ行くね。","group":"L78","extra":false,"level":"N2"},{"id":"N2-079","cat":"listening","kind":"課題理解","stem":"学生は次に何をしますか。","options":["図をすべて削除する","発表を中止する","参考文献を追加する","結論を先に発表する"],"answer":2,"exp":"「図は分かりやすい」「参考文献をもう少し増やす」对比，修改文献依据。","topic":"大学・发表","passage":"","translation":"","tip":"先确认「谁接下来做什么」；对话中同时提到多个任务时区分责任人。","wrong":[],"audio":"男：先生、発表の資料を作りました。\n女：図は分かりやすいですね。ただ、結論の根拠がまだ弱いので、参考文献をもう少し増やしてください。\n男：分かりました。図はそのままでいいですか。\n女：はい。","group":"L79","extra":false,"level":"N2"},{"id":"N2-080","cat":"listening","kind":"課題理解","stem":"男の人は十時のあと何をしますか。","options":["設営を始める","受付を手伝う","帰宅する","イベントの資料を書く"],"answer":1,"exp":"「設営を終えた後…受付へ」「十時に終わる」，顺序确定。","topic":"活动・工作","passage":"","translation":"","tip":"先确认「谁接下来做什么」；对话中同时提到多个任务时区分责任人。","wrong":[],"audio":"女：明日のイベント、受付の人数が足りないそうです。\n男：それなら、設営を終えた後、僕が手伝えますよ。\n女：ありがとうございます。設営は十時に終わる予定です。\n男：じゃあ、そのまま受付へ行きます。","group":"L80","extra":false,"level":"N2"},{"id":"N2-081","cat":"listening","kind":"ポイント理解","stem":"男の人が特に印象に残ったものは何ですか。","options":["建物の外観","壁に残った掲示物","校舎の広さ","新しい照明"],"answer":1,"exp":"「それもあるけど」「特に驚いたのは」标记重点，选掲示物而非建筑设计。","topic":"废墟・记忆","passage":"","translation":"","tip":"聴解「ポイント理解」先看问题所问：时间／原因／谁的意见／变化等。","wrong":[],"audio":"男：先月、古い校舎を見学したんだけど、予想以上に面白かったよ。\n女：建築のデザインが良かったの？\n男：それもあるけど、僕が特に驚いたのは、壁に残った昔の授業の掲示物なんだ。建物が使われていた頃の様子が想像できた。","group":"L81","extra":false,"level":"N2"},{"id":"N2-082","cat":"listening","kind":"ポイント理解","stem":"研修の二週目には何をしますか。","options":["オンラインで基本を学ぶ","成果を発表する","現場で実習する","休みを取る"],"answer":2,"exp":"时间排序：第一周线上、第二周实习、最后一天发表。","topic":"工作・研修","passage":"","translation":"","tip":"聴解「ポイント理解」先看问题所问：时间／原因／谁的意见／变化等。","wrong":[],"audio":"女：来月から研修を始めます。最初の週はオンラインで基本を学び、二週目から現場で実習します。最終日は全員で成果を発表してください。\n男：最初から現場に行かなくていいんですね。","group":"L82","extra":false,"level":"N2"},{"id":"N2-083","cat":"listening","kind":"ポイント理解","stem":"女の人が特に必要だと言っているものは何ですか。","options":["傘と帽子","上着と歩きやすい靴","水着とサンダル","特別な制服"],"answer":1,"exp":"明确要求「上着」「歩きやすい靴」。","topic":"废墟・调研","passage":"","translation":"","tip":"聴解「ポイント理解」先看问题所问：时间／原因／谁的意见／变化等。","wrong":[],"audio":"男：海の近くにある建物を調査するので、どんな服装がいいですか。\n女：風が強いので、上着を持ってきてください。あと、足場が悪い場所もあるため、歩きやすい靴が必要です。\n男：分かりました。","group":"L83","extra":false,"level":"N2"},{"id":"N2-084","cat":"listening","kind":"ポイント理解","stem":"展覧会について変更された点は何ですか。","options":["展示内容","入場料金","開催期間","会場の場所"],"answer":2,"exp":"举办时间延长一周，而展品内容没有变化。「延長」＝延长。","topic":"艺术・展览","passage":"","translation":"","tip":"聴解「ポイント理解」先看问题所问：时间／原因／谁的意见／变化等。","wrong":[],"audio":"女：この展覧会、当初は二週間だけの予定でしたが、来場者が多かったので一週間延長することになりました。なお、展示内容に変更はありません。\n男：では、今月末まで見られるんですね。","group":"L84","extra":false,"level":"N2"},{"id":"N2-085","cat":"listening","kind":"ポイント理解","stem":"女の人はどんな工夫をしましたか。","options":["夜は勉強しない","一度に長時間勉強する","短い休憩を何度か入れる","勉強する場所を毎日変える"],"answer":2,"exp":"「短い休憩を何度か入れる」是女性实践的策略，而非完全不学。","topic":"学习・方法","passage":"","translation":"","tip":"聴解「ポイント理解」先看问题所问：时间／原因／谁的意见／变化等。","wrong":[],"audio":"男：最近、夜に勉強しても集中できなくて。\n女：私は短い休憩を何度か入れるようにしたら、前より続けられるようになったよ。\n男：なるほど。長く座り続けるより良さそうだね。","group":"L85","extra":false,"level":"N2"},{"id":"N2-086","cat":"listening","kind":"ポイント理解","stem":"今年の活動の特徴は何ですか。","options":["参加者が減った","高校生の参加が増えた","活動が中止になった","参加者が全員社会人だった"],"answer":1,"exp":"人数从约20升至40+，特别强调高中生参加增加。","topic":"社会・生活","passage":"","translation":"","tip":"聴解「ポイント理解」先看问题所问：时间／原因／谁的意见／变化等。","wrong":[],"audio":"女：地域の清掃活動は、去年は二十人ほどでしたが、今年は四十人以上参加しました。特に高校生の参加が増えたことが特徴です。\n男：学校で呼びかけた効果かもしれませんね。","group":"L86","extra":false,"level":"N2"},{"id":"N2-087","cat":"listening","kind":"概要理解","stem":"話し手が最も言いたいことは何ですか。","options":["建物は外観だけで評価するべきだ","保存では安全と歴史の伝え方を考えるべきだ","古い建物はすべて公開するべきだ","地域の記憶は残せない"],"answer":1,"exp":"概述性观点：重视历史和人的生活，同时考虑安全与传达形式。","topic":"废墟・保护","passage":"","translation":"","tip":"概况题问「这段话的整体立场」，不要选其中某个细节当主旨。","wrong":[],"audio":"男：歴史的な建物の保存を考えるとき、私は外観の美しさだけを基準にすべきではないと思います。建物には、そこで暮らした人々の生活や地域の変化が残されています。一方、危険な場所を無理に公開する必要もありません。何を残し、どう伝えるかを考えることが大切です。","group":"L87","extra":false,"level":"N2"},{"id":"N2-088","cat":"listening","kind":"概要理解","stem":"話し手の意見は何ですか。","options":["図書館の役割は完全になくなった","本以外の利用も含めて図書館の役割を考えるべきだ","図書館の建物をすべて閉鎖するべきだ","勉強会は禁止するべきだ"],"answer":1,"exp":"虽然读书人数减少，但作为学习会、信息查询空间的作用增长；是用途变化。","topic":"社会・文化","passage":"","translation":"","tip":"概况题问「这段话的整体立场」，不要选其中某个细节当主旨。","wrong":[],"audio":"女：近ごろ、図書館で本を読む人の数は少し減っています。しかし、図書館の役割が小さくなったとは言えません。勉強会の場所として利用したり、地域の情報を調べたりする人が増えているからです。利用の仕方が変わったと考えるべきでしょう。","group":"L88","extra":false,"level":"N2"},{"id":"N2-089","cat":"listening","kind":"概要理解","stem":"話し手が強調していることは何ですか。","options":["技術を使う目的を明確にすること","高価な設備を最優先すること","新しい機械はすべて避けること","授業時間を減らすこと"],"answer":0,"exp":"核心论点「导入技术不是目的」「取决于学习目标」。","topic":"大学・教育","passage":"","translation":"","tip":"概况题问「这段话的整体立场」，不要选其中某个细节当主旨。","wrong":[],"audio":"男：新しい技術が便利でも、導入することだけが目的になると困ります。例えば、大学の授業で使う機械は、学生が何を学ぶのかによって選ぶべきです。高価な設備があれば良い授業になるとは限らないのです。","group":"L89","extra":false,"level":"N2"},{"id":"N2-090","cat":"listening","kind":"概要理解","stem":"話し手の考えに近いものはどれですか。","options":["旅行では絶対に写真を撮らない","写真に加えてその場を直接感じることも大切だ","写真だけが記憶を残す方法だ","旅先では早く帰るべきだ"],"answer":1,"exp":"并不否定摄影，强调照片之外的现场感受。","topic":"记忆・艺术","passage":"","translation":"","tip":"概况题问「这段话的整体立场」，不要选其中某个细节当主旨。","wrong":[],"audio":"女：旅先で写真を撮ることは思い出を残す方法の一つです。ただし、写真を撮ることに夢中になると、その場の音や匂いに気づかないまま帰ってしまうこともあります。時にはカメラを置き、周りを感じる時間も必要ではないでしょうか。","group":"L90","extra":false,"level":"N2"},{"id":"N2-091","cat":"listening","kind":"概要理解","stem":"話し手の主張は何ですか。","options":["人が自然に関わる方法は場所によって考えるべきだ","自然には絶対に手を加えてはいけない","里山はすべて建設地にするべきだ","歴史を調べる意味はない"],"answer":0,"exp":"反对「完全不干预」作为普适规则；人与自然关系需要考虑当地历史。","topic":"生态・环境","passage":"","translation":"","tip":"概况题问「这段话的整体立场」，不要选其中某个细节当主旨。","wrong":[],"audio":"男：自然環境を守ろうとするとき、人が全く関わらないことが最善とは限りません。長い間人の手で管理されてきた里山では、作業をやめることで環境が変わることもあります。場所の歴史を理解した上で、適切な関わり方を考える必要があります。","group":"L91","extra":false,"level":"N2"},{"id":"N2-092","cat":"listening","kind":"即時応答","stem":"最も自然な返答を選びなさい。","options":["ええ、確認しておきます。","いいえ、昨日見ました。","はい、資料の中です。"],"answer":0,"exp":"「～ていただけませんか」礼貌请求对方检查；自然回应「確認しておきます」。","topic":"校园・日常","passage":"","translation":"","tip":"正式试题的即時応答选项通常以音频呈现；本练习用语音读出三个选项，模考时只显示选项编号。","wrong":[],"audio":"話し手：この資料、今日中に確認していただけませんか。","group":"L92","extra":false,"level":"N2"},{"id":"N2-093","cat":"listening","kind":"即時応答","stem":"最も自然な返答を選びなさい。","options":["展示を作りました。","ぜひ、行きたいです。","展示は昨日でした。"],"answer":1,"exp":"「～ませんか」邀请；回答接受邀请「ぜひ、行きたいです」。","topic":"校园・日常","passage":"","translation":"","tip":"正式试题的即時応答选项通常以音频呈现；本练习用语音读出三个选项，模考时只显示选项编号。","wrong":[],"audio":"話し手：もし時間があったら、展示を見に来ませんか。","group":"L93","extra":false,"level":"N2"},{"id":"N2-094","cat":"listening","kind":"即時応答","stem":"最も自然な返答を選びなさい。","options":["はい、火曜日の午後五時までです。","いいえ、火曜日を出します。","先生に火曜日しました。"],"answer":0,"exp":"「～でしたっけ」询问确认记忆；应给出截止时间。","topic":"校园・日常","passage":"","translation":"","tip":"正式试题的即時応答选项通常以音频呈现；本练习用语音读出三个选项，模考时只显示选项编号。","wrong":[],"audio":"話し手：提出期限は来週の火曜日でしたっけ。","group":"L94","extra":false,"level":"N2"},{"id":"N2-095","cat":"listening","kind":"即時応答","stem":"最も自然な返答を選びなさい。","options":["そうですね。外に出るときは気をつけましょう。","いえ、先週は休日でした。","それでは風を読みます。"],"answer":0,"exp":"对天气感受表示赞同，并提醒外出时小心强风。","topic":"校园・日常","passage":"","translation":"","tip":"正式试题的即時応答选项通常以音频呈现；本练习用语音读出三个选项，模考时只显示选项编号。","wrong":[],"audio":"話し手：今日はずいぶん風が強いですね。","group":"L95","extra":false,"level":"N2"},{"id":"N2-096","cat":"listening","kind":"即時応答","stem":"最も自然な返答を選びなさい。","options":["いいえ、使う予定です。","席が見えました。","昨日使ったそうです。"],"answer":0,"exp":"「使ってもよろしいでしょうか」征求许可；「いいえ、使う予定です」拒绝并解释，该场景合理。","topic":"校园・日常","passage":"","translation":"","tip":"正式试题的即時応答选项通常以音频呈现；本练习用语音读出三个选项，模考时只显示选项编号。","wrong":[],"audio":"話し手：すみません、この席、使ってもよろしいでしょうか。","grou ……但是……」，但这道题的前后逻辑或接续不符合这一用法。"],"audio":"","group":"N2B-G054","extra":true,"mockSet":"drill","level":"N2","focus":"原因・契机"},{"id":"N2B-G055","cat":"grammar","kind":"语法辨析・易混","stem":"職員は、担当者が戻り（　）折り返すと説明した。","options":["きり","ほど","次第","うちに"],"answer":2,"exp":"「戻り次第」＝负责人一回来就回复。","topic":"校园・生活","passage":"","translation":"","tip":"","wrong":["「きり」无法与前后构成题目要求的自然搭配或语法关系；请对照正确答案的接续。","「ほど」无法与前后构成题目要求的自然搭配或语法关系；请对照正确答案的接续。","","「うちに」无法与前后构成题目要求的自然搭配或语法关系；请对照正确答案的接续。"],"audio":"","group":"N2B-G055","extra":true,"mockSet":"drill","level":"N2","focus":"时间・顺序"},{"id":"N2B-G056","cat":"grammar","kind":"语法辨析・易混","stem":"調べれば調べる（　）、新たな疑問が生まれた。","options":["限り","ほど","場合に","うちに"],"answer":1,"exp":"「調べれば調べるほど」＝越调查问题越多。","topic":"废墟・现场研究","passage":"","translation":"","tip":"","wrong":["「限り」通常表示「只要在此条件下」，但这道题的前后逻辑或接续不符合这一用法。","","「場合に」无法与前后构成题目要求的自然搭配或语法关系；请对照正确答案的接续。","「うちに」无法与前后构成题目要求的自然搭配或语法关系；请对照正确答案的接续。"],"audio":"","group":"N2B-G056","extra":true,"mockSet":"drill","level":"N2","focus":"递进・比较"},{"id":"N2B-G057","cat":"grammar","kind":"语法辨析・易混","stem":"本人の許可（　）、写真をウェブサイトに掲載することはできない。","options":["につけ","を限りに","なしには","どころか"],"answer":2,"exp":"「許可なしには～ない」＝没有许可就不可能……；强调必要条件。","topic":"废墟・现场研究","passage":"","translation":"","tip":"","wrong":["「につけ」无法与前后构成题目要求的自然搭配或语法关系；请对照正确答案的接续。","「を限りに」无法与前后构成题目要求的自然搭配或语法关系；请对照正确答案的接续。","","「どころか」无法与前后构成题目要求的自然搭配或语法关系；请对照正确答案的接续。"],"audio":"","group":"N2B-G057","extra":true,"mockSet":"drill","level":"N2","focus":"条件"},{"id":"N2B-R001","cat":"reading","kind":"内容理解（短文）","stem":"見学会に参加するには、どうすればよいか。","options":["土曜日の正午までに電話する","有料の券を購入する","当日受付で希望を伝えればよい","講演会の申し込み時に見学会も希望する"],"answer":3,"exp":"「事前申込者のうち希望した人のみ」。讲演报名免费，且须在报名时申请见学会；选项1当日临时申请没有依据。","topic":"校园・生活","passage":"【講演会のお知らせ】土曜日の講演会は、午後二時から四時まで市民ホールで開かれる。参加費は無料だが、席に限りがあるため、金曜日の正午までにウェブサイトから申し込む必要がある。当日は開始十五分前に受付を済ませてほしい。なお、講演終了後の見学会は事前申込者のうち希望した人のみ参加できる。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R001","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R002","cat":"reading","kind":"内容理解（短文）","stem":"工事中も通常どおり利用できるのは何か。","options":["静かな館内の学習場所","二階の自習机","二階の閲覧室","一階の資料貸出カウンター"],"answer":3,"exp":"明确写着「一階の資料貸出カウンターと返却ポストは通常どおり」。二楼封闭，馆内可能有噪声。","topic":"校园・生活","passage":"【図書館からのご案内】館内の工事に伴い、来週の月曜日から三日間、二階の閲覧室を閉鎖します。一階の資料貸出カウンターと返却ポストは通常どおり利用できます。ただし、工事中は大きな音が出る時間帯がありますので、静かな場所での学習を希望する方は、隣接する市民学習室をご利用ください。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R002","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R003","cat":"reading","kind":"内容理解（短文）","stem":"発表で最も重視されているのは何か。","options":["資料を当日配布する","論文に書かれた数字を全部紹介する","論文の疑問と根拠を検討する","十分以上話し続ける"],"answer":2,"exp":"「何を問題にしているのか、その根拠は十分なのかを中心に」。不仅是摘要，更需要判断问题设置与论证。","topic":"校园・生活","passage":"【ゼミの連絡】来週のゼミでは、各自が読んだ論文を紹介します。内容をすべて説明する必要はありません。むしろ、筆者が何を問題にしているのか、その根拠は十分なのかを中心に、五分以内で発表してください。発表資料は前日までに共有フォルダへ入れてください。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R003","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R004","cat":"reading","kind":"内容理解（短文）","stem":"学生が次にしようとしていることは何か。","options":["窓をすべて修理する","すぐに装置を設置する","風が唯一の原因だと発表する","別の日にも同じ現象が起こるか調べる"],"answer":3,"exp":"结尾直接表明「別の日にも同じ現象が起こるのか確かめる」。声音与风的关联还属于观察结果。","topic":"废墟・现场研究","passage":"海辺に残された建物を調べた学生は、窓の近くで低い音を聞いた。風が強くなる時間帯に音も大きくなるようだったが、その日の記録だけでは、風が原因かどうか分からなかった。学生は音を再現しようとする前に、別の日にも同じ現象が起こるのか確かめることにした。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R004","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R005","cat":"reading","kind":"内容理解（短文）","stem":"この制度について、正しいものはどれか。","options":["申し込みは一度すれば永久に有効だ","商売を始める人しか利用できない","地域イベントでは会場費が一部補助される","すべての改装費が町から支給される"],"answer":2,"exp":"「地域のイベントを開催する場合は、会場費の一部が補助」。改装费原则上个人承担，且每月申请。","topic":"校园・生活","passage":"ある町では、空き店舗を短期間だけ借りられる制度を始めた。利用者は月ごとに申し込み、店の改装費は原則として自分で負担する。ただし、地域のイベントを開催する場合は、会場費の一部が補助される。この制度によって、新しい商売を試したい人だけでなく、地域の交流の場をつくりたい団体にも利用が広がっている。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R005","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R006","cat":"reading","kind":"内容理解（中文）","stem":"筆者が最も伝えたいことは何か。","options":["利用者と周辺住民の双方が続けられる仕組みが必要だ","市場を開けば地域の問題は解決する","利用の前に大規模な工事をすべきだ","空き地は一切使わない方がよい"],"answer":0,"exp":"最后两句为主张：「双方が、無理なく関われる仕組み」。活动内容并非关键，维持可持续的规则才是重点。","topic":"校园・生活","passage":"近年、都市の小さな空き地を、地域の人が集まる場所として利用する試みが増えている。花を植えたり、週末に市場を開いたりする活動は、大がかりな工事を必要としないことが多い。しかし、利用者が増えれば、騒音やごみなど別の問題が生まれることもある。\nある町では、近隣住民との話し合いを重ね、利用時間と片付けの責任を明確にした。その結果、活動は長く続くようになった。大切なのは、空き地を単に「何かに使う」ことではない。利用する人と周囲で暮らす人の双方が、無理なく関われる仕組みをつくることなのだ。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R006","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R007","cat":"reading","kind":"内容理解（中文）","stem":"ある町の活動が長続きするようになった理由は何か。","options":["周辺住民の参加を禁止したから","空き地を建物に変えたから","利用時間と片付けの責任を明確にしたから","花を全部取り除いたから"],"answer":2,"exp":"「話し合いを重ね、利用時間と片付けの責任を明確にした。その結果」。明确的因果关系。","topic":"校园・生活","passage":"近年、都市の小さな空き地を、地域の人が集まる場所として利用する試みが増えている。花を植えたり、週末に市場を開いたりする活動は、大がかりな工事を必要としないことが多い。しかし、利用者が増えれば、騒音やごみなど別の問題が生まれることもある。\nある町では、近隣住民との話し合いを重ね、利用時間と片付けの責任を明確にした。その結果、活動は長く続くようになった。大切なのは、空き地を単に「何かに使う」ことではない。利用する人と周囲で暮らす人の双方が、無理なく関われる仕組みをつくることなのだ。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R007","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R008","cat":"reading","kind":"内容理解（中文）","stem":"「別の問題」とはどのような問題か。","options":["活動が必ず中止されること","ごみや騒音が周辺に影響すること","工事費が必ず高くなること","人が集まらないことだけ"],"answer":1,"exp":"前文「騒音やごみなど別の問題」。不要把「可能发生」夸大成「必定中止」。","topic":"校园・生活","passage":"近年、都市の小さな空き地を、地域の人が集まる場所として利用する試みが増えている。花を植えたり、週末に市場を開いたりする活動は、大がかりな工事を必要としないことが多い。しかし、利用者が増えれば、騒音やごみなど別の問題が生まれることもある。\nある町では、近隣住民との話し合いを重ね、利用時間と片付けの責任を明確にした。その結果、活動は長く続くようになった。大切なのは、空き地を単に「何かに使う」ことではない。利用する人と周囲で暮らす人の双方が、無理なく関われる仕組みをつくることなのだ。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R008","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R009","cat":"reading","kind":"内容理解（中文）","stem":"ひびの原因について、本文が述べていることはどれか。","options":["塩分が唯一の原因である","温度の変化とは無関係である","修理をすれば原因を調べる必要はない","複数の原因が関係している可能性がある"],"answer":3,"exp":"「複数の要因が関係している可能性」。相关≠已确定原因，注意限定表达。","topic":"废墟・现场研究","passage":"海辺の古い建物では、潮風に含まれる塩分が金属の腐食に影響する場合がある。ただし、壁にひびが見つかったからといって、直ちに塩分だけが原因だと判断することはできない。材料の性質や過去の補修、温度の変化など、複数の要因が関係している可能性があるからだ。\n現地調査では、まずひびの位置と大きさを記録し、以前の写真と比べて変化を確認する。そのうえで、必要なら専門家に検査を依頼する。壊れている部分を急いで取り替える前に、今そこで何が起こっているのかを理解することが、適切な判断につながる。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R009","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R010","cat":"reading","kind":"内容理解（中文）","stem":"現地調査の順序として適切なものはどれか。","options":["過去の写真は参考にならない","記録して変化を調べ、必要に応じて検査する","最初に全部交換してから記録する","専門家が来るまで一切観察しない"],"answer":1,"exp":"「まず記録→以前の写真と比較→必要なら専門家に検査依頼」。顺序题注意「まず」「そのうえで」。","topic":"废墟・现场研究","passage":"海辺の古い建物では、潮風に含まれる塩分が金属の腐食に影響する場合がある。ただし、壁にひびが見つかったからといって、直ちに塩分だけが原因だと判断することはできない。材料の性質や過去の補修、温度の変化など、複数の要因が関係している可能性があるからだ。\n現地調査では、まずひびの位置と大きさを記録し、以前の写真と比べて変化を確認する。そのうえで、必要なら専門家に検査を依頼する。壊れている部分を急いで取り替える前に、今そこで何が起こっているのかを理解することが、適切な判断につながる。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R010","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R011","cat":"reading","kind":"内容理解（中文）","stem":"「そのうえで」が指す内容は何か。","options":["材料を取り替えた後で","調査をやめる前に","塩害と断定した後で","ひびの状況を記録し、変化を確認した後で"],"answer":3,"exp":"「そのうえで」承接前面的记录与比较工作，意味着完成调查基础后再考虑专家检测。","topic":"废墟・现场研究","passage":"海辺の古い建物では、潮風に含まれる塩分が金属の腐食に影響する場合がある。ただし、壁にひびが見つかったからといって、直ちに塩分だけが原因だと判断することはできない。材料の性質や過去の補修、温度の変化など、複数の要因が関係している可能性があるからだ。\n現地調査では、まずひびの位置と大きさを記録し、以前の写真と比べて変化を確認する。そのうえで、必要なら専門家に検査を依頼する。壊れている部分を急いで取り替える前に、今そこで何が起こっているのかを理解することが、適切な判断につながる。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R011","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R012","cat":"reading","kind":"内容理解（中文）","stem":"筆者の考えに最も近いものはどれか。","options":["働き方にかかわらず、情報共有の仕組みが重要だ","全員が毎日出社するべきだ","偶然の会話は無駄なのでなくすべきだ","在宅勤務では情報共有は不可能だ"],"answer":0,"exp":"最后一句「働き方の形そのものより、必要な情報と相談の機会をどう確保するか」。","topic":"校园・生活","passage":"在宅勤務は通勤時間を減らし、個人が仕事に集中しやすい環境を整えられるという利点がある。一方で、同じ部署の人と偶然話す機会が減り、情報が一部の人にしか伝わらないという問題もある。\nある会社では、すべての社員を毎日出社させるのではなく、週に一度だけ全員が集まる日を設けた。その日には細かな報告を減らし、各自の疑問を共有する時間を長くしたという。重要なのは、出社か在宅かという働き方の形そのものより、必要な情報と相談の機会をどう確保するかである。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R012","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R013","cat":"reading","kind":"内容理解（中文）","stem":"会社が週に一度集まる日に変えたことは何か。","options":["報告を増やして相談を減らした","全員が自由に休む日にした","個人で仕事をするだけにした","細かな報告を減らし疑問を共有する時間を増やした"],"answer":3,"exp":"「細かな報告を減らし」「疑問を共有する時間を長くした」。","topic":"校园・生活","passage":"在宅勤務は通勤時間を減らし、個人が仕事に集中しやすい環境を整えられるという利点がある。一方で、同じ部署の人と偶然話す機会が減り、情報が一部の人にしか伝わらないという問題もある。\nある会社では、すべての社員を毎日出社させるのではなく、週に一度だけ全員が集まる日を設けた。その日には細かな報告を減らし、各自の疑問を共有する時間を長くしたという。重要なのは、出社か在宅かという働き方の形そのものより、必要な情報と相談の機会をどう確保するかである。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R013","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R014","cat":"reading","kind":"内容理解（中文）","stem":"本文によると、在宅勤務の問題点は何か。","options":["通勤時間が必ず増える","情報が一部の人にしか伝わらない場合がある","集中できる環境をつくれない","誰とも一切連絡が取れなくなる"],"answer":1,"exp":"「情報が一部の人にしか伝わらないという問題」。选项2的「一切」过度绝对化。","topic":"校园・生活","passage":"在宅勤務は通勤時間を減らし、個人が仕事に集中しやすい環境を整えられるという利点がある。一方で、同じ部署の人と偶然話す機会が減り、情報が一部の人にしか伝わらないという問題もある。\nある会社では、すべての社員を毎日出社させるのではなく、週に一度だけ全員が集まる日を設けた。その日には細かな報告を減らし、各自の疑問を共有する時間を長くしたという。重要なのは、出社か在宅かという働き方の形そのものより、必要な情報と相談の機会をどう確保するかである。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R014","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R015","cat":"reading","kind":"主張理解（長文）","stem":"筆者は写真の特徴をどのように捉えているか。","options":["撮影者の選択が一切入らないもの","現実を完全に再現できる手段","現地に行く代わりに必ず用いるもの","一定の視点を示し、見落としやすい細部に気づかせるもの"],"answer":3,"exp":"「切り取る」「撮影者が選んだ位置」「細部を立ち止まって見せる」。照片选择性同时带来局限和独特力量。","topic":"废墟・现场研究","passage":"写真を見ることと、実際の場所を訪れることでは、同じ風景であっても受け取る印象が異なる。写真は一定の範囲を切り取り、その瞬間をとどめる。見る人は、撮影者が選んだ位置と時間を通して場所を知ることになる。これは写真の限界であると同時に、写真ならではの力でもある。日常の中で通り過ぎてしまう細部を、写真は立ち止まって見せてくれるからだ。\n一方、現地に立つ人は、自分の足で移動しながら、音や温度、においなどを経験する。風の強さが変わると、さっきまで気づかなかった音が聞こえることもある。現地にいればすべて理解できるというわけではないが、自分が何を見落としていたかに気づく機会は増える。\n大切なのは、写真と現地の経験を優劣で比べることではないだろう。写真は一つの視点を与え、現地ではその外側に広がるものに出会う。両方を行き来することで、その場所についての理解は少しずつ変わっていく。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R015","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R016","cat":"reading","kind":"主張理解（長文）","stem":"「その外側」とは何を指すか。","options":["写真に写っていない音や温度、移動による経験など","撮影者の所属する地域だけ","現地で見ることのできない過去の数字だけ","写真を保存する箱の外"],"answer":0,"exp":"「写真は一つの視点」「現地ではその外側」。指照片框取范围以外的身体、环境体验。","topic":"废墟・现场研究","passage":"写真を見ることと、実際の場所を訪れることでは、同じ風景であっても受け取る印象が異なる。写真は一定の範囲を切り取り、その瞬間をとどめる。見る人は、撮影者が選んだ位置と時間を通して場所を知ることになる。これは写真の限界であると同時に、写真ならではの力でもある。日常の中で通り過ぎてしまう細部を、写真は立ち止まって見せてくれるからだ。\n一方、現地に立つ人は、自分の足で移動しながら、音や温度、においなどを経験する。風の強さが変わると、さっきまで気づかなかった音が聞こえることもある。現地にいればすべて理解できるというわけではないが、自分が何を見落としていたかに気づく機会は増える。\n大切なのは、写真と現地の経験を優劣で比べることではないだろう。写真は一つの視点を与え、現地ではその外側に広がるものに出会う。両方を行き来することで、その場所についての理解は少しずつ変わっていく。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R016","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R017","cat":"reading","kind":"主張理解（長文）","stem":"文章全体の主張は何か。","options":["写真は経験より必ず正確である","写真を撮ることは学習の妨げになる","写真と現地を行き来することで理解が深まる","現地で見れば写真は不要になる"],"answer":2,"exp":"末句「両方を行き来することで、その場所についての理解は少しずつ変わっていく」。","topic":"废墟・现场研究","passage":"写真を見ることと、実際の場所を訪れることでは、同じ風景であっても受け取る印象が異なる。写真は一定の範囲を切り取り、その瞬間をとどめる。見る人は、撮影者が選んだ位置と時間を通して場所を知ることになる。これは写真の限界であると同時に、写真ならではの力でもある。日常の中で通り過ぎてしまう細部を、写真は立ち止まって見せてくれるからだ。\n一方、現地に立つ人は、自分の足で移動しながら、音や温度、においなどを経験する。風の強さが変わると、さっきまで気づかなかった音が聞こえることもある。現地にいればすべて理解できるというわけではないが、自分が何を見落としていたかに気づく機会は増える。\n大切なのは、写真と現地の経験を優劣で比べることではないだろう。写真は一つの視点を与え、現地ではその外側に広がるものに出会う。両方を行き来することで、その場所についての理解は少しずつ変わっていく。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R017","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R018","cat":"reading","kind":"統合理解（比较两文）","stem":"AとBに共通する考えは何か。","options":["すべての建物を新築すべきだ","安全性を一切考える必要はない","古い材料は完全に撤去するしかない","過去の痕跡に配慮する価値がある"],"answer":3,"exp":"A重视原有痕迹，B也明确提到「古い材料や痕跡の価値」。双方都兼顾安全，而重心不同。","topic":"废墟・现场研究","passage":"【文章A】歴史的な建物を保存する際は、かつての姿をできるだけ残すべきだ。新しい材料で全体を覆うと、修理の跡や長い時間の変化が見えなくなる可能性がある。ただし、安全確認は欠かせない。\n\n【文章B】建物を使い続けるには、現在の利用者が安心して過ごせる環境が必要だ。補強や設備更新をためらうべきではないが、古い材料や痕跡の価値も考慮した計画が望ましい。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R018","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R019","cat":"reading","kind":"統合理解（比较两文）","stem":"AとBの違いとして適切なものはどれか。","options":["Aは安全を重視しBは安全を無視する","Aは過去の姿を残す点を強調し、Bは使い続けるための更新を重視する","どちらも古い建物の利用を禁止している","Aは新築を主張しBは保存を否定する"],"answer":1,"exp":"A强调保留历史面貌，B强调为继续使用进行合理补强，皆非绝对立场。","topic":"废墟・现场研究","passage":"【文章A】歴史的な建物を保存する際は、かつての姿をできるだけ残すべきだ。新しい材料で全体を覆うと、修理の跡や長い時間の変化が見えなくなる可能性がある。ただし、安全確認は欠かせない。\n\n【文章B】建物を使い続けるには、現在の利用者が安心して過ごせる環境が必要だ。補強や設備更新をためらうべきではないが、古い材料や痕跡の価値も考慮した計画が望ましい。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R019","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R020","cat":"reading","kind":"情報検索","stem":"社会人の田中さんは平日の昼間に参加できず、週末の講座を希望する。どれがよいか。","options":["B","A","どれにも参加できない","C"],"answer":3,"exp":"A火曜傍晚、B周三下午，只有C是周六上午。信息检索按时间、对象、费用等条件逐一排除。","topic":"校园・生活","passage":"【市民センター 講座案内】\nA「日本語でニュースを読む」火曜18:30〜20:00。全6回。参加費3,000円。対象：日本語中級以上。\nB「写真の見方」水曜14:00〜15:30。全4回。参加費2,000円。対象：高校生以上。\nC「建物とまち歩き」土曜10:00〜12:00。全3回。参加費1,500円。対象：どなたでも。雨天時は室内講義。\n申込：11月25日まで。定員を超えた場合は抽選。日程の変更はウェブサイトで通知する。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R020","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R021","cat":"reading","kind":"情報検索","stem":"この案内について正しいものはどれか。","options":["Aは初級者だけが対象だ","Bは全6回である","Cは雨の場合、中止になる","人数が多い場合は抽選になる"],"answer":3,"exp":"最后「定員を超えた場合は抽選」。C雨天改室内讲义，不是取消。","topic":"校园・生活","passage":"【市民センター 講座案内】\nA「日本語でニュースを読む」火曜18:30〜20:00。全6回。参加費3,000円。対象：日本語中級以上。\nB「写真の見方」水曜14:00〜15:30。全4回。参加費2,000円。対象：高校生以上。\nC「建物とまち歩き」土曜10:00〜12:00。全3回。参加費1,500円。対象：どなたでも。雨天時は室内講義。\n申込：11月25日まで。定員を超えた場合は抽選。日程の変更はウェブサイトで通知する。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R021","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-R022","cat":"reading","kind":"内容理解（短文）","stem":"機材が故障したとき、何をすべきか。","options":["担当職員に連絡する","翌月まで保管する","返却しない","自分で修理する"],"answer":0,"exp":"「自分で修理せず、すぐに担当職員へ連絡」。","topic":"校园・生活","passage":"【施設利用案内】貸し出し用の機材は予約した日の午後六時までに返却してください。故障が見つかった場合は、自分で修理せず、すぐに担当職員へ連絡してください。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R022","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-R023","cat":"reading","kind":"内容理解（短文）","stem":"図や写真を使う人は何をする必要があるか。","options":["出典を書く","印刷代を支払う","水曜の朝に持参する","発表を延期する"],"answer":0,"exp":"「図や写真を使う人は出典を記載」。论文与图片来源要明确。","topic":"校园・生活","passage":"【研究室の連絡】発表資料は水曜日の午後三時までに提出してください。印刷は研究室でまとめて行いますので、各自で印刷する必要はありません。ただし、図や写真を使う人は出典を記載してください。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R023","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-R024","cat":"reading","kind":"内容理解（短文）","stem":"車いすの利用者は、点検期間中どうすればよいか。","options":["北口のエレベーターを使う","駅を利用できない","南口を利用する","点検終了後まで外出しない"],"answer":0,"exp":"「その期間、北口のエレベーターを使う」。限定的是南口电梯，而不是车站整体。","topic":"校园・生活","passage":"駅の案内によると、南口のエレベーターは来週の水曜日から金曜日まで点検のため利用できない。車いすを利用する人は、その期間、北口のエレベーターを使うように書かれている。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R024","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-R025","cat":"reading","kind":"内容理解（短文）","stem":"学生について本文が述べていることは何か。","options":["職員以外は写真を撮れない","風が強い日は必ず調査する","撮影目的なら自由に入ってよい","禁止区域には入ってはならない"],"answer":3,"exp":"「写真を撮るためだけに立入禁止区域へ入ってはならない」。目的不构成违反禁入规定的理由。","topic":"废墟・现场研究","passage":"海辺の工事現場では、風が強い日は足場の近くに近づかないよう注意書きが出ている。調査を行う学生も、写真を撮るためだけに立入禁止区域へ入ってはならない。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R025","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-R026","cat":"reading","kind":"内容理解（短文）","stem":"依頼者はどうすることにしたか。","options":["修理を中止する","道具を捨てる","全部新品に交換する","必要な部分だけ修理する"],"answer":3,"exp":"最后「必要な部分だけを直してもらう」。并非彻底恢复崭新。","topic":"废墟・现场研究","passage":"ある古い道具の修理を頼んだところ、職人は「使えるようにすることと、昔の形を全部新しくすることは同じではない」と話した。依頼者は、必要な部分だけを直してもらうことにした。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R026","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-R027","cat":"reading","kind":"内容理解（短文）","stem":"初めて参加する人はどうすべきか。","options":["月末の日曜日に必ず参加する","前日までに代表者に連絡する","毎週土曜日に参加する","当日会場へ直接行く"],"answer":1,"exp":"「初めて参加する人は前日までに代表者へ連絡」。月末日曜休息。","topic":"校园・生活","passage":"ボランティア活動は毎週日曜日に行われる。ただし、今月最後の日曜日だけは会場の都合で休みとなる。活動に初めて参加する人は前日までに代表者へ連絡すること。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R027","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-R028","cat":"reading","kind":"内容理解（短文）","stem":"筆者が述べていることは何か。","options":["店員の仕事は必ず減る","袋を断る客は一人もいない","店は袋の提供を禁止した","客の確認という仕事が残る"],"answer":3,"exp":"「店員の仕事が減ったとは限らない」后接说明原因：每次确认客人意愿。","topic":"校园・生活","passage":"小さな店では、商品を袋に入れるかどうかを会計時に尋ねるようにした。袋を断る客が増えたものの、店員の仕事が減ったとは限らない。客の希望をその都度確認する必要があるからだ。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R028","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-R029","cat":"reading","kind":"内容理解（短文）","stem":"測定条件を書く理由は何か。","options":["数字を増やすため","後で結果を比べやすくするため","場所を秘密にするため","測定を中止するため"],"answer":1,"exp":"「条件が分からなければ、後から結果を比較しにくい」。","topic":"废墟・现场研究","passage":"調査報告では、測定した数字を並べるだけでなく、どの場所で、どのような条件で測定したかを書くよう求められた。条件が分からなければ、後から結果を比較しにくいからだ。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R029","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-R030","cat":"reading","kind":"内容理解（短文）","stem":"雨が降った場合、何が中止になるか。","options":["屋外の演奏","講演","イベント全体","展示"],"answer":0,"exp":"活动继续，只有「屋外で予定されていた演奏」取消。","topic":"校园・生活","passage":"商店街のイベントは雨天でも実施するが、屋外で予定されていた演奏は中止となる。展示と講演は予定どおり室内で行う。参加者には当日の朝、変更情報がメールで送られる。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R030","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-R031","cat":"reading","kind":"内容理解（短文）","stem":"土曜日について正しいものはどれか。","options":["証明書をすぐ受け取れる","相談も証明書発行もできない","予約すれば相談できる","発行まで三時間かかる"],"answer":2,"exp":"「予約があれば土曜日も利用できる」。证书办理只在平日，且需3个工作日。","topic":"校园・生活","passage":"大学の留学生相談室は、予約があれば土曜日も利用できる。ただし、証明書の発行は平日のみで、申請後三営業日かかる。土曜に相談したその場で証明書を受け取ることはできない。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R031","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-R032","cat":"reading","kind":"内容理解（中文）","stem":"筆者の主張は何か。","options":["新しい技術は必ず失敗する","操作を学ぶ必要はない","実際の利用者にとっての使いやすさが重要だ","機能が多ければ使いやすい"],"answer":2,"exp":"末句「機能の数ではなく、それを使う人にとっての使いやすさ」。","topic":"校园・生活","passage":"新しいアプリを導入すれば、仕事の効率が必ず上がると思われがちだ。しかし、操作に慣れるまでに時間がかかり、かえって負担が増える場合もある。ある職場では導入前に実際の利用者の意見を聞き、最も必要とされている機能だけを選んだ。機能を減らすことに最初は反対もあったが、導入後には操作が分かりやすいという声が増えた。技術の便利さは、機能の数ではなく、それを使う人にとっての使いやすさで判断されるべきだ。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R032","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-R033","cat":"reading","kind":"内容理解（中文）","stem":"職場が導入前に行ったことは何か。","options":["利用者の意見を聞いた","全機能を追加した","アプリの使用を禁止した","全員の意見を無視した"],"answer":0,"exp":"「導入前に実際の利用者の意見を聞き」。","topic":"校园・生活","passage":"新しいアプリを導入すれば、仕事の効率が必ず上がると思われがちだ。しかし、操作に慣れるまでに時間がかかり、かえって負担が増える場合もある。ある職場では導入前に実際の利用者の意見を聞き、最も必要とされている機能だけを選んだ。機能を減らすことに最初は反対もあったが、導入後には操作が分かりやすいという声が増えた。技術の便利さは、機能の数ではなく、それを使う人にとっての使いやすさで判断されるべきだ。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R033","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-R034","cat":"reading","kind":"内容理解（中文）","stem":"機能を減らした後、どのような反応があったか。","options":["反対が永久に続いた","仕事が必ず減った","操作が分かりやすいという声が増えた","誰も利用しなくなった"],"answer":2,"exp":"反对最初存在，但导入后可用性评价上升。","topic":"校园・生活","passage":"新しいアプリを導入すれば、仕事の効率が必ず上がると思われがちだ。しかし、操作に慣れるまでに時間がかかり、かえって負担が増える場合もある。ある職場では導入前に実際の利用者の意見を聞き、最も必要とされている機能だけを選んだ。機能を減らすことに最初は反対もあったが、導入後には操作が分かりやすいという声が増えた。技術の便利さは、機能の数ではなく、それを使う人にとっての使いやすさで判断されるべきだ。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R034","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-R035","cat":"reading","kind":"内容理解（中文）","stem":"筆者が重視する記録の方法は何か。","options":["見えたことと仮説を分ける","他の条件を調べない","写真だけ残せば十分だ","すぐ原因を断定する"],"answer":0,"exp":"「何が見えたのかを書き、その後で原因についての仮説を分けて記す」。","topic":"废墟・现场研究","passage":"海辺の空き地には、防波のためにつくられた構造物が並んでいる。その形は遠くから見ると同じように見えるが、近づけば表面に生じた傷や植物の付着など、細かな違いが分かる。ただし、目で見える変化がすべて海水の影響によるとは限らない。現地では、人の利用や補修の履歴も重なっているからだ。\n観察の際に重要なのは、まず何が見えたのかを書き、その後で原因についての仮説を分けて記すことである。「傷がある」という記録と「波によって傷ができた」という説明では、確かめるべき内容が異なる。観察を急いで結論に変えないことが、後の調査を自由にする。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R035","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-R036","cat":"reading","kind":"内容理解（中文）","stem":"「すべて海水の影響によるとは限らない」理由は何か。","options":["植物が存在しないから","材料は変化しないから","人の利用や補修の履歴もあるから","海に風が吹かないから"],"answer":2,"exp":"「人の利用や補修の履歴も重なっている」。","topic":"废墟・现场研究","passage":"海辺の空き地には、防波のためにつくられた構造物が並んでいる。その形は遠くから見ると同じように見えるが、近づけば表面に生じた傷や植物の付着など、細かな違いが分かる。ただし、目で見える変化がすべて海水の影響によるとは限らない。現地では、人の利用や補修の履歴も重なっているからだ。\n観察の際に重要なのは、まず何が見えたのかを書き、その後で原因についての仮説を分けて記すことである。「傷がある」という記録と「波によって傷ができた」という説明では、確かめるべき内容が異なる。観察を急いで結論に変えないことが、後の調査を自由にする。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R036","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-R037","cat":"reading","kind":"内容理解（中文）","stem":"「確かめるべき内容が異なる」とはどういうことか。","options":["原因は目で見るだけで確定できる","観察した事実と原因の説明では検証内容が違う","両方とも同じ事実である","傷があるという記録は不要である"],"answer":1,"exp":"「傷がある」属于观察事实，「波によって傷ができた」属于因果解释，两者的证据要求不同。","topic":"废墟・现场研究","passage":"海辺の空き地には、防波のためにつくられた構造物が並んでいる。その形は遠くから見ると同じように見えるが、近づけば表面に生じた傷や植物の付着など、細かな違いが分かる。ただし、目で見える変化がすべて海水の影響によるとは限らない。現地では、人の利用や補修の履歴も重なっているからだ。\n観察の際に重要なのは、まず何が見えたのかを書き、その後で原因についての仮説を分けて記すことである。「傷がある」という記録と「波によって傷ができた」という説明では、確かめるべき内容が異なる。観察を急いで結論に変えないことが、後の調査を自由にする。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R037","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-R038","cat":"reading","kind":"主張理解（長文）","stem":"筆者は修理についてどう考えているか。","options":["壊れた部分はすべて残すべきだ","古い道具は使用を禁止すべきだ","安全を考慮しながら、時間の痕跡も尊重するべきだ","買った時と同じ形に戻すことだけが目的だ"],"answer":2,"exp":"末段与前段强调两种目标：再利用与保留时间痕迹，同时安全点检不可缺。","topic":"废墟・现场研究","passage":"「物を長く使う」という言葉を聞くと、多くの人は、壊れた部分を修理して元どおりにすることを考えるだろう。確かに、修理は大切な方法の一つだ。しかし、使い続けるということは、必ずしも買ったときの状態を守り続けることではない。傷が増えたり、色が変わったりしたものにも、それまで使われてきた時間が残されている。\nもちろん、安全に関わる部分まで壊れたままにしてよいわけではない。特に人が乗ったり、重いものを支えたりする道具には、適切な点検が欠かせない。大切なのは、何を直すべきか、何を残してよいのかを一つひとつ考えることだ。すべてを新品と同じ状態に戻すことだけを目標にすると、その物が歩んできた時間まで見えなくなることがある。\n修理するという行為には、再び使えるようにする目的と、その物に残った時間を尊重する姿勢の両方が必要なのではないだろうか。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R038","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-R039","cat":"reading","kind":"主張理解（長文）","stem":"本文中の「もちろん」が示す役割は何か。","options":["前の内容を全面的に否定する","前の意見に制限を加え、安全上の例外を説明する","時間の経過を示す","話題を完全に変える"],"answer":1,"exp":"前文保留磨损痕迹，后文「もちろん」指出不能忽略涉及安全的损伤。","topic":"废墟・现场研究","passage":"「物を長く使う」という言葉を聞くと、多くの人は、壊れた部分を修理して元どおりにすることを考えるだろう。確かに、修理は大切な方法の一つだ。しかし、使い続けるということは、必ずしも買ったときの状態を守り続けることではない。傷が増えたり、色が変わったりしたものにも、それまで使われてきた時間が残されている。\nもちろん、安全に関わる部分まで壊れたままにしてよいわけではない。特に人が乗ったり、重いものを支えたりする道具には、適切な点検が欠かせない。大切なのは、何を直すべきか、何を残してよいのかを一つひとつ考えることだ。すべてを新品と同じ状態に戻すことだけを目標にすると、その物が歩んできた時間まで見えなくなることがある。\n修理するという行為には、再び使えるようにする目的と、その物に残った時間を尊重する姿勢の両方が必要なのではないだろうか。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R039","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-R040","cat":"reading","kind":"主張理解（長文）","stem":"「時間まで見えなくなる」とは何を意味するか。","options":["使われてきた歴史の痕跡が失われる","時計を使えなくなる","修理時間が長くなる","利用者が記録を読まなくなる"],"answer":0,"exp":"指物品表面经历使用而留下的变化，被彻底翻新覆盖。","topic":"废墟・现场研究","passage":"「物を長く使う」という言葉を聞くと、多くの人は、壊れた部分を修理して元どおりにすることを考えるだろう。確かに、修理は大切な方法の一つだ。しかし、使い続けるということは、必ずしも買ったときの状態を守り続けることではない。傷が増えたり、色が変わったりしたものにも、それまで使われてきた時間が残されている。\nもちろん、安全に関わる部分まで壊れたままにしてよいわけではない。特に人が乗ったり、重いものを支えたりする道具には、適切な点検が欠かせない。大切なのは、何を直すべきか、何を残してよいのかを一つひとつ考えることだ。すべてを新品と同じ状態に戻すことだけを目標にすると、その物が歩んできた時間まで見えなくなることがある。\n修理するという行為には、再び使えるようにする目的と、その物に残った時間を尊重する姿勢の両方が必要なのではないだろうか。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R040","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-R041","cat":"reading","kind":"主張理解（長文）","stem":"最も適切な題名はどれか。","options":["古い道具の危険性だけ","修理をせずに暮らす","すべて新品にする方法","修理と残された時間"],"answer":3,"exp":"主题 ,"audio":"","group":"N2B-R044","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-R045","cat":"reading","kind":"情報検索","stem":"「音の実験」に参加する人について正しいものはどれか。","options":["申し込みは当日まで可能だ","中学生以上が対象で機材貸出がある","機材を必ず自分で買う","小学生も必ず参加できる"],"answer":1,"exp":"题目限定中学生以上，有借用录音设备；报名截止为举办前三天。","topic":"废墟・现场研究","passage":"【美術センター ワークショップ】\n「紙の立体」：金曜 18:00〜20:00、参加費800円、材料費込み、対象：高校生以上。\n「街を記録する」：土曜 10:00〜12:00、参加費無料、スマートフォン持参。\n「音の実験」：日曜 14:00〜16:00、参加費1,200円、対象：中学生以上、録音機材貸出あり。\n申込締切は各開催日の3日前。定員超過の場合は抽選。","translation":"","tip":"","wrong":[],"audio":"","group":"N2B-R045","extra":true,"mockSet":"drill","level":"N2","focus":""},{"id":"N2B-L001","cat":"listening","kind":"課題理解","stem":"男の人はこのあと何をしますか。","options":["会場を掃除する","鍵を借りる","二階で資料を印刷する","コピー機を修理する"],"answer":2,"exp":"女性先去借钥匙，男性到二楼印刷室打印资料。","topic":"校园・生活","passage":"","translation":"","tip":"","wrong":[],"audio":"女：資料を印刷してから会場に行きましょう。\n男：コピー機が故障しているそうですよ。\n女：それなら、二階の印刷室を使ってください。私は先に会場の鍵を借りてきます。\n男：分かりました。","group":"N2B-L001","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-L002","cat":"listening","kind":"課題理解","stem":"男の人はまず何をしますか。","options":["四階の鍵を借りる","二時に会議を始める","メールを削除する","参加者に変更を知らせる"],"answer":3,"exp":"女性请求「全員にメールしてくれますか」，通知时间和场地变化。","topic":"校园・生活","passage":"","translation":"","tip":"","wrong":[],"audio":"男：明日の打ち合わせは午後二時でしたよね。\n女：会議室が使えなくなったので、三時に変わりました。全員にメールしてくれますか。\n男：はい。場所は同じですか。\n女：いいえ、四階の小会議室です。","group":"N2B-L002","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-L003","cat":"listening","kind":"課題理解","stem":"男の人はこれからまず何をしますか。","options":["写真を撮り直す","今日の調査を中止する","専門家に電話する","事務室で昨日の記録を受け取る"],"answer":3,"exp":"先去办公室取昨天的风速记录，再与照片保存。","topic":"废墟・现场研究","passage":"","translation":"","tip":"","wrong":[],"audio":"女：海辺の調査、写真は撮れましたか。\n男：はい。でも昨日の風速の記録が見つからなくて。\n女：それは事務室にあるはずです。先に受け取って、今日の写真と一緒に保存してください。\n男：分かりました。","group":"N2B-L003","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-L004","cat":"listening","kind":"課題理解","stem":"男の人は荷物をどうしますか。","options":["三階に送る","自宅に持ち帰る","地下の保管室に運ぶ","受付に置く"],"answer":2,"exp":"「地下の保管室へお願いします」给出最终处理方法。","topic":"校园・生活","passage":"","translation":"","tip":"","wrong":[],"audio":"男：その荷物、受付に置いてもいいですか。\n女：大きい荷物は地下の保管室へお願いします。受付には置けません。\n男：地下の入り口は分かりにくいですね。\n女：案内図をお渡しします。","group":"N2B-L004","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-L005","cat":"listening","kind":"課題理解","stem":"男の人は何を直しますか。","options":["料金","写真","ポスターの日付","会場の場所"],"answer":2,"exp":"「日付を間違えてしまいました」「修正してもう一度」。照片部分不变。","topic":"校园・生活","passage":"","translation":"","tip":"","wrong":[],"audio":"女：ポスターの案はできましたか。\n男：はい。ただ日付を間違えてしまいました。\n女：では、修正してもう一度送ってください。写真の部分はそのままで構いません。\n男：今日中に送ります。","group":"N2B-L005","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-L006","cat":"listening","kind":"課題理解","stem":"男の人は何をしますか。","options":["資料を捨てる","五時まで先生を待つ","先生に直接渡す","受付の箱に資料を入れる"],"answer":3,"exp":"对话最后「では、そうします」同意把资料放进受付の箱。","topic":"校园・生活","passage":"","translation":"","tip":"","wrong":[],"audio":"男：資料を返そうと思ったんですが、先生がいません。\n女：先生は五時まで戻りませんよ。急ぎなら、受付の箱に入れてください。\n男：では、そうします。","group":"N2B-L006","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-L007","cat":"listening","kind":"ポイント理解","stem":"運行本数が増えるのはいつですか。","options":["土曜日の朝","平日の朝","日曜日の昼","平日の夜"],"answer":1,"exp":"关键限定「平日の朝だけ」。周末不变。","topic":"校园・生活","passage":"","translation":"","tip":"","wrong":[],"audio":"女：新しいバス路線は利用者が増えたので、平日の朝だけ運行本数を増やすことにしました。土曜日と日曜日はこれまでと変わりません。","group":"N2B-L007","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-L008","cat":"listening","kind":"ポイント理解","stem":"質問の時間がなくなった場合、どうしますか。","options":["質問を取り消す","翌日電話する","会場を変更する","メールで質問を送る"],"answer":3,"exp":"条件「講演が長引いた場合」→「質問をメールで受け付ける」。","topic":"校园・生活","passage":"","translation":"","tip":"","wrong":[],"audio":"男：今日の講演会では、最後に質問の時間を設けます。ただし、講演が予定より長引いた場合は、質問をメールで受け付けることにします。","group":"N2B-L008","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-L009","cat":"listening","kind":"ポイント理解","stem":"今年の展示について分かることは何ですか。","options":["来場者も評価も増えた","来場者は変わらなかった","来場者が減り、分かりやすさの評価は増えた","評価は大きく下がった"],"answer":2,"exp":"来场人数稍减，但「分かりやすかった」回答增多。","topic":"废墟・现场研究","passage":"","translation":"","tip":"","wrong":[],"audio":"女：去年と比べると、今年の展示は来場者数が少し減りました。しかし、アンケートでは展示内容が分かりやすかったという回答が増えています。","group":"N2B-L009","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-L010","cat":"listening","kind":"ポイント理解","stem":"見学できる場所はどこですか。","options":["建物の外だけ","屋上と二階","一階だけ","屋上だけ"],"answer":2,"exp":"雨天不取消，安全考虑只参观一楼。","topic":"废墟・现场研究","passage":"","translation":"","tip":"","wrong":[],"audio":"男：明日予定していた建物の見学は、天気が悪くても行います。ただ、屋上は滑りやすいので立ち入らず、一階だけを見て回る予定です。","group":"N2B-L010","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-L011","cat":"listening","kind":"ポイント理解","stem":"社会人はいくら払いますか。","options":["二千円","千円","五百円","千五百円"],"answer":3,"exp":"社会人参加费1000日元＋教材费500日元＝1500日元。","topic":"校园・生活","passage":"","translation":"","tip":"","wrong":[],"audio":"女：この講座は大学生なら無料ですが、社会人には千円の参加費がかかります。教材費はどちらも別に五百円です。","group":"N2B-L011","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-L012","cat":"listening","kind":"概要理解","stem":"男の人は主に何を述べていますか。","options":["道を広げれば必ず店が増える","商店を増やすには複数の工夫が必要だ","家賃を上げるべきだ","中心部に店はもう必要ない"],"answer":1,"exp":"主要观点是仅降租金不够，还需要活动和步行环境建设。","topic":"校园・生活","passage":"","translation":"","tip":"","wrong":[],"audio":"男：最近、町の中心部から小さな店が減っています。しかし、家賃を安くするだけでは新しい店が増えるとは限りません。人が立ち寄りたくなる催しや、歩いて回れる道づくりも必要です。","group":"N2B-L012","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-L013","cat":"listening","kind":"概要理解","stem":"女の人の話の中心は何ですか。","options":["写真より文章が優れている","高いカメラが必要だ","撮影者の選択が写真の印象を変える","写真はいつも客観的だ"],"answer":2,"exp":"构图和视点的选择改变照片的意义；摄影不只是被动复制。","topic":"废墟・现场研究","passage":"","translation":"","tip":"","wrong":[],"audio":"女：写真を撮るとき、何を画面に入れるかだけでなく、何を入れないかも大切です。同じ場所でも、見る位置が変わればまったく違う印象になります。そのため、写真はただ景色を写す道具とは言い切れません。","group":"N2B-L013","extra":true,"mockSet":"B","level":"N2","focus":""},{"id":"N2B-L014","cat":"listening","kind":"概要理解","stem":"男の人が伝えたいことは何ですか。","options":["交流方法も授業設計の一部として考えること","オンライン授業を廃止すること","移動の時間を増 function downloadBlob(filename,content,type='text/plain;charset=utf-8'){let blob=new Blob([content],{type});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function downloadReport(date){const s=lookupEntry(date);if(!s)return;let lines=[`JLPT N2 FIELD NOTES | ${s.label}`,`Date: ${s.date}`,`Mode: ${s.mode}`,`Questions: ${s.ids.length}`,'This is original practice; raw scores are NOT official JLPT scaled scores.','',''];for(let [n,id] of s.ids.entries()){let q=BANK.find(x=>x.id===id);if(!q)continue;let own=s.answers[id],a=Object.hasOwn(s.answers,id);lines.push(`${n+1}. [${q.cat}/${q.kind}] ${q.stem}`,q.passage?'READING:\n'+q.passage:'',q.audio?'AUDIO TRANSCRIPT:\n'+q.audio:'',`YOUR ANSWER: ${a?own+1+'. '+q.options[own]:'UNANSWERED'}`,`CORRECT: ${q.answer+1}. ${q.options[q.answer]}`,`EXPLANATION: ${q.exp}`,q.tip?'TIP: '+q.tip:'',q.translation?'TRANSLATION: '+q.translation:'','-----------------------------------')}downloadBlob(`JLPT_N2_${date.slice(0,10)}_Report.txt`,lines.filter(x=>x!=='').join('\n'))}

let s=DATA.active;let myAudio=++audioSerial;audioPlaying=true;const b=document.getElementById('heard');if(b)b.textContent='▶ 播放中，请勿切换页面';let v=voiceVoices.find(x=>/ja-JP/i.test(x.lang)&&/Kyoko|Otoya|Nanami|Siri|Google/i.test(x.name))||voiceVoices[0]||null;let index=0;let completed=false;return new Promise(resolve=>{let done=(ok)=>{if(myAudio!==audioSerial){resolve(false);return}audioPlaying=false;completed=ok;if(ok&&s&&s===DATA.active){s.played[q.group]=true;store()}if(!isReview&&s===DATA.active)renderSession();resolve(ok)};let speakNext=()=>{if(myAudio!==audioSerial){resolve(false);return}if(!audioPlaying){done(false);return}if(index>=script.length){done(true);return}let u=new SpeechSynthesisUtterance(script[index++]);u.lang='ja-JP';if(v)u.voice=v;u.rate=0.93;u.pitch=1;u.onend=()=>setTimeout(speakNext,100);u.onerror=e=>{if(myAudio!==audioSerial){resolve(false);return}audioPlaying=false;toast('语音播放中断。可以再次点击播放；Safari 请保持屏幕常亮。');done(false)};try{speechSynthesis.speak(u)}catch(e){audioPlaying=false;done(false)}};speakNext()})}
