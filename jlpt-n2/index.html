const BANK=[{"id":"N2-001","cat":"vocab","kind":"漢字の読み","stem":"海辺の施設は長い間【放置】されていた。","options":["ほうち","ほうじ","はなち","ほち"],"answer":0,"exp":"「放置（ほうち）」＝放任不管。「放」读ほう、「置」读ち。常见搭配：放置する／放置された建物。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L1","extra":false,"level":"N2"},{"id":"N2-002","cat":"vocab","kind":"漢字の読み","stem":"現地で周辺の【状況】を確認した。","options":["じょうきょ","じょうきょう","しょうきょう","じょきょう"],"answer":1,"exp":"「状況（じょうきょう）」＝情况。注意末尾是长音「きょう」，不是「きょ」。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L2","extra":false,"level":"N2"},{"id":"N2-003","cat":"vocab","kind":"漢字の読み","stem":"古い設備の【維持】には費用がかかる。","options":["いし","いじ","ゆいじ","ういち"],"answer":1,"exp":"「維持（いじ）」＝维持。与「意地（いじ，固执）」同音，但汉字和用法不同。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L3","extra":false,"level":"N2"},{"id":"N2-004","cat":"vocab","kind":"漢字の読み","stem":"安全のために立ち入りを【制限】した。","options":["せいげん","せいけん","せんげん","ぜいげん"],"answer":0,"exp":"「制限（せいげん）」＝限制。「宣言（せんげん）」＝声明，常见混淆。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L4","extra":false,"level":"N2"},{"id":"N2-005","cat":"vocab","kind":"漢字の読み","stem":"資料を読んで作品の【意図】を理解した。","options":["いど","いず","いと","いとう"],"answer":2,"exp":"「意図（いと）」＝意图；「意図する」＝打算、意在。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L5","extra":false,"level":"N2"},{"id":"N2-006","cat":"vocab","kind":"表記","stem":"この問題を【かいけつ】するには時間が必要だ。","options":["解結","解決","開決","改結"],"answer":1,"exp":"「解決（かいけつ）」：处理或解决问题。与「結論（けつろん）」中的「結」不同。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L6","extra":false,"level":"N2"},{"id":"N2-007","cat":"vocab","kind":"表記","stem":"研究室の【せつび】を点検した。","options":["設置","設備","摂備","説備"],"answer":1,"exp":"「設備（せつび）」＝设备。設置（せっち）＝安装，读音和含义不同。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L7","extra":false,"level":"N2"},{"id":"N2-008","cat":"vocab","kind":"表記","stem":"作業に参加する人数を【せいげん】する。","options":["制限","制減","製限","正現"],"answer":0,"exp":"「制限（せいげん）」限制数量；「減少（げんしょう）」是减少，不可写作「制減」。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L8","extra":false,"level":"N2"},{"id":"N2-009","cat":"vocab","kind":"表記","stem":"【ちょうさ】の結果を発表した。","options":["長査","調査","超査","頂査"],"answer":1,"exp":"「調査（ちょうさ）」调查。調べる／調査する属于同一词族。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L9","extra":false,"level":"N2"},{"id":"N2-010","cat":"vocab","kind":"表記","stem":"台風の進路を【よそく】した。","options":["予測","余側","予則","預測"],"answer":0,"exp":"「予測（よそく）」预测。「予想」也指预料，但「予測」更强调利用数据推测。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L10","extra":false,"level":"N2"},{"id":"N2-011","cat":"vocab","kind":"語形成","stem":"この地域では、住民の（　）高齢化が問題になっている。","options":["超","低","逆","再"],"answer":0,"exp":"「超高齢化」是固定复合词，表示超高龄化；「再高齢化」「低高齢化」不自然。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L11","extra":false,"level":"N2"},{"id":"N2-012","cat":"vocab","kind":"語形成","stem":"以前公開した資料を修正し、国内外に（　）公開した。","options":["無","大","再","未"],"answer":2,"exp":"「再公開する」＝再次公开；「大公開」虽可用作宣传语，但此处「研究成果を国内外に大公開した」语体不自然。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L12","extra":false,"level":"N2"},{"id":"N2-013","cat":"vocab","kind":"語形成","stem":"建物の（　）利用について話し合った。","options":["再","半","否","無"],"answer":0,"exp":"「再利用」＝再使用、再利用。废弃建筑经过整修后可「再利用」する。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L13","extra":false,"level":"N2"},{"id":"N2-014","cat":"vocab","kind":"語形成","stem":"美術館では作品の（　）展示を行った。","options":["準","特別","否","当"],"answer":1,"exp":"「特別展示」＝特别展览；「準展示」「否展示」不是自然的常用搭配。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L14","extra":false,"level":"N2"},{"id":"N2-015","cat":"vocab","kind":"語形成","stem":"資料の（　）整理を担当した。","options":["未","再","過","難"],"answer":1,"exp":"「再整理」＝重新整理。表示工作已整理过但需要重新排列、分类。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L15","extra":false,"level":"N2"},{"id":"N2-016","cat":"vocab","kind":"文脈に合う語","stem":"海に近い建物では、金属が（　）しやすい。","options":["腐食","増殖","成長","拡散"],"answer":0,"exp":"「腐食（ふしょく）」＝腐蚀，常与金属和盐分搭配。増殖＝增殖；成長＝成长；拡散＝扩散。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L16","extra":false,"level":"N2"},{"id":"N2-017","cat":"vocab","kind":"文脈に合う語","stem":"展示会の準備は予定より（　）進んでいる。","options":["順調に","慎重に","永久に","突然に"],"answer":0,"exp":"「順調に進む」＝进展顺利；慎重に＝谨慎地，是做事态度，不代表进度良好。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L17","extra":false,"level":"N2"},{"id":"N2-018","cat":"vocab","kind":"文脈に合う語","stem":"急な変更で参加者に（　）をかけてしまった。","options":["手間","迷惑","印象","意識"],"answer":1,"exp":"「迷惑をかける」固定搭配＝给别人添麻烦；「手間をかける」是费工夫，不等同于造成困扰。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L18","extra":false,"level":"N2"},{"id":"N2-019","cat":"vocab","kind":"文脈に合う語","stem":"会議では予算についてさまざまな（　）が出た。","options":["意見","状況","習慣","原因"],"answer":0,"exp":"「意見が出る」意见被提出；「原因が出る」不是普通会议语境的搭配。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L19","extra":false,"level":"N2"},{"id":"N2-020","cat":"vocab","kind":"文脈に合う語","stem":"調査の経過を後から確認できるように、観測中の風の強さや音を（　）した。","options":["比較","記録","回避","調査"],"answer":1,"exp":"「風の強さや音を記録する」表示把观测内容记录下来，目的是之后能够核对调查经过。「調査する」指调查现象本身，与后续查看观测记录的目的不同。","topic":"废墟・材料","passage":"","translation":"","tip":"比較する通常要有比较对象，如「二つの地点の風速を比較する」。","wrong":[],"audio":"","group":"L20","extra":false,"level":"N2"},{"id":"N2-021","cat":"vocab","kind":"文脈に合う語","stem":"長期間使われなかった施設は、設備が（　）していた。","options":["老朽化","理想化","多様化","簡略化"],"answer":0,"exp":"「老朽化（ろうきゅうか）」＝因年代久远而老旧。理想化/多様化/簡略化不符合「長期間使われなかった」背景。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L21","extra":false,"level":"N2"},{"id":"N2-022","cat":"vocab","kind":"文脈に合う語","stem":"安全上の理由から、立ち入りを一時（　）した。","options":["納得","許可","禁止","依頼"],"answer":2,"exp":"「立ち入りを禁止する」禁止进入；「許可」是允许，与「安全上の理由」不吻合。","topic":"废墟・材料","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L22","extra":false,"level":"N2"},{"id":"N2-023","cat":"vocab","kind":"言い換え・類義","stem":"この計画には【大幅な】変更が必要だ。","options":["小さな","大きな","細かい","一時的な"],"answer":1,"exp":"「大幅な」＝幅度很大，最接近「大きな」。与「細かい（细小的）」相反。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L23","extra":false,"level":"N2"},{"id":"N2-024","cat":"vocab","kind":"言い換え・類義","stem":"提出期限を【延長】することになった。","options":["早める","取り消す","遅くする","守る"],"answer":2,"exp":"「延長する」＝延长期限，即推迟截止时间；不是取消或提前。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L24","extra":false,"level":"N2"},{"id":"N2-025","cat":"vocab","kind":"言い換え・類義","stem":"雨が降ったため、予定を【変更】した。","options":["変えた","続けた","決めた","知らせた"],"answer":0,"exp":"「変更する」＝改变，「変える」是直接的同义表达。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L25","extra":false,"level":"N2"},{"id":"N2-026","cat":"vocab","kind":"言い換え・類義","stem":"説明が【曖昧】で、よく理解できなかった。","options":["具体的","不明確","丁寧","正確"],"answer":1,"exp":"「曖昧（あいまい）」＝含糊、不明确；「不明確」最接近。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L26","extra":false,"level":"N2"},{"id":"N2-027","cat":"vocab","kind":"言い換え・類義","stem":"実験の結果は【予想外】だった。","options":["予測していた通り","計画通り","思っていたのと違う","十分に検討した"],"answer":2,"exp":"「予想外」＝出乎预料；与「思っていたのと違う」同义。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L27","extra":false,"level":"N2"},{"id":"N2-028","cat":"vocab","kind":"語の使い方","stem":"「携わる」の使い方として最も適切なものはどれか。","options":["彼は地域の建築調査に携わっている。","机が部屋の隅に携わっている。","彼女は荷物を携わって駅に向かった。","新しい機械を携わって使った。"],"answer":0,"exp":"「携わる（たずさわる）」＝参与某项工作／事业；接「～に携わる」。不表示物体的位置或携带物品。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L28","extra":false,"level":"N2"},{"id":"N2-029","cat":"vocab","kind":"語の使い方","stem":"「踏まえる」の使い方として最も適切なものはどれか。","options":["昨日の雨を踏まえて靴が濡れた。","調査結果を踏まえて計画を見直した。","信号を踏まえて道を渡った。","材料を踏まえて箱に入れた。"],"answer":1,"exp":"「踏まえる」＝以事实、结果、前提为依据；「～を踏まえて判断する／見直す」。不是实际踩踏。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L29","extra":false,"level":"N2"},{"id":"N2-030","cat":"vocab","kind":"語の使い方","stem":"「見込む」の使い方として最も適切なものはどれか。","options":["今朝、友人を駅まで見込んだ。","紙を箱に見込んだ。","来場者は約千人と見込まれている。","昼食を見込んで食べた。"],"answer":2,"exp":"「見込む」＝预计、预期；「～と見込まれる」预计为……，常用于人数、费用、收益。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L30","extra":false,"level":"N2"},{"id":"N2-031","cat":"vocab","kind":"語の使い方","stem":"「さえぎる」の使い方として最も適切なものはどれか。","options":["木々が強い日差しをさえぎっている。","先生は宿題をさえぎって配った。","仕事が終わってから昼食をさえぎった。","彼は毎朝七時に目をさえぎる。"],"answer":0,"exp":"「遮る（さえぎる）」＝阻挡光、风、声音，或打断谈话；「日差しを遮る」自然。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L31","extra":false,"level":"N2"},{"id":"N2-032","cat":"vocab","kind":"語の使い方","stem":"「とどまる」の使い方として最も適切なものはどれか。","options":["海水をコップにとどまった。","彼は説明をとどまって話した。","被害は小規模な範囲にとどまった。","写真をとどまって印刷した。"],"answer":2,"exp":"「とどまる」＝停留在某范围或程度；「～にとどまる」。不表示把海水倒入容器。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L32","extra":false,"level":"N2"},{"id":"N2-033","cat":"grammar","kind":"文の文法①","stem":"この建物の調査を始める（　）、安全管理者に相談してください。","options":["にあたって","ところで","にすぎず","ばかりに"],"answer":0,"exp":"「V辞書形＋にあたって」＝在开始某项重要活动时。后接需要预先进行的行为；「ところで」表示即使……也，并不合语境。","topic":"日常・社会","passage":"","translation":"","tip":"接续：調査を始めるにあたって／調査にあたって。","wrong":[],"audio":"","group":"L33","extra":false,"level":"N2"},{"id":"N2-034","cat":"grammar","kind":"文の文法①","stem":"風が強くなってきたので、屋外での作業を中止せ（　）。","options":["ざるを得ない","ないことはない","ないわけではない","るに違いない"],"answer":0,"exp":"「Vない形（ない→ず）＋ざるを得ない」＝不得不。する→せざるを得ない（特别变化）。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L34","extra":false,"level":"N2"},{"id":"N2-035","cat":"grammar","kind":"文の文法①","stem":"何度も確認した（　）、資料の数値には誤りが見つからなかった。","options":["にとって","うえで","ところ","ものの"],"answer":3,"exp":"「～ものの」表示转折：虽然反复确认，但最终还是没有找到错误。「にとって」要接名词，不能直接接「確認した」。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L35","extra":false,"level":"N2"},{"id":"N2-036","cat":"grammar","kind":"文の文法①","stem":"この装置は便利な（　）、定期的な点検が必要だ。","options":["反面","うちに","限り","せいで"],"answer":0,"exp":"「～反面」＝一方面……另一方面……。便利与需要维护是并列对比；「せいで」需有负面原因结果。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L36","extra":false,"level":"N2"},{"id":"N2-037","cat":"grammar","kind":"文の文法①","stem":"参加者の増加に（　）、展示室の利用時間を延ばした。","options":["つれて","伴って","よっても","限って"],"answer":1,"exp":"「N＋に伴って」＝随着某种变化而发生另一变化；「増加に伴って」固定书面搭配。「につれて」要接动词/名词表达如「増えるにつれて」。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L37","extra":false,"level":"N2"},{"id":"N2-038","cat":"grammar","kind":"文の文法①","stem":"先生の説明を聞いた（　）、疑問がすべて解消したわけではない。","options":["からといって","に従って","ところで","ついでに"],"answer":0,"exp":"「～からといって、必ずしも～わけではない」＝不能因为……就断定……。「聞いたからといって」明确反驳简单因果推断。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L38","extra":false,"level":"N2"},{"id":"N2-039","cat":"grammar","kind":"文の文法①","stem":"この公園は子ども（　）、高齢者にも利用されている。","options":["からには","に限らず","にわたって","かねて"],"answer":1,"exp":"「N＋に限らず」＝不仅限于……；「子どもに限らず、高齢者にも」自然。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L39","extra":false,"level":"N2"},{"id":"N2-040","cat":"grammar","kind":"文の文法①","stem":"提出された資料は、内容を確認した（　）公開します。","options":["上で","おかげで","ばかりに","ところを"],"answer":0,"exp":"「Vた形＋上で」＝完成前一动作后，再进行下一动作；强调步骤。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L40","extra":false,"level":"N2"},{"id":"N2-041","cat":"grammar","kind":"文の文法①","stem":"あの研究者は長年現場を調べてきただけ（　）、説明に説得力がある。","options":["で","あって","に","か"],"answer":1,"exp":"「～だけあって」＝不愧是／正因为具有某经历，结果符合期待；接「だけあって」。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L41","extra":false,"level":"N2"},{"id":"N2-042","cat":"grammar","kind":"文の文法①","stem":"問題がこれ以上深刻化すれば、計画の延期もあり（　）。","options":["かねない","そうもない","得る","うるまい"],"answer":2,"exp":"「Vます形＋得る（える／うる）」＝有可能发生；「あり得る」。注意「ありかねない」不是标准表达，かねない接「起こりかねない」。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L42","extra":false,"level":"N2"},{"id":"N2-043","cat":"grammar","kind":"文の文法①","stem":"準備が整い（　）、詳しい日程をご連絡します。","options":["次第","以来","途中","ほど"],"answer":0,"exp":"「Vます形＋次第」＝一……就立刻……（正式通知常见）；「整い次第」正确。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L43","extra":false,"level":"N2"},{"id":"N2-044","cat":"grammar","kind":"文の文法①","stem":"この作品は美しい（　）、修復には多くの課題が残っている。","options":["一方で","だけに","ところを","ことから"],"answer":0,"exp":"「～一方で」＝另一方面；既承认美感，也指出修复困难。","topic":"日常・社会","passage":"","translation":"","tip":"","wrong":[],"audio":"","group":"L44","extra":false,"level":"N2"},{"id":"N2-045","cat":"grammar","kind":"文の文法②（★排序）","stem":"海沿いに建つ古い建物の壁に ____ ____ ★ ____ 気づいた。","options":["ひびが","ことに","小さな","入っている"],"answer":3,"exp":"完整顺序：壁に【小さな → ひびが → 入っている → ことに】気づいた。★是第三个「入っている」。关键搭配「～ことに気づく」。","topic":"废墟・材料","passage":"","translation":"","tip":"四个词块必须各用一次，排成自然句子；选择放在 ★ 位置的词块。","wrong":["先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。"],"audio":"","group":"L45","extra":false,"level":"N2"},{"id":"N2-046","cat":"grammar","kind":"文の文法②（★排序）","stem":"私は、その作品が ____ ____ ★ ____ ようになった。","options":["動かすのかを","人の心を","考える","なぜ"],"answer":0,"exp":"完整顺序：作品が【なぜ → 人の心を → 動かすのかを → 考える】ようになった。「疑问词＋普通形＋か」嵌入间接疑问。","topic":"废墟・材料","passage":"","translation":"","tip":"四个词块必须各用一次，排成自然句子；选择放在 ★ 位置的词块。","wrong":["先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。"],"audio":"","group":"L46","extra":false,"level":"N2"},{"id":"N2-047","cat":"grammar","kind":"文の文法②（★排序）","stem":"安全性を確認せずに ____ ____ ★ ____ わけにはいかない。","options":["危険な","場所へ","学生を","入れる"],"answer":2,"exp":"完整顺序：【危険な → 場所へ → 学生を → 入れる】わけにはいかない。结构「V辞書形＋わけにはいかない」＝基于常识、责任不能这样做。","topic":"废墟・材料","passage":"","translation":"","tip":"四个词块必须各用一次，排成自然句子；选择放在 ★ 位置的词块。","wrong":["先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。"],"audio":"","group":"L47","extra":false,"level":"N2"},{"id":"N2-048","cat":"grammar","kind":"文の文法②（★排序）","stem":"長年使われていない設備を ____ ____ ★ ____ 難しい。","options":["動かす","再び","のは","そのまま"],"answer":0,"exp":"完整顺序：設備を【そのまま → 再び → 動かす → のは】難しい。「V辞書形＋のは＋形容词」，将动作名词化。","topic":"废墟・材料","passage":"","translation":"","tip":"四个词块必须各用一次，排成自然句子；选择放在 ★ 位置的词块。","wrong":["先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。"],"audio":"","group":"L48","extra":false,"level":"N2"},{"id":"N2-049","cat":"grammar","kind":"文の文法②（★排序）","stem":"計画を進める前に ____ ____ ★ ____ 必要がある。","options":["住民に","説明を","する","周辺の"],"answer":1,"exp":"完整顺序：【周辺の → 住民に → 説明を → する】必要がある。「V辞書形＋必要がある」表示有必要做。","topic":"废墟・材料","passage":"","translation":"","tip":"四个词块必须各用一次，排成自然句子；选择放在 ★ 位置的词块。","wrong":["先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。","先找助词的承接关系，再决定词块顺序。"],"audio":"","group":"L49","extra":false,"level":"N2"},{"id":"N2-050","cat":"grammar","kind":"文章の文法","stem":"文章中の【A】に入る最も適切なものを選びなさい。","options":["にもかかわらず","とともに","にかけて","に限って"],"answer":0,"exp":"「放置されていたにもかかわらず、外観はよく残っている」＝虽然长期闲置，外观却保持良好。","topic":"废墟・材料","passage":"ある町では、使われなくなった倉庫を展示室として活用する計画が進んでいる。建物は長年放置されていた【A】、外観は比較的よく残っている。しかし、内部の設備は古く、来場者を迎える前に点検が必要だ。担当者は安全性を確認した【B】、公開できる範囲を決めるという。\n一方、市民からは「古さをすべて消してほしくない」という声も上がった。そこで、設計者は建物の傷を【C】残す方法を検討している。修復によって空間が安全になる【D】、その場所の歴史まで見えなくなるのは避けたいからだ。今回の計画は、建物をただ新しくする【E】、過去の痕跡と現在の利用を両立させようとする試みである。","translation":"","tip":"文章语法要回到前后句找逻辑关系；单看语法接续往往有多个看似可能的选项。","wrong":[],"audio":"","group":"L50","extra":false,"level":"N2"},{"id":"N2-051","cat":"grammar","kind":"文章の文法","stem":"文章中の【B】に入る最も適切なものを選びなさい。","options":["ように","うえで","ばかりに", 者を迎える前に点検が必要だ。担当者は安全性を確認した【B】、公開できる範囲を決めるという。\n一方、市民からは「古さをすべて消してほしくない」という声も上がった。そこで、設計者は建物の傷を【C】残す方法を検討している。修復によって空間が安全になる【D】、その場所の歴史まで見えなくなるのは避けたいからだ。今回の計画は、建物をただ新しくする【E】、過去の痕跡と現在の利用を両立させようとする試みである。","translation":"","tip":"文章语法要回到前后句找逻辑关系；单看语法接续往往有多个看似可能的选项。","wrong":[],"audio":"","group":"L54","extra":false,"level":"N2"},{"id":"N2-055","cat":"reading","kind":"内容理解（短文）","stem":"大型の作品を搬入する学生は、何をしなければならないか。","options":["金曜日の午後五時以降に搬入する","前日までに搬入口を予約する","土曜日までに照明を調整する","会場の鍵を受付で借りる"],"answer":1,"exp":"「大型の作品を搬入する場合は、前日までに受付へ連絡し、搬入口を予約する必要がある」が直接依据。照明调整与搬入口不是同一事项。","topic":"大学・展示","passage":"大学のギャラリーでは、来週から学生作品の展示が始まる。作品の設置は金曜日の午後五時までに終えること。ただし、照明の調整については土曜日の午前中も担当者が対応する。大型の作品を搬入する場合は、前日までに受付へ連絡し、搬入口を予約する必要がある。会場の鍵は展示担当の職員が管理するため、学生が自由に持ち出すことはできない。","translation":"大型作品须提前一天预约搬入口，照明可周六调整，但布展须周五17:00前结束。","tip":"定位决定性语句；避免把可能性夸大成已经证实。","wrong":[],"audio":"","group":"L55","extra":false,"level":"N2"},{"id":"N2-056","cat":"reading","kind":"内容理解（短文）","stem":"この案内の内容と合っているものはどれか。","options":["本の貸し出しは午後八時まで可能だ","二階では普段どおり本が読める","夜間にも返却ポストを利用できる","図書館は今月から午後七時に閉まる"],"answer":2,"exp":"文中「返却は入口横のポストを利用すれば夜間でも可能」。借阅截至19:45，不是20:00；二楼阅览席停用。","topic":"校园・生活","passage":"駅前の図書館では、今月から閉館時間を午後七時から八時に変更した。ただし、資料の貸し出しは閉館十五分前までで、返却は入口横のポストを利用すれば夜間でも可能だ。また、館内の一部で工事が行われるため、二階の閲覧席は当面利用できない。最新の開館情報は図書館のウェブサイトで確認してほしい。","translation":"图书馆延时到20:00，但借阅截止19:45，夜间可用还书箱，二楼临时关闭。","tip":"定位决定性语句；避免把可能性夸大成已经证实。","wrong":[],"audio":"","group":"L56","extra":false,"level":"N2"},{"id":"N2-057","cat":"reading","kind":"内容理解（短文）","stem":"筆者がこの時点で判断したことは何か。","options":["音は確実に機械から出ている","風と音には関係がありそうだが原因は未確定だ","建物の内部には入っても安全だ","風の強さと音の大きさは無関係だ"],"answer":1,"exp":"「風が強まるたびに音も大きく」是观察相关；「原因を特定できたわけではない」明确未证因果。典型 N2 过度推断陷阱。","topic":"废墟・风声","passage":"海沿いの古い建物を訪れたとき、壁の隙間から低い音が聞こえた。最初は機械が動いているのかと思ったが、近づいてみると、風が強まるたびに音も大きくなっていた。ただし、それだけで音の原因を特定できたわけではない。記録を続け、風向きや周囲の環境との関係を確かめる必要があると感じた。","translation":"在海边旧建筑听到低鸣，声音随风变大，但尚不能确认机制。","tip":"定位决定性语句；避免把可能性夸大成已经证实。","wrong":[],"audio":"","group":"L57","extra":false,"level":"N2"},{"id":"N2-058","cat":"reading","kind":"内容理解（短文）","stem":"申し込みに関して正しいものはどれか。","options":["定員を超えたら早い者から選ばれる","電話申し込みは週末も可能だ","ネットが使えない人は電話で申し込める","結果は申し込み当日に必ず分かる"],"answer":2,"exp":"「インターネットを利用できない人は…電話で申し込むことができる」。先着順ではなく抽選。","topic":"公告・生活","passage":"市が運営する文化講座の申し込みは、原則としてウェブサイトで受け付ける。ただし、インターネットを利用できない人は、平日の午前九時から午後五時まで電話で申し込むことができる。申し込み人数が定員を超えた場合は抽選とし、先着順では決めない。結果は来月初めにメールまたは郵便で通知する。","translation":"网页优先报名；无法上网可平日电话报名；超额抽签；下月初通知。","tip":"定位决定性语句；避免把可能性夸大成已经证实。","wrong":[],"audio":"","group":"L58","extra":false,"level":"N2"},{"id":"N2-059","cat":"reading","kind":"内容理解（短文）","stem":"研究者が特に重視しているのは何か。","options":["古い写真だけで歴史を結論づけること","写真の数を増やすこと","過去の記録に加えて現在の変化を調べること","歴史的な建物をすべて建て直すこと"],"answer":2,"exp":"「だからこそ」之后是结论：听居民讲述、实地观察现状。不是拒绝照片，而是认为仅凭过去的静态记录不够。","topic":"废墟・时间","passage":"ある研究者は、古い写真を集めることだけでは地域の歴史を理解したことにはならないと言う。写真には撮影された瞬間が残るが、その後に場所がどう使われたのか、なぜ姿を変えたのかまでは写らない。だからこそ、住民の話を聞いたり、現在の景色を歩いて観察したりすることが重要なのだ。","translation":"照片记录瞬间，难呈现后续变化，因此要结合口述与当前的场所观察。","tip":"定位决定性语句；避免把可能性夸大成已经证实。","wrong":[],"audio":"","group":"L59","extra":false,"level":"N2"},{"id":"N2-060","cat":"reading","kind":"内容理解（中文）","stem":"筆者によると、舗装された場所では何が起こりやすいか。","options":["雨水が地下に入りにくい","どんな植物もすぐ育つ","人が歩けなくなる","風が常に弱くなる"],"answer":0,"exp":"第一段「舗装された地面では雨水が地下にしみ込みにくく」明确说明。","topic":"废墟・生态","passage":"都市の空き地に自然が戻ってくることを、単純に「緑が増えて良かった」と評価する人もいる。しかし、草や木が増える過程は場所によって大きく異なる。舗装された地面では雨水が地下にしみ込みにくく、根を伸ばせる場所も限られる。一方、建物が取り壊された後の土地には、土に含まれる種や、風に運ばれてきた種が芽を出す場合がある。\nこうした変化を観察する際には、植物の種類を数えるだけでは不十分だ。日当たりや水の流れ、以前そこに何が建っていたのかを調べることで、現在の風景がどう生まれたのかが少しずつ分かってくる。また、空き地を利用する人々の行動も変化に影響する。人がよく歩く場所には草が育ちにくいが、通らなくなった道では徐々に植物が広がることもある。\nこのように、都市の自然は人間の活動から切り離されたものではない。過去に造られた環境と現在の利用の仕方が、植物の成長と重なり合っている。だからこそ、空き地の変化を考えるには、自然だけでなく、その場所の使われ方にも目を向ける必要がある。","translation":"城市空地的植被变化受雨水、土壤、旧建设、行走路径等共同影响；认识城市自然不能脱离人的使用历史。","tip":"","wrong":[],"audio":"","group":"L60","extra":false,"level":"N2"},{"id":"N2-061","cat":"reading","kind":"内容理解（中文）","stem":"植物の種類を数えるだけでは不十分なのはなぜか。","options":["種類が多すぎて数えられないから","日当たりや過去の土地利用も変化に関わるから","すべて同じ種類の草だから","空き地には植物が生えないから"],"answer":1,"exp":"第二段举日照、水流、建筑历史及人的路径，说明需要考察形成条件，而非仅测数量。","topic":"废墟・生态","passage":"都市の空き地に自然が戻ってくることを、単純に「緑が増えて良かった」と評価する人もいる。しかし、草や木が増える過程は場所によって大きく異なる。舗装された地面では雨水が地下にしみ込みにくく、根を伸ばせる場所も限られる。一方、建物が取り壊された後の土地には、土に含まれる種や、風に運ばれてきた種が芽を出す場合がある。\nこうした変化を観察する際には、植物の種類を数えるだけでは不十分だ。日当たりや水の流れ、以前そこに何が建っていたのかを調べることで、現在の風景がどう生まれたのかが少しずつ分かってくる。また、空き地を利用する人々の行動も変化に影響する。人がよく歩く場所には草が育ちにくいが、通らなくなった道では徐々に植物が広がることもある。\nこのように、都市の自然は人間の活動から切り離されたものではない。過去に造られた環境と現在の利用の仕方が、植物の成長と重なり合っている。だからこそ、空き地の変化を考えるには、自然だけでなく、その場所の使われ方にも目を向ける必要がある。","translation":"城市空地的植被变化受雨水、土壤、旧建设、行走路径等共同影响；认识城市自然不能脱离人的使用历史。","tip":"","wrong":[],"audio":"","group":"L61","extra":false,"level":"N2"},{"id":"N2-062","cat":"reading","kind":"内容理解（中文）","stem":"文章全体で筆者が述べたいことは何か。","options":["都市の自然は人間と無関係にできる","空き地はすべて公園に変えるべきだ","都市の自然を理解するには人の活動と場所の歴史も見るべきだ","舗装を増やすと植物が育ちやすい"],"answer":2,"exp":"最后一段「自然だけでなく、その場所の使われ方にも目を向ける必要」是主张。","topic":"废墟・生态","passage":"都市の空き地に自然が戻ってくることを、単純に「緑が増えて良かった」と評価する人もいる。しかし、草や木が増える過程は場所によって大きく異なる。舗装された地面では雨水が地下にしみ込みにくく、根を伸ばせる場所も限られる。一方、建物が取り壊された後の土地には、土に含まれる種や、風に運ばれてきた種が芽を出す場合がある。\nこうした変化を観察する際には、植物の種類を数えるだけでは不十分だ。日当たりや水の流れ、以前そこに何が建っていたのかを調べることで、現在の風景がどう生まれたのかが少しずつ分かってくる。また、空き地を利用する人々の行動も変化に影響する。人がよく歩く場所には草が育ちにくいが、通らなくなった道では徐々に植物が広がることもある。\nこのように、都市の自然は人間の活動から切り離されたものではない。過去に造られた環境と現在の利用の仕方が、植物の成長と重なり合っている。だからこそ、空き地の変化を考えるには、自然だけでなく、その場所の使われ方にも目を向ける必要がある。","translation":"城市空地的植被变化受雨水、土壤、旧建设、行走路径等共同影响；认识城市自然不能脱离人的使用历史。","tip":"","wrong":[],"audio":"","group":"L62","extra":false,"level":"N2"},{"id":"N2-063","cat":"reading","kind":"内容理解（中文）","stem":"オンライン授業の利点として挙げられているものは何か。","options":["教員に必ず直接会えること","通学の負担が減ること","実験をすべて自宅で行えること","友人と話す時間が増えること"],"answer":1,"exp":"第一段前半：远程学生通学负担减轻；后面指出交流机会可能减少。","topic":"教育・社会","passage":"ある大学では、授業の一部をオンラインで受けられる仕組みを導入した。遠くに住む学生にとっては通学の負担が減り、録画を繰り返し視聴できるという利点もある。一方で、友人に質問したり、授業の前後に先生と話したりする機会が減ったという声も聞かれる。\nそこで大学は、すべての授業をオンラインに移すのではなく、講義の説明部分は録画で提供し、議論や実験を行う時間は教室に集まる方法を試している。学生は説明を自分の速さで理解した上で、対面の時間を他者との交流に使える。ただし、この方法がどの授業にも適しているとは限らない。例えば、実際に道具を操作することそのものが学習の中心となる科目では、早い段階から教員の指導が必要になる。\n授業方法を選ぶ際に大切なのは、新しい技術を使うこと自体を目標にしないことだ。学生が何を身につけるべきかを考え、そのために必要な環境を整える姿勢が求められる。","translation":"线上课程便利，但影响交流；大学混合录播讲授与教室讨论、实验。教学形式应根据学习目标而定。","tip":"","wrong":[],"audio":"","group":"L63","extra":false,"level":"N2"},{"id":"N2-064","cat":"reading","kind":"内容理解（中文）","stem":"大学が試している方法は何か。","options":["講義も実験もすべて録画にする","録画で説明を学び、議論などは教室で行う","授業の前後の交流を禁止する","すべての授業を対面だけに戻す"],"answer":1,"exp":"第二段「説明部分は録画」「議論や実験は教室」が组合关键。","topic":"教育・社会","passage":"ある大学では、授業の一部をオンラインで受けられる仕組みを導入した。遠くに住む学生にとっては通学の負担が減り、録画を繰り返し視聴できるという利点もある。一方で、友人に質問したり、授業の前後に先生と話したりする機会が減ったという声も聞かれる。\nそこで大学は、すべての授業をオンラインに移すのではなく、講義の説明部分は録画で提供し、議論や実験を行う時間は教室に集まる方法を試している。学生は説明を自分の速さで理解した上で、対面の時間を他者との交流に使える。ただし、この方法がどの授業にも適しているとは限らない。例えば、実際に道具を操作することそのものが学習の中心となる科目では、早い段階から教員の指導が必要になる。\n授業方法を選ぶ際に大切なのは、新しい技術を使うこと自体を目標にしないことだ。学生が何を身につけるべきかを考え、そのために必要な環境を整える姿勢が求められる。","translation":"线上课程便利，但影响交流；大学混合录播讲授与教室讨论、实验。教学形式应根据学习目标而定。","tip":"","wrong":[],"audio":"","group":"L64","extra":false,"level":"N2"},{"id":"N2-065","cat":"reading","kind":"内容理解（中文）","stem":"筆者が授業方法を決める際に重視するのは何か。","options":["最新技術を必ず導入すること","学ぶべき内容に合った環境を用意すること","学生を教室に集めないこと","録画の長さを統一すること"],"answer":1,"exp":"末段强调「新技术本身不是目标」，根据学习目的设计环境。","topic":"教育・社会","passage":"ある大学では、授業の一部をオンラインで受けられる仕組みを導入した。遠くに住む学生にとっては通学の負担が減り、録画を繰り返し視聴できるという利点もある。一方で、友人に質問したり、授業の前後に先生と話したりする機会が減ったという声も聞かれる。\nそこで大学は、すべての授業をオンラインに移すのではなく、講義の説明部分は録画で提供し、議論や実験を行う時間は教室に集まる方法を試している。学生は説明を自分の速さで理解した上で、対面の時間を他者との交流に使える。ただし、この方法がどの授業にも適しているとは限らない。例えば、実際に道具を操作することそのものが学習の中心となる科目では、早い段階から教員の指導が必要になる。\n授業方法を選ぶ際に大切なのは、新しい技術を使うこと自体を目標にしないことだ。学生が何を身につけるべきかを考え、そのために必要な環境を整える姿勢が求められる。","translation":"线上课程便利，但影响交流；大学混合录播讲授与教室讨论、实验。教学形式应根据学习目标而定。","tip":"","wrong":[],"audio":"","group":"L65","extra":false,"level":"N2"},{"id":"N2-066","cat":"reading","kind":"内容理解（中文）","stem":"塩分が鉄筋の周囲に達すると、何が起こることがあるか。","options":["鉄筋の腐食が進む","コンクリートが自動的に修復する","海風が弱まる","建物の設計図が完成する"],"answer":0,"exp":"第一段「塩分が…鉄筋の周囲に達すると…腐食が進む」，并说明锈膨胀可能导致裂缝。","topic":"废墟・盐害","passage":"海岸近くの構造物では、表面に大きな変化が見られなくても、内部で劣化が進むことがある。海から運ばれる塩分がコンクリートの隙間から入り、鉄筋の周囲に達すると、条件によっては金属の腐食が進む。腐食によって生じたさびは元の金属より体積が大きくなるため、周囲のコンクリートを押し、ひび割れを生じさせる場合がある。\nこのため、建物の状態を外観だけで判断するのは危険だ。表面の色や傷は参考になるものの、安全性を確かめるには専門的な調査が必要になる。特に、長い間利用されていない施設では、過去の修理記録や設計図が残っていないこともある。調査を行う際は、見えている変化と、目に見えない部分の可能性を分けて考えなければならない。\nまた、海風による音が聞こえたとしても、それだけで部材の状態を決めつけることはできない。音を記録することは変化を知る手がかりになるが、原因を調べるには風向きや部材の形状など、複数の条件を確認する必要がある。","translation":"沿海混凝土内部可能因氯盐侵入而导致钢筋腐蚀、锈胀和开裂。不能只凭外观或风声推断结构状态。","tip":"","wrong":[],"audio":"","group":"L66","extra":false,"level":"N2"},{"id":"N2-067","cat":"reading","kind":"内容理解（中文）","stem":"筆者が外観だけでの判断を危険だとする理由は何か。","options":["外から見えない部分でも劣化が進む可能性があるから","海辺には色の違う建物が多いから","写真撮影が難しいから","修理記録は必ず残っているから"],"answer":0,"exp":"文章明确区分可见的痕迹与内部劣化可能；外观好不等于结构安全。","topic":"废墟・盐害","passage":"海岸近くの構造物では、表面に大きな変化が見られなくても、内部で劣化が進むことがある。海から運ばれる塩分がコンクリートの隙間から入り、鉄筋の周囲に達すると、条件によっては金属の腐食が進む。腐食によって生じたさびは元の金属より体積が大きくなるため、周囲のコンクリートを押し、ひび割れを生じさせる場合がある。\nこのため、建物の状態を外観だけで判断するのは危険だ。表面の色や傷は参考になるものの、安全性を確かめるには専門的な調査が必要になる。特に、長い間利用されていない施設では、過去の修理記録や設計図が残っていないこともある。調査を行う際は、見えている変化と、目に見えない部分の可能性を分けて考えなければならない。\nまた、海風による音が聞こえたとしても、それだけで部材の状態を決めつけることはできない。音を記録することは変化を知る手がかりになるが、原因を調べるには風向きや部材の形状など、複数の条件を確認する必要がある。","translation":"沿海混凝土内部可能因氯盐侵入而导致钢筋腐蚀、锈胀和开裂。不能只凭外观或风声推断结构状态。","tip":"","wrong":[],"audio":"","group":"L67","extra":false,"level":"N2"},{"id":"N2-068","cat":"reading","kind":"内容理解（中文）","stem":"海風による音について筆者はどう述べているか。","options":["音だけで部材の安全性を判断できる","記録する意味がない","音は機械からしか生じない","音は手がかりになるが原因の確認には他の条件も必要だ"],"answer":3,"exp":"第三段：「手がかりになるが」后接必须核对风向、构件形状等条件。","topic":"废墟・盐害","passage":"海岸近くの構造物では、表面に大きな変化が見られなくても、内部で劣化が進むことがある。海から運ばれる塩分がコンクリートの隙間から入り、鉄筋の周囲に達すると、条件によっては金属の腐食が進む。腐食によって生じたさびは元の金属より体積が大きくなるため、周囲のコンクリートを押し、ひび割れを生じさせる場合がある。\nこのため、建物の状態を外観だけで判断するのは危険だ。表面の色や傷は参考になるものの、安全性を確かめるには専門的な調査が必要になる。特に、長い間利用されていない施設では、過去の修理記録や設計図が残っていないこともある。調査を行う際は、見えている変化と、目に見えない部分の可能性を分けて考えなければならない。\nまた、海風による音が聞こえたとしても、それだけで部材の状態を決めつけることはできない。音を記録することは変化を知る手がかりになるが、原因を調べるには風向きや部材の形状など、複数の条件を確認する必要がある。","translation":"沿海混凝土内部可能因氯盐侵入而导致钢筋腐蚀、锈胀和开裂。不能只凭外观或风声推断结构状态。","tip":"","wrong":[],"audio":"","group":"L68","extra":false,"level":"N2"},{"id":"N2-069","cat":"reading","kind":"統合理解（比较两文）","stem":"二人が共通して認めていることは何か。","options":["危険を考慮せず一般公開すべきだ","建物の安全性を考える必要がある","記録をすべて捨てるべきだ","建物は完全に取り壊すしかない"],"answer":1,"exp":"A主张「安全を優先」；B也明确「危険性を無視して公開すべきだとは思わない」。共同点是重视安全。","topic":"废墟・保护","passage":"【資料A：市の担当者の意見】\n使われなくなった公共施設を保存することには一定の価値がある。しかし、建物を維持するには費用がかかり、危険な部分をそのまま残すわけにはいかない。私たちは安全を優先し、必要に応じて建物の一部を取り除く方針だ。その一方で、建設当時の資料や住民の記憶を集め、建物が地域に果たしてきた役割を記録として残したい。\n\n【資料B：地域の研究者の意見】\n建物の危険性を無視して公開すべきだとは思わない。ただ、写真や文章で記録すれば、実物が持つ価値を十分に伝えられるとも限らない。ひび割れや使われた材料の質感は、長い時間がそこに積み重なったことを示している。安全な範囲を慎重に見極めながら、できる限り実物を残す選択肢も検討してほしい。","translation":"A 市政管理者优先安全与费用、以记录保留历史；B 研究者也重视安全，但强调实物裂痕和质地具有无法被照片完全替代的价值。","tip":"","wrong":[],"audio":"","group":"L69","extra":false,"level":"N2"},{"id":"N2-070","cat":"reading","kind":"統合理解（比较两文）","stem":"資料Bの研究者が資料Aと特に異なる点は何か。","options":["建物の写真の保存を全く認めない","施設の費用を重視している","実物が持つ質感や痕跡の価値をより重視している","市民の記憶を否定している"],"answer":2,"exp":"A倾向必要时拆除、以资料记录；B强调实物的裂痕和材质无法完全由影像替代。差异是实物遗存价值的权重。","topic":"废墟・保护","passage":"【資料A：市の担当者の意見】\n使われなくなった公共施設を保存することには一定の価値がある。しかし、建物を維持するには費用がかかり、危険な部分をそのまま残すわけにはいかない。私たちは安全を優先し、必要に応じて建物の一部を取り除く方針だ。その一方で、建設当時の資料や住民の記憶を集め、建物が地域に果たしてきた役割を記録として残したい。\n\n【資料B：地域の研究者の意見】\n建物の危険性を無視して公開すべきだとは思わない。ただ、写真や文章で記録すれば、実物が持つ価値を十分に伝えられるとも限らない。ひび割れや使われた材料の質感は、長い時間がそこに積み重なったことを示している。安全な範囲を慎重に見極めながら、できる限り実物を残す選択肢も検討してほしい。","translation":"A 市政管理者优先安全与费用、以记录保留历史；B 研究者也重视安全，但强调实物裂痕和质地具有无法被照片完全替代的价值。","tip":"","wrong":[],"audio":"","group":"L70","extra":false,"level":"N2"},{"id":"N2-071","cat":"reading","kind":"主張理解（長文）","stem":"筆者は、古い建物をすべて保存することについてどう考えているか。","options":["安全性や費用の問題があるため一律には決められない","どんな状況でも必ず保存すべきだ","必ず商業施設に改装するべきだ","住民の記憶は判断に関係しない"],"answer":0,"exp":"第二段「すべてを保存することが正しいとは言い切れない」，理由是费用与安全等；不是主张全部拆除。","topic":"废墟・场所记忆","passage":"私たちは普段、街の中を歩きながら建物を一つ一つ意識しているわけではない。駅から学校へ、あるいは家から職場へ向かう道では、目の前の空間を目的地までの通路として利用している。ところが、いつも通っていた店が閉まり、看板が外されたとき、急にその場所の存在に気づくことがある。何も変わらないように見えた通りにも、時間は積み重なっていたのである。\n古い建物を残すことについて、人々の意見が分かれるのは当然だ。そこに思い出がある人にとっては大切な風景でも、新しく移り住んだ人にとっては不便な施設にすぎないかもしれない。また、建物を修理して使い続けるには費用がかかる。壊れた部分を放置すれば、安全上の問題が生じることもある。そのため、すべてを保存することが正しいとは言い切れない。\nしかし、古いものを新しくすれば、それで場所の問題が解決するとも限らない。例えば、かつて工場だった建物をきれいな商業施設に改装した場合、利用者が増えて街がにぎやかになることはあるだろう。一方で、以前そこで働いていた人々の生活や、長い時間の中で生じた材料の変化が、改装によって見えなくなる場合もある。建物の使いやすさが増したとしても、そこにあったさまざまな経験まで新しくできるわけではない。\nこう考えると、残すか壊すかという二つの選択肢だけで議論するのは十分ではない。何を残し、何を変えるのかを具体的に考える必要がある。建物全体をそのまま保存できなくても、特徴的な部分を残し、その場所がどのように変化してきたのかを伝える方法はある。また、建物に入れない場合でも、外から観察できる仕組みを用意したり、当時の記録を公開したりすることは可能だ。\n大切なのは、ある時代の姿を唯一の正解として固定することではなく、その場所に関わってきた人々や物の時間を、現在の生活の中でどう扱うかという問いを持ち続けることだろう。過去の痕跡を見つめることは、単に昔を懐かしむためだけではない。私たちが日常の中で当然だと思っている風景も、いずれ変わっていくことを知るためでもある。","translation":"长文讨论旧建筑的保存与更新：安全、费用和使用价值都真实存在，但仅二选一会丢失地点的复杂时间。关键是具体决定保留和改变什么。","tip":"","wrong":[],"audio":"","group":"L71","extra":false,"level":"N2"},{"id":"N2-072","cat":"reading","kind":"主張理解（長文）","stem":"「経験まで新しくできるわけではない」とあるが、どういう意味か。","options":["改装は必ず失敗する","建物を新しくしても過去の人々の経験は作り直せない","記録を残す必要はない","新しい利用者は過去を必ず理解する"],"answer":1,"exp":"前文谈工厂工人的生活与材料痕迹；翻新可更新功能，无法把过往的经验重新制造出来。","topic":"废墟・场所记忆","passage":"私たちは普段、街の中を歩きながら建物を一つ一つ意識しているわけではない。駅から学校へ、あるいは家から職場へ向かう道では、目の前の空間を目的地までの通路として利用している。ところが、いつも通っていた店が閉まり、看板が外されたとき、急にその場所の存在に気づくことがある。何も変わらないように見えた通りにも、時間は積み重なっていたのである。\n古い建物を残すことについて、人々の意見が分かれるのは当然だ。そこに思い出がある人にとっては大切な風景でも、新しく移り住んだ人にとっては不便な施設にすぎないかもしれない。また、建物を修理して使い続けるには費用がかかる。壊れた部分を放置すれば、安全上の問題が生じることもある。そのため、すべてを保存することが正しいとは言い切れない。\nしかし、古いものを新しくすれば、それで場所の問題が解決するとも限らない。例えば、かつて工場だった建物をきれいな商業施設に改装した場合、利用者が増えて街がにぎやかになることはあるだろう。一方で、以前そこで働いていた人々の生活や、長い時間の中で生じた材料の変化が、改装によって見えなくなる場合もある。建物の使いやすさが増したとしても、そこにあったさまざまな経験まで新しくできるわけではない。\nこう考えると、残すか壊すかという二つの選択肢だけで議論するのは十分ではない。何を残し、何を変えるのかを具体的に考える必要がある。建物全体をそのまま保存できなくても、特徴的な部分を残し、その場所がどのように変化してきたのかを伝える方法はある。また、建物に入れない場合でも、外から観察できる仕組みを用意したり、当時の記録を公開したりすることは可能だ。\n大切なのは、ある時代の姿を唯一の正解として固定することではなく、その場所に関わってきた人々や物の時間を、現在の生活の中でどう扱うかという問いを持ち続けることだろう。過去の痕跡を見つめることは、単に昔を懐かしむためだけではない。私たちが日常の中で当然だと思っている風景も、いずれ変わっていくことを知るためでもある。","translation":"长文讨论旧建筑的保存与更新：安全、费用和使用价值都真实存在，但仅二选一会丢失地点的复杂时间。关键是具体决定保留和改变什么。","tip":"","wrong":[],"audio":"","group":"L72","extra":false,"level":"N2"},{"id":"N2-073","cat":"reading","kind":"主張理解（長文）","stem":"筆者が最も伝えたいことは何か。","options":["過去の建物は人々の生活と切り離して判断すべきだ","都市は変化しないほうが良い","保存と更新の間で、場所の時間や人の経験をどう扱うか考え続けることが重要だ","建物を外から見るだけでは意味がない"],"answer":2,"exp":"末段主张：不能仅在保留/拆除二选一里停下；要思考时间痕迹与当代生活的关系。","topic":"废墟・场所记忆","passage":"私たちは普段、街の中を歩きながら建物を一つ一つ意識しているわけではない。駅から学校へ、あるいは家から職場へ向かう道では、目の前の空間を目的地までの通路として利用している。ところが、いつも通っていた店が閉まり、看板が外されたとき、急にその場所の存在に気づくことがある。何も変わらないように見えた通りにも、時間は積み重なっていたのである。\n古い建物を残すことについて、人々の意見が分かれるのは当然だ。そこに思い出がある人にとっては大切な風景でも、新しく移り住んだ人にとっては不便な施設にすぎないかもしれない。また、建物を修理して使い続けるには費用がかかる。壊れた部分を放置すれば、安全上の問題が生じることもある。そのため、すべてを保存することが正しいとは言い切れない。\nしかし、古いものを新しくすれば、それで場所の問題が解決するとも限らない。例えば、かつて工場だった建物をきれいな商業施設に改装した場合、利用者が増えて街がにぎやかになることはあるだろう。一方で、以前そこで働いていた人々の生活や、長い時間の中で生じた材料の変化が、改装によって見えなくなる場合もある。建物の使いやすさが増したとしても、そこにあったさまざまな経験まで新しくできるわけではない。\nこう考えると、残すか壊すかという二つの選択肢だけで議論するのは十分ではない。何を残し、何を変えるのかを具体的に考える必要がある。建物全体をそのまま保存できなくても、特徴的な部分を残し、その場所がどのように変化してきたのかを伝える方法はある。また、建物に入れない場合でも、外から観察できる仕組みを用意したり、当時の記録を公開したりすることは可能だ。\n大切なのは、ある時代の姿を唯一の正解として固定することではなく、その場所に関わってきた人々や物の時間を、現在の生活の中でどう扱うかという問いを持ち続けることだろう。過去の痕跡を見つめることは、単に昔を懐かしむためだけではない。私たちが日常の中で当然だと思っている風景も、いずれ変わっていくことを知るためでもある。","translation":"长文讨论旧建筑的保存与更新：安全、费用和使用价值都真实存在，但仅二选一会丢失地点的复杂时间。关键是具体决定保留和改变什么。","tip":"","wrong":[],"audio":"","group":"L73","extra":false,"level":"N2"},{"id":"N2-074","cat":"reading","kind":"情報検索","stem":"高校生の佐藤さんは、土曜日の午後に無料で参加できる講座を探している。どれがよいか。","options":["①風と音の観察","②身近な建築の記録","③海岸の自然を読む","④地域の記憶を聞く"],"answer":1,"exp":"条件「土曜日／午後／無料」を同时满足的只有②；④虽然免费但在周日。","topic":"校园・活动","passage":"【地域文化センター　公開講座のご案内】\n①「風と音の観察」：12月12日（土）10:00～12:00／参加費500円／定員20名。屋外で短時間の観察を行う。雨天時は室内講義に変更。中学生以上。\n②「身近な建築の記録」：12月12日（土）14:00～16:00／参加費無料／定員30名。写真を使った記録方法を学ぶ。年齢制限なし。\n③「海岸の自然を読む」：12月13日（日）9:30～11:30／参加費800円／定員15名。海岸の植物を観察する。雨天中止。高校生以上。\n④「地域の記憶を聞く」：12月13日（日）13:00～15:00／参加費無料／定員25名。地域住民による話を聞く。年齢制限なし。\n【申し込み方法】\n各講座の開催日の5日前、17:00までにウェブサイトで申し込むこと。申し込み多数の場合は抽選。複数講座への申し込みも可能だが、同じ時間帯に重なる講座は選べない。キャンセルは開催日の2日前までに連絡すること。\n【持ち物】\n屋外観察を含む①③は歩きやすい靴。③のみ筆記用具と飲み物も必要。館内講座②④は特別な持ち物は不要。","translation":"活动安排：①周六上午收费500，②周六下午免费，③周日上午收费800，④周日下午免费。统一提前5天17:00报名；③需装备，遇雨取消。","tip":"","wrong":[],"audio":"","group":"L74","extra":false,"level":"N2"},{"id":"N2-075","cat":"reading","kind":"情報検索","stem":"③を受講したい人は、何をする必要があるか。","options":["12月13日の朝に会場で申し込む","12月8日17時までに申し込み、歩きやすい靴などを用意する","雨でも必ず海岸へ行く","年齢に関係なく誰でも参加できる"],"answer":1,"exp":"③ 12月13日举办，5日前是12月8日17:00；同时需要鞋、笔记用具和饮料，雨天取消。","topic":"校园・活动","passage":"【地域文化センター　公開講座のご案内】\n①「風と音の観察」：12月12日（土）10:00～12:00／参加費500円／定員20名。屋外で短時間の観察を行う。雨天時は室内講義に変更。中学生以上。\n②「身近な建築の記録」：12月12日（土）14:00～16:00／参加費無料／定員30名。写真を使った記録方法を学ぶ。年齢制限なし。\n③「海岸の自然を読む」：12月13日（日）9:30～11:30／参加費800円／定員15名。海岸の植物を観察する。雨天中止。高校生以上。\n④「地域の記憶を聞く」：12月13日（日）13:00～15:00／参加費無料／定員25名。地域住民による話を聞く。年齢制限なし。\n【申し込み方法】\n各講座の開催日の5日前、17:00までにウェブサイトで申し込むこと。申し込み多数の場合は抽選。複数講座への申し込みも可能だが、同じ時間帯に重なる講座は選べない。キャンセルは開催日の2日前までに連絡すること。\n【持ち物】\n屋外観察を含む①③は歩きやすい靴。③のみ筆記用具と飲み物も必要。館内講座②④は特別な持ち物は不要。","translation":"活动安排：①周六上午收费500，②周六下午免费，③周日上午收费800，④周日下午免费。统一提前5天17:00报名；③需装备，遇雨取消。","tip":"","wrong":[],"audio":"","group":"L75","extra":false,"level":"N2"},{"id":"N2-076","cat":"listening","kind":"課題理解","stem":"男の人はこのあと、まず何をしますか。","options":["照明を調整する","印刷室にカードを取りに行く","机を並べる","作品を運ぶ"],"answer":1,"exp":"女性明确指示「印刷室…受け取りに行ってください」。注意桌子已摆好；照明由女性负责。","topic":"展览・准备","passage":"","translation":"","tip":"先确认「谁接下来做什么」；对话中同时提到多个任务时区分责任人。","wrong":[],"audio":"女：会場の準備、どうなっていますか。\n男：机は並べ終わりました。でも、作品の説明カードがまだ届いていません。\n女：印刷室に連絡したら、もうできているそうです。受け取りに行ってください。私は照明を確認します。\n男：分かりました。","group":"L76","extra":false,"level":"N2"},{"id":"N2-077","cat":"listening","kind":"課題理解","stem":"男の人は何をすることになりましたか。","options":["機材を準備する","午前の測定を中止する","集合時間の変更を知らせる","午後の天気を調べる"],"answer":2,"exp":"男性表示「参加者に集合時間の変更を伝えておく」，器材由女性负责。","topic":"废墟・调研","passage":"","translation":"","tip":"先确认「谁接下来做什么」；对话中同时提到多个任务时区分责任人。","wrong":[],"audio":"男：明日の海岸調査だけど、午後は雨になりそうだね。\n女：じゃあ午前中に測定を済ませましょう。機材は私が用意します。\n男：僕は参加者に集合時間の変更を伝えておくよ。\n女：助かります。","group":"L77","extra":false,"level":"N2"},{"id":"N2-078","cat":"listening","kind":"課題理解","stem":"女の人はまず何をしますか。","options":["家でメールを送る","窓口へ書類を持っていく","署名を取り消す","明日の朝まで待つ"],"answer":1,"exp":"签名件要亲赴窗口，16:00关门，目前15:30，故立即去。","topic":"校园・手续","passage":"","translation":"","tip":"先确认「谁接下来做什么」；对话中同时提到多个任务时区分责任人。","wrong":[],"audio":"女：この書類、今日中に出さなきゃ。\n男：提出はネットだけ？\n女：いや、署名が必要だから窓口へ持っていくの。\n男：窓口は四時に閉まるよ。今、三時半だ。\n女：じゃあ、すぐ行くね。","group":"L78","extra":false,"level":"N2"},{"id":"N2-079","cat":"listening","kind":"課題理解","stem":"学生は次に何をしますか。","options":["図をすべて削除する","発表を中止する","参考文献を追加する","結論を先に発表する"],"answer":2,"exp":"「図は分かりやすい」「参考文献をもう少し増やす」对比，修改文献依据。","topic":"大学・发表","passage":"","translation":"","tip":"先确认「谁接下来做什么」；对话中同时提到多个任务时区分责任人。","wrong":[],"audio":"男：先生、発表の資料を作りました。\n女：図は分かりやすいですね。ただ、結論の根拠がまだ弱いので、参考文献をもう少し増やしてください。\n男：分かりました。図はそのままでいいですか。\n女：はい。","group":"L79","extra":false,"level":"N2"},{"id":"N2-080","cat":"listening","kind":"課題理解","stem":"男の人は十時のあと何をしますか。","options":["設営を始める","受付を手伝う","帰宅する","イベントの資料を書く"],"answer":1,"exp":"「設営を終えた後…受付へ」「十時に終わる」，顺序确定。","topic":"活动・工作","passage":"","translation":"","tip":"先确认「谁接下来做什么」；对话中同时提到多个任务时区分责任人。","wrong":[],"audio":"女：明日のイベント、受付の人数が足りないそうです。\n男：それなら、設営を終えた後、僕が手伝えますよ。\n女：ありがとうございます。設営は十時に終わる予定です。\n男：じゃあ、そのまま受付へ行きます。","group":"L80","extra":false,"level":"N2"},{"id":"N2-081","cat":"listening","kind":"ポイント理解","stem":"男の人が特に印象に残ったものは何ですか。","options":["建物の外観","壁に残った掲示物","校舎の広さ","新しい照明"],"answer":1,"exp":"「それもあるけど」「特に驚いたのは」标记重点，选掲示物而非建筑设计。","topic":"废墟・记忆","passage":"","translation":"","tip":"聴解「ポイント理解」先看问题所问：时间／原因／谁的意见／变化等。","wrong":[],"audio":"男：先月、古い校舎を見学したんだけど、予想以上に面白かったよ。\n女：建築のデザインが良かったの？\n男：それもあるけど、僕が特に驚いたのは、壁に残った昔の授業の掲示物なんだ。建物が使われていた頃の様子が想像できた。","group":"L81","extra":false,"level":"N2"},{"id":"N2-082","cat":"listening","kind":"ポイント理解","stem":"研修の二週目には何をしますか。","options":["オンラインで基本を学ぶ","成果を発表する","現場で実習する","休みを取る"],"answer":2,"exp":"时间排序：第一周线上、第二周实习、最后一天发表。","topic":"工作・研修","passage":"","translation":"","tip":"聴解「ポイント理解」先看问题所问：时间／原因／谁的意见／变化等。","wrong":[],"audio":"女：来月から研修を始めます。最初の週はオンラインで基本を学び、二週目から現場で実習します。最終日は全員で成果を発表してください。\n男：最初から現場に行かなくていいんですね。","group":"L82","extra":false,"level":"N2"},{"id":"N2-083","cat":"listening","kind":"ポイント理解","stem":"女の人が特に必要だと言っているものは何ですか。","options":["傘と帽子","上着と歩きやすい靴","水着とサンダル","特別な制服"],"answer":1,"exp":"明确要求「上着」「歩きやすい靴」。","topic":"废墟・调研","passage":"","translation":"","tip":"聴解「ポイント理解」先看问题所问：时间／原因／谁的意见／变化等。","wrong":[],"audio":"男：海の近くにある建物を調査するので、どんな服装がいいですか。\n女：風が強いので、上着を持ってきてください。あと、足場が悪い場所もあるため、歩きやすい靴が必要です。\n男：分かりました。","group":"L83","extra":false,"level":"N2"},{"id":"N2-084","cat":"listening","kind":"ポイント理解","stem":"展覧会について変更された点は何ですか。","options":["展示内容","入場料金","開催期間","会場の場所"],"answer":2,"exp":"举办时间延长一周，而展品内容没有变化。「延長」＝延长。","topic":"艺术・展览","passage":"","translation":"","tip":"聴解「ポイント理解」先看问题所问：时间／原因／谁的意见／变化等。","wrong":[],"audio":"女：この展覧会、当初は二週間だけの予定でしたが、来場者が多かったので一週間延長することになりました。なお、展示内容に変更はありません。\n男：では、今月末まで見られるんですね。","group":"L84","extra":false,"level":"N2"},{"id":"N2-085","cat":"listening","kind":"ポイント理解","stem":"女の人はどんな工夫をしましたか。","options":["夜は勉強しない","一度に長時間勉強する","短い休憩を何度か入れる","勉強する場所を毎日変える"],"answer":2,"exp":"「短い休憩を何度か入れる」是女性实践的策略，而非完全不学。","topic":"学习・方法","passage":"","translation":"","tip":"聴解「ポイント理解」先看问题所问：时间／原因／谁的意见／变化等。","wrong":[],"audio":"男：最近、夜に勉強しても集中できなくて。\n女：私は短い休憩を何度か入れるようにしたら、前より続けられるようになったよ。\n男：なるほど。長く座り続けるより良さそうだね。","group":"L85","extra":false,"level":"N2"},{"id":"N2-086","cat":"listening","kind":"ポイント理解","stem":"今年の活動の特徴は何ですか。","options":["参加者が減った","高校生の参加が増えた","活動が中止になった","参加者が全員社会人だった"],"answer":1,"exp":"人数从约20升至40+，特别强调高中生参加增加。","topic":"社会・生活","passage":"","translation":"","tip":"聴解「ポイント理解」先看问题所问：时间／原因／谁的意见／变化等。","wrong":[],"audio":"女：地域の清掃活動は、去年は二十人ほどでしたが、今年は四十人以上参加しました。特に高校生の参加が増えたことが特徴です。\n男：学校で呼びかけた効果かもしれませんね。","group":"L86","extra":false,"level":"N2"},{"id":"N2-087","cat":"listening","kind":"概要理解","stem":"話し手が最も言いたいことは何ですか。","options":["建物は外観だけで評価するべきだ","保存では安全と歴史の伝え方を考えるべきだ","古い建物はすべて公開するべきだ","地域の記憶は残せない"],"answer":1,"exp":"概述性观点：重视历史和人的生活，同时考虑安全与传达形式。","topic":"废墟・保护","passage":"","translation":"","tip":"概况题问「这段话的整体立场」，不要选其中某个细节当主旨。","wrong":[],"audio":"男：歴史的な建物の保存を考えるとき、私は外観の美しさだけを基準にすべきではないと思います。建物には、そこで暮らした人々の生活や地域の変化が残されています。一方、危険な場所を無理に公開する必要もありません。何を残し、どう伝えるかを考えることが大切です。","group":"L87","extra":false,"level":"N2"},{"id":"N2-088","cat":"listening","kind":"概要理解","stem":"話し手の意見は何ですか。","options":["図書館の役割は完全になくなった","本以外の利用も含めて図書館の役割を考えるべきだ","図書館の建物をすべて閉鎖するべきだ","勉強会は禁止するべきだ"],"answer":1,"exp":"虽然读书人数减少，但作为学习会、信息查询空间的作用增长；是用途变化。","topic":"社会・文化","passage":"","translation":"","tip":"概况题问「这段话的整体立场」，不要选其中某个细节当主旨。","wrong":[],"audio":"女：近ごろ、図書館で本を読む人の数は少し減っています。しかし、図書館の役割が小さくなったとは言えません。勉強会の場所として利用したり、地域の情報を調べたりする人が増えているからです。利用の仕方が変わったと考えるべきでしょう。","group":"L88","extra":false,"level":"N2"},{"id":"N2-089","cat":"listening","kind":"概要理解","stem":"話し手が強調していることは何ですか。","options":["技術を使う目的を明確にすること","高価な設備を最優先すること","新しい機械はすべて避けること","授業時間を減らすこと"],"answer":0,"exp":"核心论点「导入技术不是目的」「取决于学习目标」。","topic":"大学・教育","passage":"","translation":"","tip":"概况题问「这段话的整体立场」，不要选其中某个细节当主旨。","wrong":[],"audio":"男：新しい技術が便利でも、導入することだけが目的になると困ります。例えば、大学の授業で使う機械は、学生が何を学ぶのかによって選ぶべきです。高価な設備があれば良い授業になるとは限らないのです。","group":"L89","extra":false,"level":"N2"},{"id":"N2-090","cat":"listening","kind":"概要理解","stem":"話し手の考えに近いものはどれですか。","options":["旅行では絶対に写真を撮らない","写真に加えてその場を直接感じることも大切だ","写真だけが記憶を残す方法だ","旅先では早く帰るべきだ"],"answer":1,"exp":"并不否定摄影，强调照片之外的现场感受。","topic":"记忆・艺术","passage":"","translation":"","tip":"概况题问「这段话的整体立场」，不要选其中某个细节当主旨。","wrong":[],"audio":"女：旅先で写真を撮ることは思い出を残す方法の一つです。ただし、写真を撮ることに夢中になると、その場の音や匂いに気づかないまま帰ってしまうこともあります。時にはカメラを置き、周りを感じる時間も必要ではないでしょうか。","group":"L90","extra":false,"level":"N2"},{"id":"N2-091","cat":"listening","kind":"概要理解","stem":"話し手の主張は何ですか。","options":["人が自然に関わる方法は場所によって考えるべきだ","自然には絶対に手を加えてはいけない","里山はすべて建設地にするべきだ","歴史を調べる意味はない"],"answer":0,"exp":"反对「完全不干预」作为普适规则；人与自然关系需要考虑当地历史。","topic":"生态・环境","passage":"","translation":"","tip":"概况题问「这段话的整体立场」，不要选其中某个细节当主旨。","wrong":[],"audio":"男：自然環境を守ろうとするとき、人が全く関わらないことが最善とは限りません。長い間人の手で管理されてきた里山では、作業をやめることで環境が変わることもあります。場所の歴史を理解した上で、適切な関わり方を考える必要があります。","group":"L91","extra":false,"level":"N2"},{"id":"N2-092","cat":"listening","kind":"即時応答","stem":"最も自然な返答を選びなさい。","options":["ええ、確認しておきます。","いいえ、昨日見ました。","はい、資料の中です。"],"answer":0,"exp":"「～ていただけませんか」礼貌请求对方检查；自然回应「確認しておきます」。","topic":"校园・日常","passage":"","translation":"","tip":"正式试题的即時応答选项通常以音频呈现；本练习用语音读出三个选项，模考时只显示选项编号。","wrong":[],"audio":"話し手：この資料、今日中に確認していただけませんか。","group":"L92","extra":false,"level":"N2"},{"id":"N2-093","cat":"listening","kind":"即時応答","stem":"最も自然な返答を選びなさい。","options":["展示を作りました。","ぜひ、行きたいです。","展示は昨日でした。"],"answer":1,"exp":"「～ませんか」邀请；回答接受邀请「ぜひ、行きたいです」。","topic":"校园・日常","passage":"","translation":"","tip":"正式试题的即時応答选项通常以音频呈现；本练习用语音读出三个选项，模考时只显示选项编号。","wrong":[],"audio":"話し手：もし時間があったら、展示を見に来ませんか。","group":"L93","extra":false,"level":"N2"},{"id":"N2-094","cat":"listening","kind":"即時応答","stem":"最も自然な返答を選びなさい。","options":["はい、火曜日の午後五時までです。","いいえ、火曜日を出します。","先生に火曜日しました。"],"answer":0,"exp":"「～でしたっけ」询问确认记忆；应给出截止时间。","topic":"校园・日常","passage":"","translation":"","tip":"正式试题的即時応答选项通常以音频呈现；本练习用语音读出三个选项，模考时只显示选项编号。","wrong":[],"audio":"話し手：提出期限は来週の火曜日でしたっけ。","group":"L94","extra":false,"level":"N2"},{"id":"N2-095","cat":"listening","kind":"即時応答","stem":"最も自然な返答を選びなさい。","options":["そうですね。外に出るときは気をつけましょう。","いえ、先週は休日でした。","それでは風を読みます。"],"answer":0,"exp":"对天气感受表示赞同，并提醒外出时小心强风。","topic":"校园・日常","passage":"","translation":"","tip":"正式试题的即時応答选项通常以音频呈现；本练习用语音读出三个选项，模考时只显示选项编号。","wrong":[],"audio":"話し手：今日はずいぶん風が強いですね。","group":"L95","extra":false,"level":"N2"},{"id":"N2-096","cat":"listening","kind":"即時応答","stem":"最も自然な返答を選びなさい。","options":["いいえ、使う予定です。","席が見えました。","昨日使ったそうです。"],"answer":0,"exp":"「使ってもよろしいでしょうか」征求许可；「いいえ、使う予定です」拒绝并解释，该场景合理。","topic":"校园・日常","passage":"","translation":"","tip":"正式试题的即時応答选项通常以音频呈现；本练习用语音读出三个选项，模考时只显示选项编号。","wrong":[],"audio":"話し手：すみません、この席、使ってもよろしいでしょうか。","grou function startDaily(){let ids=[];for(let [cat,n] of [['grammar',5],['vocab',3],['reading',2],['listening',2]]){let a=rankQuestions(queryPool(cat,'all'));ids.push(...a.slice(0,n).map(q=>q.id))}startSession('study',shuffled(ids),'今日12题')}
function rankQuestions(items){const wrong=items.filter(q=>DATA.wrong[q.id]);const unseen=shuffled(items.filter(q=>!DATA.records[q.id]));const rest=shuffled(items.filter(q=>DATA.records[q.id]&&!DATA.wrong[q.id]));return [...shuffled(wrong),...unseen,...rest]}
function startDrill(c,t,n,k='all'){let pool=rankQuestions(queryPool(c,t,k));if(!pool.length){toast('当前筛选没有匹配的题目，请调整条件');return}let selected=pool.slice(0,Math.min(n,pool.length));startSession('study',selected.map(q=>q.id),'专项练习')}
function startSession(mode,ids,label){if(DATA.active&&DATA.active.mode==='mock'&&mode!=='mock'&&!confirm('当前有未完成的正式模拟，开始新练习会覆盖其进度。继续吗？'))return;if(audioPlaying)stopAudio();DATA.active={mode,label,ids,idx:0,answers:{},flagged:[],played:{},phase:'lang',deadline:mode==='mock'?Date.now()+105*60000:null,created:new Date().toISOString()};store();go('session')}
function renderMockLanding(){html(`<div class="pagehead"><div><div class="eyebrow">SIMULATION · 155 MINUTES</div><h1>完整机考模拟</h1><p>一次完成四个题类，共 107 道原创题。形式参照 JLPT N2，但并非官方试卷。</p></div><span class="tag">N2 / 2026</span></div><div class="risk"><b>模考与即时解析不能同时做到完全一致。</b> 为模拟考试，这一模式在整场结束之前隐藏正误与讲解；想边学边看解析，请使用「专项练习」或「今日12题」。真实 JLPT 是纸笔填答；本网页模拟题序、限时和考点，但不代表官方纸面、音源和评分。</div><div class="sectionhead"><div><h2>考试时间与题量</h2></div></div><div class="introgrid">${Object.entries(CN).map(([c,name])=>`<div class="tile"><span class="count-small">${name}</span><strong>${OFFICIAL[c]}</strong><div class="small">${c==='listening'?'50分钟，第二节':'属于第一节105分钟'}</div></div>`).join('')}</div><div class="panel" style="margin-top:18px"><div class="split"><div><h3 style="margin:0 0 12px;font-size:17px">第一节 · 言語知識・読解</h3><p class="resource">总计 75 题，105 分钟。可在第一节内部回看、标记与改选。进入聴解后不能返回。</p><h3 style="margin:19px 0 12px;font-size:17px">第二节 · 聴解</h3><p class="resource">总计 32 题，50 分钟。每组录音需要点击播放；模考模式每组只能完整听一次，之后依次作答。系统使用日语 TTS，不同于正式考试的真人录音。</p></div><div><h3 style="margin:0 0 12px;font-size:17px">开始前确认</h3><ul class="tinylist"><li>建议用电脑或稳定的耳机，在安静环境完成。</li><li>保存进度仅保存在本机浏览器，不上传服务器。</li><li>考试计时从点击开始起持续运行，关闭页面也不会暂停。</li><li>交卷后提供每题答案、解释与完整阅读/听力原文。</li></ul><div class="btnrow" style="margin-top:16px"><button class="btn" onclick="beginMock()">开始 155 分钟模考　→</button>${DATA.active?.mode==='mock'?'<button class="btn ghost" onclick="go(\'session\')">继续未完成模考</button>':''}</div></div></div></div>`)}
function beginMock(){if(DATA.active&&!confirm('将用新的完整模拟卷覆盖当前未完成的练习。确定开始吗？'))return;let ids=BANK.filter(q=>!q.extra&&q.cat!=='listening').map(q=>q.id).concat(BANK.filter(q=>!q.extra&&q.cat==='listening').map(q=>q.id));startSession('mock',ids,'完整模拟 · Set A')}
function current(){let s=DATA.active;if(!s)return null;return BANK.find(q=>q.id===s.ids[s.idx])||null}
function inSession(){return !!DATA.active}
function sessionDoneCount(s){return s.ids.filter(id=>Object.hasOwn(s.answers,id)).length}
let audioSerial=0;
function stopAudio(){audioSerial++;if(window.speechSynthesis){try{speechSynthesis.cancel()}catch(e){}}audioPlaying=false}
function setIndex(i){let s=DATA.active;if(!s||i<0||i>=s.ids.length)return;let newQ=BANK.find(q=>q.id===s.ids[i]);if(s.mode==='mock'&&s.phase==='lang'&&newQ.cat==='listening')return;if(s.mode==='mock'&&s.phase==='listen'&&newQ.cat!=='listening')return;if(s.mode==='mock'&&s.phase==='listen'&&i<s.idx)return;if(audioPlaying)stopAudio();s.idx=i;store();renderSession();scrollTop()}
function renderSession(){let s=DATA.active;if(!s){go('home');return}navActive(s.mode==='mock'?'mock':'practice');let q=current();if(!q){go('home');return}if(s.mode==='mock'&&s.phase==='listen'&&q.cat!=='listening'){let ix=s.ids.findIndex(id=>BANK.find(q=>q.id===id).cat==='listening');s.idx=ix;q=current()}
let qidx=s.idx+1,ans=s.answers[q.id],answered=Object.hasOwn(s.answers,q.id),show=s.mode!=='mock'&&answered,playing=audioPlaying,full=s.mode==='mock';let sectionids=full?s.ids.map((id,i)=>({id,i})).filter(x=>s.phase==='lang'?BANK.find(q=>q.id===x.id).cat!=='listening':BANK.find(q=>q.id===x.id).cat==='listening'):s.ids.map((id,i)=>({id,i}));let sectionNo=sectionids.findIndex(x=>x.i===s.idx)+1;let sectionName=full?(s.phase==='lang'?'言語知識・読解':'聴解'):CATS[q.cat];let next=qidx>=s.ids.length?null: BANK.find(x=>x.id===s.ids[qidx]);let lockAudio=full&&q.cat==='listening'&&!s.played[q.group];
html(`<div class="exam-top"><div class="exam-breadcrumb"><strong>${esc(s.label)}</strong><br><span>${esc(sectionName)}　·　${sectionNo}/${sectionids.length}</span></div><div class="btnrow"><span class="clock" id="clock">${full?'—:—':'即时讲解'}</span><button class="btn ghost smallbtn" onclick="saveAndExit()">保存并退出</button></div></div><div class="exam-layout"><div><article class="paper"><div class="question-meta"><span class="qnumber">${esc(q.kind)} · Q ${String(qidx).padStart(3,'0')}</span><span>${/废墟|艺术|生态|记忆|盐|风|材料|现场|保护/.test(q.topic)?'<span class="tag art">现场主题</span>':`<span class="tag">${esc(q.topic)}</span>`}</span></div>${q.cat==='listening'?audioHtml(q,s,show):''}${q.passage?`<div class="passage ${q.passage.length>520?'long':''}" lang="ja">${esc(q.passage)}</div>`:''}<div class="question-stem" lang="ja">${esc(q.stem)}</div><div class="options">${q.options.map((o,i)=>{let classname='';if(show){if(i===q.answer)classname='correct';else if(i===ans)classname='wrong'}else if(answered&&ans===i)classname='chosen';let label= full&&q.kind==='即時応答'&&!show?`${i+1}`:o;return `<button class="option ${classname}" onclick="answer(${i})" ${((answered&&!(full&&s.phase==='lang'))||lockAudio)?'disabled':''} aria-label="选项${i+1}"><span class="letter">${i+1}</span><span lang="ja">${esc(label)}</span></button>`}).join('')}</div>${show?feedbackHtml(q,ans):''}${full?'':`<div class="note-caption">我的笔记（本地自动保存）</div><textarea class="note-field" placeholder="比如：接续形式、错因、原文证据……" oninput="DATA.notes[${jsArg(q.id)}]=this.value;store()">${esc(DATA.notes[q.id]||'')}</textarea>`}<div class="qfooter"><div class="btnrow">${!full||s.phase==='lang'?`<button class="btn ghost" ${s.idx===0?'disabled':''} onclick="setIndex(${s.idx-1})">← 上一题</button>`:''}<button class="btn ghost" onclick="flagQuestion()">${s.flagged.includes(q.id)?'★ 已标记':'☆ 标记'} </button></div><div class="btnrow"><span class="small">${full?`${sessionDoneCount(s)} / ${s.ids.length} 已答`:`${sessionDoneCount(s)} / ${s.ids.length} 已练`}</span><button class="btn" onclick="nextQuestion()">${next===null?'完成并查看结果':(full&&s.phase==='lang'&&next.cat==='listening')?'交第一节 →': '下一题 →'}</button></div></div></article>${full?'':'<p class="small" style="margin:14px 3px">每题会在选择后立即显示解析；标记与笔记只存于当前设备。错题正确作答两次后自动从错题本移除。</p>'}</div><aside class="rail"><div class="panel"><h3>进度 / PROGRESS</h3><div class="progressbar"><i style="width:${Math.round(100*sessionDoneCount(s)/s.ids.length)}%"></i></div><div class="raillabel">${sectionNo} / ${sectionids.length} · 点击题号跳转</div><div class="bubbles">${sectionids.map((x,i)=>`<button class="bubble ${x.i===s.idx?'current':''} ${Object.hasOwn(s.answers,x.id)?'done':''} ${s.flagged.includes(x.id)?'flag':''}" ${(full&&s.phase==='listen'&&x.i<s.idx)?'disabled':''} onclick="setIndex(${x.i})" title="${i+1}. ${esc(BANK.find(q=>q.id===x.id).kind)}">${i+1}</button>`).join('')}</div><div class="divider"></div>${full?`<button class="btn ghost smallbtn" onclick="finishPhase()" style="width:100%">${s.phase==='lang'?'确认交卷・进入聴解':'提前结束模考'}</button>`:`<button class="btn ghost smallbtn" onclick="finishStudy()" style="width:100%">结束并查看本次结果</button>`}<div class="hint" style="margin-top:16px">${full?'模考期间不显示正确答案；点击交卷后不可返回本节。':'学习模式：答题后立即显示正解、易错原因和必要的语法说明。'}</div></div></aside></div>`);
if(full)updateTimer(); if(q.cat==='listening'&&s.played[q.group]){let b=document.getElementById('heard');if(b)b.textContent='✓ 已播放该组录音'} }
function audioHtml(q,s,show){let played=!!s.played[q.group],mock=s.mode==='mock';return `<div class="audio-card"><div class="audio-title">🎧 聴解 · ${esc(q.kind)} ${mock?'（本组限播放一次）':'（可重复练习）'}</div><p>${q.kind==='即時応答'?'音频将读出简短问句及三个回答；正式模拟时只显示答案编号。':'请先听录音，再结合问题和选项作答。整组音频听完后，才能在模考中选择答案。'}</p><div class="audio-ctrl"><button class="btn smallbtn" onclick="playAudio()" ${(mock&&played)||audioPlaying?'disabled':''}>${audioPlaying?'播放中…':played&&mock?'已播放':'▶ 播放日语音频'}</button>${audioPlaying?'<button class="btn ghost smallbtn" onclick="stopAudio();renderSession()">停止</button>':''}<span id="heard" class="audio-badge">${played?'✓ 已播放':'尚未播放'}</span></div><p class="audio-warning">使用浏览器内置日语语音，首次可能需要设备加载日语语音；iPhone Safari 需要手动点击播放。TTS 不能准确替代官方真人聴解。</p>${show?`<details style="margin-top:10px"><summary class="small" style="cursor:pointer">查看逐字听力稿</summary><div class="passage" style="margin-top:9px;max-height:260px" lang="ja">${esc(q.audio)}</div></details>`:''}</div>`}
function feedbackHtml(q,chosen){let ok=chosen===q.answer, correct=q.options[q.answer],wrong=q.options[chosen];return `<div class="feedback ${ok?'':'bad'}"><div class="feedback-head">${ok?'✓ 正确 · 正解':'✕ 这题需要再看一遍'}</div><div class="small">正确答案　<strong class="jp">${q.answer+1}. ${esc(correct)}</strong></div>${ok||chosen<0?'':`<p>你选择的是 <span class="jp">${chosen+1}. ${esc(wrong)}</span>。${q.kind==='文の文法②（★排序）'?'★排序要先把四个词块全部接成一句。':q.cat==='reading'?'请检查这一选项是否在原文中得到直接支持，尤其注意「仅可能」与「已确定」的区别。':q.cat==='grammar'?'请对照前后词形、接续形式，以及转折／因果关系。':q.cat==='listening'?'请在听力稿中定位转折、最终决定或时间信息。':'请比较这个词的实际搭配、词形和语境。'}</p>`}<p><b>答案依据：</b>${esc(q.exp)}</p>${q.tip?`<p><b>解题提醒：</b>${esc(q.tip)}</p>`:''}${q.translation?`<details><summary style="font-size:12px;cursor:pointer;color:#396c56">中文内容提要</summary><p>${esc(q.translation)}</p></details>`:''}</div>`}
function updateRecord(q,chosen){let rec=DATA.records[q.id]||{seen:0,correct:0,wrong:0,streak:0};rec.seen++;rec.last=new Date().toISOString();if(chosen===q.answer){rec.correct++;rec.streak++;if(DATA.wrong[q.id]&&rec.streak>=2)delete DATA.wrong[q.id]}else{rec.wrong++;rec.streak=0;DATA.wrong[q.id]={last:new Date().toISOString(),count:rec.wrong}}DATA.records[q.id]=rec}
function answer(i){let s=DATA.active,q=current();if(!s)return;let already=Object.hasOwn(s.answers,q.id);if(already&&!(s.mode==='mock'&&s.phase==='lang'))return;if(s.mode==='mock'&&q.cat==='listening'&&!s.played[q.group]){toast('请先完整播放音频');return}if(audioPlaying){toast('请等录音播放完毕再作答');return}s.answers[q.id]=i;if(s.mode!=='mock'){updateRecord(q,i)}store();renderSession();if(s.mode!=='mock'){let f=document.querySelector('.feedback');if(f)f.scrollIntoView({block:'nearest',behavior:'smooth'})}}

function flagQuestion(){let s=DATA.active,q=current();s.flagged=s.flagged.includes(q.id)?s.flagged.filter(x=>x!==q.id):[...s.flagged,q.id];store();renderSession()}
function nextQuestion(){let s=DATA.active,q=current();if(!s)return;let i=s.idx+1;if(s.mode==='mock'&&s.phase==='lang'&&i<s.ids.length&&BANK.find(q=>q.id===s.ids[i]).cat==='listening'){finishPhase();return}if(i>=s.ids.length){s.mode==='mock'?finishPhase():finishStudy();return}setIndex(i)}
function saveAndExit(){if(audioPlaying)stopAudio();store();toast('已保存，可从主页继续');go('home')}
function finishPhase(auto=false){let s=DATA.active;if(!s)return;let isMock=s.mode==='mock';if(!isMock){finishStudy();return}if(s.phase==='lang'){let left=s.ids.filter(id=>BANK.find(q=>q.id===id).cat!=='listening'&&!Object.hasOwn(s.answers,id)).length;if(!auto&&left&&!confirm(`第一节还有 ${left} 题未作答。进入听力后无法返回。确认交卷吗？`))return;if(audioPlaying)stopAudio();s.phase='listen';s.idx=s.ids.findIndex(id=>BANK.find(q=>q.id===id).cat==='listening');s.deadline=Date.now()+50*60000;store();renderSession();scrollTop();toast('第一节已锁定 · 现在开始50分钟聴解');return}let left=s.ids.filter(id=>BANK.find(q=>q.id===id).cat==='listening'&&!Object.hasOwn(s.answers,id)).length;if(!auto&&left&&!confirm(`听力还有 ${left} 题未作答。确认结束模考并查看成绩吗？`))return;finishStudy()}
function finishStudy(){let s=DATA.active;if(!s)return;if(audioPlaying)stopAudio();if(s.mode==='mock'){for(let id of s.ids){if(Object.hasOwn(s.answers,id)){let q=BANK.find(q=>q.id===id);if(q)updateRecord(q,s.answers[id])}}}
const entry={date:new Date().toISOString(),mode:s.mode,label:s.label,ids:[...s.ids],answers:{...s.answers},durationMs:Date.now()-new Date(s.created).getTime()};DATA.sessions.unshift(entry);DATA.sessions=DATA.sessions.slice(0,35);DATA.active=null;store();renderResult(entry);navActive(s.mode==='mock'?'mock':'practice');scrollTop()}
let tick=null;
function updateTimer(){clearInterval(tick);let timer=document.getElementById('clock');if(!timer)return;const render=()=>{let s=DATA.active;if(!s||s.mode!=='mock')return;let seconds=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));let el=document.getElementById('clock');if(el){el.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');el.classList.toggle('soon',seconds<300)}if(seconds<=0){clearInterval(tick);finishPhase(true)}};render();tick=setInterval(render,600)}
function renderResult(item){view='results';navActive(item.mode==='mock'?'mock':'practice');let qs=item.ids.map(id=>BANK.find(q=>q.id===id)).filter(Boolean);let done=qs.filter(q=>Object.hasOwn(item.answers,q.id));let right=done.filter(q=>item.answers[q.id]===q.answer);let ratio=qs.length?Math.round(100*right.length/qs.length):0;let stats=Object.keys(CN).map(c=>{let subset=qs.filter(q=>q.cat===c);let d=subset.filter(q=>Object.hasOwn(item.answers,q.id));let right=subset.filter(q=>item.answers[q.id]===q.answer&&Object.hasOwn(item.answers,q.id));return {cat:c,all:subset.length,done:d.length,correct:right.length,ratio:subset.length?Math.round(100*right.length/subset.length):0}});let err=qs.filter(q=>item.answers[q.id]!==q.answer||!Object.hasOwn(item.answers,q.id));html(`<div class="pagehead"><div><div class="eyebrow">REVIEW · TEST COMPLETE</div><h1>这一次的答卷</h1><p>${esc(item.label)} · ${new Date(item.date).toLocaleString('zh-CN',{timeZone:'Asia/Tokyo'})} JST</p></div><span class="tag">本次 ${qs.length} 题</span></div><div class="panel"><div class="split"><div><div class="eyebrow">RAW CORRECT RATE</div><div class="summary-num">${ratio}%</div><p class="resource">答对 ${right.length} / ${qs.length}；答题 ${done.length} 道，未答 ${qs.length-done.length} 道。</p><div class="btnrow"><button class="btn" onclick="downloadReport(${jsArg(item.date)})">导出本次详细报告 TXT</button><button class="btn ghost" onclick="exportAll()">导出备份 JSON</button></div></div><div><div class="risk"><b>不能直接换算成官方 180 分。</b> JLPT 使用「尺度得点」，不是逐题等分。下面的百分比只用于找弱项；不能据此判定正式合格或不合格。</div></div></div></div><div class="introgrid">${stats.map(x=>`<div class="tile"><span class="count-small">${CN[x.cat]}</span><strong>${x.ratio}%</strong><div class="small">${x.correct} / ${x.all} · 已答${x.done}</div></div>`).join('')}</div><div class="sectionhead"><div><h2>错题与未答题 · ${err.length}</h2><p>现在可以打开每道题的正确答案、文字依据和解释。</p></div><button class="btn ghost smallbtn" onclick="reviewEntry(${jsArg(item.date)})">全卷逐题复盘 ↗</button></div><div class="panel">${err.length?err.map(q=>`<div class="review-row"><div><b>${esc(q.id)} · ${esc(q.kind)}</b><div class="small">${esc(q.stem.slice(0,66))}${q.stem.length>66?'…':''}</div></div><button class="btn ghost smallbtn" onclick="reviewOne(${jsArg(item.date)},${jsArg(q.id)})">查看解析 →</button></div>`).join(''):'<div class="empty">本次没有错题。可以再做一次专项加练或尝试更难的阅读。</div>'}</div><div class="btnrow" style="margin:22px 0"><button class="btn" onclick="go('home')">返回主页</button><button class="btn ghost" onclick="go('wrong')">查看长期错题本</button></div>`)}
function lookupEntry(date){return DATA.sessions.find(x=>x.date===date)}
let reviewEntryState=null;
function reviewEntry(date){let item=lookupEntry(date);if(!item){toast('找不到这份报告');return}reviewEntryState={date,idx:0};reviewOne(date,item.ids[0])}
function reviewOne(date,id){let item=lookupEntry(date);let q=BANK.find(q=>q.id===id);if(!q||!item){toast('找不到这道题');return}let idx=item.ids.indexOf(id),ans=item.answers[id],answered=Object.hasOwn(item.answers,id);reviewEntryState={date,idx};view='review';let text=`<div class="exam-top"><div class="exam-breadcrumb"><strong>逐题回看 · ${esc(item.label)}</strong><br>${idx+1} / ${item.ids.length}</div><div class="btnrow"><button class="btn ghost smallbtn" onclick="renderResult(lookupEntry(${jsArg(date)}))">← 返回成绩</button></div></div><article class="paper" style="max-width:960px;margin:25px auto"><div class="question-meta"><span class="qnumber">${esc(q.id)} · ${esc(q.kind)}</span><span class="tag">${esc(q.topic)}</span></div>${q.cat==='listening'?`<div class="audio-card"><button class="btn smallbtn" onclick="playReview(${jsArg(q.id)})">▶ 复听</button><details style="margin-top:11px"><summary class="small">听力原文</summary><div class="passage" lang="ja">${esc(q.audio)}</div></details></div>`:''}${q.passage?`<div class="passage" lang="ja">${esc(q.passage)}</div>`:''}<div class="question-stem" lang="ja">${esc(q.stem)}</div><div class="options">${q.options.map((o,i)=>`<div class="option ${i===q.answer?'correct':i===ans?'wrong':''}"><span class="letter">${i+1}</span><span>${esc(o)}</span></div>`).join('')}</div>${!answered?'<p class="alert-txt">这题没有作答。</p>':''}${feedbackHtml(q,answered?ans:-1)}<div class="qfooter"><button class="btn ghost" ${idx===0?'disabled':''} onclick="reviewOne(${jsArg(date)},${jsArg(item.ids[idx-1]||'')})">← 上一题</button><button class="btn" ${idx>=item.ids.length-1?'disabled':''} onclick="reviewOne(${jsArg(date)},${jsArg(item.ids[idx+1]||'')})">下一题 →</button></div></article>`;html(text);scrollTop()}
function renderWrong(){let ids=Object.keys(DATA.wrong);let recent=DATA.sessions.slice(0,7);html(`<div class="pagehead"><div><div class="eyebrow">REVIEW · ERROR NOTEBOOK</div><h1>错题本</h1><p>错误不是单纯划掉的分数；这里把每次误判的原因留下来。</p></div><span class="tag">${ids.length} 待巩固</span></div><div class="panel"><h3 style="margin-top:0">复习规则</h3><p class="resource">答错题会自动进入错题本。以后重新练习该题，连续答对两次才自动移除；这比仅仅看过一次解析更容易确认是否真的掌握。</p><div class="btnrow"><button class="btn" onclick="startWrong()" ${ids.length?'':'disabled'}>复习全部错题（最多20题） →</button><button class="btn ghost" onclick="exportAll()">导出全部记录 JSON</button><label class="btn ghost smallbtn" for="importfile" style="cursor:pointer">导入备份 JSON</label><input id="importfile" type="file" accept=".json" style="display:none" onchange="importAll(event)"></div></div><div class="panel">${ids.length?ids.map(id=>{let q=BANK.find(x=>x.id===id),r=DATA.records[id];return q?`<div class="review-row"><div><b>${esc(q.kind)} · ${esc(q.id)}</b><div class="small">${esc(q.stem.slice(0,66))}</div><span class="small">累计错 ${r?.wrong||0} 次 · 当前连续答对 ${r?.streak||0} 次</span></div><button class="btn ghost smallbtn" onclick="startOne(${jsArg(id)})">再答一次 →</button></div>`:''}).join(''):'<div class="empty">目前没有待复习错题。答错后会自动收录在这里。</div>'}</div><div class="sectionhead"><h2>最近的练习记录</h2></div><div class="panel">${recent.length?recent.map(s=>`<div class="review-row"><div><b>${esc(s.label)} · ${new Date(s.date).toLocaleString('zh-CN',{timeZone:'Asia/Tokyo'})}</b><div class="small">${s.ids.length}题 · ${Object.keys(s.answers).length}题已作答</div></div><button class="btn ghost smallbtn" onclick="renderResult(lookupEntry(${jsArg(s.date)}))">查看报告</button></div>`).join(''):'<div class="empty">完成练习后，报告会出现在这里。</div>'}</div>`)}
function startWrong(){let ids=Object.keys(DATA.wrong).sort((a,b)=>{let ra=DATA.records[a],rb=DATA.records[b];return (rb?.wrong||0)-(ra?.wrong||0)}).slice(0,20);if(!ids.length){toast('还没有错题');return}startSession('study',ids,'错题复习')}
function startOne(id){startSession('study',[id],'单题重练')}
function renderResources(){html(`<div class="pagehead"><div><div class="eyebrow">READING LAB · FIELD RESEARCH</div><h1>研究笔记</h1><p>把你正在思考的海边建筑、盐风、材料与声音转化成日语阅读材料。</p></div><span class="tag art">FOLLY · NO. 3</span></div><div class="panel"><h3>从现场到词汇</h3><p class="resource">海边未竣工的建筑、波浪形墙体、结构在风中的低鸣、附近的消波块：这些是本题库原创阅读的触发点，并不代表第三件作品的装置方案已经决定。词汇与阅读练习把「看到／听到的现象」和「尚待验证的原因」严格分开。</p><div class="section-badges"><span class="tag art">塩害 · 盐害</span><span class="tag art">風向き · 风向</span><span class="tag art">振動 · 振动</span><span class="tag art">共鳴 · 共鸣</span><span class="tag art">腐食 · 腐蚀</span><span class="tag art">現地調査 · 现场调查</span><span class="tag art">痕跡 · 痕迹</span><span class="tag art">未完成 · 未完成</span><span class="tag art">再利用 · 再利用</span><span class="tag art">立入禁止 · 禁入</span></div><div class="btnrow" style="margin-top:18px"><button class="btn" onclick="startDrill('reading','art',12)">开始相关阅读 →</button><button class="btn ghost" onclick="startDrill('all','art',16)">跨题型混合训练</button></div></div><div class="sectionhead"><h2>四条研究路径</h2></div><div class="split">${[
 ['01 / MATERIAL','塩害と鉄筋の腐食','海风携带的氯盐可能进入混凝土，使钢筋锈蚀、膨胀并促使表层开裂。训练「原因→结果」的表达：〜によって／〜ため／〜可能性がある。','https://www.pwri.go.jp/jpn/results/db/doken_kankoubutu/kyoudoukenkyu_houkokusyo/files/doken_kyoudoukenkyu_0286_00.pdf'],
 ['02 / SOUND','風で生まれる音','风穿过细长物体会形成涡流，可能激起振动；但建筑的低鸣不能仅凭耳朵断定具体机理。训练「观察和推断」：〜とは限らない／〜わけではない。','https://www.isc.meiji.ac.jp/~ksumiya/lectures/wave/2024/04-1/'],
 ['03 / SPACE','保存と再利用','失去原有用途的建筑要如何重新开放？安全、材料痕迹和公共记忆会拉向不同方向。训练两篇观点比较与作者主张题。','https://www.jlpt.jp/e/guideline/testsections.html'],
 ['04 / PRACTICE','公式問題の形式','文字・语彙（6类）、文法（3类）、读解（5类）、聴解（5类）。本网站参照题型独立创作，不转载官方题目或录音。','https://www.jlpt.jp/e/samples/sampleindex.html']
 ].map(([k,h,p,u])=>`<div class="tile"><div class="count-small">${esc(k)}</div><h3>${esc(h)}</h3><p>${esc(p)}</p><a class="small" href="${esc(u)}" target="_blank" rel="noopener">参考资料 ↗</a></div>`).join('')}</div><div class="sectionhead"><h2>考试与临场信息</h2></div><div class="panel"><p class="resource"><b>2026年12月6日（星期日） · N2 日本上午场</b>。官方表述：第一节语言知识＋阅读 105 分钟，第二节聴解 50 分钟。日本当年上午考试的安排为 09:10 开始第一节，11:45 开始聴解；请以个人受验票及官方通知的入场时刻为准。</p><p class="resource">日文题目均为本站原创，参考研究材料仅用于核实概念；阅读文本不是论文原文或真实官方真题。</p><div class="btnrow"><a class="btn ghost smallbtn" href="https://info.jees-jlpt.jp/info/2026-2jisshiannnai.html" target="_blank" rel="noopener">日本官方考试安排 ↗</a><a class="btn ghost smallbtn" href="https://www.jlpt.jp/e/guideline/testsections.html" target="_blank" rel="noopener">官方题型说明 ↗</a><a class="btn ghost smallbtn" href="https://www.jlpt.jp/e/samples/sampleindex.html" target="_blank" rel="noopener">官方免费样卷 ↗</a></div></div>`)}
function downloadBlob(filename,content,type='text/plain;charset=utf-8'){let blob=new Blob([content],{type});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function downloadReport(date){const s=lookupEntry(date);if(!s)return;let lines=[`JLPT N2 FIELD NOTES | ${s.label}`,`Date: ${s.date}`,`Mode: ${s.mode}`,`Questions: ${s.ids.length}`,'This is original practice; raw scores are NOT official JLPT scaled scores.','',''];for(let [n,id] of s.ids.entries()){let q=BANK.find(x=>x.id===id);if(!q)continue;let own=s.answers[id],a=Object.hasOwn(s.answers,id);lines.push(`${n+1}. [${q.cat}/${q.kind}] ${q.stem}`,q.passage?'READING:\n'+q.passage:'',q.audio?'AUDIO TRANSCRIPT:\n'+q.audio:'',`YOUR ANSWER: ${a?own+1+'. '+q.options[own]:'UNANSWERED'}`,`CORRECT: ${q.answer+1}. ${q.options[q.answer]}`,`EXPLANATION: ${q.exp}`,q.tip?'TIP: '+q.tip:'',q.translation?'TRANSLATION: '+q.translation:'','-----------------------------------')}downloadBlob(`JLPT_N2_${date.slice(0,10)}_Report.txt`,lines.filter(x=>x!=='').join('\n'))}
function exportAll(){downloadBlob(`JLPT_N2_backup_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({app:'N2-FIELD-NOTES',version:2,exported:new Date().toISOString(),data:DATA},null,2),'application/json')}
async function importAll(evt){let f=evt.target.files?.[0];if(!f)return;try{let v=JSON.parse(await f.text());if(v.app!=='N2-FIELD-NOTES'||!v.data?.records||!v.data?.sessions)throw Error('not valid');if(!confirm('将覆盖当前本地练习记录。确定导入吗？'))return;Object.assign(DATA,v.data);store();renderWrong();toast('备份已恢复')}catch(e){toast('无法导入：不是本站有效备份文件')}}
function loadVoices(){try{voiceVoices=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang))}catch(e){voiceVoices=[]}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function cleanLine(a){return a.replace(/^(?:女|男|先生|学生|話し手)[:：]/,'').trim()}
async function playAudio(){let s=DATA.active,q=current();if(!s||q.cat!=='listening'||audioPlaying)return;if(s.mode==='mock'&&s.played[q.group]){toast('模考已播放此组音频');return}await playSpoken(q,q.kind==='即時応答'&&s.mode==='mock');}
function playReview(id){let q=BANK.find(q=>q.id===id);if(q)playSpoken(q,false,true)}
function playSpoken(q,hiddenInstant=false,isReview=false){if(!('speechSynthesis' in window)){toast('浏览器未提供内置日语语音，请换用支持语音的浏览器');return Promise.resolve(false)}try{speechSynthesis.cancel()}catch(e){}let script=q.audio.split('\n').filter(Boolean).map(cleanLine);if(q.kind==='即時応答'){script.push('いちばん自然な答えを選んでください。');q.options.forEach((o,i)=>script.push(`${['いち','に','さん','よん'][i]}。${o}`))}else{script.unshift('問題。よく聞いてください。')}
let s=DATA.active;let myAudio=++audioSerial;audioPlaying=true;const b=document.getElementById('heard');if(b)b.textContent='▶ 播放中，请勿切换页面';let v=voiceVoices.find(x=>/ja-JP/i.test(x.lang)&&/Kyoko|Otoya|Nanami|Siri|Google/i.test(x.name))||voiceVoices[0]||null;let index=0;let completed=false;return new Promise(resolve=>{let done=(ok)=>{if(myAudio!==audioSerial){resolve(false);return}audioPlaying=false;completed=ok;if(ok&&s&&s===DATA.active){s.played[q.group]=true;store()}if(!isReview&&s===DATA.active)renderSession();resolve(ok)};let speakNext=()=>{if(myAudio!==audioSerial){resolve(false);return}if(!audioPlaying){done(false);return}if(index>=script.length){done(true);return}let u=new SpeechSynthesisUtterance(script[index++]);u.lang='ja-JP';if(v)u.voice=v;u.rate=0.93;u.pitch=1;u.onend=()=>setTimeout(speakNext,100);u.onerror=e=>{if(myAudio!==audioSerial){resolve(false);return}audioPlaying=false;toast('语音播放中断。可以再次点击播放；Safari 请保持屏幕常亮。');done(false)};try{speechSynthesis.speak(u)}catch(e){audioPlaying=false;done(false)}};speakNext()})}
window.addEventListener('beforeunload',()=>{store();try{speechSynthesis.cancel()}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&DATA.active?.mode==='mock'&&DATA.active.deadline<Date.now()){finishPhase(true)}});
window.TEST_API={count:BANK.length,fullCount:BANK.filter(q=>!q.extra).length,counts:Object.fromEntries(Object.keys(CN).map(c=>[c,BANK.filter(q=>q.cat===c&&!q.extra).length])),startDaily,startDrill,beginMock,renderResult,answer,current,go,getData:()=>DATA};
go('home');
